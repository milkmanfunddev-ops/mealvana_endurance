org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter stable ≥3.44 (2026-08-13) reads only the AGP 9 "new DSL" by default,
# which breaks the Flutter Gradle plugin against our AGP 8.9.1 old-DSL
# build.gradle.kts (CI exit 70 in `shorebird release android`). Opt out until
# we migrate the DSL / bump AGP 9.
android.newDsl=false
