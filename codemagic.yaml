# Codemagic CI/CD Configuration for Mealvana Endurance
#
# Updated: 2025-12-18
# Changes:
# - Fixed Firebase variable name (GOOGLE_SERVICES_JSON, no base64 encoding)
# - Refactored to use YAML anchors (reduced duplication)
# - REMOVED ALL TESTING for faster deployment testing
# - Added dev-ios workflow (manual, no Shorebird)
# - Updated prod triggers to release/* only (removed main)
# - Changed Android prod to beta track (open testing)
#
# Documentation:
# - Codemagic: https://docs.codemagic.io/yaml-testing/testing/
# - Shorebird: https://docs.shorebird.dev/code-push/ci/codemagic/
# - Project docs: /docs/ci-cd/README.md
#
# ============================================================
# CONVENTION: Build-number resolution (do not skip)
# ============================================================
# Every workflow that produces a release artifact (.aab/.ipa) MUST:
#   1. Run a "Resolve next … build number" step before the build, which
#      queries Play / TestFlight for the highest existing buildNumber for
#      that bundle id and exports BUILD_NUMBER = max + 1.
#   2. Pass `--build-number=$BUILD_NUMBER` to whatever produces the
#      artifact: `flutter build appbundle/ipa`, `shorebird release ios`,
#      `shorebird release android`.
#
# WHY: pubspec.yaml's `version: x.y.z+N` is committed state. Without
# runtime resolution every build of the same release branch ships the
# same buildNumber, which:
#   - Google Play rejects the rollout ("does not allow existing users to
#     upgrade to the newly added APKs").
#   - Shorebird rejects creating the release ("existing release for
#     version x.y.z+N").
#   - TestFlight silently dedupes / rejects.
# Patch workflows (`prod-*-patch`) are exempt — they take a
# `--release-version` instead of producing a new artifact.
# ============================================================

definitions:
  # ============================================================
  # Reusable Script Definitions
  # ============================================================
  scripts:
    - &flutter_pub_get
      name: Get Flutter dependencies
      script: flutter pub get

    - &run_build_runner
      name: Run code generation
      script: dart run build_runner build --delete-conflicting-outputs

    - &run_unit_tests
      name: Run unit tests
      script: |
        mkdir -p test-results
        flutter test --exclude-tags="integration || e2e" --machine > test-results/unit-tests.json
      test_report: test-results/unit-tests.json

    - &run_algorithm_tests
      name: Run nutrition algorithm tests (Deno)
      script: |
        if ! command -v deno &> /dev/null; then
          curl -fsSL https://deno.land/install.sh | sh -s -- --yes
          export PATH="$HOME/.deno/bin:$PATH"
        fi
        bash supabase/functions/run-algorithm-tests.sh

    - &run_flutter_analyze
      name: Analyze code
      script: flutter analyze --no-fatal-warnings --no-fatal-infos

    - &check_formatting
      name: Check code formatting
      script: dart format --set-exit-if-changed lib test

    - &install_shorebird
      name: Install Shorebird CLI
      script: |
        curl -fsSL https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
        export PATH="$HOME/.shorebird/bin:$PATH"
        echo "PATH=$HOME/.shorebird/bin:$PATH" >> $CM_ENV
        shorebird doctor

    - &upload_sentry_symbols
      # Upload debug symbols / source maps to Sentry so stack traces are
      # de-obfuscated in the Sentry dashboard.
      #
      # OPTIONAL / NON-BLOCKING: this is observability, not a release gate.
      # Symbol upload must NEVER fail a build or block TestFlight delivery.
      # If SENTRY_AUTH_TOKEN is missing or the upload errors, we warn and
      # continue so the IPA still publishes.
      #
      # To enable actual symbol upload: add SENTRY_AUTH_TOKEN to the
      # Codemagic variable group (mealvana_dev and/or mealvana_prod).
      # Create the token at https://sentry.io/settings/account/api/auth-tokens/
      # with scopes: project:releases, org:read. Then in Codemagic:
      #   Team Settings → Environment variables → add SENTRY_AUTH_TOKEN
      #   to the relevant variable group(s).
      #
      # The sentry: block in pubspec.yaml already has org: milkman-24 and
      # project: mealvana-endurance configured for the plugin.
      name: Upload debug symbols to Sentry
      script: |
        if [ -z "$SENTRY_AUTH_TOKEN" ]; then
          echo "⚠️  SENTRY_AUTH_TOKEN not set — skipping Sentry symbol upload (non-blocking)."
          exit 0
        fi
        dart run sentry_dart_plugin || \
          echo "⚠️  Sentry symbol upload failed — continuing anyway (non-blocking)."

    - &install_cocoapods
      name: Install CocoaPods dependencies
      script: cd ios && pod install

    - &load_firebase_config
      name: Load Firebase configuration
      script: |
        #!/usr/bin/env sh
        set -e
        echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        echo "✅ google-services.json created"
        ls -la android/app/google-services.json

    - &setup_ios_signing
      name: Set up iOS code signing
      # IMPORTANT: do NOT call `keychain initialize` here. Codemagic
      # auto-injects a "Set up code signing identities" step when
      # `ios_signing:` is present in the workflow environment, and that
      # step initializes the keychain + imports the .p12 cert. A second
      # `keychain initialize` creates a fresh empty keychain and pushes
      # the cert-bearing keychain off the search list, leaving xcodebuild
      # with 0 valid signing identities and the misleading
      # "No signing certificate iOS Distribution found" error at export.
      script: |
        xcode-project use-profiles

    - &setup_ios_signing_shorebird
      name: Set up iOS code signing (Shorebird)
      # IMPORTANT: do NOT call `keychain initialize` here. See note on
      # &setup_ios_signing above for the full explanation. Codemagic's
      # auto-injected "Set up code signing identities" step (triggered by
      # the `ios_signing:` env block) already initializes the keychain
      # and imports the cert .p12; a second `keychain initialize` here
      # spawns a fresh empty keychain and silently knocks the cert off
      # the search path, leading to "iOS Distribution not found" at
      # exportArchive time.
      script: |
        # CRITICAL: manageAppVersionAndBuildNumber must be false for Shorebird
        xcode-project use-profiles --custom-export-options='{"manageAppVersionAndBuildNumber":false}'

    - &boot_ios_simulator
      name: Boot iOS Simulator
      script: |
        # Shutdown any existing simulators
        xcrun simctl shutdown all || true

        # Find available iPhone simulator runtime
        RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9]+-[0-9]+' | tail -1)
        echo "Using runtime: $RUNTIME"

        # Create a test device
        TEST_DEVICE=$(xcrun simctl create "Test iPhone" "iPhone 15 Pro" "$RUNTIME")
        echo "Created device: $TEST_DEVICE"

        # Boot the simulator
        xcrun simctl boot "$TEST_DEVICE"

        # Wait for simulator to be ready
        sleep 10

        # Export device ID for subsequent scripts
        echo "TEST_DEVICE=$TEST_DEVICE" >> $CM_ENV

    - &shutdown_ios_simulator
      name: Shutdown iOS Simulator
      script: xcrun simctl shutdown all || true

    - &setup_android_signing
      name: Decode Android keystore and write key.properties
      # android/app/build.gradle.kts reads android/key.properties for release signing.
      # Both files are gitignored, so we recreate them from the android_signing_credentials
      # variable group: CM_KEYSTORE_B64 (base64 of .jks) + password/alias vars.
      script: |
        set -euo pipefail
        if [ -z "${CM_KEYSTORE_B64:-}" ]; then
          echo "⚠️  CM_KEYSTORE_B64 not set — skipping Android signing setup"
          exit 0
        fi
        mkdir -p android/app
        printf '%s' "$CM_KEYSTORE_B64" | base64 -d > android/app/keystore.jks
        cat > android/key.properties <<EOF
        storePassword=${CM_KEYSTORE_PASSWORD}
        keyPassword=${CM_KEYSTORE_KEY_PASSWORD}
        keyAlias=${CM_KEYSTORE_KEY_ALIAS}
        storeFile=keystore.jks
        EOF
        echo "wrote android/app/keystore.jks ($(wc -c < android/app/keystore.jks) bytes) + android/key.properties"

    - &write_dotenv_files
      name: Write .env files from Codemagic secrets
      # The app bundles .env / .env.dev.local / .env.prod.local as Flutter assets
      # (pubspec.yaml). They're gitignored, so Codemagic has to recreate them from
      # secure vars uploaded to the mealvana_dev / mealvana_prod variable groups.
      # Any file whose source var isn't in the current workflow's groups is written
      # as an empty stub — enough to satisfy the asset bundler without leaking the
      # other flavor's secrets into this build.
      script: |
        set -euo pipefail
        printf '%s' "${DOTENV_ROOT:-}" > .env
        printf '%s' "${DOTENV_DEV_LOCAL:-}" > .env.dev.local
        printf '%s' "${DOTENV_PROD_LOCAL:-}" > .env.prod.local
        echo "wrote .env ($(wc -c < .env) bytes), .env.dev.local ($(wc -c < .env.dev.local) bytes), .env.prod.local ($(wc -c < .env.prod.local) bytes)"

        # Dev analytics opt-in. app_config.dart defaults ANALYTICS_DEV_ENABLED to
        # 'false', and analytics_tracker.dart swaps in a NoopAnalyticsTracker for any
        # dev build without it — silently discarding every event, with nothing in
        # Sentry to show for it. Developers set the flag in their own .env.dev.local,
        # but it was never added to the DOTENV_DEV_LOCAL secret, so CodeMagic-built dev
        # apps sent nothing to the dev Mixpanel board while emulator builds worked.
        # Guarantee it here instead of depending on the secret's contents.
        # Only applies to dev: prod reads .env.prod.local, and on prod workflows
        # DOTENV_DEV_LOCAL is unset so this file is an empty stub and is left alone.
        if [ -s .env.dev.local ] && ! grep -q '^ANALYTICS_DEV_ENABLED=' .env.dev.local; then
          printf '\nANALYTICS_DEV_ENABLED=true\n' >> .env.dev.local
          echo "appended ANALYTICS_DEV_ENABLED=true to .env.dev.local"
        fi

        # RevenueCat Test Store key — same story as ANALYTICS_DEV_ENABLED above.
        # It lives in a developer's own .env.dev.local, so local dev builds could
        # buy tokens against the Test Store while CI-built dev apps fell back to
        # the real appl_ key. The credit SKUs are not in App Store Connect yet, so
        # that key yields an empty offering and the sheet reads "Token packs
        # aren't available right now" — a broken purchase flow for every tester.
        #
        # Held as its own secure var (mealvana_dev group) rather than being folded
        # into DOTENV_DEV_LOCAL: that secret is the whole file and is unreadable,
        # so appending here is additive and cannot clobber its other contents.
        # Dev only — on prod workflows REVENUECAT_API_KEY_TEST is unset and
        # .env.dev.local is an empty stub, so this is a no-op. AppConfig also
        # ignores the test key entirely unless the build is a dev flavor.
        if [ -s .env.dev.local ] && [ -n "${REVENUECAT_API_KEY_TEST:-}" ] \
           && ! grep -q '^REVENUECAT_API_KEY_TEST=' .env.dev.local; then
          printf '\nREVENUECAT_API_KEY_TEST=%s\n' "$REVENUECAT_API_KEY_TEST" >> .env.dev.local
          echo "appended REVENUECAT_API_KEY_TEST to .env.dev.local"
        fi

        # Force the AI surface flags ON for dev builds.
        #
        # Standing rule: dev is the AI proving ground, so these are always on
        # there. AppConfig already defaults them on when the key is ABSENT — but
        # DOTENV_DEV_LOCAL is a snapshot of somebody's .env.dev.local taken at
        # some point in the past, and a key that is present-and-false beats any
        # code-side fallback. That is invisible from here: the secret cannot be
        # read back, so the only way to guarantee the flag is to overwrite it.
        # Replace-or-append, rather than append-if-missing like the two above.
        #
        # APP_ENVIRONMENT is forced alongside them because it is the switch the
        # others hang off: AppConfig.fromEnv reads it with `fallback: 'prod'`, so
        # if the secret omits it, a dev build silently identifies as production —
        # every dev-default flag resolves to false AND revenueCatApiKey ignores
        # the Test Store key, because that is gated on isDevelopment. This
        # workflow only ever produces dev-flavor artifacts, so pinning it is
        # always correct here.
        if [ -s .env.dev.local ]; then
          # APP_ENVIRONMENT is a string ('dev'), the rest are booleans — do not
          # fold it into the loop or it ends up as APP_ENVIRONMENT=true and the
          # `appEnv == 'dev'` check fails just as silently as an absent key.
          # MACRO_DASHBOARD_ENABLED: the daily-macro-dashboard redesign
          # (bundle daily-macros-dashboard@v3, landed 2026-08-19). Fail-closed
          # in code and absent from most DOTENV_DEV_LOCAL snapshots, so dev
          # TestFlight builds rendered the legacy Fuel Timeline while carrying
          # the new surface dark. Forced ON here — dev is the proving ground —
          # while prod and the code default stay off (the default-on flip is a
          # separate decision with its own checklist; see
          # docs/features/macro_dashboard/README.md, Epilogue).
          for entry in "APP_ENVIRONMENT=dev" "DEV_MODE_ENABLED=true" \
                       "AI_CREDITS_ENABLED=true" "DESCRIBE_MEAL_ENABLED=true" \
                       "COACH_INSIGHTS_ENABLED=true" \
                       "MACRO_DASHBOARD_ENABLED=true"; do
            key="${entry%%=*}"
            # Strip any existing definition (commented or not), then set ours.
            sed -i '' "/^[[:space:]]*#*[[:space:]]*${key}=/d" .env.dev.local 2>/dev/null \
              || sed -i "/^[[:space:]]*#*[[:space:]]*${key}=/d" .env.dev.local
            printf '%s\n' "$entry" >> .env.dev.local
          done
          echo "forced dev flavor + AI surface flags ON for dev build"
        fi

        # Point dev builds at the RevenueCat app whose bundle id actually
        # matches them.
        #
        # The dev flavor ships `com.milkman.mealvanaendurance.dev`, but
        # DOTENV_DEV_LOCAL carries the `appl_` key of the RevenueCat app
        # registered to `com.milkman.mealvanaendurance` — the PROD bundle. A
        # RevenueCat App Store app validates receipts against its own bundle id,
        # so the dev build was authenticating as the wrong app and could never
        # have been served its products, no matter what was provisioned. There
        # is now a second RevenueCat app for the dev bundle, and this is its key.
        # Release dev builds use it; debug builds still prefer the Test Store key
        # (AppConfig gates that on kDebugMode, because RevenueCat refuses
        # Test Store keys in release binaries).
        if [ -s .env.dev.local ] && [ -n "${REVENUECAT_API_KEY_APPLE_DEV:-}" ]; then
          sed -i '' "/^[[:space:]]*#*[[:space:]]*REVENUECAT_API_KEY_APPLE=/d" .env.dev.local 2>/dev/null \
            || sed -i "/^[[:space:]]*#*[[:space:]]*REVENUECAT_API_KEY_APPLE=/d" .env.dev.local
          printf 'REVENUECAT_API_KEY_APPLE=%s\n' "$REVENUECAT_API_KEY_APPLE_DEV" >> .env.dev.local
          echo "pointed REVENUECAT_API_KEY_APPLE at the dev-bundle RevenueCat app"
        fi

        # Same wrong-bundle problem on Android: the shared dotenv carries the
        # `goog_` key of the RevenueCat app registered to the PROD package.
        # Point dev-android builds at the RevenueCat app for
        # com.milkman.mealvanaendurance.dev instead.
        if [ -s .env.dev.local ] && [ -n "${REVENUECAT_API_KEY_GOOGLE_DEV:-}" ]; then
          sed -i '' "/^[[:space:]]*#*[[:space:]]*REVENUECAT_API_KEY_GOOGLE=/d" .env.dev.local 2>/dev/null \
            || sed -i "/^[[:space:]]*#*[[:space:]]*REVENUECAT_API_KEY_GOOGLE=/d" .env.dev.local
          printf 'REVENUECAT_API_KEY_GOOGLE=%s\n' "$REVENUECAT_API_KEY_GOOGLE_DEV" >> .env.dev.local
          echo "pointed REVENUECAT_API_KEY_GOOGLE at the dev-package RevenueCat app"
        fi

        # Diagnostic: prove what the app will actually read. Booleans only, plus
        # presence (never the value) of the RevenueCat key. Without this, "the
        # tokens are missing" is indistinguishable from "the flag is off", and
        # that ambiguity has already cost two build cycles.
        if [ -s .env.dev.local ]; then
          echo "--- dev feature flags as built ---"
          grep -E '^(APP_ENVIRONMENT|DEV_MODE_ENABLED|AI_CREDITS_ENABLED|DESCRIBE_MEAL_ENABLED|COACH_INSIGHTS_ENABLED|ANALYTICS_DEV_ENABLED)=' .env.dev.local || echo "  (none found)"
          if grep -q '^REVENUECAT_API_KEY_TEST=test_' .env.dev.local; then
            echo "  REVENUECAT_API_KEY_TEST: present (debug builds only — RevenueCat rejects it in a release binary)"
          else
            echo "  REVENUECAT_API_KEY_TEST: absent"
          fi
          if grep -q '^REVENUECAT_API_KEY_APPLE=appl_' .env.dev.local; then
            echo "  REVENUECAT_API_KEY_APPLE: present (appl_ prefix) — this is what a TestFlight build uses"
          else
            echo "  REVENUECAT_API_KEY_APPLE: MISSING or wrong prefix — the paywall will have no store"
          fi
        fi

        # Prod counterpart of the diagnostic above — and a hard gate, not just an
        # echo. DOTENV_PROD_LOCAL is an unreadable point-in-time snapshot exactly
        # like the dev one, and every failure the dev-side repairs above patch
        # (silent no-op analytics, wrong RC key, absent flags) started as that
        # snapshot drifting. A prod build missing any of these keys would ship
        # silently broken, so fail the build instead. Presence only — values are
        # never printed.
        if [ -s .env.prod.local ]; then
          echo "--- prod env keys as built (presence only) ---"
          missing=""
          for key in SUPABASE_URL SUPABASE_ANON_KEY SENTRY_DSN MIXPANEL_PROJECT_TOKEN \
                     REVENUECAT_API_KEY_APPLE REVENUECAT_API_KEY_GOOGLE; do
            if grep -q "^${key}=." .env.prod.local; then
              echo "  ${key}: present"
            else
              echo "  ${key}: MISSING"
              missing="$missing $key"
            fi
          done
          grep -E '^(APP_ENVIRONMENT|DEV_MODE_ENABLED|AI_CREDITS_ENABLED|DESCRIBE_MEAL_ENABLED|COACH_INSIGHTS_ENABLED)=' .env.prod.local || true
          # AI_CREDITS_ENABLED must be affirmatively true: app_config falls back
          # to 'false' on prod when unset, which hides the entire token paywall
          # (token pill, buy screen, RevenueCat configure). Caught 2026-08-10 —
          # the snapshot carried =false and the gate only echoed it.
          if ! grep -q '^AI_CREDITS_ENABLED=true' .env.prod.local; then
            echo "  ERROR: AI_CREDITS_ENABLED must be exactly 'true' in the prod secret — anything else ships with the token paywall invisible"
            missing="$missing AI_CREDITS_ENABLED(!=true)"
          fi
          if grep -q '^REVENUECAT_API_KEY_TEST=' .env.prod.local; then
            echo "  ERROR: REVENUECAT_API_KEY_TEST found in .env.prod.local — it must never be in the prod secret"
            missing="$missing REVENUECAT_API_KEY_TEST(forbidden)"
          fi
          if [ -n "$missing" ]; then
            echo "FATAL: DOTENV_PROD_LOCAL is missing or mis-carrying:$missing"
            echo "Update the DOTENV_PROD_LOCAL secure var in the mealvana_prod group."
            exit 1
          fi
        fi

    - &install_patrol_cli
      name: Install Patrol CLI
      # patrol_cli MUST match the `patrol` package (pubspec.lock: 4.6.1). Per the
      # Patrol compatibility table, patrol 4.6.1 pairs with patrol_cli 4.4.0 — the
      # latest CLI (4.5.x) prints "Version incompatibility detected!" and refuses
      # to run. Pin it. `patrol test` drives the native RunnerUITests XCUITest
      # target, so this replaces the old (broken) `flutter test integration_test/`
      # invocation, which never ran the patrolTest() bodies as native tests.
      script: |
        dart pub global activate patrol_cli 4.4.0
        echo "PATH=$HOME/.pub-cache/bin:$PATH" >> $CM_ENV
        "$HOME/.pub-cache/bin/patrol" doctor || true

    - &write_integration_creds
      name: Write integration-test credentials
      # Patrol flow tests read INTEGRATION_TEST_EMAIL / INTEGRATION_TEST_PASSWORD
      # from secrets/integration_test.env via --dart-define-from-file. That file is
      # gitignored, so CI recreates it from the INTEGRATION_TEST_ENV secure var
      # (upload it to the mealvana_dev variable group — contents of the local
      # secrets/integration_test.env). If the var is unset the file is an empty
      # stub and credentialed flows self-skip with a clear message instead of
      # failing hard.
      script: |
        set -euo pipefail
        mkdir -p secrets
        printf '%s' "${INTEGRATION_TEST_ENV:-}" > secrets/integration_test.env
        echo "wrote secrets/integration_test.env ($(wc -c < secrets/integration_test.env) bytes)"

workflows:
  # ============================================================
  # DEV WORKFLOWS — auto-triggered on push to `develop`
  # ============================================================

  dev-ios:
    name: Develop - iOS TestFlight (Shorebird, dev flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: API Key for CI builds

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milkman.mealvanaendurance.dev
      groups:
        - mealvana_dev  # Dev environment variables
        - shorebird_credentials  # SHOREBIRD_TOKEN for CI (shared with prod)
      vars:
        FLUTTER_ENV: dev
        APP_ENVIRONMENT: dev

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true
      # Docs-only pushes: use [skip ci] in the commit title instead of a
      # changeset filter — the `when: changeset` block previously here
      # (nested under triggering:) is not where Codemagic accepts it and is
      # suspected of invalidating the config (no builds fired from the
      # 2026-08-20 bug-batch merge). [skip ci] is documented, proven in this
      # repo, and costs nothing when forgotten except one build.

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods
      - *setup_ios_signing_shorebird

      - name: Resolve next iOS build number from TestFlight
        # Shorebird rejects creating a release for a (flavor, version,
        # platform) tuple it has already seen. TestFlight likewise rejects
        # duplicate build numbers. Both are derived from CFBundleVersion,
        # which we set via --build-number below. Without this resolve,
        # rerunning a develop build collides on either side.
        #
        # Looks up the dev ASC app by bundle id, asks ASC for the latest
        # TestFlight build number, and exports BUILD_NUMBER = latest + 1. If
        # lookup fails (e.g. ASC integration permissions issue or empty
        # TestFlight history), falls back to Codemagic's project-level
        # $PROJECT_BUILD_NUMBER, which auto-increments per project build.
        #
        # TestFlight alone is not enough: a failed run can create the
        # Shorebird release and die before publishing, leaving a zombie
        # release TestFlight never saw. Every retry then resolves the same
        # number and collides forever (2026-07-17: four builds in a row died
        # on "existing ios release for 1.21.1+103"). So take the max of both
        # sides before incrementing.
        script: |
          set -e
          APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier com.milkman.mealvanaendurance.dev --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$APP_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve TestFlight build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "TestFlight latest build for com.milkman.mealvanaendurance.dev: $LATEST"
          fi
          SB_LATEST=$(shorebird releases list --flavor dev 2>/dev/null | grep -oE '\+[0-9]+' | tr -d '+' | sort -n | tail -1 || echo "")
          if [ -n "$SB_LATEST" ] && [ "$SB_LATEST" -eq "$SB_LATEST" ] 2>/dev/null; then
            echo "Shorebird latest dev release build: $SB_LATEST"
            if [ "$SB_LATEST" -gt "$LATEST" ]; then
              LATEST=$SB_LATEST
            fi
          else
            echo "⚠️  Could not resolve Shorebird release list; using TestFlight number only"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Create Shorebird iOS Release (dev flavor)
        # Mirrors prod-ios. Shorebird keys releases by the `dev` app_id in
        # shorebird.yaml (d25496f9-...), separate from prod, so dev patches
        # are never served to prod builds. Don't pass --flutter-version=stable
        # (Shorebird only accepts pinned versions). `set -e` fails the build
        # loudly here instead of silently producing no IPA. --build-number is
        # forwarded to flutter build ipa so CFBundleVersion picks up the
        # resolved value, keeping the release version unique.
        script: |
          set -e
          shorebird release ios \
            --flavor dev \
            --target lib/main_dev.dart \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$BUILD_NUMBER

          echo ""
          echo "=========================================="
          echo "Shorebird iOS dev release created successfully!"
          echo "You can now create patches using dev-ios-patch workflow"
          echo "=========================================="

      - *upload_sentry_symbols

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        # Note: do NOT list "Internal Testers" under beta_groups. That is
        # Apple's built-in auto-managed group (assigned implicitly to all
        # team members with App Manager+ role), not a custom external
        # group, and the ASC API rejects explicit assignment to it with
        # "Cannot add internal group to a build". With submit_to_testflight
        # alone, the build appears for the auto-managed Internal Testers
        # group as soon as ASC finishes processing.
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  dev-android:
    name: Develop - Android Play Internal Testing (dev flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_dev
        - google_play_credentials
        - firebase_config
        - android_signing_credentials
      vars:
        FLUTTER_ENV: dev
        APP_ENVIRONMENT: dev

    # Manual-only as of 2026-08-10 (Lee): develop pushes should run tests +
    # dev-ios only — no Android build. Start this workflow from the Codemagic
    # UI/API when a dev Android build is actually needed. The Play Console
    # dev app (com.milkman.mealvanaendurance.dev) exists as of 2026-05-06;
    # note its very first AAB may need a manual upload in the Play Console
    # UI before API publishing to the internal track succeeds.
    # (No `triggering:` block = manual start only.)

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *setup_android_signing

      - name: Resolve next Android build number from Play Internal track
        # Asks Google Play for the highest versionCode it's seen for our dev
        # package — across all tracks, so newly-promoted/old builds are also
        # respected — and exports BUILD_NUMBER = max + 1. Falls back to the
        # Codemagic $PROJECT_BUILD_NUMBER if Play returns nothing (first ever
        # upload, or service-account auth issue).
        script: |
          set -e
          PACKAGE_NAME=com.milkman.mealvanaendurance.dev
          # Persist credentials for the google-play CLI
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud-sa.json
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @file:/tmp/gcloud-sa.json 2>/dev/null || echo "")
