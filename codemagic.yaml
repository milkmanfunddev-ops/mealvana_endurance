          set -e
          BUNDLE_ID=com.milkman.mealvanaendurance.dev
          APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$APP_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve TestFlight build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "TestFlight latest build for $BUNDLE_ID: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Build prod-flavor-code with dev bundle (iOS)
        # IS_INTERNAL: this build loads .env.prod.local, so it talks to the
        # PRODUCTION Mixpanel project. It only ever goes to the team, so tag its
        # events is_internal to keep them out of production reports.
        script: |
          flutter build ipa --release \
            --flavor dev \
            --target lib/main_prod.dart \
            --dart-define=IS_INTERNAL=true \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - *upload_sentry_symbols

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        beta_groups:
          - Internal Testers
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
  # SHOREBIRD PATCH WORKFLOWS (Manual Only)
  # ============================================================

  prod-ios-patch:
    name: Prod - iOS Shorebird Patch (OTA)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_prod
        - shorebird_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod
        # Set to patch a specific version (e.g., "1.0.0+1") or "latest"
        RELEASE_VERSION: "latest"

    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods
      # Required. `shorebird patch ios` runs a full `flutter build ipa`, which
      # archives and therefore SIGNS. Without this the build dies with
      # "No profiles for 'com.milkman.mealvanaendurance' were found".
      - *setup_ios_signing_shorebird

      - name: Create Shorebird iOS Patch
        script: |
          # `set -e` is not optional here. Without it, a failed `shorebird patch`
          # still falls through to the success banner below and the build goes
          # GREEN — so a patch that never shipped looks like one that did.
          set -e

          # --export-options-plist is what makes signing actually take. The
          # signing step above writes it via `xcode-project use-profiles`;
          # without passing it, flutter falls back to AUTOMATIC signing, goes
          # looking for an "iOS App Development" profile that does not exist,
          # and fails — even though the certificate and profile are installed.
          # The prod-ios release workflow passes this; the patch workflow never did.
          if [ -z "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "latest" ]; then
            echo "Creating patch for latest iOS release..."
            shorebird patch ios --flavor prod --target lib/main_prod.dart \
              --export-options-plist=/Users/builder/export_options.plist
          else
            echo "Creating patch for iOS release version: $RELEASE_VERSION"
            shorebird patch ios --flavor prod --target lib/main_prod.dart \
              --release-version="$RELEASE_VERSION" \
              --export-options-plist=/Users/builder/export_options.plist
          fi

          echo ""
          echo "=========================================="
          echo "iOS Patch created successfully!"
          echo "Users will receive update on next app restart"
          echo "=========================================="

  prod-android-patch:
    name: Prod - Android Shorebird Patch (OTA)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - shorebird_credentials
        - firebase_config
        - android_signing_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod
        RELEASE_VERSION: "latest"

    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *setup_android_signing
      - *install_shorebird

      - name: Create Shorebird Android Patch
        script: |
          # `set -e` is not optional here. Without it, a failed `shorebird patch`
          # still falls through to the success banner below and the build goes
          # GREEN — so a patch that never shipped looks like one that did.
          set -e

          if [ -z "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "latest" ]; then
            echo "Creating patch for latest Android release..."
            shorebird patch android --flavor prod --target lib/main_prod.dart
          else
            echo "Creating patch for Android release version: $RELEASE_VERSION"
            shorebird patch android --flavor prod --target lib/main_prod.dart --release-version="$RELEASE_VERSION"
          fi

          echo ""
          echo "=========================================="
          echo "Android Patch created successfully!"
          echo "Users will receive update on next app restart"
          echo "=========================================="

  dev-ios-patch:
    name: Dev - iOS Shorebird Patch (OTA)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Required, same as the dev-ios release workflow. `shorebird patch ios` runs
    # a full `flutter build ipa`, which archives and signs — so the patch needs
    # exactly the same signing setup a release does. Without the `ios_signing`
    # block Codemagic never injects the certificate or provisioning profile, and
    # the build dies with "No profiles for 'com.milkman.mealvanaendurance.dev'".
    integrations:
      app_store_connect: API Key for CI builds

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milkman.mealvanaendurance.dev
      groups:
        - mealvana_dev
        - shorebird_credentials
      vars:
        FLUTTER_ENV: dev
        APP_ENVIRONMENT: dev
        # Set to patch a specific version (e.g., "1.0.0+1") or "latest"
        RELEASE_VERSION: "latest"

    # Manual-only trigger. Run this against a `develop` (or any dev-flavor)
    # commit to ship an over-the-air patch to the dev-flavor release already
    # on TestFlight, without a fresh TestFlight upload. The patch must be
    # built from code compatible with the release you're patching.
    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods
      # Required. `shorebird patch ios` runs a full `flutter build ipa`, which
      # archives and therefore SIGNS. Without this the build dies with
      # "No profiles for 'com.milkman.mealvanaendurance.dev' were found".
      - *setup_ios_signing_shorebird

      - name: Create Shorebird iOS Patch (dev flavor)
        script: |
          # `set -e` is not optional here. Without it, a failed `shorebird patch`
          # still falls through to the success banner below and the build goes
          # GREEN — so a patch that never shipped looks like one that did.
          set -e

          # --export-options-plist is what makes signing actually take. The
          # signing step above writes it via `xcode-project use-profiles`;
          # without passing it, flutter falls back to AUTOMATIC signing, goes
          # looking for an "iOS App Development" profile that does not exist,
          # and fails — even though the certificate and profile are installed.
          # The dev-ios release workflow passes this; the patch workflow never did.
          if [ -z "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "latest" ]; then
            echo "Creating patch for latest dev iOS release..."
            shorebird patch ios --flavor dev --target lib/main_dev.dart \
              --export-options-plist=/Users/builder/export_options.plist
          else
            echo "Creating patch for dev iOS release version: $RELEASE_VERSION"
            shorebird patch ios --flavor dev --target lib/main_dev.dart \
              --release-version="$RELEASE_VERSION" \
              --export-options-plist=/Users/builder/export_options.plist
          fi

          echo ""
          echo "=========================================="
          echo "iOS dev Patch created successfully!"
          echo "Users will receive update on next app restart"
          echo "=========================================="

  # ============================================================
  # TESTING WORKFLOWS
  # ============================================================

  # The Patrol suite driven against the DEV backend (dev flavor +
  # .env.dev.local + the mealvana_dev variable group). Runs on push to
  # `develop` — the same event that ships a dev TestFlight build via dev-ios —
  # and on release/* PRs. Its prod-backend twin is integration-tests-prod
  # below; the two differ only in flavor, env file and variable group, so a
  # flow never has to know which backend it is talking to.
  integration-tests:
    name: Integration Tests (DEV backend)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev

    triggering:
      # DISABLED 2026-08-20 — Lee's ruling: "those integration tests cannot be
      # run by Codemagic" (~9c/min; one run billed 1h31m ~= $9). Run the suite
      # locally (patrol test / run-algorithm-tests.sh --e2e) or on Lee's M1 via
      # .github/workflows/tests-selfhosted.yml. Re-enable by restoring
      # `events: [pull_request]`.
      # (Was: PR gate on release/* PRs; the push-to-develop run is the separate
      # integration-tests-develop workflow because Codemagic applies
      # branch_patterns to every event in the block.)
      events: []
      branch_patterns:
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *write_integration_creds
      - *flutter_pub_get
      - *run_build_runner
      - *install_patrol_cli
      - *boot_ios_simulator

      - name: Run Patrol integration tests
        script: |
          mkdir -p test-results

          # `patrol test` builds the dev app ONCE with the native XCUITest harness
          # (RunnerUITests → PATROL_INTEGRATION_TEST_IOS_RUNNER) and runs every
          # patrolTest() under integration_test/ as a real native test. It also
          # regenerates integration_test/test_bundle.dart (gitignored). Unit tests
          # are gated separately by pr-validation on the same release/* PR, so they
          # are not re-run here.
          #
          # iOS-only note: credentialed OAuth flows (e.g. Google) can't be driven
          # through ASWebAuthSession, so those flows self-skip on iOS rather than
          # fail. INTEGRATION_TEST_EMAIL/_PASSWORD email login is automatable.
          # Explicit target list, kept in step with
          # .github/workflows/tests-selfhosted.yml. A bare
          # `--target integration_test` globs the whole directory, which
          # sweeps in ai_coach_chat_flow_test — that flow only self-skips on
          # PROD, so on this dev lane it called the AI coach chat edge
          # function and billed real AI spend on every push to develop.
          # google_login and onboarding_signup are excluded for the same
          # reasons as on the M1 runner (interactive OAuth consent; needs
          # a clean install with no session).
          #
          # These comments MUST stay ABOVE the command. A `#` line placed
          # between backslash-continued lines does not comment "inside" the
          # command: the shell joins the continuation first, the `#` then
          # swallows the rest of that line, and `patrol test` runs with NO
          # targets — globbing the whole directory, which is precisely what
          # this list exists to prevent. Everything after it parses as a new
          # command ("--target: command not found").
          patrol test \
            --target integration_test/patrol_smoke_test.dart \
            --target integration_test/flows/auth_flow_test.dart \
            --target integration_test/flows/fuel_timeline_flow_test.dart \
            --target integration_test/flows/meal_log_build_flow_test.dart \
            --target integration_test/flows/meal_card_interaction_flow_test.dart \
            --target integration_test/flows/activities_crud_flow_test.dart \
            --target integration_test/flows/brick_plan_flow_test.dart \
            --target integration_test/flows/events_crud_flow_test.dart \
            --target integration_test/flows/event_checklist_carbload_flow_test.dart \
            --target integration_test/flows/formula_pin_flow_test.dart \
            --target integration_test/flows/formula_create_pin_flow_test.dart \
            --target integration_test/flows/settings_persist_flow_test.dart \
            --target integration_test/flows/settings_sweep_flow_test.dart \
            --target integration_test/flows/integrations_connect_flow_test.dart \
            --target integration_test/flows/learn_flow_test.dart \
            --target integration_test/flows/paywall_render_flow_test.dart \
            --target integration_test/flows/recommendation_stacking_flow_test.dart \
            --target integration_test/flows/energy_breakdown_flow_test.dart \
            --target integration_test/flows/barcode_scanner_entry_flow_test.dart \
            --target integration_test/flows/ai_credits_balance_flow_test.dart \
            --flavor dev \
            --dart-define-from-file=.env.dev.local \
            --dart-define-from-file=secrets/integration_test.env \
            --device "$TEST_DEVICE" \
            2>&1 | tee test-results/integration-tests.log
        test_report: test-results/integration-tests.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  # ============================================================
  # DEV INTEGRATION TESTS ON PUSH TO DEVELOP — identical to
  # `integration-tests` above (same anchors, same dev flavor, same
  # .env.dev.local, same mealvana_dev group), split out only because Codemagic
  # applies `branch_patterns` to every event in a `triggering` block. Merging
  # the two would fire the dev-backend suite on release/* pushes as well, where
  # integration-tests-prod is the suite that should run.
  #
  # This is the gate for "deploy to develop": dev-ios ships a dev TestFlight
  # build off the same push, so the flows run against the dev backend at the
  # moment the dev app changes, instead of waiting for a release branch to be
  # cut.
  # ============================================================
  integration-tests-develop:
    name: Integration Tests (DEV backend, push to develop)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev

    triggering:
      # DISABLED 2026-08-20 — Lee's ruling (see integration-tests above): this
      # exact workflow ran 1h31m on a develop push (~$9). Re-enable by
      # restoring `events: [push]` only if the suite ever moves back off the M1.
      events: []
      branch_patterns:
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *write_integration_creds
      - *flutter_pub_get
      - *run_build_runner
      - *install_patrol_cli
      - *boot_ios_simulator

      - name: Run Patrol integration tests (dev backend)
        script: |
          mkdir -p test-results

          # One build, every patrolTest() under integration_test/. Unit tests,
          # analyze and format are gated separately by pr-validation, which also
          # runs on this push, so they are not repeated here.
          # Explicit target list, kept in step with
          # .github/workflows/tests-selfhosted.yml. A bare
          # `--target integration_test` globs the whole directory, which
          # sweeps in ai_coach_chat_flow_test — that flow only self-skips on
          # PROD, so on this dev lane it called the AI coach chat edge
          # function and billed real AI spend on every push to develop.
          # google_login and onboarding_signup are excluded for the same
          # reasons as on the M1 runner (interactive OAuth consent; needs
          # a clean install with no session).
          #
          # These comments MUST stay ABOVE the command. A `#` line placed
          # between backslash-continued lines does not comment "inside" the
          # command: the shell joins the continuation first, the `#` then
          # swallows the rest of that line, and `patrol test` runs with NO
          # targets — globbing the whole directory, which is precisely what
          # this list exists to prevent. Everything after it parses as a new
          # command ("--target: command not found").
          patrol test \
            --target integration_test/patrol_smoke_test.dart \
            --target integration_test/flows/auth_flow_test.dart \
            --target integration_test/flows/fuel_timeline_flow_test.dart \
            --target integration_test/flows/meal_log_build_flow_test.dart \
            --target integration_test/flows/meal_card_interaction_flow_test.dart \
            --target integration_test/flows/activities_crud_flow_test.dart \
            --target integration_test/flows/brick_plan_flow_test.dart \
            --target integration_test/flows/events_crud_flow_test.dart \
            --target integration_test/flows/event_checklist_carbload_flow_test.dart \
            --target integration_test/flows/formula_pin_flow_test.dart \
            --target integration_test/flows/formula_create_pin_flow_test.dart \
            --target integration_test/flows/settings_persist_flow_test.dart \
            --target integration_test/flows/settings_sweep_flow_test.dart \
            --target integration_test/flows/integrations_connect_flow_test.dart \
            --target integration_test/flows/learn_flow_test.dart \
            --target integration_test/flows/paywall_render_flow_test.dart \
            --target integration_test/flows/recommendation_stacking_flow_test.dart \
            --target integration_test/flows/energy_breakdown_flow_test.dart \
            --target integration_test/flows/barcode_scanner_entry_flow_test.dart \
            --target integration_test/flows/ai_credits_balance_flow_test.dart \
            --flavor dev \
            --dart-define-from-file=.env.dev.local \
            --dart-define-from-file=secrets/integration_test.env \
            --device "$TEST_DEVICE" \
            2>&1 | tee test-results/integration-tests.log
        test_report: test-results/integration-tests.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  # ============================================================
  # PROD INTEGRATION TESTS — the same Patrol suite driven against the
  # PRODUCTION backend (prod flavor + .env.prod.local). The flows boot
  # main_prod via integration_test/helpers/flow_launcher.dart and log in with
  # the prod tester account (INTEGRATION_TEST_PROD_EMAIL/PASSWORD inside the
  # INTEGRATION_TEST_ENV secure var, present in BOTH the mealvana_dev and
  # mealvana_prod groups). CRUD flows create uniquely-named rows under that
  # tester account and delete them on the way out — they touch no other
  # prod user's data.
  #
  # Triggered on push to release/* (the release-verification point) and
  # startable manually before an App Store submit.
  # ============================================================
  integration-tests-prod:
    name: Integration Tests (PROD backend)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_prod
      vars:
        FLUTTER_ENV: prod

    triggering:
      # DISABLED 2026-08-20 — Lee's ruling (see integration-tests above).
      # Re-enable by restoring `events: [push]` only if the suite moves back
      # off the M1.
      events: []
      branch_patterns:
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *write_integration_creds
      - *flutter_pub_get
      - *run_build_runner
      - *install_patrol_cli
      - *boot_ios_simulator

      - name: Run Patrol integration tests against prod
        script: |
          mkdir -p test-results
          patrol test \
            --target integration_test \
            --flavor prod \
            --dart-define-from-file=.env.prod.local \
            --dart-define-from-file=secrets/integration_test.env \
            --device "$TEST_DEVICE" \
            2>&1 | tee test-results/integration-tests-prod.log
        test_report: test-results/integration-tests-prod.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  integration-test-quick:
    name: Quick Integration Test
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev
        # Default to a flow that actually exists (the old default,
        # event_management_flow_test.dart, was renamed to events_crud_flow_test).
        TEST_FLOW: events_crud_flow_test.dart

    # Manual only
    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *write_integration_creds
      - *flutter_pub_get
      - *run_build_runner
      - *install_patrol_cli
      - *boot_ios_simulator

      - name: Run single Patrol integration test
        script: |
          mkdir -p test-results
          patrol test \
            --target "integration_test/flows/$TEST_FLOW" \
            --flavor dev \
            --dart-define-from-file=.env.dev.local \
            --dart-define-from-file=secrets/integration_test.env \
            --device "$TEST_DEVICE" \
            2>&1 | tee test-results/quick-test.log
        test_report: test-results/quick-test.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  pr-validation:
    name: PR Validation
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      groups:
        - mealvana_dev  # needed for DOTENV_* secrets so asset-bundled .env files exist

    triggering:
      events:
        - pull_request
        # Push runs the same quality gate on every develop push (Lee,
        # 2026-07-21: tests must run on develop, not only at release time) and
        # on pushes to release/* branches themselves.
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *run_flutter_analyze
      - *check_formatting
      - *run_unit_tests
      - *run_algorithm_tests

    artifacts:
      - test-results/**

  # ============================================================
  # WEB E2E — boots the real Flutter web app in real Chrome via
  # `flutter drive` (the only e2e that sees a canvas-rendered UI; DOM tools
  # like Playwright cannot). Catches web-only boot failures that VM unit/widget
  # tests miss (e.g. the edge-CORS storm and the drift migration boot crash).
  # Separate, non-gating workflow — a failure here does NOT block pr-validation.
  # Promote to a required check once it has proven stable, or move to a schedule.
  #
  # Requires a `DOTENV_WEB_LOCAL` secret in the mealvana_dev group: the JSON
  # contents of .env.web.local (at minimum APP_ENVIRONMENT / SUPABASE_URL /
  # SUPABASE_ANON_KEY). chromedriver is auto-provisioned to match the runner's
  # Chrome by scripts/run_web_e2e.sh, so no driver setup step is needed.
  # ============================================================
  web-e2e:
    name: Web E2E (flutter drive)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: stable
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'develop'
          include: true
        - pattern: 'feature/*'
          include: true
        - pattern: 'fix/*'
          include: true
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - name: Write .env.web.local from Codemagic secret
        script: |
          set -euo pipefail
          printf '%s' "${DOTENV_WEB_LOCAL:-}" > .env.web.local
          echo "wrote .env.web.local ($(wc -c < .env.web.local) bytes)"
          if [ ! -s .env.web.local ]; then
            echo "ERROR: DOTENV_WEB_LOCAL secret is empty — add it to the mealvana_dev group." >&2
            exit 1
          fi
      - *flutter_pub_get
      - *run_build_runner
      - name: Run web e2e (boot smoke)
        script: |
          mkdir -p test-results
          bash scripts/run_web_e2e.sh 2>&1 | tee test-results/web-e2e.log

    artifacts:
      - test-results/**

  # ============================================================
  # LEGACY BUILD WORKFLOWS (Fallback without Shorebird)
  # ============================================================

  ios-build-legacy:
    name: iOS Build (Legacy - No Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: API Key for CI builds

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milkman.mealvanaendurance
      groups:
        - mealvana_prod
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_cocoapods
      - *setup_ios_signing

      - name: Resolve next iOS build number from TestFlight
        script: |
          set -e
          BUNDLE_ID=com.milkman.mealvanaendurance
          APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$APP_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve TestFlight build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "TestFlight latest build for $BUNDLE_ID: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Build iOS (Standard)
        script: |
          flutter build ipa --release \
            --flavor prod \
            --target lib/main_prod.dart \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - *upload_sentry_symbols

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  android-build-legacy:
    name: Android Build (Legacy - No Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - google_play_credentials
        - firebase_config
        - android_signing_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *setup_android_signing

      - name: Resolve next Android build number from Play
        script: |
          set -e
          PACKAGE_NAME=com.milkman.mealvanaendurance
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud-sa.json
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @file:/tmp/gcloud-sa.json 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve Play build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "Play latest build for $PACKAGE_NAME: $LATEST"
          fi
          # A run that builds the Shorebird release but dies at Play publishing
          # leaves a zombie release Play never saw; the next run then collides
          # with exit 70 at `shorebird release android` (hit 2026-07-22 — the
          # same failure class the iOS resolver already guards against). Take
          # the max of Play and Shorebird, exactly like the iOS resolvers.
          SB_LATEST=$(shorebird releases list --flavor prod 2>/dev/null | grep -oE '\+[0-9]+' | tr -d '+' | sort -n | tail -1 || echo "")
          if [ -n "$SB_LATEST" ] && [ "$SB_LATEST" -eq "$SB_LATEST" ] 2>/dev/null; then
            echo "Shorebird latest prod release build: $SB_LATEST"
            if [ "$SB_LATEST" -gt "$LATEST" ]; then
              LATEST=$SB_LATEST
            fi
          else
            echo "⚠️  Could not resolve Shorebird release list; using Play number only"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next Android build number: $NEXT"

      - name: Build Android App Bundle (Standard)
        script: |
          flutter build appbundle --release \
            --flavor prod \
            --target lib/main_prod.dart \
            --build-number=$BUILD_NUMBER

      - *upload_sentry_symbols

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true
