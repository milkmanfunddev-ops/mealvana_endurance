# Codemagic CI/CD Configuration for Mealvana Endurance
#
# Updated: 2025-12-18
# Changes:
# - Fixed Firebase variable name (GOOGLE_SERVICES_JSON, no base64 encoding)
# - Refactored to use YAML anchors (reduced duplication)
# - REMOVED ALL TESTING for faster deployment testing
# - Added dev-ios workflow (manual, no Shorebird)
# - Updated prod triggers to release/* only (removed main)
# - Changed Android prod to beta track (open testing)
#
# Documentation:
# - Codemagic: https://docs.codemagic.io/yaml-testing/testing/
# - Shorebird: https://docs.shorebird.dev/code-push/ci/codemagic/
# - Project docs: /docs/ci-cd/README.md
#
# ============================================================
# CONVENTION: Build-number resolution (do not skip)
# ============================================================
# Every workflow that produces a release artifact (.aab/.ipa) MUST:
#   1. Run a "Resolve next … build number" step before the build, which
#      queries Play / TestFlight for the highest existing buildNumber for
#      that bundle id and exports BUILD_NUMBER = max + 1.
#   2. Pass `--build-number=$BUILD_NUMBER` to whatever produces the
#      artifact: `flutter build appbundle/ipa`, `shorebird release ios`,
#      `shorebird release android`.
#
# WHY: pubspec.yaml's `version: x.y.z+N` is committed state. Without
# runtime resolution every build of the same release branch ships the
# same buildNumber, which:
#   - Google Play rejects the rollout ("does not allow existing users to
#     upgrade to the newly added APKs").
#   - Shorebird rejects creating the release ("existing release for
#     version x.y.z+N").
#   - TestFlight silently dedupes / rejects.
# Patch workflows (`prod-*-patch`) are exempt — they take a
# `--release-version` instead of producing a new artifact.
# ============================================================

definitions:
  # ============================================================
  # Reusable Script Definitions
  # ============================================================
  scripts:
    - &flutter_pub_get
      name: Get Flutter dependencies
      script: flutter pub get

    - &run_build_runner
      name: Run code generation
      script: dart run build_runner build --delete-conflicting-outputs

    - &run_unit_tests
      name: Run unit tests
      script: |
        mkdir -p test-results
        flutter test --exclude-tags="integration || e2e" --machine > test-results/unit-tests.json
      test_report: test-results/unit-tests.json

    - &run_algorithm_tests
      name: Run nutrition algorithm tests (Deno)
      script: |
        if ! command -v deno &> /dev/null; then
          curl -fsSL https://deno.land/install.sh | sh -s -- --yes
          export PATH="$HOME/.deno/bin:$PATH"
        fi
        bash supabase/functions/run-algorithm-tests.sh

    - &run_flutter_analyze
      name: Analyze code
      script: flutter analyze --no-fatal-warnings --no-fatal-infos

    - &check_formatting
      name: Check code formatting
      script: dart format --set-exit-if-changed lib test

    - &install_shorebird
      name: Install Shorebird CLI
      script: |
        curl -fsSL https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
        export PATH="$HOME/.shorebird/bin:$PATH"
        echo "PATH=$HOME/.shorebird/bin:$PATH" >> $CM_ENV
        shorebird doctor

    - &upload_sentry_symbols
      # Upload debug symbols / source maps to Sentry so stack traces are
      # de-obfuscated in the Sentry dashboard.
      #
      # OPTIONAL / NON-BLOCKING: this is observability, not a release gate.
      # Symbol upload must NEVER fail a build or block TestFlight delivery.
      # If SENTRY_AUTH_TOKEN is missing or the upload errors, we warn and
      # continue so the IPA still publishes.
      #
      # To enable actual symbol upload: add SENTRY_AUTH_TOKEN to the
      # Codemagic variable group (mealvana_dev and/or mealvana_prod).
      # Create the token at https://sentry.io/settings/account/api/auth-tokens/
      # with scopes: project:releases, org:read. Then in Codemagic:
      #   Team Settings → Environment variables → add SENTRY_AUTH_TOKEN
      #   to the relevant variable group(s).
      #
      # The sentry: block in pubspec.yaml already has org: milkman-24 and
      # project: mealvana-endurance configured for the plugin.
      name: Upload debug symbols to Sentry
      script: |
        if [ -z "$SENTRY_AUTH_TOKEN" ]; then
          echo "⚠️  SENTRY_AUTH_TOKEN not set — skipping Sentry symbol upload (non-blocking)."
          exit 0
        fi
        dart run sentry_dart_plugin || \
          echo "⚠️  Sentry symbol upload failed — continuing anyway (non-blocking)."

    - &install_cocoapods
      name: Install CocoaPods dependencies
      script: cd ios && pod install

    - &load_firebase_config
      name: Load Firebase configuration
      script: |
        #!/usr/bin/env sh
        set -e
        echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        echo "✅ google-services.json created"
        ls -la android/app/google-services.json

    - &setup_ios_signing
      name: Set up iOS code signing
      # IMPORTANT: do NOT call `keychain initialize` here. Codemagic
      # auto-injects a "Set up code signing identities" step when
      # `ios_signing:` is present in the workflow environment, and that
      # step initializes the keychain + imports the .p12 cert. A second
      # `keychain initialize` creates a fresh empty keychain and pushes
      # the cert-bearing keychain off the search list, leaving xcodebuild
      # with 0 valid signing identities and the misleading
      # "No signing certificate iOS Distribution found" error at export.
      script: |
        xcode-project use-profiles

    - &setup_ios_signing_shorebird
      name: Set up iOS code signing (Shorebird)
      # IMPORTANT: do NOT call `keychain initialize` here. See note on
      # &setup_ios_signing above for the full explanation. Codemagic's
      # auto-injected "Set up code signing identities" step (triggered by
      # the `ios_signing:` env block) already initializes the keychain
      # and imports the cert .p12; a second `keychain initialize` here
      # spawns a fresh empty keychain and silently knocks the cert off
      # the search path, leading to "iOS Distribution not found" at
      # exportArchive time.
      script: |
        # CRITICAL: manageAppVersionAndBuildNumber must be false for Shorebird
        xcode-project use-profiles --custom-export-options='{"manageAppVersionAndBuildNumber":false}'

    - &boot_ios_simulator
      name: Boot iOS Simulator
      script: |
        # Shutdown any existing simulators
        xcrun simctl shutdown all || true

        # Find available iPhone simulator runtime
        RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9]+-[0-9]+' | tail -1)
        echo "Using runtime: $RUNTIME"

        # Create a test device
        TEST_DEVICE=$(xcrun simctl create "Test iPhone" "iPhone 15 Pro" "$RUNTIME")
        echo "Created device: $TEST_DEVICE"

        # Boot the simulator
        xcrun simctl boot "$TEST_DEVICE"

        # Wait for simulator to be ready
        sleep 10

        # Export device ID for subsequent scripts
        echo "TEST_DEVICE=$TEST_DEVICE" >> $CM_ENV

    - &shutdown_ios_simulator
      name: Shutdown iOS Simulator
      script: xcrun simctl shutdown all || true

    - &setup_android_signing
      name: Decode Android keystore and write key.properties
      # android/app/build.gradle.kts reads android/key.properties for release signing.
      # Both files are gitignored, so we recreate them from the android_signing_credentials
      # variable group: CM_KEYSTORE_B64 (base64 of .jks) + password/alias vars.
      script: |
        set -euo pipefail
        if [ -z "${CM_KEYSTORE_B64:-}" ]; then
          echo "⚠️  CM_KEYSTORE_B64 not set — skipping Android signing setup"
          exit 0
        fi
        mkdir -p android/app
        printf '%s' "$CM_KEYSTORE_B64" | base64 -d > android/app/keystore.jks
        cat > android/key.properties <<EOF
        storePassword=${CM_KEYSTORE_PASSWORD}
        keyPassword=${CM_KEYSTORE_KEY_PASSWORD}
        keyAlias=${CM_KEYSTORE_KEY_ALIAS}
        storeFile=keystore.jks
        EOF
        echo "wrote android/app/keystore.jks ($(wc -c < android/app/keystore.jks) bytes) + android/key.properties"

    - &write_dotenv_files
      name: Write .env files from Codemagic secrets
      # The app bundles .env / .env.dev.local / .env.prod.local as Flutter assets
      # (pubspec.yaml). They're gitignored, so Codemagic has to recreate them from
      # secure vars uploaded to the mealvana_dev / mealvana_prod variable groups.
      # Any file whose source var isn't in the current workflow's groups is written
      # as an empty stub — enough to satisfy the asset bundler without leaking the
      # other flavor's secrets into this build.
      script: |
        set -euo pipefail
        printf '%s' "${DOTENV_ROOT:-}" > .env
        printf '%s' "${DOTENV_DEV_LOCAL:-}" > .env.dev.local
        printf '%s' "${DOTENV_PROD_LOCAL:-}" > .env.prod.local
        echo "wrote .env ($(wc -c < .env) bytes), .env.dev.local ($(wc -c < .env.dev.local) bytes), .env.prod.local ($(wc -c < .env.prod.local) bytes)"

workflows:
  # ============================================================
  # DEV WORKFLOWS — auto-triggered on push to `develop`
  # ============================================================

  dev-ios:
    name: Develop - iOS TestFlight (dev flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: API Key for CI builds

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milkman.mealvanaendurance.dev
      groups:
        - mealvana_dev  # Dev environment variables
      vars:
        FLUTTER_ENV: dev
        APP_ENVIRONMENT: dev

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_cocoapods
      - *setup_ios_signing

      - name: Resolve next iOS build number from TestFlight
        # Looks up the dev ASC app by bundle id, asks ASC for the latest TestFlight
        # build number, and exports BUILD_NUMBER = latest + 1. If lookup fails (e.g.
        # ASC integration permissions issue or empty TestFlight history), falls back
        # to Codemagic's project-level $PROJECT_BUILD_NUMBER, which auto-increments
        # per project build.
        script: |
          set -e
          APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier com.milkman.mealvanaendurance.dev --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$APP_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve TestFlight build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "TestFlight latest build for com.milkman.mealvanaendurance.dev: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Build dev iOS
        script: |
          flutter build ipa --release \
            --flavor dev \
            --target lib/main_dev.dart \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - *upload_sentry_symbols

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        # Note: do NOT list "Internal Testers" under beta_groups. That is
        # Apple's built-in auto-managed group (assigned implicitly to all
        # team members with App Manager+ role), not a custom external
        # group, and the ASC API rejects explicit assignment to it with
        # "Cannot add internal group to a build". With submit_to_testflight
        # alone, the build appears for the auto-managed Internal Testers
        # group as soon as ASC finishes processing.
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  dev-android:
    name: Develop - Android Play Internal Testing (dev flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_dev
        - google_play_credentials
        - firebase_config
        - android_signing_credentials
      vars:
        FLUTTER_ENV: dev
        APP_ENVIRONMENT: dev

    # Manual-only trigger. Auto-trigger on `develop` push is disabled
    # until the Play Console dev app (com.milkman.mealvanaendurance.dev)
    # exists — without it the build always fails at publish with
    # "Package not found", spamming Slack on every push to develop.
    # Re-enable by adding back `events: [push]` once the Play Console
    # dev app is created.
    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *setup_android_signing

      - name: Resolve next Android build number from Play Internal track
        # Asks Google Play for the highest versionCode it's seen for our dev
        # package — across all tracks, so newly-promoted/old builds are also
        # respected — and exports BUILD_NUMBER = max + 1. Falls back to the
        # Codemagic $PROJECT_BUILD_NUMBER if Play returns nothing (first ever
        # upload, or service-account auth issue).
        script: |
          set -e
          PACKAGE_NAME=com.milkman.mealvanaendurance.dev
          # Persist credentials for the google-play CLI
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud-sa.json
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @file:/tmp/gcloud-sa.json 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve Play build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "Play latest build for $PACKAGE_NAME: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next Android build number: $NEXT"

      - name: Build dev Android
        script: |
          flutter build appbundle --release \
            --flavor dev \
            --target lib/main_dev.dart \
            --build-number=$BUILD_NUMBER

      - *upload_sentry_symbols

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
  # RELEASE WORKFLOWS — auto-triggered on push to `release/*`
  # Prod flavor, Shorebird release. iOS → TestFlight; Android → Play Closed (alpha).
  # ============================================================

  prod-ios:
    name: Release - iOS TestFlight (Shorebird, prod flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: API Key for CI builds

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milkman.mealvanaendurance
      groups:
        - mealvana_prod
        - shorebird_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods
      - *setup_ios_signing_shorebird

      - name: Resolve next iOS build number from TestFlight
        # Shorebird rejects creating a release for a (flavor, version,
        # platform) tuple it has already seen. TestFlight likewise rejects
        # duplicate build numbers. Both are derived from CFBundleVersion,
        # which we set via --build-number below. Without this resolve,
        # rerunning a release/* build (or main → release-merge) collides.
        script: |
          set -e
          BUNDLE_ID=com.milkman.mealvanaendurance
          APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$APP_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve TestFlight build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "TestFlight latest build for $BUNDLE_ID: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Create Shorebird iOS Release
        # Don't pass --flutter-version=stable. Shorebird only accepts
        # specific version strings (e.g. 3.27.4), not "stable", and will
        # fail with "Version stable not found." Without the flag, Shorebird
        # uses its default supported version. `set -e` ensures the build
        # fails loudly here instead of silently producing no IPA.
        # --build-number is forwarded to flutter build ipa so the IPA's
        # CFBundleVersion picks up the resolved value, making the release
        # version unique in Shorebird's records.
        script: |
          set -e
          shorebird release ios \
            --flavor prod \
            --target lib/main_prod.dart \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$BUILD_NUMBER

          echo ""
          echo "=========================================="
          echo "Shorebird iOS release created successfully!"
          echo "You can now create patches using prod-ios-patch workflow"
          echo "=========================================="

      - *upload_sentry_symbols

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        # Apple's auto-managed Internal Testers group sees the build
        # as soon as ASC finishes processing; no explicit beta_groups
        # entry is needed (and listing "Internal Testers" here causes
        # post-publish failures — that's a built-in implicit group).
        # To promote a specific build to External Testers, do that
        # manually in App Store Connect → TestFlight → Builds → Add to
        # Group when you want it; CI stays out of external review.
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  prod-android:
    name: Release - Android Play Closed Testing (Shorebird, prod flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - shorebird_credentials
        - google_play_credentials
        - firebase_config
        - android_signing_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *setup_android_signing
      - *install_shorebird

      - name: Resolve next Android build number from Play
        # Play rejects rollouts whose versionCode isn't strictly greater
        # than every existing one across ALL tracks (production, beta,
        # alpha, internal). google-play get-latest-build-number scans all
        # tracks; we bump by 1 and fall back to $PROJECT_BUILD_NUMBER if
        # Play returns nothing.
        script: |
          set -e
          PACKAGE_NAME=com.milkman.mealvanaendurance
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud-sa.json
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @file:/tmp/gcloud-sa.json 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve Play build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "Play latest build for $PACKAGE_NAME: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next Android build number: $NEXT"

      - name: Create Shorebird Android Release
        # Same as iOS: drop --flutter-version=stable (Shorebird rejects
        # the literal string "stable") and add set -e so a silent
        # shorebird failure doesn't masquerade as a successful build.
        # --build-number is forwarded to `flutter build appbundle` so
        # versionCode picks up the value resolved above instead of the
        # +1 from pubspec.yaml.
        script: |
          set -e
          shorebird release android \
            --flavor prod \
            --target lib/main_prod.dart \
            --artifact=aab \
            --build-number=$BUILD_NUMBER

          echo ""
          echo "=========================================="
          echo "Shorebird Android release created successfully!"
          echo "You can now create patches using prod-android-patch workflow"
          echo "=========================================="

      - *upload_sentry_symbols

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha  # Closed testing track
        submit_as_draft: false
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
  # MAIN WORKFLOWS — auto-triggered on push to `main`
  # Prod flavor, Shorebird release. iOS → App Store submission;
  # Android → Play Open Testing (beta track).
  #
  # ⚠️  Shorebird version collision: both release/* and main flows call
  #     `shorebird release` with --flavor prod. Shorebird keys releases by
  #     (flavor, Flutter version, pubspec version). If main and release/*
  #     ever share a version, the second one errors. Standard practice:
  #     bump pubspec version between the release/* merge-back and the
  #     main merge, OR only run one of these flows per version.
  # ============================================================

  main-ios:
    name: Main - iOS App Store (Shorebird, prod flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: API Key for CI builds

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milkman.mealvanaendurance
      groups:
        - mealvana_prod
        - shorebird_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods
      - *setup_ios_signing_shorebird

      - name: Resolve next iOS build number from TestFlight
        # Same rationale as prod-ios: every release artifact must get a
        # versionCode/buildNumber that's unique in TestFlight + Shorebird.
        script: |
          set -e
          BUNDLE_ID=com.milkman.mealvanaendurance
          APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$APP_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve TestFlight build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "TestFlight latest build for $BUNDLE_ID: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Create Shorebird iOS Release (App Store)
        # Don't pass --flutter-version=stable (Shorebird rejects it).
        # set -e so silent shorebird failures don't get past CI.
        # --build-number forwarded to flutter build ipa (see prod-ios).
        script: |
          set -e
          shorebird release ios \
            --flavor prod \
            --target lib/main_prod.dart \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$BUILD_NUMBER

      - *upload_sentry_symbols

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        # Leave manual release control in App Store Connect; don't auto-release to users.
        release_type: MANUAL
        # External tester promotion is intentionally manual: do that
        # from App Store Connect → TestFlight → Builds when you're
        # ready, so CI doesn't burn Beta App Review submissions on
        # candidates that aren't actually externally-tested-ready.
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  main-android:
    name: Main - Android Play Open Testing (Shorebird, prod flavor)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - shorebird_credentials
        - google_play_credentials
        - firebase_config
        - android_signing_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *setup_android_signing
      - *install_shorebird

      - name: Resolve next Android build number from Play
        # Same rationale as prod-android: Play won't accept a versionCode
        # less than the max across all tracks (and main-android targets
        # the beta/open-testing track on top of whatever release/* has
        # already shipped to alpha).
        script: |
          set -e
          PACKAGE_NAME=com.milkman.mealvanaendurance
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud-sa.json
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @file:/tmp/gcloud-sa.json 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve Play build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "Play latest build for $PACKAGE_NAME: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next Android build number: $NEXT"

      - name: Create Shorebird Android Release (Play Open/Beta)
        # Drop --flutter-version=stable + add set -e (see iOS notes above).
        # --build-number forwarded to flutter build (see prod-android).
        script: |
          set -e
          shorebird release android \
            --flavor prod \
            --target lib/main_prod.dart \
            --artifact=aab \
            --build-number=$BUILD_NUMBER

      - *upload_sentry_symbols

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta  # Open testing track (app not yet released to production)
        submit_as_draft: false
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
  # PROD-CI WORKFLOW — manual. Prod flavor built against real prod
  # endpoints, uploaded to the DEV TestFlight app
  # (bundle com.milkman.mealvanaendurance.dev) for dogfooding without
  # going through release/*. No Shorebird (dev TestFlight = scratch).
  #
  # Uses --flavor dev (→ Xcode gives us the .dev bundle ID and signing)
  # with --target lib/main_prod.dart (→ app loads .env.prod.local).
  # ============================================================

  prod-ci-ios:
    name: Prod-CI - iOS dev TestFlight with prod flavor (manual)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: API Key for CI builds

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milkman.mealvanaendurance.dev
      groups:
        - mealvana_prod  # prod env vars via DOTENV_PROD_LOCAL
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_cocoapods
      - *setup_ios_signing

      - name: Resolve next iOS build number from TestFlight (dev)
        # prod-ci uploads to the .dev TestFlight app, so resolve against
        # that bundle id (not the prod one).
        script: |
          set -e
          BUNDLE_ID=com.milkman.mealvanaendurance.dev
          APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -n "$APP_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve TestFlight build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "TestFlight latest build for $BUNDLE_ID: $LATEST"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Build prod-flavor-code with dev bundle (iOS)
        script: |
          flutter build ipa --release \
            --flavor dev \
            --target lib/main_prod.dart \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - *upload_sentry_symbols

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        beta_groups:
          - Internal Testers
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
  # SHOREBIRD PATCH WORKFLOWS (Manual Only)
  # ============================================================

  prod-ios-patch:
    name: Prod - iOS Shorebird Patch (OTA)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_prod
        - shorebird_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod
        # Set to patch a specific version (e.g., "1.0.0+1") or "latest"
        RELEASE_VERSION: "latest"

    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods

      - name: Create Shorebird iOS Patch
        script: |
          if [ -z "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "latest" ]; then
            echo "Creating patch for latest iOS release..."
            shorebird patch ios --flavor prod --target lib/main_prod.dart
          else
            echo "Creating patch for iOS release version: $RELEASE_VERSION"
            shorebird patch ios --flavor prod --target lib/main_prod.dart --release-version="$RELEASE_VERSION"
          fi

          echo ""
          echo "=========================================="
          echo "iOS Patch created successfully!"
          echo "Users will receive update on next app restart"
          echo "=========================================="

  prod-android-patch:
    name: Prod - Android Shorebird Patch (OTA)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - shorebird_credentials
        - firebase_config
        - android_signing_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod
        RELEASE_VERSION: "latest"

    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *setup_android_signing
      - *install_shorebird

      - name: Create Shorebird Android Patch
        script: |
          if [ -z "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "latest" ]; then
            echo "Creating patch for latest Android release..."
            shorebird patch android --flavor prod --target lib/main_prod.dart
          else
            echo "Creating patch for Android release version: $RELEASE_VERSION"
            shorebird patch android --flavor prod --target lib/main_prod.dart --release-version="$RELEASE_VERSION"
          fi

          echo ""
          echo "=========================================="
          echo "Android Patch created successfully!"
          echo "Users will receive update on next app restart"
          echo "=========================================="

  # ============================================================
  # TESTING WORKFLOWS
  # ============================================================

  integration-tests:
    name: Integration Tests
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'develop'
          include: true
        - pattern: 'feature/*'
          include: true
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *run_unit_tests
      - *boot_ios_simulator

      - name: Run integration tests
        script: |
          mkdir -p test-results

          # Run integration tests with expanded output (single run)
          flutter test integration_test/test_runner.dart \
            -d "$TEST_DEVICE" \
            --reporter expanded \
            2>&1 | tee test-results/integration-tests.log
        test_report: test-results/integration-tests.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  integration-test-quick:
    name: Quick Integration Test
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev
        # Default to event management test (fastest)
        TEST_FLOW: event_management_flow_test.dart

    # Manual only
    triggering:
      events: []

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *boot_ios_simulator

      - name: Run single integration test
        script: |
          mkdir -p test-results
          flutter test "integration_test/flows/$TEST_FLOW" \
            -d "$TEST_DEVICE" \
            --reporter expanded \
            2>&1 | tee test-results/quick-test.log
        test_report: test-results/quick-test.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  pr-validation:
    name: PR Validation
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      groups:
        - mealvana_dev  # needed for DOTENV_* secrets so asset-bundled .env files exist

    triggering:
      events:
        - pull_request
      cancel_previous_builds: true

    scripts:
      - *write_dotenv_files
      - *flutter_pub_get
      - *run_build_runner
      - *run_flutter_analyze
      - *check_formatting
      - *run_unit_tests
      - *run_algorithm_tests

    artifacts:
      - test-results/**

