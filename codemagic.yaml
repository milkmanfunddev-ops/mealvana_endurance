      - name: Resolve next Android build number from Play
        # Play rejects rollouts whose versionCode isn't strictly greater
        # than every existing one across ALL tracks (production, beta,
        # alpha, internal). google-play get-latest-build-number scans all
        # tracks; we bump by 1 and fall back to $PROJECT_BUILD_NUMBER if
        # Play returns nothing.
        script: |
          set -e
          PACKAGE_NAME=com.milkman.mealvanaendurance
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud-sa.json
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @file:/tmp/gcloud-sa.json 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || ! [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            LATEST=$PROJECT_BUILD_NUMBER
            echo "⚠️  Could not resolve Play build number; falling back to PROJECT_BUILD_NUMBER=$LATEST"
          else
            echo "Play latest build for $PACKAGE_NAME: $LATEST"
          fi
          # A run that builds the Shorebird release but dies at Play publishing
          # leaves a zombie release Play never saw; the next run then collides
          # with exit 70 at `shorebird release android` (hit 2026-07-22 — the
          # same failure class the iOS resolver already guards against). Take
          # the max of Play and Shorebird, exactly like the iOS resolvers.
          SB_LATEST=$(shorebird releases list --flavor prod 2>/dev/null | grep -oE '\+[0-9]+' | tr -d '+' | sort -n | tail -1 || echo "")
          if [ -n "$SB_LATEST" ] && [ "$SB_LATEST" -eq "$SB_LATEST" ] 2>/dev/null; then
            echo "Shorebird latest prod release build: $SB_LATEST"
            if [ "$SB_LATEST" -gt "$LATEST" ]; then
              LATEST=$SB_LATEST
            fi
          else
            echo "⚠️  Could not resolve Shorebird release list; using Play number only"
          fi
          NEXT=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next Android build number: $NEXT"

      - name: Create Shorebird Android Release
        # Same as iOS: drop --flutter-version=stable (Shorebird rejects
        # the literal string "stable") and add set -e so a silent
        # shorebird failure doesn't masquerade as a successful build.
        # --build-number is forwarded to `flutter build appbundle` so
        # versionCode picks up the value resolved above instead of the
        # +1 from pubspec.yaml.
        script: |
          set -e
          shorebird release android \
            --flavor prod \
            --target lib/main_prod.dart \
            --artifact=aab \
            --build-number=$BUILD_NUMBER

          echo ""
          echo "=========================================="
          echo "Shorebird Android release created successfully!"
          echo "You can now create patches using prod-android-patch workflow"
          echo "=========================================="

      - *upload_sentry_symbols

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta  # Open testing track (Play target-API notice asks for a testable release)
        submit_as_draft: false
        # Play refuses automatic send-for-review while the console has pending
        # items (App-access credentials). Without this the 1.23.0 publish
        # failed AFTER a successful AAB upload: "Changes cannot be sent for
        # review automatically. Please set changesNotSentForReview to true."
        # Releases land in the console and must be sent for review manually.
        changes_not_sent_for_review: true
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
