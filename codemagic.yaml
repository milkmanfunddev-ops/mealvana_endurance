# Codemagic CI/CD Configuration for Mealvana Endurance
#
# Updated: 2025-12-18
# Changes:
# - Fixed Firebase variable name (GOOGLE_SERVICES_JSON, no base64 encoding)
# - Refactored to use YAML anchors (reduced duplication)
# - REMOVED ALL TESTING for faster deployment testing
# - Added dev-ios workflow (manual, no Shorebird)
# - Updated prod triggers to release/* only (removed main)
# - Changed Android prod to beta track (open testing)
#
# Documentation:
# - Codemagic: https://docs.codemagic.io/yaml-testing/testing/
# - Shorebird: https://docs.shorebird.dev/code-push/ci/codemagic/
# - Project docs: /docs/ci-cd/README.md

definitions:
  # ============================================================
  # Reusable Script Definitions
  # ============================================================
  scripts:
    - &flutter_pub_get
      name: Get Flutter dependencies
      script: flutter pub get

    - &run_build_runner
      name: Run code generation
      script: dart run build_runner build --delete-conflicting-outputs

    - &run_unit_tests
      name: Run unit tests
      script: |
        mkdir -p test-results
        flutter test --machine > test-results/unit-tests.json
      test_report: test-results/unit-tests.json

    - &run_flutter_analyze
      name: Analyze code
      script: flutter analyze

    - &check_formatting
      name: Check code formatting
      script: dart format --set-exit-if-changed lib test

    - &install_shorebird
      name: Install Shorebird CLI
      script: |
        curl -fsSL https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
        export PATH="$HOME/.shorebird/bin:$PATH"
        echo "PATH=$HOME/.shorebird/bin:$PATH" >> $CM_ENV
        shorebird doctor

    - &install_cocoapods
      name: Install CocoaPods dependencies
      script: cd ios && pod install

    - &load_firebase_config
      name: Load Firebase configuration
      script: |
        #!/usr/bin/env sh
        set -e
        echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        echo "✅ google-services.json created"
        ls -la android/app/google-services.json

    - &setup_ios_signing
      name: Set up iOS code signing
      script: |
        keychain initialize
        xcode-project use-profiles

    - &setup_ios_signing_shorebird
      name: Set up iOS code signing (Shorebird)
      script: |
        keychain initialize
        # CRITICAL: manageAppVersionAndBuildNumber must be false for Shorebird
        xcode-project use-profiles --custom-export-options='{"manageAppVersionAndBuildNumber":false}'

    - &boot_ios_simulator
      name: Boot iOS Simulator
      script: |
        # Shutdown any existing simulators
        xcrun simctl shutdown all || true

        # Find available iPhone simulator runtime
        RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9]+-[0-9]+' | tail -1)
        echo "Using runtime: $RUNTIME"

        # Create a test device
        TEST_DEVICE=$(xcrun simctl create "Test iPhone" "iPhone 15 Pro" "$RUNTIME")
        echo "Created device: $TEST_DEVICE"

        # Boot the simulator
        xcrun simctl boot "$TEST_DEVICE"

        # Wait for simulator to be ready
        sleep 10

        # Export device ID for subsequent scripts
        echo "TEST_DEVICE=$TEST_DEVICE" >> $CM_ENV

    - &shutdown_ios_simulator
      name: Shutdown iOS Simulator
      script: xcrun simctl shutdown all || true

workflows:
  # ============================================================
  # DEV WORKFLOWS (Manual Only)
  # ============================================================

  dev-ios:
    name: Dev - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Mealvana

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mealvana.endurance.dev
      groups:
        - mealvana_dev  # Dev environment variables
      vars:
        FLUTTER_ENV: dev
        APP_ENVIRONMENT: dev

    # Manual trigger only - no automatic builds for dev
    triggering:
      events: []

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *install_cocoapods
      - *setup_ios_signing

      - name: Build dev iOS
        script: |
          flutter build ipa --release \
            --flavor dev \
            --target lib/main_dev.dart \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        # Internal testers only
        beta_groups:
          - Internal Testers
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  dev-android:
    name: Dev - Android Internal Testing
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_dev
        - google_play_credentials
        - firebase_config
      vars:
        FLUTTER_ENV: dev
        APP_ENVIRONMENT: dev

    # Manual trigger only
    triggering:
      events: []

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config

      - name: Build dev Android
        script: |
          flutter build appbundle --release \
            --flavor dev \
            --target lib/main_dev.dart

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
  # PRODUCTION WORKFLOWS (Automated on release/*)
  # ============================================================

  prod-ios:
    name: Prod - iOS Shorebird Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Mealvana

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mealvana.endurance
      groups:
        - mealvana_prod
        - shorebird_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods
      - *setup_ios_signing_shorebird

      - name: Create Shorebird iOS Release
        script: |
          shorebird release ios \
            --flavor prod \
            --target lib/main_prod.dart \
            --flutter-version=stable \
            --export-options-plist=/Users/builder/export_options.plist

          echo ""
          echo "=========================================="
          echo "Shorebird iOS release created successfully!"
          echo "You can now create patches using prod-ios-patch workflow"
          echo "=========================================="

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        beta_groups:
          - Internal Testers
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  prod-android:
    name: Prod - Android Open Testing
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - shorebird_credentials
        - google_play_credentials
        - firebase_config
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *install_shorebird

      - name: Create Shorebird Android Release
        script: |
          shorebird release android \
            --flavor prod \
            --target lib/main_prod.dart \
            --flutter-version=stable \
            --artifact=aab

          echo ""
          echo "=========================================="
          echo "Shorebird Android release created successfully!"
          echo "You can now create patches using prod-android-patch workflow"
          echo "=========================================="

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta  # Open testing track
        submit_as_draft: false
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  # ============================================================
  # SHOREBIRD PATCH WORKFLOWS (Manual Only)
  # ============================================================

  prod-ios-patch:
    name: Prod - iOS Shorebird Patch (OTA)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_prod
        - shorebird_credentials
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod
        # Set to patch a specific version (e.g., "1.0.0+1") or "latest"
        RELEASE_VERSION: "latest"

    triggering:
      events: []

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *install_shorebird
      - *install_cocoapods

      - name: Create Shorebird iOS Patch
        script: |
          if [ -z "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "latest" ]; then
            echo "Creating patch for latest iOS release..."
            shorebird patch ios --flavor prod --target lib/main_prod.dart
          else
            echo "Creating patch for iOS release version: $RELEASE_VERSION"
            shorebird patch ios --flavor prod --target lib/main_prod.dart --release-version="$RELEASE_VERSION"
          fi

          echo ""
          echo "=========================================="
          echo "iOS Patch created successfully!"
          echo "Users will receive update on next app restart"
          echo "=========================================="

  prod-android-patch:
    name: Prod - Android Shorebird Patch (OTA)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - shorebird_credentials
        - firebase_config
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod
        RELEASE_VERSION: "latest"

    triggering:
      events: []

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config
      - *install_shorebird

      - name: Create Shorebird Android Patch
        script: |
          if [ -z "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "latest" ]; then
            echo "Creating patch for latest Android release..."
            shorebird patch android --flavor prod --target lib/main_prod.dart
          else
            echo "Creating patch for Android release version: $RELEASE_VERSION"
            shorebird patch android --flavor prod --target lib/main_prod.dart --release-version="$RELEASE_VERSION"
          fi

          echo ""
          echo "=========================================="
          echo "Android Patch created successfully!"
          echo "Users will receive update on next app restart"
          echo "=========================================="

  # ============================================================
  # TESTING WORKFLOWS
  # ============================================================

  integration-tests:
    name: Integration Tests
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'develop'
          include: true
        - pattern: 'feature/*'
          include: true
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *run_unit_tests
      - *boot_ios_simulator

      - name: Run integration tests
        script: |
          mkdir -p test-results

          # Run integration tests with expanded output (single run)
          flutter test integration_test/test_runner.dart \
            -d "$TEST_DEVICE" \
            --reporter expanded \
            2>&1 | tee test-results/integration-tests.log
        test_report: test-results/integration-tests.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  integration-test-quick:
    name: Quick Integration Test
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mealvana_dev
      vars:
        FLUTTER_ENV: dev
        # Default to event management test (fastest)
        TEST_FLOW: event_management_flow_test.dart

    # Manual only
    triggering:
      events: []

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *boot_ios_simulator

      - name: Run single integration test
        script: |
          mkdir -p test-results
          flutter test "integration_test/flows/$TEST_FLOW" \
            -d "$TEST_DEVICE" \
            --reporter expanded \
            2>&1 | tee test-results/quick-test.log
        test_report: test-results/quick-test.log

      - *shutdown_ios_simulator

    artifacts:
      - test-results/**

  pr-validation:
    name: PR Validation
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest

    triggering:
      events:
        - pull_request
      cancel_previous_builds: true

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *run_flutter_analyze
      - *check_formatting
      - *run_unit_tests

    artifacts:
      - test-results/**

  # ============================================================
  # LEGACY BUILD WORKFLOWS (Fallback without Shorebird)
  # ============================================================

  ios-build-legacy:
    name: iOS Build (Legacy - No Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Mealvana

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mealvana.endurance
      groups:
        - mealvana_prod
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events: []

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *install_cocoapods
      - *setup_ios_signing

      - name: Build iOS (Standard)
        script: |
          flutter build ipa --release \
            --flavor prod \
            --target lib/main_prod.dart \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true

  android-build-legacy:
    name: Android Build (Legacy - No Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      groups:
        - mealvana_prod
        - google_play_credentials
        - firebase_config
      vars:
        FLUTTER_ENV: prod
        APP_ENVIRONMENT: prod

    triggering:
      events: []

    scripts:
      - *flutter_pub_get
      - *run_build_runner
      - *load_firebase_config

      - name: Build Android App Bundle (Standard)
        script: |
          flutter build appbundle --release \
            --flavor prod \
            --target lib/main_prod.dart

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: '#builds'
        notify:
          success: true
          failure: true
