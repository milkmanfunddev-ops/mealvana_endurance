name: mealvana_endurance
description: "Personalized nutrition fueling plans for endurance athletes"
publish_to: 'none'

version: 1.4.0+21

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core Icons
  cupertino_icons: ^1.0.8

  # State Management (Riverpod v2)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Storage
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.6
  path_provider: ^2.1.1
  path: ^1.9.0

  # Theming & Fonts
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.3

  # UI Components & Animation
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  simple_gradient_text: ^1.3.0

  # Logging
  logger: ^2.4.0

  # Form & Input
  flutter_rating_bar: ^4.0.1
  numberpicker: ^2.1.2

  # Navigation
  go_router: ^12.1.3

  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0
  http: ^1.1.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  
  # Analytics
  mixpanel_flutter: ^2.3.1
  
  # Backend & Auth
  supabase_flutter: ^2.8.5
  
  # Error Tracking & Performance Monitoring
  sentry_flutter: ^9.6.0
  sentry_drift: ^9.6.0

  # JSON & Data Classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local Notifications
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.0
  
  # Speech Recognition
  speech_to_text: ^6.6.0

dev_dependencies:
  sentry_dart_plugin: ^3.1.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Testing
  mocktail: ^1.0.4
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  analyzer: ^6.11.0
  
  # App Icons & Splash Screen
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/images/
    - assets/config/
    - assets/icons/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Sansita
      fonts:
        - asset: assets/fonts/Sansita/Sansita-Regular.otf
          weight: 400
        - asset: assets/fonts/Sansita/Sansita-Medium.otf
          weight: 500
        - asset: assets/fonts/Sansita/Sansita-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sansita/Sansita-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Sansita/Sansita-Black.otf
          weight: 900
        - asset: assets/fonts/Sansita/Sansita-Light.otf
          weight: 300
        - asset: assets/fonts/Sansita/Sansita-Italic.otf
          style: italic
        - asset: assets/fonts/Sansita/Sansita-BoldItalic.ttf
          weight: 700
          style: italic
    
    - family: Apercu
      fonts:
        - asset: assets/fonts/Apercu/Apercu Regular.otf
          weight: 400
        - asset: assets/fonts/Apercu/Apercu-Light.otf
          weight: 300
        - asset: assets/fonts/Apercu/Apercu-Medium.otf
          weight: 500
        - asset: assets/fonts/Apercu/Apercu-Bold.otf
          weight: 700
        - asset: assets/fonts/Apercu/Apercu-Italic.otf
          style: italic
        - asset: assets/fonts/Apercu/Apercu-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Apercu/Apercu-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Apercu/Apercu-BoldItalic.otf
          weight: 700
          style: italic
    
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica/Helvetica.ttf
          weight: 400
        - asset: assets/fonts/Helvetica/Helvetica-BlackBlack.ttf
          weight: 900
    
    - family: Compadre
      fonts:
        - asset: assets/fonts/Compadre/Compadre-Demo-Regular.otf
          weight: 400
  
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  ios: true
  android: true
  image_path_ios: "assets/images/main_icon_no_text.png"
  image_path_android: "assets/images/main_icon_no_text.png"
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/main_icon_no_text.png"

# Flutter Native Splash configuration
flutter_native_splash:
  color: "#f5f5f5"
  image: "assets/images/main_icon.png"
  android_12:
    color: "#f5f5f5"
    icon_background_color: "#f5f5f5"
    image: "assets/images/main_icon.png"

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: mealvana-endurance
  org: milkman-24
