name: mealvana_endurance
description: "Personalized nutrition fueling plans for endurance athletes"
publish_to: 'none'

version: 1.20.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core Icons
  cupertino_icons: ^1.0.8

  # State Management (Riverpod v2)
  # flutter_riverpod: ^2.5.1
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Local Storage
  drift: ^2.29.0  # Includes web support via drift/web.dart
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.6
  path_provider: ^2.1.5
  path: ^1.9.0

  # Theming & Fonts
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.3

  # UI Components & Animation
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  simple_gradient_text: ^1.3.0

  # Logging
  logger: ^2.6.2

  # Form & Input
  flutter_rating_bar: ^4.0.1
  numberpicker: ^2.1.2

  # Navigation
  go_router: ^12.1.3

  # Utilities
  uuid: ^4.2.1
  intl: any  # Let flutter_localizations pin this
  http: ^1.1.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.2.0
  pub_semver: ^2.1.4
  
  # Analytics
  mixpanel_flutter: ^2.4.4
  
  # Backend & Auth
  supabase_flutter: ^2.10.0  # Required for linkIdentityWithIdToken() (gotrue 2.15.0+)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  flutter_web_auth_2: ^4.1.0  # OAuth for Final Surge/TrainingPeaks integration

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Error Tracking & Performance Monitoring
  sentry_flutter: ^9.6.0
  sentry_drift: ^9.6.0

  # JSON & Data Classes
  json_annotation: ^4.9.0

  # Local Notifications
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.0

  # Speech Recognition
  speech_to_text: ^7.0.0

  # Barcode Scanning
  mobile_scanner: ^7.2.0

  # Meal photo capture (meal logging)
  image_picker: ^1.2.2
  
  # Font Awesome Icons
  font_awesome_flutter: ^11.0.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Location Services
  geolocator: ^13.0.2
  location_iq: ^1.0.1

  # User Feedback with Screenshot Annotation
  wiredash: ^2.6.0
  connectivity_plus: ^7.0.0
  flutter_svg: ^2.2.3
  calendar_date_picker2: ^2.0.1
  fl_chart: ^1.2.0
  onesignal_flutter: ^5.5.0

  # Dev-only accessibility checker overlay + testing-tools panel.
  # Pinned exact: 2.7.0+ uses SemanticsFlags collection APIs that require a
  # newer Flutter SDK than Codemagic's stable channel ships.
  # Wrapped in a debug-only widget that resets panel state on every hot
  # reload so panel overrides (text scale, color mode, etc.) cannot leak
  # across sessions — see lib/shared/widgets/root_app_widget.dart.
  accessibility_tools: 2.2.3


dev_dependencies:
  sentry_dart_plugin: ^3.1.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Testing
  mocktail: ^1.0.4
  patrol: ^4.3.0
  
  # Code Generation
  build_runner: ^2.6.0
  # riverpod_generator: ^2.4.3
  riverpod_generator: ^3.0.0
  drift_dev: ^2.20.3
  
  # App Icons & Splash Screen
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  test: any
  path_provider_platform_interface: any
  riverpod: any
  matcher: any
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - .env
    - .env.dev.local
    - .env.prod.local
    - shorebird.yaml
    - assets/images/
    - assets/images/integrations/
    - assets/config/
    - assets/icons/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Sansita
      fonts:
        - asset: assets/fonts/Sansita/Sansita-Regular.otf
          weight: 400
        - asset: assets/fonts/Sansita/Sansita-Medium.otf
          weight: 500
        - asset: assets/fonts/Sansita/Sansita-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sansita/Sansita-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Sansita/Sansita-Black.otf
          weight: 900
        - asset: assets/fonts/Sansita/Sansita-Light.otf
          weight: 300
        - asset: assets/fonts/Sansita/Sansita-Italic.otf
          style: italic
        - asset: assets/fonts/Sansita/Sansita-BoldItalic.ttf
          weight: 700
          style: italic
    
    - family: Apercu
      fonts:
        - asset: assets/fonts/Apercu/Apercu Regular.otf
          weight: 400
        - asset: assets/fonts/Apercu/Apercu-Light.otf
          weight: 300
        - asset: assets/fonts/Apercu/Apercu-Medium.otf
          weight: 500
        - asset: assets/fonts/Apercu/Apercu-Bold.otf
          weight: 700
        - asset: assets/fonts/Apercu/Apercu-Italic.otf
          style: italic
        - asset: assets/fonts/Apercu/Apercu-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Apercu/Apercu-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Apercu/Apercu-BoldItalic.otf
          weight: 700
          style: italic
    
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica/Helvetica.ttf
          weight: 400
        - asset: assets/fonts/Helvetica/Helvetica-BlackBlack.ttf
          weight: 900
    
    - family: Compadre
      fonts:
        - asset: assets/fonts/Compadre/Compadre-Demo-Regular.otf
          weight: 400
        - asset: assets/fonts/Compadre/Compadre-Demo-Wide.otf
          weight: 400
        - asset: assets/fonts/Compadre/Compadre-Demo-Extended.otf
          weight: 400
        - asset: assets/fonts/Compadre/Compadre-Demo-Narrow.otf
          weight: 400
  
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_inverted.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3D1F47"
  adaptive_icon_foreground: "assets/images/launcher_inverted.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/launcher_inverted.png"

# Flutter Native Splash configuration
flutter_native_splash:
  color: "#3D1F47"
  image: "assets/images/launcher_inverted.png"
  ios_content_mode: center
  android_gravity: center
  fullscreen: true
  android_12:
    color: "#3D1F47"
    icon_background_color: "#3D1F47"
    image: "assets/images/android12_splash.png"
  ios: true
  web: true

patrol:
  app_name: Mealvana Endurance
  android:
    package_name: com.milkman.mealvanaendurance
  ios:
    bundle_id: com.milkman.mealvanaendurance

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: mealvana-endurance
  org: milkman-24
