# Catalog refresh routine — keeps catalog_products/variants current with TheFeed.
#
# DETERMINISTIC data-ops job (not build/test CI — Codemagic remains the build
# SSOT). Runs the non-destructive importer (B0) + removed-product deactivation
# (B1) + classify-new SQL (B2) against dev, then prod. See
# .claude/commands/refresh-feed.md and docs/technical/data-refresh-routines.md.
#
# ─────────────────────────────────────────────────────────────────────────────
# NOT ACTIVE until you opt in:
#   1. Add repo secrets (Settings → Secrets and variables → Actions):
#        SUPABASE_ACCESS_TOKEN        (personal/CI token — for `supabase db query --linked`)
#        DEV_SUPABASE_SERVICE_ROLE_KEY
#        PROD_SUPABASE_SERVICE_ROLE_KEY
#        FDA_API_KEY                  (optional — enables nutrition enrichment)
#   2. Uncomment the `schedule:` block below to run weekly.
# Until then it only runs when you trigger it manually (workflow_dispatch),
# and you can scope it to dev-only via the input.
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh Feed Catalog

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment(s) to refresh"
        type: choice
        default: prod
        options: [prod, dev, both]
  schedule:
    - cron: "23 9 * * 1"   # Mondays ~09:23 UTC (off-minute on purpose)

permissions:
  contents: read

concurrency:
  group: refresh-feed
  cancel-in-progress: false

env:
  DEV_SUPABASE_URL: https://vlmtsdzpnjnavdgytcmi.supabase.co
  PROD_SUPABASE_URL: https://wvmvsodrvbkxfydabqed.supabase.co
  DEV_REF: vlmtsdzpnjnavdgytcmi
  PROD_REF: wvmvsodrvbkxfydabqed

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Refresh DEV
        if: ${{ inputs.target == 'dev' || inputs.target == 'both' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ env.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/update_catalog.js
          supabase link --project-ref "$DEV_REF"
          supabase db query --linked -f scripts/classify_unclassified_by_type.sql
          supabase db query --linked \
            "SELECT count(*) FILTER (WHERE classification_source IS NULL) AS unclassified,
                    count(*) FILTER (WHERE classification_source='claude') AS claude_preserved
             FROM public.catalog_products;"

      - name: Refresh PROD
        if: ${{ github.event_name == 'schedule' || inputs.target == 'prod' || inputs.target == 'both' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/update_catalog.js
          supabase link --project-ref "$PROD_REF"
          supabase db query --linked -f scripts/classify_unclassified_by_type.sql
          supabase db query --linked \
            "SELECT count(*) FILTER (WHERE classification_source IS NULL) AS unclassified,
                    count(*) FILTER (WHERE classification_source='claude') AS claude_preserved
             FROM public.catalog_products;"
