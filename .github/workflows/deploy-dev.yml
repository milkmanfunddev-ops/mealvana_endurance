name: Deploy to Dev

on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run edge function tests
        working-directory: test/local_edge_functions
        run: |
          npm install
          npm test

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: test
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to dev project
        run: |
          supabase link --project-ref ${{ secrets.DEV_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}

      - name: Deploy database migrations
        run: |
          echo "📋 Checking for schema differences..."
          supabase db diff

          echo "🚀 Deploying migrations to dev..."
          supabase db push

          echo "✅ Migrations deployed successfully"

      - name: Deploy Edge Functions
        run: |
          echo "🚀 Deploying Edge Functions to dev..."
          supabase functions deploy

          echo "✅ Edge Functions deployed successfully"

      - name: Notify deployment
        if: success()
        run: |
          echo "🎉 Dev deployment completed successfully!"
          echo "Environment: Development"
          echo "Project: ${{ secrets.DEV_PROJECT_ID }}"
