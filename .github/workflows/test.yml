name: Run Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'  # 10 AM UTC daily for integration tests

jobs:
  flutter-tests:
    name: Flutter/Dart Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'

      - name: Create env asset placeholders
        # pubspec.yaml lists .env, .env.dev.local and .env.prod.local as assets,
        # but they are gitignored (real values live only on dev machines / in
        # secrets). Without them `flutter test` fails at "Failed to build asset
        # bundle / No file or variants found for asset: .env". Create empty
        # placeholders so the asset bundle builds.
        run: |
          touch .env .env.dev.local .env.prod.local

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter tests
        # Exclude live-service suites (TrainingPeaks/Final Surge live APIs and
        # live Supabase edge-function e2e). They need real credentials/network
        # and run on demand or via the scheduled edge-integration job below.
        run: flutter test --exclude-tags="integration || e2e" --coverage --reporter expanded

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  edge-function-tests:
    name: Edge Function Tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No npm cache: the harness package has no dependencies and its
          # package-lock.json is gitignored, so caching on it fails the step
          # ("Some specified paths were not resolved, unable to cache").

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        working-directory: test/local_edge_functions
        run: npm install

      - name: Run edge function tests
        working-directory: test/local_edge_functions
        run: npm test -- --reporter=verbose

      - name: Test summary
        if: always()
        working-directory: test/local_edge_functions
        run: |
          echo "## Edge Function Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Edge function algorithm tests executed" >> $GITHUB_STEP_SUMMARY

  edge-integration-tests:
    name: Edge Integration Tests (Dev Cloud)
    runs-on: ubuntu-latest
    # Only run on manual trigger or schedule (uses dev Supabase)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'

      - name: Create env asset placeholders
        # pubspec.yaml lists .env, .env.dev.local and .env.prod.local as assets,
        # but they are gitignored (real values live only on dev machines / in
        # secrets). Without them `flutter test` fails at "Failed to build asset
        # bundle / No file or variants found for asset: .env". Create empty
        # placeholders so the asset bundle builds.
        run: |
          touch .env .env.dev.local .env.prod.local

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create test environment file
        run: |
          echo "SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" > .env.test_supabase
          echo "SUPABASE_ANON_KEY=${{ secrets.DEV_ANON_KEY }}" >> .env.test_supabase

      - name: Run edge integration tests
        run: flutter test --tags edge --dart-define-from-file=.env.test_supabase

      - name: Test summary
        if: always()
        run: |
          echo "## Edge Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Integration tests against dev Supabase completed" >> $GITHUB_STEP_SUMMARY

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [flutter-tests, edge-function-tests]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter/Dart (11+) | ${{ needs.flutter-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Functions | ${{ needs.edge-function-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** Flutter, Dart, and edge function algorithm suites" >> $GITHUB_STEP_SUMMARY
