document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

amily:'Apercu',sans-serif;font-size:12.5px;line-height:1.45;color:rgba(248,246,235,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ insightText }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showMacroDash }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:0;\">\n            <div style=\"font-family:'Apercu',sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(248,246,235,0.5);\">Intake today<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:4px;\"><span style=\"font-family:'Sansita',Georgia,serif;font-weight:700;font-size:25px;line-height:1;color:var(--me-orange);\">{{ eatenCalStr }}<\u002Fspan><span style=\"font-family:'Apercu',sans-serif;font-size:12px;color:rgba(248,246,235,0.45);\">/ {{ calTargetStr }} kcal<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;margin-top:11px;\">\n              <sc-for list=\"{{ macrosSub }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"flex:1;\">\n                  <div style=\"font-family:'Apercu Mono',monospace;font-size:12.5px;color:var(--me-cream);font-variant-numeric:tabular-nums;\">{{ m.eaten }}<span style=\"color:rgba(248,246,235,0.4);\">/{{ m.target }}{{ m.unit }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:5px;border-radius:3px;background:rgba(248,246,235,0.1);margin-top:6px;overflow:hidden;\"><div style=\"height:100%;border-radius:3px;background:{{ m.color }};width:{{ m.pctStr }};\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-family:'Apercu',sans-serif;font-size:10px;color:rgba(248,246,235,0.5);margin-top:5px;\">{{ m.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button onclick=\"{{ openEnergy }}\" style=\"margin-top:13px;display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid rgba(28,249,207,0.4);border-radius:100px;padding:6px 13px;cursor:pointer;font-family:'Apercu',sans-serif;font-size:11px;font-weight:500;color:var(--me-electrolyte);\">Full Breakdown<svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showBalanceDash }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:0;\">\n            <div style=\"font-family:'Apercu',sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(248,246,235,0.5);\">Energy balance<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:4px;\"><span style=\"font-family:'Sansita',Georgia,serif;font-weight:700;font-size:25px;line-height:1;color:var(--me-orange);\">{{ eatenCalStr }}<\u002Fspan><span style=\"font-family:'Apercu',sans-serif;font-size:12px;color:rgba(248,246,235,0.45);\">/ {{ calTargetStr }} kcal<\u002Fspan><\u002Fdiv>\n            <div style=\"height:5px;border-radius:3px;background:rgba(248,246,235,0.1);margin-top:12px;overflow:hidden;\"><div style=\"height:100%;border-radius:3px;background:var(--me-orange);width:{{ eatenPctStr }};\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;margin-top:11px;\">\n              <div style=\"flex:1;\">\n                <div style=\"display:flex;align-items:center;gap:5px;\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--me-electrolyte)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;\"><path d=\"M12 19V5\"><\u002Fpath><path d=\"m5 12 7-7 7 7\"><\u002Fpath><\u002Fsvg><span style=\"font-family:'Apercu',sans-serif;font-size:10px;color:rgba(248,246,235,0.5);\">Burned<\u 2Fspan><span style=\"font-family:'Apercu',sans-serif;font-size:12px;color:rgba(248,246,235,0.45);\">kcal planned · {{ workoutCountStr }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:11px;\">\n              <sc-for list=\"{{ energyWorkouts }}\" as=\"w\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;align-items:center;gap:11px;\">\n                  <div style=\"width:32px;height:32px;border-radius:50%;background:var(--me-electrolyte);display:flex;align-items:center;justify-content:center;flex:0 0 auto;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(56,22,51)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"5.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><circle cx=\"18.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><path d=\"M15 17.5h-4l-2.5-7 3-2 2.5 4h3\"><\u002Fpath><circle cx=\"15\" cy=\"5\" r=\"1.4\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;\"><div style=\"font-family:'Compadre',Georgia,serif;font-size:15px;color:var(--me-cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ w.name }}<\u002Fdiv><div style=\"font-family:'Apercu',sans-serif;font-size:11px;color:rgba(248,246,235,0.5);margin-top:1px;font-variant-numeric:tabular-nums;\">{{ w.sub }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:0 0 auto;text-align:right;\"><span style=\"font-family:'Apercu Mono',monospace;font-size:14px;color:var(--me-cream);font-variant-numeric:tabular-nums;\">{{ w.calStr }}<\u002Fspan><span style=\"font-family:'Apercu',sans-serif;font-size:10px;color:rgba(248,246,235,0.45);\"> kcal<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button onclick=\"{{ openEnergy }}\" style=\"margin-top:13px;display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid rgba(28,249,207,0.4); 0%\"><\u002Fdc-import><\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ showAdd }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute;inset:0;z-index:30;\"><dc-import name=\"Add Food Sheet\" on-close=\"{{ closeOverlay }}\" on-pick=\"{{ onPickFood }}\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ showEnergy }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute;inset:0;z-index:30;\"><dc-import name=\"Energy Breakdown Sheet\" on-close=\"{{ closeEnergy }}\" cal-target=\"{{ calTargetStr }}\" carbs=\"{{ carbTargetStr }}\" protein=\"{{ proteinTargetStr }}\" fat=\"{{ fatTargetStr }}\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;enableTracking&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    overlay: null, expanded: null, timelineOpen: true, filter: \"all\",\n    suggestOn: false, dismissed: {},\n    log: {\n      Breakfast: [{ id: \"bf\", name: \"Everything Bagel with Cream Cheese\", kcal: 574, c: 58, p: 30, f: 25 }],\n      Lunch: [{ id: \"ln\", name: \"Pineapple Chunks & Eggs\", kcal: 408, c: 35, p: 25, f: 20 }],\n      Snack: [{ id: \"sn\", name: \"8 oz Mocha\", kcal: 180, c: 24, p: 6, f: 6 }],\n      Recovery: [],\n      Dinner: [],\n    },\n  };\n\n  patch(p) { this.setState(p); }\n  toggleExpand(id) { this.setState((s) => ({ expanded: s.expanded === id ? null : id })); }\n  removeItem(group, id) { this.setState((s) => ({ expanded: null, log: { ...s.log, [group]: s.log[group].filter((x) => x.id !== id) } })); }\n  addFood(food) {\n    this.setState((s) => {\n      const id = \"d\" + Math.random().toString(36).slice(2, 8);\n      const item = { id, name: food.name, kcal: food.kcal, c: food.c, p: food.p, f: food.f };\n      return { overlay: null, log: { ...s.log, Dinner: [...s.log.Dinner, item] } };\n    });\n  }\n  acceptSugg(group, it) {\n    this.setState((s) => {\n      const logged = { id: \"lg\" + Math.random().toString(36).slice(2, 8), name: it.name, kcal: it.kcal, c: it.c, p: it.p, f: it.f };\n      return { expanded: null, dismissed: { ...s.dismissed, [it.id]: true }, log: { ...s.log, [group]: [...(s.log[group] || []), logged] } };\n    });\n  }\n  dismissSugg(id) { this.setState((s) => ({ expanded: null, dismissed: { ...s.dismissed, [id]: true } })); }\n  toggleSuggest() {\n    this.setState((s) => ({ suggestOn: !s.suggestOn, expanded: null, insightDismissed: s.suggestOn ? s.insightDismissed : false }), () => {\n      if (this.state.suggestOn) this.scrollToSuggestion();\n    });\n  }\n  dismissInsight() { this.setState({ insightDismissed: true }); }\n  scrollToSuggestion() {\n    setTimeout(() => {\n      const sb = document.querySelector(\".scrollbody\");\n      const target = document.querySelector('[data-node-suggested=\"1\"]');\n      if (!sb || !target) return;\n      const top = target.getBoundingClientRect().top - sb.getBoundingClientRect().top + sb.scrollTop - 16;\n      const dest = Math.max(0, Math.min(top, sb.scrollHeight - sb.clientHeight));\n      const start = sb.scrollTop, dist = dest - start, t0 = Date.now(), dur = 420;\n      if (this._scrollTimer) clearInterval(this._scrollTimer);\n      this._scrollTimer = setInterval(() => {\n        const k = Math.min(1, (Date.now() - t0) / dur);\n        sb.scrollTop = start + dist * (1 - Math.pow(1 - k, 3));\n        if (k >= 1) { clearInterval(this._scrollTimer); this._scrollTimer = null; }\n      }, 16);\n    }, 50);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const log = s.log;\n    const tag = {\n      Breakfast: { color: \"rgb(251,167,72)\" },\n      Lunch: { color: \"var(--me-electrolyte)\" },\n      Snack: { color: \"rgb(236,84,153)\" },\n      Recovery: { color: \"rgb(251,167,72)\" },\n      Dinner: { color: \"rgb(167,139,250)\" },\n    };\n    const order = [\"Breakfast\", \"Lunch\", \"Snack\", \"Recovery\", \"Dinner\"];\n    const META = { Breakfast: 450, Lunch: 750, Snack: 885, Recovery: 1005, Dinner: 1140 };\n    const NOW = 930; // 3:30 PM\n    const SUGG = {\n      Recovery: [\n        { id: \"sgr1\", name: \"Chocolate Milk & Banana\", kcal: 330, c: 58, p: 14, f: 6 },\n      ],\n      Dinner: [\n        { id: \"sgd1\", name: \"Grilled Chicken & Rice Bowl\", kcal: 640, c: 82, p: 50, f: 12 },\n        { id: \"sgd2\", name: \"Roasted Sweet Potato\", kcal: 200, c: 46, p: 4, f: 0 },\n      ],\n    };\n    const decLogged = (it, g) => ({\n      ...it, suggested: false, logged: true, group: g, expanded: s.expanded === it.id,\n      onToggle: () => this.toggleExpand(it.id),\n      onRemove: () => this.removeItem(g, it.id),\n    });\n    const decSugg = (it, g) => ({\n      ...it, suggested: true, logged: false, group: g, expanded: s.expanded === it.id,\n      onToggle: () => this.toggleExpand(it.id),\n      onAccept: () => this.acceptSugg(g, it),\n      onDismiss: () => this.dismissSugg(it.id),\n    });\n    const groups = {};\n    order.forEach((g) => {\n      const logged = (log[g] || []).map((it) => decLogged(it, g));\n      const future = META[g] > NOW;\n      const sugg = (s.suggestOn && future) ? (SUGG[g] || []).filter((it) => !s.dismissed[it.id]).map((it) => decSugg(it, g)) : [];\n      const items = [...logged, ...sugg];\n      groups[g] = { items, empty: items.length === 0, allSuggested: items.length > 0 && logged.length === 0 };\n    });\n    let cal = 0, cc = 0, pp = 0, ff = 0;\n    order.forEach((g) => log[g].forEach((it) => { cal += it.kcal; cc += it.c; pp += it.p; ff += it.f; }));\n    const TGT = { calories: 2520, carbs: 300, protein: 140, fat: 75 };\n    const COL = { carbs: \"var(--me-electrolyte)\", protein: \"rgb(167,139,250)\", fat: \"rgb(236,84,153)\" };\n    const mk2 = (k, label, e, unit) => {\n      const t = TGT[k]; const pct = Math.min(100, Math.round((e / t) * 100));\n      return { label, eaten: e, target: t, unit, color: COL[k], pctStr: pct + \"%\" };\n    };\n    const macrosSub = [mk2(\"carbs\", \"Carbs\", cc, \"g\"), mk2(\"protein\", \"Protein\", pp, \"g\"), mk2(\"fat\", \"Fat\", ff, \"g\")];\n    const openAdd = () => this.setState({ overlay: \"add\" });\n    const fullTimeline = [\n      { id: \"tb\", time: \"7:30 AM\", isRide: false, isMeal: true, group: \"Breakfast\", dot: tag.Breakfast.color, tagColor: tag.Breakfast.color, items: groups.Breakfast.items, empty: groups.Breakfast.empty, suggestedNode: groups.Breakfast.allSuggested, solidNode: !groups.Breakfast.allSuggested, openAdd },\n      { id: \"tl\", time: \"12:30 PM\", isRide: false, isMeal: true, group: \"Lunch\", dot: tag.Lunch.color, tagColor: tag.Lunch.color, items: groups.Lunch.items, empty: groups.Lunch.empty, suggestedNode: groups.Lunch.allSuggested, solidNode: !groups.Lunch.allSuggested, openAdd },\n      { id: \"ts\", time: \"2:45 PM\", isRide: false, isMeal: true, group: \"Snack\", dot: tag.Snack.color, tagColor: tag.Snack.color, items: groups.Snack.items, empty: groups.Snack.empty, suggestedNode: groups.Snack.allSuggested, solidNode: !groups.Snack.allSuggested, openAdd },\n      { id: \"tr\", time: \"4:15 PM\", isRide: true, isMeal: false, dot: \"var(--me-orange)\", suggestedNode: false, solidNode: true },\n      { id: \"trc\", time: \"4:45 PM\", isRide: false, isMeal: true, group: \"Recovery\", dot: tag.Recovery.color, tagColor: tag.Recovery.color, items: groups.Recovery.items, empty: groups.Recovery.empty, suggestedNode: groups.Recovery.allSuggested, solidNode: !groups.Recovery.allSuggested, openAdd },\n      { id: \"td\", time: \"7:00 PM\", isRide: false, isMeal: true, group: \"Dinner\", dot: tag.Dinner.color, tagColor: tag.Dinner.color, items: groups.Dinner.items, empty: groups.Dinner.empty, suggestedNode: groups.Dinner.allSuggested, solidNode: !groups.Dinner.allSuggested, openAdd },\n    ];\n    const nodes = fullTimeline\n      .filter((n) => !(n.isMeal && n.empty))\n      .filter((n) => s.filter === \"all\" ? true : s.filter === \"workout\" ? n.isRide : n.isMeal)\n      .map((n) => ({ ...n, railSolid: s.timelineOpen && !n.suggestedNode, railDashed: s.timelineOpen && n.suggestedNode, dataSugg: n.suggestedNode ? \"1\" : \"\" }));\n    const pbg = (k) => s.filter === k ? \"var(--me-cream)\" : \"transparent\";\n    const pcol = (k) => s.filter === k ? \"var(--me-blackberry)\" : \"rgba(248,246,235,0.65)\";\n    const trackingOn = (s.tracking ?? this.props.enableTracking) ?? true;\n    const workouts = [\n      { id: \"w1\", name: \"25 mi Ride\", sub: \"25.0 mi \\u00b7 15.0 mph \\u00b7 1.7 h\", cal: 502 },\n    ];\n    const workoutBurn = workouts.reduce((a, w) => a + w.cal, 0);\n    const BASE_DAILY = 1950; // resting + daily-activity expenditure across a full day\n    const baseBurn = Math.round(BASE_DAILY * (NOW / 1440)); // proportional to elapsed day\n    const totalBurned = baseBurn + workoutBurn; // workout (once done) + daily activity\n    const energyWorkouts = workouts.map((w) => ({ ...w, calStr: w.cal.toLocaleString() }));\n    const dashOpen = !!s.dashOpen;\n    const insightMap = {\n      all: { label: \"Today's Fuel\", text: \"Bring carbs up through the day to top off glycogen for Saturday's long run, and keep protein steady at every meal.\" },\n      workout: { label: \"Fueling Your Ride\", text: \"Top off carbs in the 2 hours before, aim for 30\\u201360 g carbs per hour on the bike, and refuel within 30 minutes after.\" },\n      meals: { label: \"Fueling Focus\", text: \"Spread carbs evenly and anchor each meal with protein. Keep it light before the afternoon ride, then refuel within the hour after.\" },\n    };\n    const ins = insightMap[s.filter] || insightMap.all;\n    const remCalNum = Math.max(0, TGT.calories - cal);\n    const remCNum = Math.max(0, TGT.carbs - cc);\n    const remPNum = Math.max(0, TGT.protein - pp);\n    const remFNum = Math.max(0, TGT.fat - ff);\n    return {\n      macrosSub, nodes,\n      suggestOn: s.suggestOn,\n      showInsightBox: s.suggestOn && !s.insightDismissed,\n      dismissInsight: () => this.dismissInsight(),\n      toggleSuggest: () => this.toggleSuggest(),\n      askFollowUp: () => {},\n      suggestBtnBg: s.suggestOn ? \"var(--me-orange)\" : \"rgba(247,139,20,0.15)\",\n      suggestBtnBorder: s.suggestOn ? \"var(--me-orange)\" : \"rgba(247,139,20,0.55)\",\n      suggestBtnColor: s.suggestOn ? \"var(--me-blackberry)\" : \"var(--me-orange)\",\n      suggestTitle: s.suggestOn ? \"Hide suggestions\" : \"Suggest meals for the rest of your day\",\n      pillAllBg: pbg(\"all\"), pillAllColor: pcol(\"all\"),\n      pillWorkoutBg: pbg(\"workout\"), pillWorkoutColor: pcol(\"workout\"),\n      pillMealsBg: pbg(\"meals\"), pillMealsColor: pcol(\"meals\"),\n      pickAll: () => this.setState({ filter: \"all\" }),\n      pickWorkout: () => this.setState({ filter: \"workout\" }),\n      pickMeals: () => this.setState({ filter: \"meals\" }),\n      showAddFood: s.filter !== \"workout\",\n      showAddActivity: s.filter !== \"meals\",\n      openAddActivity: () => this.setState({ overlay: \"add\" }),\n      trackingOn, trackingOff: !trackingOn,\n      dashMinHeight: \"0px\",\n      dashOpen,\n      toggleDash: () => this.setState((st) => ({ dashOpen: !st.dashOpen })),\n      dashChevronRotate: dashOpen ? \"180deg\" : \"0deg\",\n      dashToggleLabel: dashOpen ? \"Less\" : \"More\",\n      dashToggleTitle: dashOpen ? \"Collapse details\" : \"Expand details\",\n      collapAll: trackingOn && !dashOpen && s.filter === \"all\",\n      collapWorkout: trackingOn && !dashOpen && s.filter === \"workout\",\n      collapMeals: trackingOn && !dashOpen && s.filter === \"meals\",\n      collapOff: false,\n      showDashToggle: trackingOn,\n      insightLabel: ins.label,\n      insightText: ins.text,\n      showMacroDash: trackingOn && dashOpen && s.filter === \"meals\",\n      showBalanceDash: trackingOn && dashOpen && s.filter === \"all\",\n      showEnergyDash: trackingOn && dashOpen && s.filter === \"workout\",\n      showInsightAll: false,\n      showInsightWorkout: false,\n      showInsightMeals: false,\n      energyWorkouts,\n      burnedTotalStr: totalBurned.toLocaleString(),\n      workoutTotalStr: workoutBurn.toLocaleString(),\n      baseBurnStr: baseBurn.toLocaleString(),\n      netStr: (cal - totalBurned).toLocaleString(),\n      remainingStr: Math.max(0, TGT.calories - cal).toLocaleString(),\n      eatenPctStr: Math.min(100, Math.round((cal / TGT.calories) * 100)) + \"%\",\n      workoutCountStr: workouts.length === 1 ? \"1 workout\" : workouts.length + \" workouts\",\n      trackBg: trackingOn ? \"var(--me-electrolyte)\" : \"rgba(248,246,235,0.16)\",\n      trackKnobLeft: trackingOn ? \"17px\" : \"2px\",\n      trackKnobBg: trackingOn ? \"var(--me-blackberry)\" : \"rgba(248,246,235,0.8)\",\n      trackLabel: trackingOn ? \"Tracking On\" : \"Tracking Off\",\n      trackTitle: trackingOn ? \"Turn tracking off\" : \"Turn tracking on\",\n      trackBtnBg: trackingOn ? \"rgba(220,37,151,0.16)\" : \"rgba(255,255,255,0.05)\",\n      trackBtnBorder: trackingOn ? \"rgba(220,37,151,0.6)\" : \"rgba(248,246,235,0.18)\",\n      trackBtnColor: trackingOn ? \"var(--me-dragonfruit)\" : \"rgba(248,246,235,0.55)\",\n      chevronAlign: dashOpen ? \"flex-start\" : \"center\",\n      carbTargetStr: String(TGT.carbs), proteinTargetStr: String(TGT.protein),\n      fatTargetStr: String(TGT.fat),\n      eatenCalStr: cal.toLocaleString(), calTargetStr: TGT.calories.toLocaleString(),\n      timelineOpen: s.timelineOpen, timelineClosed: !s.timelineOpen,\n      timelineLabel: s.timelineOpen ? \"Hide times\" : \"Show times\",\n      timelineToggleBg: s.timelineOpen ? \"rgba(28,249,207,0.12)\" : \"rgba(255,255,255,0.05)\",\n      timelineToggleBorder: s.timelineOpen ? \"rgba(28,249,207,0.55)\" : \"rgba(248,246,235,0.18)\",\n      timelineToggleColor: s.timelineOpen ? \"var(--me-electrolyte)\" : \"rgba(248,246,235,0.55)\",\n      entryCountStr: String(fullTimeline.length),\n      showRide: s.overlay === \"ride\", showAdd: s.overlay === \"add\",\n      openRide: () => this.setState({ overlay: \"ride\" }),\n      openAdd, closeOverlay: () => this.setState({ overlay: null }),\n      onPickFood: (food) => this.addFood(food),\n      toggleTimeline: () => this.setState((st) => ({ timelineOpen: !st.timelineOpen })),\n      toggleTracking: () => this.setState((st) => ({ tracking: !((st.tracking ?? this.props.enableTracking) ?? true) })),\n      openEnergy: () => this.setState({ energyOpen: true }),\n      showEnergy: !!s.energyOpen,\n      closeEnergy: () => this.setState({ energyOpen: false }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
