<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Formula Kit — Mealvana Endurance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100vh; }
    body { background: #1a0a17; }
    button { font-family: inherit; }
    /* Hide scrollbars on chip rows */
    div::-webkit-scrollbar { display: none; }
    @keyframes fk-toast {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fk-slide-up {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fk-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fk-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes fk-new-card-pulse {
      0% { background-color: rgba(247,139,20,0.06); box-shadow: 0 0 0 0 rgba(247,139,20,0); }
      30% { background-color: rgba(247,139,20,0.22); box-shadow: 0 0 0 6px rgba(247,139,20,0.15); }
      100% { background-color: rgba(247,139,20,0.06); box-shadow: 0 0 0 0 rgba(247,139,20,0); }
    }
    @keyframes fk-star-pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
