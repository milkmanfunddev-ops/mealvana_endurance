document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

div style=\"margin-top:14px; padding:0 4px;\">\n              <div style=\"position:relative; height:3px;\">\n                <div style=\"position:absolute; inset:0; border-radius:2px; background:rgba(248,246,235,.45);\"><\u002Fdiv>\n                <div style=\"position:absolute; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:5px solid rgb(247,139,20); top:8px; margin-left:-4px; transition:left .22s cubic-bezier(.2,.8,.2,1); left:{{ cb.tPct }}%;\"><\u002Fdiv>\n                <div style=\"position:absolute; width:9px; height:9px; transform:rotate(45deg); top:-3px; margin-left:-4.5px; transition:left .22s cubic-bezier(.2,.8,.2,1), background .22s; background:{{ cb.dColor }}; left:{{ cb.dPct }}%;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; font-size:11px; color:rgba(248,246,235,.6); margin-top:12px;\"><span>{{ cb.loL }}<\u002Fspan><span>{{ cb.hiL }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"text-align:center;\">\n          <div style=\"font-family:'Sansita'; font-weight:700; font-size:28px; line-height:1; color:rgb(28,249,207);\">{{ fluidVal }}<\u002Fdiv>\n          <div style=\"font-size:11px; letter-spacing:.1em; color:rgba(248,246,235,.65); margin-top:6px;\">FLUIDS<\u002Fdiv>\n          <div style=\"margin-top:14px; padding:0 4px;\">\n            <div style=\"position:relative; height:3px;\">\n              <div style=\"position:absolute; inset:0; border-radius:2px; background:rgba(248,246,235,.45);\"><\u002Fdiv>\n              <div style=\"position:absolute; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:5px solid rgb(247,139,20); top:8px; margin-left:-4px; transition:left .22s cubic-bezier(.2,.8,.2,1); left:{{ fb.tPct }}%;\"><\u002Fdiv>\n              <div style=\"position:absolute; width:9px; height:9px; transform:rotate(45deg); top:-3px; margin-left:-4.5px; transition:left .22s cubic-bezier(.2,.8,.2,1), background .22s; background:{{ fb.dColor }}; left:{{ fb.dPct }}%;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; font-size:11px; color:rgba(248,246,235,.6); margin-top:12px;\"><span>{{ fb.loL }}<\u002Fspan><span>{{ fb.hiL }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"text-align:center;\">\n          <div style=\"font-family:'Sansita'; font-weight:700; font-size:28px; line-height:1; color:rgba(248,246,235,.8);\">{{ sodiumVal }}<\u002Fdiv>\n          <div style=\"font-size:11px; letter-spacing:.1em; color:rgba(248,246,235,.65); margin-top:6px;\">SODIUM<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ feedings }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <div style=\"position:relative; padding-left:{{ railPad }}; margin-top:14px;\">\n          <sc-if value=\"{{ railMode }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute; left:5px; width:2px; top:-15px; height:15px; background:{{ f.railTop }};\"><\u002Fdiv>\n            <div style=\"position:absolute; left:5px; width:2px; top:14px; bottom:-15px; background:{{ f.railBot }};\"><\u002Fdiv>\n            <div style=\"position:absolute; top:1px; left:0; width:12px; height:12px; border-radius:50%; box-sizing:border-box; background:transparent; border:2px solid rgba(248,246,235,.45);\"><\u002Fdiv>\n            <div style=\"display:flex; align-items:center; min-height:14px; margin-bottom:8px;\">\n              <span style=\"font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:rgba(248,246,235,.5);\">{{ f.when }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"border-radius:15px; background:rgba(82,40,75,.5); border:1px solid rgba(248,246,235,.12);\">\n          <div sc-camel-on-click=\"{{ f.toggle }}\" style=\"display:flex; align-items:center; gap:10px; padding:14px 14px; cursor:pointer;\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(247,139,20)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none; transition:transform .22s; transform:rotate({{ f.chev }}deg);\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <div style=\"flex:1; min-width:0;\">\n              <div style=\"font-family:'Compadre'; font-size:17px; color:rgb(247,139,20); line-height:1.15;\">{{ f.name }}<\u002Fdiv>\n              <sc-if value=\"{{ embedMode }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:rgba(248,246,235,.5); margin-top:4px;\">{{ f.when }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ f.showFoodsLine }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:12px; color:rgba(248,246,235,.75); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ f.foodsLine }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; flex:none;\">\n              <div style=\"text-align:center;\">\n                <div style=\"font-family:'Sansita'; font-weight:700; font-size:16px; color:rgb(248,246,235);\">{{ f.carbsVal }}<\u002Fdiv>\n                <div style=\"font-size:8px; letter-spacing:.08em; color:rgba(248,246,235,.5); margin-top:2px;\">CARBS<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ f.showFluid }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"text-align:center;\">\n                  <div style=\"font-family:'Sansita'; font-weight:700; font-size:16px; color:rgb(248,246,235);\">{{ f.fluidVal }}<\u002Fdiv>\n                  <div style=\"font-size:8px; letter-spacing:.08em; color:rgba(248,246,235,.5); margin-top:2px;\">FLUIDS<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-top:1px solid rgba(248,246,235,.12); padding:12px 14px 16px; display:flex; flex-direction:column; gap:10px;\">\n              <sc-if value=\"{{ f.showHydration }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid {{ hydroBorder }}; border-radius:12px; padding:10px 12px; transition:border-color .22s;\">\n                  <div sc-camel-on-click=\"{{ toggleUrineExp }}\" style=\"display:flex; align-items:center; gap:11px; cursor:pointer;\">\n                    <div style=\"width:34px; height:34px; border-radius:50%; border:1.5px solid rgb(28,249,207); display:flex; align-items:center; justify-content:center; flex:none;\">\n                      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(28,249,207)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3c3.2 4.2 5 7.2 5 9.7a5 5 0 0 1-10 0C7 10.2 8.8 7.2 12 3z\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fdiv>\n                    <div style=\"flex:1; min-width:0;\">\n                      <div style=\"font-family:'Compadre'; font-size:15px; color:rgb(248,246,235); line-height:1.2;\">Hydration check<\u002Fdiv>\n                      <sc-if value=\"{{ hydroDone }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10.5px; color:rgba(248,246,235,.5); margin-top:2px;\">{{ hydroSub }}<\u002Fdiv><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ hydroTodo }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:8.5px; font-weight:700; letter-spacing:.08em; color:rgb(247,139,20); border:1px solid rgb(247,139,20); border-radius:100px; padding:2.5px 8px; flex:none;\">TO-DO<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ hydroDone }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:8.5px; font-weight:700; letter-spacing:.08em; color:rgb(28,249,207); border:1px solid rgba(28,249,207,.5); border-radius:100px; padding:2.5px 8px; flex:none;\">{{ hydroHead }}<\u002Fspan><\u002Fsc-if>\n                    <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(248,246,235,.6)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none; transition:transform .22s; transform:rotate({{ urineChev }}deg);\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ urineExpAsk }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-family:'Compadre'; font-size:15px; color:rgb(248,246,235); line-height:1.25; margin-top:12px;\">Was your urine pale yellow this morning?<\u002Fdiv>\n                    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;\">\n                      <sc-for list=\"{{ urineOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                        <div sc-camel-on-click=\"{{ o.pick }}\" style=\"border:1px solid rgba(248,246,235,.35); border-radius:100px; padding:8px 6px; text-align:center; font-size:12.5px; color:rgb(248,246,235); cursor:pointer;\" style-hover=\"border-color: rgb(247,139,20); color: rgb(247,139,20);\">{{ o.label }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px; line-height:1.45; color:rgba(248,246,235,.55); margin-top:11px;\">On a multivitamin or B-complex? It turns urine yellow on its own — don't read that as dark.<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ urineExpResult }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:12px; line-height:1.5; color:rgba(248,246,235,.75); margin-top:10px;\">{{ hydroBody }}<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ changeAnswer }}\" style=\"font-size:12px; color:rgb(247,139,20); text-decoration:underline; text-underline-offset:4px; cursor:pointer; margin-top:8px; width:fit-content;\">Change answer<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ f.foods }}\" as=\"fd\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; align-items:center; gap:11px; border:1px solid rgba(247,139,20,.45); border-radius:12px; padding:10px 12px;\">\n                  <div style=\"width:34px; height:34px; border-radius:50%; background:rgb(28,249,207); display:flex; align-items:center; justify-content:center; flex:none;\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(56,22,51)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ fd.iconPath }}\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"font-family:'Compadre'; font-size:15px; color:rgb(248,246,235); line-height:1.2;\">{{ fd.name }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px; color:rgba(248,246,235,.5); margin-top:2px;\">{{ fd.sub }}<\u002Fdiv>\n                    <sc-if value=\"{{ fd.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:9px; letter-spacing:.05em; color:rgb(28,249,207); margin-top:2px;\">{{ fd.note }}<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:8px; flex:none;\">\n                    <div sc-camel-on-click=\"{{ fd.dec }}\" style=\"width:26px; height:26px; border-radius:50%; border:1px solid rgb(247,139,20); color:rgb(247,139,20); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 1px 2px rgba(16,24,40,.05);\" style-hover=\"background: rgba(247,139,20,.15);\">−<\u002Fdiv>\n                    <div style=\"min-width:24px; text-align:center; font-size:13px; font-weight:500; color:rgb(248,246,235); font-variant-numeric:tabular-nums;\">{{ fd.qty }}<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ fd.inc }}\" style=\"width:26px; height:26px; border-radius:50%; border:1px solid rgb(247,139,20); color:rgb(247,139,20); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 1px 2px rgba(16,24,40,.05);\" style-hover=\"background: rgba(247,139,20,.15);\">+<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex; justify-content:center; margin-top:4px;\">\n                <div style=\"border:1.5px solid rgb(247,139,20); border-radius:100px; padding:9px 24px; color:rgb(247,139,20); font-family:'Sansita'; font-weight:700; font-size:13px; letter-spacing:.05em; cursor:pointer;\" style-hover=\"background: rgba(247,139,20,.12);\">+&nbsp;&nbsp;ADD FOOD<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: &quot;470px&quot;, &quot;height&quot;: &quot;1150px&quot; },\n  &quot;layout&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Timestamps inside cards&quot;, &quot;options&quot;: [&quot;Timeline rail&quot;, &quot;Timestamps inside cards&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Layout&quot; },\n  &quot;plannedAhead&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;3+ hours ahead&quot;, &quot;options&quot;: [&quot;3+ hours ahead&quot;, &quot;90 minutes ahead&quot;, &quot;20 minutes ahead&quot;, &quot;At the start line&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Scenario&quot; },\n  &quot;targetState&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Targets set&quot;, &quot;options&quot;: [&quot;Targets set&quot;, &quot;Gated — no target&quot;, &quot;Fasted session&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Edge states&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { open: {}, qty: {}, ans: null, hydro: null, addedWater: false, bumped: false, fine: false, urineExp: false };\n  componentDidUpdate(p) {\n    if (p.plannedAhead !== this.props.plannedAhead) this.setState({ open: {}, qty: {}, ans: null, hydro: null, addedWater: false, bumped: false, urineExp: false });\n  }\n  renderVals() {\n    const ICONS = {\n      drop: 'M12 3c3.2 4.2 5 7.2 5 9.7a5 5 0 0 1-10 0C7 10.2 8.8 7.2 12 3z',\n      bowl: 'M4 12h16a8 8 0 0 1-16 0z M8 12V9 M12 12V8 M16 12V9',\n      bar:  'M7 5h10l2 3v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8l2-3z M5 8h14',\n      chew: 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16z M8.5 12h7 M12 8.5v7'\n    };\n    const SC = {\n      '3+ hours ahead': {\n        min: 180, paLabel: '3 hours ahead',\n        carbsBand: { lo: 50, hi: 140 },\n        fluidBand: { lo: 12, hi: 26 },\n        fluidTarget: 16,\n        feedings: [\n          { id: 'meal', name: 'Pre-Run Meal', when: 'finish by 2h out', carbs: 60, fluid: 16,\n            foods: [\n              { id: 'oat', name: 'Oatmeal with banana', icon: 'bowl', step: 1, qty0: 1, carbs: 52, fluid: 0, sodium: 120 },\n              { id: 'wat', name: 'Water (cups)', icon: 'drop', step: 1, qty0: 2, carbs: 0, fluid: 8, sodium: 0 }\n            ] },\n          { id: 'snack', name: 'Pre-Workout Snack', when: '2h to 30 min out', carbs: 30, fluid: 0,\n            foods: [ { id: 'rx', name: 'RXBAR Blueberry', icon: 'bar', step: 1, qty0: 1, carbs: 24, fluid: 0, sodium: 150 } ] },\n          { id: 'topoff', name: 'Top-Off', when: 'last 30 min', carbs: 10, fluid: null,\n            foods: [ { id: 'chew', name: 'Energy Chews (packets)', icon: 'chew', step: 0.5, qty0: 0.5, carbs: 26, fluid: 0, sodium: 80 } ] }\n        ] },\n      '90 minutes ahead': {\n        min: 90, paLabel: '90 minutes ahead',\n        carbsBand: { lo: 30, hi: 70 },\n        fluidBand: { lo: 0, hi: 20 },\n        fluidTarget: 12,\n        feedings: [\n          { id: 'snack', name: 'Pre-Workout Snack', when: 'now until 30 min out', carbs: 33, fluid: 12,\n            foods: [\n              { id: 'rx', name: 'RXBAR Blueberry', icon: 'bar', step: 1, qty0: 1, carbs: 24, fluid: 0, sodium: 150 },\n              { id: 'wat', name: 'Water (cups)', icon: 'drop', step: 1, qty0: 1, carbs: 0, fluid: 8, sodium: 0 }\n            ] },\n          { id: 'topoff', name: 'Top-Off', when: 'last 30 min', carbs: 11, fluid: null,\n            foods: [ { id: 'chew', name: 'Energy Chews (packets)', icon: 'chew', step: 0.5, qty0: 0.5, carbs: 26, fluid: 0, sodium: 80 } ] }\n        ] },\n      '20 minutes ahead': {\n        min: 20, paLabel: '20 minutes ahead',\n        carbsBand: { lo: 0, hi: 30 },\n        fluidBand: { lo: 0, hi: 12 },\n        fluidTarget: 8,\n        feedings: [\n          { id: 'topoff', name: 'Top-Off', when: 'now until the start', carbs: 15, fluid: 8,\n            foods: [\n              { id: 'chew', name: 'Energy Chews (packets)', icon: 'chew', step: 0.5, qty0: 0.5, carbs: 26, fluid: 0, sodium: 80 },\n              { id: 'wat', name: 'Water (cups)', icon: 'drop', step: 1, qty0: 1, carbs: 0, fluid: 8, sodium: 0 }\n            ] }\n        ] },\n      'At the start line': {\n        min: 2, paLabel: 'at the start line',\n        carbsBand: { lo: 0, hi: 15 },\n        fluidBand: { lo: 0, hi: 12 },\n        fluidTarget: 6,\n        feedings: [\n          { id: 'topoff', name: 'Top-Off', when: 'now', carbs: 0, fluid: 6,\n            foods: [ { id: 'wat', name: 'Water (cups)', icon: 'drop', step: 1, qty0: 1, carbs: 0, fluid: 8, sodium: 0 } ] }\n        ] }\n    };\n    const pa = this.props.plannedAhead ?? '3+ hours ahead';\n    const sc = SC[pa] || SC['3+ hours ahead'];\n    const st = this.props.targetState ?? 'Targets set';\n    const ans = this.state.ans;\n    const hydro = this.state.hydro;\n    const qtyOf = (fid, fd) => this.state.qty[fid + '.' + fd.id] ?? fd.qty0;\n    const fmtQ = q => q % 1 ? q.toFixed(1) : String(q);\n    const r = v => Math.round(v);\n\n    const hydroWater = { id: 'hwat', name: 'Water (cups)', icon: 'drop', step: 1, qty0: 1, carbs: 0, fluid: 8, sodium: 0, note: 'added by hydration check' };\n    const feedDefs = sc.feedings.map(f => (f.id === 'snack' && this.state.addedWater)\n      ? { ...f, foods: [...f.foods, hydroWater] } : f);\n\n    let dC = 0, dF = 0, dNa = 0;\n    feedDefs.forEach(f => f.foods.forEach(fd => {\n      const q = qtyOf(f.id, fd);\n      dC += q * fd.carbs; dF += q * fd.fluid; dNa += q * fd.sodium;\n    }));\n\n    const carbsTarget = sc.feedings.reduce((s, f) => s + f.carbs, 0);\n    const fluidTarget = sc.fluidTarget;\n\n    const pct = (b, v) => Math.max(0, Math.min(100, (v - b.lo) / (b.hi - b.lo) * 100));\n    const band = (b, d, t, unit, oneWay) => {\n      const out = oneWay ? d > b.hi : (d > b.hi || d < b.lo);\n      return {\n        loL: r(b.lo) + unit, hiL: r(b.hi) + unit,\n        dPct: pct(b, d), tPct: pct(b, t),\n        dColor: out ? 'rgb(220,37,151)' : 'rgb(28,249,207)'\n      };\n    };\n    const cb = band(sc.carbsBand, dC, carbsTarget, 'g', false);\n    const fb = band(sc.fluidBand, dF, fluidTarget, ' oz', true);\n\n    const gated = st === 'Gated — no target', fasted = st === 'Fasted session';\n    const hydroVisible = sc.min > 120;\n\n    const pickWet = (head, prefix) => () => {\n      let mode = 'added', patch = {};\n      if (dF > fluidTarget) mode = 'over';\n      else {\n        const snack = sc.feedings.find(f => f.id === 'snack');\n        if (!snack) mode = 'over';\n        else if (snack.foods.some(fd => fd.fluid > 0 && fd.id !== 'wat')) mode = 'sports';\n        else {\n          const wat = snack.foods.find(fd => fd.id === 'wat');\n          if (wat) { patch.qty = { ...this.state.qty, ['snack.' + wat.id]: qtyOf('snack', wat) + 1 }; patch.bumped = true; }\n          else patch.addedWater = true;\n        }\n      }\n      const BODY = {\n        added: 'An 8 oz water entry was added to this snack. Adjust it like any other item.',\n        over: \"Your plan already covers your fluid target, so nothing was added. Don't force extra fluid.\",\n        sports: 'Your snack already carries fluid from a sports drink, so no water was stacked on top.'\n      };\n      const SHORT = {\n        added: 'Added 8 oz of water below.',\n        over: 'Fluids already cover your target.',\n        sports: 'Sports drink covers your fluids.'\n      };\n      this.setState({ ans: 'wet', urineExp: false, ...patch,\n        hydro: { head, short: SHORT[mode], body: prefix + BODY[mode] } });\n    };\n\n    const feedings = feedDefs.map((f, i) => {\n      const open = this.state.open[f.id] ?? false;\n      return {\n        name: f.name, when: f.when,\n        railTop: i === 0 ? 'transparent' : 'rgba(248,246,235,.2)',\n        railBot: i === feedDefs.length - 1 ? 'transparent' : 'rgba(248,246,235,.2)',\n        chev: open ? 0 : -90,\n        open,\n        showHydration: f.id === 'snack' && hydroVisible,\n        toggle: () => this.setState(s => ({ open: { ...s.open, [f.id]: !(s.open[f.id] ?? false) } })),\n        carbsVal: r(f.carbs) + 'g',\n        showFluid: f.fluid != null && f.fluid > 0,\n        fluidVal: f.fluid == null ? '' : r(f.fluid) + 'oz',\n        showFoodsLine: !open,\n        foodsLine: f.foods.map(fd => fd.name.replace(/ \\((cups|packets)\\)$/, '')).join(' + '),\n        foods: f.foods.map(fd => {\n          const q = qtyOf(f.id, fd);\n          const parts = [];\n          if (fd.carbs) parts.push(r(q * fd.carbs) + 'g carbs');\n          if (fd.fluid) parts.push(r(q * fd.fluid) + ' oz');\n          if (fd.sodium) parts.push(r(q * fd.sodium) + 'mg sodium');\n          const set = d => this.setState(s => ({ qty: { ...s.qty, [f.id + '.' + fd.id]: Math.max(0, Math.min(8, (s.qty[f.id + '.' + fd.id] ?? fd.qty0) + d)) } }));\n          return { iconPath: ICONS[fd.icon], name: fd.name, sub: parts.join(' · ') || 'nothing yet', qty: fmtQ(q), hasNote: !!fd.note, note: fd.note || '', inc: () => set(fd.step), dec: () => set(-fd.step) };\n        })\n      };\n    });\n\n    return {\n      scenarioLine: 'Planned ' + sc.paLabel,\n      fineOpen: this.state.fine,\n      toggleFine: () => this.setState(s => ({ fine: !s.fine })),\n      carbsVal: r(dC) + 'g',\n      showCarbsBand: !gated && !fasted,\n      cb, fb,\n      fluidVal: r(dF) + 'oz',\n      sodiumVal: r(dNa) + 'mg',\n      hydroTodo: !ans,\n      hydroBorder: !ans ? 'rgba(28,249,207,.55)' : 'rgba(248,246,235,.14)',\n      hydroDone: !!ans,\n      hydroHead: hydro ? hydro.head : '',\n      hydroSub: hydro ? hydro.short : 'Was your urine pale yellow this morning?',\n      hydroBody: hydro ? hydro.body : '',\n      urineOptions: [\n        { label: 'Pale yellow', pick: () => this.setState({ ans: 'wet', urineExp: false, hydro: { head: 'Pale yellow', short: 'Hydrated — no water added.', body: \"You're hydrated. No extra water needed before the start.\" } }) },\n        { label: 'Dark', pick: pickWet('Dark', '') },\n        { label: \"Haven't gone yet\", pick: pickWet('Not yet', 'Treated as dark for now — update after you go. ') },\n        { label: 'Not sure', pick: () => this.setState({ ans: 'wet', urineExp: false, hydro: { head: 'Not sure', short: 'No change to your plan.', body: 'Recorded with no change. Check when you can and update your answer.' } }) }\n      ],\n      changeAnswer: () => this.setState(s => {\n        const patch = { ans: null, hydro: null, urineExp: true };\n        let q = s.qty;\n        if (s.addedWater) { patch.addedWater = false; q = { ...q }; delete q['snack.hwat']; patch.qty = q; }\n        if (s.bumped) { patch.bumped = false; patch.qty = { ...q, ['snack.wat']: Math.max(0, (q['snack.wat'] ?? 1) - 1) }; }\n        return patch;\n      }),\n      urineExp: this.state.urineExp,\n      urineChev: this.state.urineExp ? 0 : -90,\n      urineExpAsk: this.state.urineExp && !ans,\n      urineExpResult: this.state.urineExp && !!ans,\n      toggleUrineExp: () => this.setState(s => ({ urineExp: !s.urineExp })),\n      feedings,\n      railMode: (this.props.layout ?? 'Timestamps inside cards') === 'Timeline rail',\n      embedMode: (this.props.layout ?? 'Timestamps inside cards') !== 'Timeline rail',\n      railPad: (this.props.layout ?? 'Timestamps inside cards') === 'Timeline rail' ? '24px' : '0px'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
