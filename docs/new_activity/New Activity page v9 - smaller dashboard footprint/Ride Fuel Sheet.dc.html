<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Apercu";src:url("fonts/Apercu-Regular.otf") format("opentype");font-weight:400;font-display:swap;}
@font-face{font-family:"Apercu";src:url("fonts/Apercu-Medium.otf") format("opentype");font-weight:500;font-display:swap;}
@font-face{font-family:"Apercu";src:url("fonts/Apercu-Bold.otf") format("opentype");font-weight:700;font-display:swap;}
@font-face{font-family:"Apercu Mono";src:url("fonts/Apercu-Mono.otf") format("opentype");font-weight:400;font-display:swap;}
@font-face{font-family:"Compadre";src:url("fonts/Compadre-Regular.otf") format("opentype");font-weight:400;font-display:swap;}
@font-face{font-family:"Sansita";src:url("fonts/Sansita-Bold.ttf") format("truetype");font-weight:700;font-display:swap;}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
:root{--me-blackberry:rgb(56,22,51);--me-cream:rgb(248,246,235);--me-orange:rgb(247,139,20);--me-electrolyte:rgb(28,249,207);--me-dragonfruit:rgb(220,37,151);}
</style>
</helmet>
<div style="position:absolute;inset:0;background:rgba(20,8,18,0.55);display:flex;flex-direction:column;justify-content:flex-end;">
  <div style="height:100%;background:rgb(48,18,44);display:flex;flex-direction:column;animation:sheetUp 320ms cubic-bezier(0.2,0.8,0.2,1);box-shadow:0 -18px 40px -12px rgba(0,0,0,0.5);">

    <div style="display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid rgba(248,246,235,0.08);">
      <button onClick="{{ onClose }}" style="width:32px;height:32px;border-radius:50%;background:var(--me-cream);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgb(56,22,51)" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
      <div style="flex:1;text-align:center;font-family:'Sansita',Georgia,serif;font-weight:700;font-size:17px;color:var(--me-cream);">Ride Fuel Plan</div>
      <div style="width:32px;"></div>
    </div>

    <div style="flex:1;overflow:auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:18px;">

      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:46px;height:46px;border-radius:50%;background:var(--me-electrolyte);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgb(56,22,51)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 17.5h-4l-2.5-7 3-2 2.5 4h3"></path><circle cx="15" cy="5" r="1.4"></circle></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Compadre',Georgia,serif;font-size:21px;color:var(--me-cream);line-height:1.05;">25 mi Ride</div>
          <div style="font-family:'Apercu',sans-serif;font-size:12.5px;color:rgba(248,246,235,0.6);margin-top:3px;font-variant-numeric:tabular-nums;">4:15 PM &middot; 25.0 mi &middot; 15.0 mph</div>
        </div>
      </div>

      <div style="background:rgba(247,139,20,0.13);border:1px solid rgba(247,139,20,0.45);border-radius:14px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--me-orange)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px;"><path d="m12 19V5M5 12l7-7 7 7"></path></svg>
        <div style="font-family:'Apercu',sans-serif;font-size:13px;line-height:1.45;color:var(--me-cream);">This ride raises today's plan by <span style="color:var(--me-orange);font-weight:700;">+520 kcal</span> and <span style="color:var(--me-orange);font-weight:700;">+90g carbs</span>. Fuel the three windows below.</div>
      </div>

      <sc-for list="{{ windows }}" as="w" hint-placeholder-count="3">
        <div>
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;">
            <div style="font-family:'Sansita',Georgia,serif;font-weight:700;font-size:16px;color:var(--me-cream);">{{ w.title }}</div>
            <div style="font-family:'Apercu',sans-serif;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:{{ w.accent }};background:{{ w.accentBg }};padding:4px 9px;border-radius:100px;">{{ w.timing }}</div>
          </div>
          <div style="background:rgba(255,255,255,0.045);border:1px solid rgba(248,246,235,0.08);border-radius:14px;padding:4px 14px;">
            <sc-for list="{{ w.items }}" as="it" hint-placeholder-count="2">
              <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(248,246,235,0.07);">
                <div style="width:30px;height:30px;border-radius:50%;background:{{ w.accent }};display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgb(56,22,51)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.4-2.2-7-5.2-7-9a7 7 0 0 1 14 0c0 3.8-2.6 6.8-7 9z"></path></svg>
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="font-family:'Compadre',Georgia,serif;font-size:15.5px;color:var(--me-cream);">{{ it.name }}</div>
                  <div style="font-family:'Apercu',sans-serif;font-size:11.5px;color:rgba(248,246,235,0.55);margin-top:2px;">{{ it.detail }}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
                  <button style="background:transparent;border:none;color:var(--me-dragonfruit);font-family:'Apercu',sans-serif;font-weight:500;font-size:11px;padding:0;cursor:pointer;">&times; Swap</button>
                  <button style="background:transparent;border:none;color:rgba(248,246,235,0.4);font-family:'Apercu',sans-serif;font-weight:500;font-size:11px;padding:0;cursor:pointer;">&times; Remove</button>
                </div>
              </div>
            </sc-for>
            <div style="padding:11px 0;">
              <button style="background:transparent;border:none;color:var(--me-electrolyte);font-family:'Apercu',sans-serif;font-weight:500;font-size:13px;padding:0;cursor:pointer;">+ Add Food</button>
            </div>
          </div>
        </div>
      </sc-for>

      <button onClick="{{ onClose }}" style="margin-top:4px;background:var(--me-orange);color:rgb(56,22,51);border:none;border-radius:100px;padding:14px;font-family:'Sansita',Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;width:100%;">Complete Workout</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:800},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      onClose: this.props.onClose || (() => {}),
      windows: [
        { title: "Before Ride", timing: "~2 h before \u00b7 2:15 PM", accent: "var(--me-electrolyte)", accentBg: "rgba(28,249,207,0.14)", items: [
          { name: "Oatmeal + Banana", detail: "65g carbs \u00b7 8g protein" },
        ]},
        { title: "During Ride", timing: "Every 30 min", accent: "var(--me-orange)", accentBg: "rgba(247,139,20,0.16)", items: [
          { name: "Carb Drink Mix", detail: "60g carbs \u00b7 500 ml fluid" },
          { name: "Energy Gel \u2014 Caffeine", detail: "22g carbs" },
        ]},
        { title: "After Ride", timing: "Within 30 min \u00b7 5:45 PM", accent: "var(--me-dragonfruit)", accentBg: "rgba(220,37,151,0.16)", items: [
          { name: "Recovery Shake", detail: "30g carbs \u00b7 20g protein" },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
