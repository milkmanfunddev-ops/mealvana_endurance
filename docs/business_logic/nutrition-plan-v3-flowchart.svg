<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
  <title id="title">Generate Nutrition Plan V3 algorithm flowchart</title>
  <desc id="desc">The request is validated and routed to either a brick-workout branch or a single-sport branch. Single-sport plans generate Before, During, and After phases in parallel, validate their results, return the plan, and write a best-effort analytics ledger. The brick branch honors the same Formula Kit pins, uses the same recovery-template After design, and writes the same ledger.</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .input { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; }
      .before { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .during { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .after { fill: #f3e8ff; stroke: #9333ea; stroke-width: 3; }
      .brick { fill: #ffedd5; stroke: #ea580c; stroke-width: 3; }
      .warning { fill: #fef2f2; stroke: #dc2626; stroke-width: 3; }
      .decision { fill: #ffffff; stroke: #0284c7; stroke-width: 3; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrowhead); }
      .bus { fill: none; stroke: #64748b; stroke-width: 3; }
      text { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { font-size: 32px; font-weight: 600; }
      .subheading { fill: #475569; font-size: 18px; }
      .node-title { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .body { font-size: 18px; text-anchor: middle; }
      .small { fill: #475569; font-size: 16px; text-anchor: middle; }
      .edge-label { fill: #475569; font-size: 17px; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="background" width="1600" height="1400"/>

  <text class="heading" x="60" y="58">Generate Nutrition Plan V3</text>
  <text class="subheading" x="60" y="88">Consumes macro targets and selects the actual foods for each workout phase</text>

  <!-- Request and validation -->
  <rect class="input" x="610" y="120" width="380" height="72" rx="16"/>
  <text class="node-title" x="800" y="165">Receive PlanInputV2</text>
  <path class="arrow" d="M800 192 L800 225"/>

  <polygon class="decision" points="800,225 945,290 800,355 655,290"/>
  <text class="node-title" x="800" y="285">Required input</text>
  <text class="body" x="800" y="312">valid?</text>

  <path class="arrow" d="M945 290 L1115 290"/>
  <text class="edge-label" x="1010" y="276">No</text>
  <rect class="warning" x="1115" y="250" width="300" height="80" rx="16"/>
  <text class="node-title" x="1265" y="282">Return HTTP 400</text>
  <text class="small" x="1265" y="309">missing or invalid fields</text>

  <path class="arrow" d="M800 355 L800 395"/>
  <text class="edge-label" x="820" y="382">Yes</text>
  <rect class="node" x="600" y="395" width="400" height="76" rx="16"/>
  <text class="node-title" x="800" y="427">Normalize request</text>
  <text class="small" x="800" y="454">apply user-overridden target ranges</text>
  <path class="arrow" d="M800 471 L800 505"/>

  <polygon class="decision" points="800,505 945,570 800,635 655,570"/>
  <text class="node-title" x="800" y="565">Brick</text>
  <text class="body" x="800" y="592">workout?</text>

  <!-- Single-sport branch -->
  <path class="arrow" d="M800 635 L800 680"/>
  <text class="edge-label" x="820" y="662">No</text>
  <rect class="input" x="600" y="680" width="400" height="72" rx="16"/>
  <text class="node-title" x="800" y="711">Fetch Formula Kit pins</text>
  <text class="small" x="800" y="738">Before, During, and After scopes</text>

  <path class="bus" d="M800 752 L800 790 L510 790 M800 790 L190 790 M800 790 L830 790"/>
  <path class="arrow" d="M190 790 L190 820"/>
  <path class="arrow" d="M510 790 L510 820"/>
  <path class="arrow" d="M830 790 L830 820"/>
  <text class="small" x="800" y="780">generate all three phases in parallel</text>

  <!-- Before lane -->
  <rect class="before" x="45" y="820" width="290" height="350" rx="18"/>
  <text class="node-title" x="190" y="862">BEFORE</text>
  <text class="body" x="190" y="910">Use macro-v4 selections</text>
  <text class="body" x="190" y="941">or Algorithm C fallback</text>
  <text class="body" x="190" y="993">Explode composite templates</text>
  <text class="body" x="190" y="1024">into individual foods</text>
  <text class="body" x="190" y="1076">Apply user-food substitutions</text>
  <text class="body" x="190" y="1128">Overlay a matching</text>
  <text class="body" x="190" y="1159">personal formula by slot</text>

  <!-- During lane -->
  <rect class="during" x="365" y="820" width="290" height="350" rx="18"/>
  <text class="node-title" x="510" y="862">DURING</text>
  <text class="body" x="510" y="910">Personal formula first</text>
  <text class="body" x="510" y="962">Load one shared food pool</text>
  <text class="body" x="510" y="1014">Template solver</text>
  <text class="body" x="510" y="1066">Rule-solver fallback</text>
  <text class="body" x="510" y="1118">Gut-capped carb gap-fill</text>
  <text class="body" x="510" y="1150">Report every shortfall</text>

  <!-- After lane -->
  <rect class="after" x="685" y="820" width="290" height="350" rx="18"/>
  <text class="node-title" x="830" y="862">AFTER</text>
  <text class="body" x="830" y="910">Personal formula first</text>
  <text class="body" x="830" y="962">Recovery template</text>
  <text class="body" x="830" y="993">ranked by travel + prep</text>
  <text class="body" x="830" y="1045">Use canonical servings</text>
  <text class="body" x="830" y="1097">LP fallback</text>
  <text class="body" x="830" y="1149">then greedy fallback</text>

  <!-- Single-sport convergence -->
  <path class="bus" d="M190 1170 L190 1200 L830 1200 M510 1170 L510 1200 M830 1170 L830 1200"/>
  <path class="arrow" d="M510 1200 L510 1230"/>
  <rect class="node" x="300" y="1230" width="420" height="82" rx="16"/>
  <text class="node-title" x="510" y="1263">Validate final foods</text>
  <text class="small" x="510" y="1292">attach non-fatal warnings and shortfalls</text>
  <path class="arrow" d="M720 1271 L790 1271"/>
  <rect class="input" x="790" y="1230" width="250" height="82" rx="16"/>
  <text class="node-title" x="915" y="1263">Return plan</text>
  <text class="small" x="915" y="1292">foods + metadata</text>
  <path class="arrow" d="M915 1312 L915 1340 L1160 1340"/>
  <rect class="node" x="1160" y="1300" width="340" height="80" rx="16"/>
  <text class="node-title" x="1330" y="1331">Best-effort ledger</text>
  <text class="small" x="1330" y="1360">never blocks plan delivery</text>

  <!-- Brick branch -->
  <path class="arrow" d="M945 570 L1160 570"/>
  <text class="edge-label" x="1035" y="555">Yes</text>
  <rect class="brick" x="1160" y="525" width="360" height="90" rx="16"/>
  <text class="node-title" x="1340" y="559">Shared Before phase</text>
  <text class="small" x="1340" y="588">pins + personal formulas honored</text>
  <path class="arrow" d="M1340 615 L1340 655"/>

  <rect class="brick" x="1160" y="655" width="360" height="100" rx="16"/>
  <text class="node-title" x="1340" y="689">Each sport segment</text>
  <text class="body" x="1340" y="721">normal During flow, pins honored</text>
  <path class="arrow" d="M1340 755 L1340 795"/>

  <rect class="brick" x="1160" y="795" width="360" height="120" rx="16"/>
  <text class="node-title" x="1340" y="829">T1 / T2 transitions</text>
  <text class="body" x="1340" y="863">targets come from macro-v4</text>
  <text class="small" x="1340" y="894">template 0 -> LP -> greedy</text>
  <path class="arrow" d="M1340 915 L1340 955"/>

  <rect class="brick" x="1160" y="955" width="360" height="100" rx="16"/>
  <text class="node-title" x="1340" y="989">Brick After phase</text>
  <text class="body" x="1340" y="1021">recovery template (as single-sport)</text>
  <path class="arrow" d="M1340 1055 L1340 1095"/>

  <rect class="input" x="1160" y="1095" width="360" height="100" rx="16"/>
  <text class="node-title" x="1340" y="1129">Return brick plan</text>
  <text class="small" x="1340" y="1160">segments + transitions + after + shortfalls</text>
  <path class="arrow" d="M1340 1195 L1340 1300"/>
</svg>
