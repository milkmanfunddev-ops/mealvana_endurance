(155, 138, 163);\n  --me-hairline:          rgb(198, 195, 178);\n  --me-input-bg:          rgb(90, 51, 102);\n\n  /* Ground + ink — dark-first */\n  --me-bg:                var(--me-blackberry);\n  --me-ink:               var(--me-cream);\n  --me-ink-2:             rgba(248, 246, 235, 0.65);   /* secondary text on dark */\n  --me-ink-3:             rgba(248, 246, 235, 0.5);    /* eyebrows, times, muted */\n  --me-ink-4:             rgba(248, 246, 235, 0.45);   /* units */\n  --me-card:              rgba(248, 246, 235, 0.06);   /* card fill on dark (measured) */\n  --me-card-line:         rgba(248, 246, 235, 0.14);   /* card + control hairline on dark */\n  --me-card-raised:       var(--me-blackberry-light);\n\n  /* Data colours as they appear in the ratified macro-dashboard rendering\n     (surface-level truth; the global macro meaning contract is DEFERRED, Q-SA3) */\n  --me-data-carbs:        var(--me-electrolyte);\n  --me-data-protein:      rgb(167, 139, 250);\n  --me-data-fat:          rgb(236, 84, 153);\n\n  /* Type families */\n  --me-font-display:  \"Sansita\", Georgia, serif;\n  --me-font-ui:       \"Compadre\", Georgia, serif;\n  --me-font-ui-wide:  \"Compadre Wide\", \"Compadre\", Georgia, serif;\n  --me-font-body:     \"Apercu\", ui-sans-serif, system-ui, sans-serif;\n  --me-font-mono:     \"Apercu Mono\", ui-monospace, monospace;\n\n  /* Radii — card 15 px is RATIFIED (Q-SA4); buttons and chips are pills */\n  --me-radius-sm:   8px;\n  --me-radius-input: 12px;\n  --me-radius-md:   15px;\n  --me-radius-lg:   20px;\n  --me-radius-pill: 100px;\n\n  /* Spacing (4 px grid; 17 px screen gutter) */\n  --me-space-1: 4px;  --me-space-2: 8px;  --me-space-3: 12px; --me-space-4: 16px;\n  --me-space-5: 17px; --me-space-6: 20px; --me-space-7: 24px; --me-space-8: 32px;\n  --me-space-9: 40px; --me-space-10: 48px; --me-space-12: 64px;\n\n  /* Sizes */\n  --me-button-height: 56px;\n  --me-button-height-sm: 44px;\n  --me-input-height: 48px;\n  --me-chip: 56px;          /* filled icon circle on cards (measured) */\n  --me-chip-sm: 36px;\n\n  /* Elevation — restrained; prefer hairlines */\n  --me-shadow-xs: 0 1px 2px 0 rgba(16, 24, 40, 0.05);\n  --me-shadow-md: 0 8px 20px -4px rgba(0, 0, 0, 0.35);\n\n  --me-ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --me-duration-fast: 120ms;\n  --me-duration-base: 220ms;\n}\n\n/* Light re-tint: wrap a subtree in .on-light (and pass dark={false} to components) */\n.on-light {\n  --me-bg: var(--me-cream);\n  --me-ink: var(--me-blackberry);\n  --me-ink-2: rgba(56, 22, 51, 0.7);\n  --me-ink-3: rgba(56, 22, 51, 0.55);\n  --me-ink-4: rgba(56, 22, 51, 0.45);\n  --me-card: var(--me-cream);\n  --me-card-line: var(--me-blackberry);\n  --me-card-raised: var(--me-cream-dark);\n  background: var(--me-bg); color: var(--me-ink);\n}\n.on-dark { background: var(--me-blackberry); color: var(--me-cream); }\n\nhtml { font-family: var(--me-font-body); color: var(--me-ink); background: var(--me-bg); }\nbody { background: var(--me-bg); color: var(--me-ink); margin: 0; }\n\n/* Role-based type — sizes measured from the rendering */\n.me-page-title    { font-family: var(--me-font-display); font-weight: 700; font-size: 27px; line-height: 1.1; letter-spacing: -0.01em; }\n.me-section-title { font-family: var(--me-font-display); font-weight: 700; font-size: 19px; line-height: 1.15; }\n.me-screen-title  { font-family: var(--me-font-display); font-weight: 700; font-size: 17px; line-height: 1.1; text-align: center; }\n.me-tab           { font-family: var(--me-font-ui-wide); font-size: 18px; line-height: 1; letter-spacing: 0.12em; text-transform: uppercase; }\n.me-eyebrow       { font-family: var(--me-font-body); font-weight: 500; font-size: 9.5px; line-height: 1; letter-spacing: 0.12em; text-transform: uppercase; color: var(--me-ink-3); }\n.me-food-title    { font-family: var(--me-font-ui); font-size: 17px; line-height: 1.15; letter-spacing: 0.02em; text-transform: uppercase; }\n.me-activity-title{ font-family: var(--me-font-ui); font-size: 20px; line-height: 1.1; letter-spacing: 0.02em; text-transform: uppercase; }\n.me-descriptor    { font-family: var(--me-font-ui); font-size: 14px; line-height: 1.4; letter-spacing: 0.5px; }\n.me-body          { font-family: var(--me-font-body); font-weight: 400; font-size: 13px; line-height: 1.5; }\n.me-body-lg       { font-family: var(--me-font-body); font-weight: 400; font-size: 16px; line-height: 1.5; }\n.me-body-sm       { font-family: var(--me-font-body); font-weight: 400; font-size: 11px; line-height: 1.45; color: var(--me-ink-2); }\n.me-caption       { font-family: var(--me-font-body); font-weight: 400; font-size: 10.5px; line-height: 1.2; color: var(--me-ink-3); }\n.me-data          { font-family: var(--me-font-body); font-weight: 500; font-size: 11px; line-height: 1.25; font-variant-numeric: tabular-nums; }\n.me-data-number   { font-family: var(--me-font-body); font-weight: 600; font-size: 32px; line-height: 1.2; font-variant-numeric: tabular-nums; }\n.me-data-xl       { font-family: var(--me-font-display); font-weight: 700; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; }\n.me-mono          { font-family: var(--me-font-mono); font-size: 12px; }\n.me-button-label  { font-family: var(--me-font-display); font-weight: 700; font-size: 16px; line-height: 20px; }\n\n/* ============================================================\n   Materials — tokens.md §Materials (RULED Xuan 2026-09-06/07, home-shell@v1;\n   liquid-bubble intake RESOLVED 2026-09-07). Web twin of the app's\n   AppMaterials registry. Boundaries: timeline/content cards NEVER take\n   glass — solid fill + hairline stays their treatment. The bubble's true\n   refraction is Impeller-only in the app; this twin (like Flutter web)\n   renders the flat translucent approximation.\n   ============================================================ */\n:root {\n  /* glass (floating chrome): backdrop blur 4 · saturate 1.8 · brighten 1.12 */\n  --me-glass-fill-top:    rgba(248, 246, 235, 0.07);\n  --me-glass-fill-bottom: rgba(248, 246, 235, 0.02);\n  --me-glass-rim-top:     rgba(248, 246, 235, 0.40);\n  --me-glass-rim-side:    rgba(248, 246, 235, 0.08);\n  --me-glass-lift:        0 8px 24px rgba(0, 0, 0, 0.25);\n  /* tab-bar dim chain: blur 12 · saturate 1.1 · blackberry 55% fill */\n  --me-bar-dim:           rgba(56, 22, 51, 0.55);\n  /* glass-sheet: blur 18 · saturate 1.2 · blackberry 30% veil; scrim 60% */\n  --me-sheet-fill-top:    rgba(248, 246, 235, 0.04);\n  --me-sheet-fill-bottom: rgba(248, 246, 235, 0.01);\n  --me-sheet-veil:        rgba(56, 22, 51, 0.30);\n  --me-scrim:             rgba(56, 22, 51, 0.60);\n  --me-sheet-radius:      24px;\n  /* top-fade dissolve: 104px, blackberry 85% → 55% @ half → 0 */\n  --me-top-fade-h:        104px;\n  --me-top-fade:          linear-gradient(to bottom,\n                            rgba(56,22,51,0.85) 0%, rgba(56,22,51,0.55) 50%,\n                            rgba(56,22,51,0) 100%);\n  /* calendar channels (calendar-sheet.md Q1/Q2) */\n  --me-cal-tint-fill:     rgba(255, 166, 48, 0.18);\n  --me-cal-tint-ring:     rgba(255, 180, 80, 0.15);\n}\n\n/* Backdrop chains. The rim is a 1px inner specular (top arc bright, sides\n   faint) + a bottom inner shadow — box-shadow insets approximate it. */\n.me-glass {\n  background: linear-gradient(to bottom, var(--me-glass-fill-top), var(--me-glass-fill-bottom));\n  backdrop-filter: blur(4px) saturate(1.8) brightness(1.12);\n  -webkit-backdrop-filter: blur(4px) saturate(1.8) brightness(1.12);\n  box-shadow: inset 0 1px 0 var(--me-glass-rim-top),\n              inset 1px 0 0 var(--me-glass-rim-side),\n              inset -1px 0 0 var(--me-glass-rim-side),\n              inset 0 -1px 1px rgba(0, 0, 0, 0.25);\n}\n.me-glass-dim {\n  background: var(--me-bar-dim);\n  backdrop-filter: blur(12px) saturate(1.1);\n  -webkit-backdrop-filter: blur(12px) saturate(1.1);\n  box-shadow: inset 0 1px 0 var(--me-glass-rim-top),\n              inset 1px 0 0 var(--me-glass-rim-side),\n              inset -1px 0 0 var(--me-glass-rim-side),\n              inset 0 -1px 1px rgba(0, 0, 0, 0.25);\n}\n.me-glass-sheet {\n  background: linear-gradient(var(--me-sheet-veil), var(--me-sheet-veil)),\n              linear-gradient(to bottom, var(--me-sheet-fill-top), var(--me-sheet-fill-bottom));\n  backdrop-filter: blur(18px) saturate(1.2);\n  -webkit-backdrop-filter: blur(18px) saturate(1.2);\n  border-radius: var(--me-sheet-radius) var(--me-sheet-radius) 0 0;\n  box-shadow: inset 0 1px 0 var(--me-glass-rim-top);\n}\n/* Outer lift is additive — floating pills carry rim + drop shadow together. */\n.me-glass.me-glass-lift,\n.me-glass-dim.me-glass-lift {\n  box-shadow: inset 0 1px 0 var(--me-glass-rim-top),\n              inset 1px 0 0 var(--me-glass-rim-side),\n              inset -1px 0 0 var(--me-glass-rim-side),\n              inset 0 -1px 1px rgba(0, 0, 0, 0.25),\n              var(--me-glass-lift);\n}\n\n<\u002Fstyle>\n<script src=\"26c52e9a-2575-4e66-8108-62242abcd476\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--me-blackberry-dark); }\n  a { color: var(--me-orange); }\n  a:hover { color: var(--me-orange-light); }\n  @keyframes meRise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 16px 56px;background:var(--me-blackberry-dark);min-height:100vh;box-sizing:border-box;font-family:Apercu, ui-sans-serif, system-ui, sans-serif;color:var(--me-ink)\">\n\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:660px\">\n    <div style=\"font-family:Apercu, ui-sans-serif, system-ui, sans-serif;font-size:11px;font-weight:600;letter-spacing:0.01em;color:var(--me-ink-3)\">ftp field state<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:center\">\n      <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ m.select }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"me-body-sm\" style=\"color:var(--me-ink-3);text-align:center;max-width:520px;text-wrap:pretty\">A manual entry always wins for calculation and flips the source to manual. Edit the field to see it happen.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:404px;max-width:100%;padding:12px;border-radius:54px;background:#000;box-shadow:0 24px 64px rgba(0,0,0,0.55)\">\n    <div style=\"position:relative;height:812px;border-radius:42px;overflow:hidden;background:var(--me-bg);display:flex;flex-direction:column\">\n      <div style=\"position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:16px;background:#000;z-index:6\"><\u002Fdiv>\n\n      <div style=\"flex:1;overflow:auto;padding:54px 16px 20px;display:flex;flex-direction:column;gap:18px\">\n\n        <x-import component-from-global-scope=\"MealvanaDS.DetailHeader\" title=\"Cycling Details\" hint-size=\"100%,44px\"><\u002Fx-import>\n\n        <div class=\"me-page-title\" style=\"color:var(--me-orange);font-size:26px;line-height:1.1;margin:0\">Cycling details<\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span class=\"me-body\" style=\"font-weight:700;font-size:16px\">FTP (Functional Threshold Power)<\u002Fspan>\n            <sc-if value=\"{{ showStaleChip }}\">\n              <span style=\"font-family:Apercu, ui-sans-serif, system-ui, sans-serif;font-size:10.5px;font-style:italic;font-weight:600;letter-spacing:0.01em;color:var(--me-ink-3);border:1px solid var(--me-card-line);border-radius:6px;padding:2px 7px\">stale<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div class=\"me-body-sm\" style=\"color:var(--me-ink-3);text-wrap:pretty\">Maximum power you can sustain for ~1 hour. Enter 0 if unknown.<\u002Fdiv>\n\n          <x-import component-from-global-scope=\"MealvanaDS.InputField\" numeric=\"{{ true }}\" suffix=\"watts\" label=\"FTP\" value=\"{{ ftp }}\" sc-camel-on-change=\"{{ onFtpChange }}\" hint-size=\"100%,48px\"><\u002Fx-import>\n\n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px\">\n            <span style=\"{{ sourcePillStyle }}\">\n              <x-import component-from-global-scope=\"MealvanaDS.SourceDot\" source=\"{{ dotSource }}\" size=\"{{ 8 }}\" hint-size=\"8px,8px\"><\u002Fx-import>\n              {{ sourceText }}\n            <\u002Fspan>\n            <sc-if value=\"{{ showNoticeA }}\">\n              <button sc-camel-on-click=\"{{ adopt }}\" style=\"display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--me-electrolyte);border-radius:var(--me-radius-pill);padding:4px 10px;cursor:pointer;font-family:Apercu, ui-sans-serif, system-ui, sans-serif;font-size:12px;font-style:italic;font-weight:600;color:var(--me-electrolyte);animation:meRise 200ms ease-out\">\n                TrainingPeaks · {{ tpLabel }} — tap to use\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showSyncNow }}\">\n              <button sc-camel-on-click=\"{{ syncNow }}\" style=\"display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--me-card-line);border-radius:var(--me-radius-pill);padding:4px 10px;cursor:pointer;font-family:Apercu, ui-sans-serif, system-ui, sans-serif;font-size:12px;font-style:italic;font-weight:600;color:var(--me-ink-2)\">\n                <x-import component-from-global-scope=\"MealvanaDS.Icon\" name=\"rotate\" size=\"{{ 11 }}\" hint-size=\"11px,11px\"><\u002Fx-import>\n                Sync Now\n              <\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ overrideNote }}\">\n            <div class=\"me-body-sm\" style=\"color:var(--me-ink-3);text-wrap:pretty;animation:meRise 220ms ease-out\">{{ overrideNote }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div class=\"me-body-sm\" style=\"color:var(--me-ink);font-weight:600\">What is your bike's bottle capacity?<\u002Fdiv>\n          <x-import component-from-global-scope=\"MealvanaDS.Stepper\" value=\"{{ bottles }}\" sc-camel-on-change=\"{{ setBottles }}\" min=\"{{ 0 }}\" max=\"{{ 6 }}\" step=\"{{ 1 }}\" unit=\" bottles\" hint-size=\"100%,44px\"><\u002Fx-import>\n          <div class=\"me-body-sm\" style=\"color:var(--me-ink-3)\">1 bottle = 20 oz (591 mL)<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <label style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--me-card);border:1px solid var(--me-card-line);border-radius:var(--me-radius-md);padding:12px 14px\">\n            <span class=\"me-body\">I use Aero Bottles<\u002Fspan>\n            <x-import component-from-global-scope=\"MealvanaDS.Switch\" label=\"I use Aero Bottles\" value=\"{{ aero }}\" sc-camel-on-change=\"{{ setAero }}\" hint-size=\"51px,31px\"><\u002Fx-import>\n          <\u002Flabel>\n          <label style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--me-card);border:1px solid var(--me-card-line);border-radius:var(--me-radius-md);padding:12px 14px\">\n            <span class=\"me-body\">I use a Bento Box for food<\u002Fspan>\n            <x-import component-from-global-scope=\"MealvanaDS.Switch\" label=\"I use a Bento Box for food\" value=\"{{ bento }}\" sc-camel-on-change=\"{{ setBento }}\" hint-size=\"51px,31px\"><\u002Fx-import>\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:auto;padding-top:20px\">\n          <x-import component-from-global-scope=\"MealvanaDS.PrimaryButton\" full=\"{{ true }}\" hint-size=\"100%,56px\">Save<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:1000},&quot;tpWatts&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:285,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;W&quot;,&quot;section&quot;:&quot;Data&quot;},&quot;manualWatts&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:265,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;W&quot;,&quot;section&quot;:&quot;Data&quot;},&quot;staleAge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6 days ago&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { mode: 'manual', ftp: '265', source: 'manual', stale: false, syncAge: '2 hours ago', conflict: null, note: null, bottles: 2, aero: false, bento: false };\n  }\n  tp() { return this.props.tpWatts ?? 285; }\n  manual() { return this.props.manualWatts ?? 265; }\n  staleAge() { return this.props.staleAge ?? '6 days ago'; }\n\n  setMode(mode) {\n    const m = String(this.manual()), t = String(this.tp());\n    const presets = {\n      manual:    { ftp: m, source: 'manual', stale: false, conflict: null, note: null },\n      tp:        { ftp: t, source: 'tp', stale: false, syncAge: '2 hours ago', conflict: null, note: null },\n      conflictA: { ftp: m, source: 'manual', stale: false, syncAge: '2 hours ago', conflict: 'A', note: null },\n      stale:     { ftp: String(this.tp() - 14), source: 'tp', stale: true, syncAge: this.staleAge(), conflict: null, note: null }\n    };\n    this.setState(Object.assign({ mode }, presets[mode]));\n  }\n\n  renderVals() {\n    const s = this.state, tp = this.tp();\n    const tpLabel = tp + ' W', manualLabel = this.manual() + ' W';\n    const base = 'font-family:Apercu, ui-sans-serif, system-ui, sans-serif;font-size:13px;font-weight:600;padding:9px 14px;border-radius:var(--me-radius-pill);cursor:pointer;transition:all 140ms ease;';\n    const defs = [\n      ['manual', 'Manual'], ['tp', 'TrainingPeaks'], ['conflictA', 'Conflict'], ['stale', 'Stale sync']\n    ];\n    const modes = defs.map(([value, label]) => ({\n      label, value,\n      select: () => this.setMode(value),\n      style: base + (s.mode === value\n        ? 'background:var(--me-orange);border:1px solid var(--me-orange);color:var(--me-blackberry);'\n        : 'background:transparent;border:1px solid var(--me-card-line);color:var(--me-ink-2);')\n    }));\n\n    let sourceText, dotSource, pillInk, pillLine, pillFill;\n    const inConflict = s.conflict === 'A';\n    if (s.source === 'manual') {\n      sourceText = inConflict ? 'Manual · ' + (s.ftp || '0') + ' W' : 'Manual';\n      dotSource = 'self-reported';\n      pillInk = 'var(--me-cream)'; pillLine = 'var(--me-cream)'; pillFill = 'transparent';\n    } else {\n      sourceText = 'TrainingPeaks';\n      dotSource = s.stale ? 'estimated' : 'verified';\n      pillInk = 'var(--me-electrolyte)'; pillLine = 'var(--me-electrolyte)'; pillFill = 'transparent';\n    }\n    const sourcePillStyle = 'display:inline-flex;align-items:center;gap:6px;font-family:Apercu, ui-sans-serif, system-ui, sans-serif;font-size:12px;font-style:italic;font-weight:600;border-radius:var(--me-radius-pill);padding:4px 10px;color:' + pillInk + ';border:1px solid ' + pillLine + ';background:' + pillFill + ';';\n\n    return {\n      modes, tpLabel, manualLabel, sourceText, dotSource, sourcePillStyle,\n      showStaleChip: s.stale,\n      ftp: s.ftp,\n      syncAge: s.syncAge,\n      overrideNote: s.note,\n      showSyncNow: s.stale || inConflict,\n      showNoticeA: s.conflict === 'A',\n      bottles: s.bottles, aero: s.aero, bento: s.bento,\n      setBottles: (v) => this.setState({ bottles: v }),\n      setAero: (v) => this.setState({ aero: v }),\n      setBento: (v) => this.setState({ bento: v }),\n      onFtpChange: (v) => this.setState({ ftp: v, source: 'manual', stale: false, conflict: null, note: 'Manual entry is used for calculation. TrainingPeaks (' + tpLabel + ') is kept as reference only.' }),\n      adopt: () => this.setState({ ftp: String(tp), source: 'tp', stale: false, syncAge: 'just now', conflict: null, note: 'Now using the TrainingPeaks value.' }),\n      syncNow: () => this.setState({ ftp: String(tp), stale: false, source: 'tp', syncAge: 'just now', note: 'Refreshed from TrainingPeaks.' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
