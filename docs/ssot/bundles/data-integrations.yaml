  runner: qa/conformance/run_dart.sh + deno vectors runner + matcher-tier runner (Stage B, to build)
  invoke:
    - "Stage B: matcher-tier runner over vectors/integrations/matching.json — RED FIRST against current code, mandatory"
    - "deno runner: session-demand incl. f4a-* rows (comparator gains estimateFlag/legs)"
  done_when: >
    all 41 matching vectors green through the matcher-tier runner (after the mandatory
    red-first run); session-demand green incl. the 9 f4a rows; DI-7/DI-12 seam tests
    green; migration rehearsal (test plan §4) green on a prod-schema shadow; the three
    goldens manifests realized as green app suites; stages A–E of
    docs/feature-test-plans/data-integrations.md each green-gated in order.
  note: >
    Vectors are EXPECTED-RED until implementation. The matcher-tier runner does not
    exist yet — building it and proving it RED against today's earliest-first matcher
    is Stage B's first task, not a precondition of this ship.

