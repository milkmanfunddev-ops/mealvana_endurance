<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 579" width="100%" role="img" aria-label="One conversation, start to idle">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One conversation, start to idle</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="432"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Msg 1-39</text><text class="dg-sub" x="50" y="73">Every message kept verbatim.</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="108" font-weight="700">Msg 30</text><text class="dg-sub" x="50" y="126">Summary of the oldest 20 written</text><text class="dg-sub" x="50" y="142">in the background; no turn waits.</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Msg 40</text><text class="dg-sub" x="50" y="195">Oldest 20 become one summary message,</text><text class="dg-sub" x="50" y="211">last 20 stay verbatim.</text><circle cx="30" cy="241" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="246" font-weight="700">Msg 60</text><text class="dg-sub" x="50" y="264">Same again, previous summary rolled in.</text><circle cx="30" cy="294" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="299" font-weight="700">Any time</text><text class="dg-sub" x="50" y="317">Remember tool saves a durable thing</text><text class="dg-sub" x="50" y="333">the moment the athlete says it.</text><circle cx="30" cy="363" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="368" font-weight="700">Idle</text><text class="dg-sub" x="50" y="386">Sheet closes, app backgrounds, or a new</text><text class="dg-sub" x="50" y="402">chat starts: client tells the server.</text><circle cx="30" cy="432" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="437" font-weight="700">Then</text><text class="dg-sub" x="50" y="455">Server writes the episode once.</text><text class="dg-sub" x="50" y="471">Next opener reads it, never waits.</text><rect class="dg-ex" x="16" y="499" width="384" height="68" rx="8"/><text class="dg-sub" x="28" y="521">Turn 45: one summary of messages 1 to 20, then 21 to 45.</text><text class="dg-sub" x="28" y="539">Sheet closed 21:10: episode written before the 07:00 chat.</text><text class="dg-sub" x="28" y="557">Removed: 3.5 s read-back wait, last-words fallback.</text></svg>
