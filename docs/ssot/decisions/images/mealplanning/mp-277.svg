<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 372" width="100%" role="img" aria-label="Inside one chat: history in chunks of 20">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Inside one chat: history in</text><text class="dg-title" x="16" y="44">chunks of 20</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">From message 1</text><text class="dg-sub" x="50" y="73">Every message kept word for word</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="108" font-weight="700">Message 30</text><text class="dg-sub" x="50" y="126">A summary of messages 1 to 20</text><text class="dg-sub" x="50" y="142">is prepared in the background</text><circle cx="30" cy="172" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="177" font-weight="700">Message 40</text><text class="dg-sub" x="50" y="195">Messages 1 to 20 become that summary;</text><text class="dg-sub" x="50" y="211">21 to 40 stay word for word</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">Message 60</text><text class="dg-sub" x="50" y="264">Same again: 1 to 40 are summary,</text><text class="dg-sub" x="50" y="280">41 to 60 word for word</text><rect class="dg-ex" x="16" y="308" width="288" height="32" rx="8"/><text class="dg-sub" x="28" y="330">No reply waits for a summary</text></g></svg>
