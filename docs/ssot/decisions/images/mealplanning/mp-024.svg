<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 484" width="100%" role="img" aria-label="Three ways a Memory is written">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Three ways a Memory is written</text><line class="dg-edge" x1="122.3" y1="100" x2="194" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="270.9" y1="100" x2="212.2" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="204" y1="196" x2="204" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="130.7" y1="332" x2="185.9" y2="274" marker-end="url(#dg-arrow)" style="stroke:var(--muted, #8A7A8C)"/><rect x="123.80000000000001" y="294" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="158.3" y="307" text-anchor="middle">not built</text><line class="dg-edge" x1="277.3" y1="332" x2="222.1" y2="274" marker-end="url(#dg-arrow)" style="stroke:var(--muted, #8A7A8C)"/><rect x="215.2" y="294" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="249.7" y="307" text-anchor="middle">not built</text><rect class="dg-box" x="40.5" y="44" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="107.5" y="62" text-anchor="middle">Athlete says</text><text x="107.5" y="80" text-anchor="middle">&#39;remember this&#39;</text><rect class="dg-box" x="198.5" y="44" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="283" y="62" text-anchor="middle">Model on its own</text><text x="283" y="80" text-anchor="middle">margin-note rule met</text><rect class="dg-box" x="123" y="140" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="204" y="158" text-anchor="middle">Background extract</text><text x="204" y="176" text-anchor="middle">after the chat ends</text><rect class="dg-box" x="147.5" y="236" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="204" y="254" text-anchor="middle">Memory table</text><rect class="dg-box" x="16" y="332" width="176" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="104" y="350" text-anchor="middle">Extraction on a timer</text><text x="104" y="368" text-anchor="middle">(needs a cron)</text><rect class="dg-box" x="216" y="332" width="176" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="304" y="350" text-anchor="middle">Extraction every turn</text><text x="304" y="368" text-anchor="middle">(too costly)</text><rect class="dg-ex" x="16" y="404" width="376" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Mon 10:02 &#39;remember I race Saturday&#39;: written at once.</text><text class="dg-sub" x="28" y="444">Mon 10:05 she mentions hating gels: model notes it.</text><text class="dg-sub" x="28" y="462">Mon 10:20 chat ends: extractor adds &#39;skips breakfast&#39;.</text></svg>
