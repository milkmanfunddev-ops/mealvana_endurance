<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 502" width="100%" role="img" aria-label="Which plan an action hits">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Which plan an action hits</text><line class="dg-edge" x1="201.5" y1="118" x2="201.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="183.8" y1="178" x2="129.7" y2="236" marker-end="url(#dg-arrow)"/><rect x="141.75" y="198" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="156.75" y="211" text-anchor="middle">yes</text><line class="dg-edge" x1="212.4" y1="178" x2="245.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="165.45" y="198" width="127" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="228.95" y="211" text-anchor="middle">no, a draft exists</text><line class="dg-edge" x1="201.5" y1="178" x2="201.5" y2="332" marker-end="url(#dg-arrow)"/><rect x="147.5" y="246" width="108" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="201.5" y="259" text-anchor="middle">no id, no draft</text><rect class="dg-box" x="117" y="44" width="169" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201.5" y="62" text-anchor="middle">Action arrives</text><text x="201.5" y="80" text-anchor="middle">chat part, Plan tab,</text><text x="201.5" y="98" text-anchor="middle">Review sheet</text><rect class="dg-box" x="131" y="140" width="141" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201.5" y="158" text-anchor="middle">Names a plan id?</text><rect class="dg-box" x="64" y="236" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="112" y="254" text-anchor="middle">That plan</text><rect class="dg-box" x="184" y="236" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="261.5" y="254" text-anchor="middle">The conversation&#39;s</text><text x="261.5" y="272" text-anchor="middle">draft</text><rect class="dg-box" x="148.5" y="332" width="106" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="201.5" y="350" text-anchor="middle">The week&#39;s</text><text x="201.5" y="368" text-anchor="middle">active plan</text><rect class="dg-ex" x="16" y="422" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="444">Review sheet sends plan 8f2: plan 8f2 changes.</text><text class="dg-sub" x="28" y="462">A chat chip with no id while a draft is open: the draft.</text><text class="dg-sub" x="28" y="480">Plan tab swap, no id, no draft: this week&#39;s active plan.</text></svg>
