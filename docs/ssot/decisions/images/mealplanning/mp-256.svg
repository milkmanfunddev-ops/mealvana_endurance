t class="dg-box" x="194.5" y="236" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="242.5" y="254" text-anchor="middle">The draft</text><rect class="dg-box" x="68.5" y="332" width="183" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="350" text-anchor="middle">The week&#39;s active plan</text><rect class="dg-ex" x="16" y="404" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Same order for chat parts, the Plan tab</text><text class="dg-sub" x="28" y="444">and the Review sheet.</text></svg>
