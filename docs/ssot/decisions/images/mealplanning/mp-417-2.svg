<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 370" width="100%" role="img" aria-label="What we decided: how onboarding ends">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: how onboarding ends</text><line class="dg-edge" x1="178" y1="72" x2="202" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="241.9" y1="100" x2="203.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="158.5" y1="196" x2="133.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="111.5" y="207" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="146" y="220" text-anchor="middle">no access</text><line class="dg-edge" x1="204.8" y1="196" x2="246" y2="236" marker-end="url(#dg-arrow)"/><rect x="187.9" y="207" width="75" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="225.4" y="220" text-anchor="middle">has access</text><line class="dg-edge" x1="193.5" y1="259.3" x2="217.5" y2="257.9" marker-end="url(#dg-arrow)"/><rect x="187.5" y="249.60000000000002" width="36" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="205.5" y="262.6" text-anchor="middle">buys</text><rect class="dg-box" x="16" y="44" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="97" y="62" text-anchor="middle">Onboarding answers,</text><text x="97" y="80" text-anchor="middle">kept on the phone</text><rect class="dg-box" x="202" y="44" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269" y="62" text-anchor="middle">Account screen:</text><text x="269" y="80" text-anchor="middle">the trial line</text><rect class="dg-box" x="84.5" y="140" width="183" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="176" y="158" text-anchor="middle">Sign up: answers</text><text x="176" y="176" text-anchor="middle">written to the account</text><rect class="dg-box" x="38.5" y="236" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="116" y="254" text-anchor="middle">Paywall: app name,</text><text x="116" y="272" text-anchor="middle">two plans, Restore</text><rect class="dg-box" x="217.5" y="236" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="265.5" y="254" text-anchor="middle">The app</text><rect class="dg-ex" x="16" y="308" width="320" height="50" rx="8"/><text class="dg-sub" x="28" y="330">&quot;7 days free, then $24.99 a month or</text><text class="dg-sub" x="28" y="348">$199.99 a year. Cancel any time.&quot;</text></svg>
