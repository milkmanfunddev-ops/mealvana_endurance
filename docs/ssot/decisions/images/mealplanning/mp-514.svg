<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 236" width="100%" role="img" aria-label="Refused AI call: error or paywall?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Refused AI call: error or paywall?</text><rect class="dg-box" x="16" y="44" width="199" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Today: a generic error</text><line x1="28" y1="74" x2="203" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">The server refuses: no Pro</text><text class="dg-sub" x="28" y="109">&quot;The AI service returned an</text><text class="dg-sub" x="28" y="126">error. Please try again.&quot;</text><text class="dg-sub" x="28" y="143">Taps again, same error</text><rect class="dg-box" x="231" y="44" width="193" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="243" y="66" font-weight="700">Open the paywall</text><line x1="243" y1="74" x2="412" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="243" y="92">The server refuses: no Pro</text><text class="dg-sub" x="243" y="109">The paywall opens</text><text class="dg-sub" x="243" y="126">Subscribe, or close it</text><text class="dg-sub" x="243" y="143">and keep reading</text><rect class="dg-ex" x="16" y="174" width="408" height="50" rx="8"/><text class="dg-sub" x="28" y="196">A Lapsed athlete taps Describe on a meal</text><text class="dg-sub" x="28" y="214">on 10 November.</text></svg>
