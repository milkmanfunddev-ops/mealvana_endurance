<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 370" width="100%" role="img" aria-label="Who reaches Vana which way">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Who reaches Vana which way</text><line class="dg-edge" x1="96.6" y1="100" x2="100.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="283.1" y1="100" x2="293.4" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="30" y="44" width="127" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="93.5" y="62" text-anchor="middle">Shipped app:</text><text x="93.5" y="80" text-anchor="middle">old chat route</text><rect class="dg-box" x="181" y="44" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="276" y="62" text-anchor="middle">Current app:</text><text x="276" y="80" text-anchor="middle">chat call + opener flag</text><rect class="dg-box" x="16" y="140" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="104" y="158" text-anchor="middle">Vana in general mode;</text><text x="104" y="176" text-anchor="middle">Opener not saved</text><rect class="dg-box" x="216" y="140" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="300.5" y="158" text-anchor="middle">Chat function;</text><text x="300.5" y="176" text-anchor="middle">general Opener saved</text><rect class="dg-box" x="70.5" y="236" width="260" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="200.5" y="254" text-anchor="middle">Old tables renamed to Vana names;</text><text x="200.5" y="272" text-anchor="middle">old names kept as views</text><rect class="dg-ex" x="16" y="308" width="369" height="50" rx="8"/><text class="dg-sub" x="28" y="330">The old route stays until the minimum</text><text class="dg-sub" x="28" y="348">app version passes 1.24.</text></svg>
