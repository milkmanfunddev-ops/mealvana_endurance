<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 388" width="100%" role="img" aria-label="A monthly budget, and never a lock">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A monthly budget, and never a lock</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Trial, day 1</text><text class="dg-sub" x="50" y="73">The full month&#39;s budget lands in the wallet</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="108" font-weight="700">Budget runs out</text><text class="dg-sub" x="50" y="126">An AI button opens the Top-up sheet:</text><text class="dg-sub" x="50" y="142">share used, renewal date, two packs</text><circle cx="30" cy="172" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="177" font-weight="700">Renewal</text><text class="dg-sub" x="50" y="195">The budget refills; what was left</text><text class="dg-sub" x="50" y="211">does not roll over</text><circle cx="30" cy="241" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="246" font-weight="700">Trial cancelled</text><text class="dg-sub" x="50" y="264">The rest of the budget is taken back;</text><text class="dg-sub" x="50" y="280">bought Top-ups stay</text><rect class="dg-ex" x="16" y="308" width="332" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Spending order: the monthly budget, then Top-ups.</text><text class="dg-sub" x="28" y="348">An annual plan refills monthly on its anniversary.</text><text class="dg-sub" x="28" y="366">The app never locks for an empty wallet.</text></svg>
