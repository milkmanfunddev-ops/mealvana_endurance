<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 218" width="100%" role="img" aria-label="A floor per turn, or an average?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A floor per turn, or an average?</text><rect class="dg-box" x="16" y="44" width="174" height="114" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">Average over ten</text><line x1="28" y1="74" x2="178" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Ten turns read 85%</text><text class="dg-sub" x="28" y="109">One turn at 79% is fine</text><text class="dg-sub" x="28" y="126">No more work</text><rect class="dg-box" x="206" y="44" width="193" height="114" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="218" y="66" font-weight="700">Floor for every turn</text><line x1="218" y1="74" x2="387" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="218" y="92">The turn at 79% fails</text><text class="dg-sub" x="218" y="109">Needs a third cache marker</text><text class="dg-sub" x="218" y="126">on the history</text><text class="dg-sub" x="218" y="143">Saves under a cent a chat</text><rect class="dg-ex" x="16" y="174" width="383" height="32" rx="8"/><text class="dg-sub" x="28" y="196">79% is the turn right after the plan changed</text></svg>
