<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 386" width="100%" role="img" aria-label="What we decided: the app says when a chat goes idle">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: the app says when a chat goes idle</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="257"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">6 Oct 19:00</text><text class="dg-sub" x="50" y="73">Athlete plans dinners. Lasting things</text><text class="dg-sub" x="50" y="89">saved as they are said</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">19:20</text><text class="dg-sub" x="50" y="142">The app is killed mid-chat.</text><text class="dg-sub" x="50" y="158">The notes are already saved</text><circle cx="30" cy="188" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="193" font-weight="700">Later</text><text class="dg-sub" x="50" y="211">The Episode for that chat waits</text><text class="dg-sub" x="50" y="227">until it is next opened</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">7 Oct morning</text><text class="dg-sub" x="50" y="280">A new chat: the opener reads</text><text class="dg-sub" x="50" y="296">what exists. No wait</text><rect class="dg-ex" x="16" y="324" width="352" height="50" rx="8"/><text class="dg-sub" x="28" y="346">Normally the sheet closing tells the server,</text><text class="dg-sub" x="28" y="364">and it writes the Episode and missed notes then, once</text></svg>
