<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 236" width="100%" role="img" aria-label="Does a Grant get the Monthly budget?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Does a Grant get the Monthly budget?</text><rect class="dg-box" x="16" y="44" width="193" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">No monthly budget</text><line x1="28" y1="74" x2="197" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">1 Oct: Legacy grace starts</text><text class="dg-sub" x="28" y="109">Pro is live, budget $0.00</text><text class="dg-sub" x="28" y="126">Vana runs only on Top-ups</text><text class="dg-sub" x="28" y="143">bought before</text><rect class="dg-box" x="225" y="44" width="201" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="237" y="66" font-weight="700">Budget like a subscriber</text><line x1="237" y1="74" x2="414" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="237" y="92">1 Oct: Legacy grace starts</text><text class="dg-sub" x="237" y="109">Pro is live, budget $4.00</text><text class="dg-sub" x="237" y="126">Vana runs as for a paying</text><text class="dg-sub" x="237" y="143">subscriber</text><rect class="dg-ex" x="16" y="174" width="410" height="50" rx="8"/><text class="dg-sub" x="28" y="196">An account from before the flip gets 30 days</text><text class="dg-sub" x="28" y="214">of Legacy grace on 1 October.</text></svg>
