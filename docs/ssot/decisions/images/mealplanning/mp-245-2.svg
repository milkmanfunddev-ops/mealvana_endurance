<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 274" width="100%" role="img" aria-label="What we decided: what gets saved">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: what gets saved</text><line class="dg-edge" x1="107" y1="100" x2="107" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="268.4" y1="100" x2="273.2" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="33" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="107" y="62" text-anchor="middle">Complaint, praise</text><text x="107" y="80" text-anchor="middle">or suggestion</text><rect class="dg-box" x="205" y="44" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="265" y="62" text-anchor="middle">Taste comment</text><text x="265" y="80" text-anchor="middle">&quot;not those&quot;</text><rect class="dg-box" x="22.5" y="140" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="107" y="158" text-anchor="middle">Saved in their words</text><text x="107" y="176" text-anchor="middle">and sent to Wiredash</text><rect class="dg-box" x="215.5" y="140" width="120" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="275.5" y="158" text-anchor="middle">Nothing saved</text><rect class="dg-ex" x="16" y="212" width="326" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Complaint plus a question: Vana still answers it.</text><text class="dg-sub" x="28" y="252">A pure vent: the acknowledgement alone.</text></svg>
