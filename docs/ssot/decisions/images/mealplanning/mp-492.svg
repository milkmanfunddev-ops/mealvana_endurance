<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 406" width="100%" role="img" aria-label="Ticket 13: checks before release">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 13: checks before release</text><line class="dg-edge" x1="160" y1="100" x2="160" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="214" x2="160" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="89.5" y="44" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="62" text-anchor="middle">Claude: APIs and</text><text x="160" y="80" text-anchor="middle">browser checks</text><rect class="dg-box" x="79" y="140" width="162" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="158" text-anchor="middle">Lee on a phone:</text><text x="160" y="176" text-anchor="middle">purchase, reminder,</text><text x="160" y="194" text-anchor="middle">Restore</text><rect class="dg-box" x="112" y="236" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="254" text-anchor="middle">Release</text><rect class="dg-ex" x="16" y="326" width="288" height="68" rx="8"/><text class="dg-sub" x="28" y="348">Both stores and RevenueCat.</text><text class="dg-sub" x="28" y="366">Founding purchase; reminder with the clock</text><text class="dg-sub" x="28" y="384">moved on.</text></svg>
