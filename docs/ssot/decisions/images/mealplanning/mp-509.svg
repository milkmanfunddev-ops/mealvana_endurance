<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 370" width="100%" role="img" aria-label="Where the onboarding answers go">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where the onboarding answers go</text><line class="dg-edge" x1="164.9" y1="100" x2="129.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="219.2" y1="100" x2="260.8" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="129.1" y1="196" x2="164.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="260.8" y1="196" x2="219.2" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="98.5" y="44" width="183" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="190" y="62" text-anchor="middle">Answers and connected</text><text x="190" y="80" text-anchor="middle">platform, temporary id</text><rect class="dg-box" x="16" y="140" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="104" y="158" text-anchor="middle">Signs up:</text><text x="104" y="176" text-anchor="middle">new account takes all</text><rect class="dg-box" x="216" y="140" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="290" y="158" text-anchor="middle">Signs in, set up:</text><text x="290" y="176" text-anchor="middle">its settings stay</text><rect class="dg-box" x="105.5" y="236" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="190" y="254" text-anchor="middle">Temporary id cleared</text><text x="190" y="272" text-anchor="middle">only once data moved</text><rect class="dg-ex" x="16" y="308" width="348" height="50" rx="8"/><text class="dg-sub" x="28" y="330">1 Oct: answers onboarding, connects a platform,</text><text class="dg-sub" x="28" y="348">creates an account: both are on it.</text></svg>
