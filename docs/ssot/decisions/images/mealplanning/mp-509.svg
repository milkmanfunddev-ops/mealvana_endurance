<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377 370" width="100%" role="img" aria-label="Answers wait under a temporary id">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Answers wait under a temporary id</text><line class="dg-edge" x1="204.5" y1="72" x2="228.5" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="230.8" y1="100" x2="153.3" y2="140" marker-end="url(#dg-arrow)"/><rect x="164.05" y="111" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="192.05" y="124" text-anchor="middle">sign up</text><line class="dg-edge" x1="280.9" y1="100" x2="275.1" y2="140" marker-end="url(#dg-arrow)"/><rect x="250" y="111" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="278" y="124" text-anchor="middle">sign in</text><line class="dg-edge" x1="125.1" y1="196" x2="162.4" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="246.9" y1="196" x2="212.6" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="35.5" y="44" width="169" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="120" y="62" text-anchor="middle">Onboarding answers</text><text x="120" y="80" text-anchor="middle">+ connected platform</text><rect class="dg-box" x="228.5" y="44" width="113" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="285" y="62" text-anchor="middle">Stored under</text><text x="285" y="80" text-anchor="middle">temporary id</text><rect class="dg-box" x="28.5" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="99" y="158" text-anchor="middle">New account:</text><text x="99" y="176" text-anchor="middle">takes everything</text><rect class="dg-box" x="193.5" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="271" y="158" text-anchor="middle">Set-up account:</text><text x="271" y="176" text-anchor="middle">keeps its settings</text><rect class="dg-box" x="104" y="236" width="169" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="188.5" y="254" text-anchor="middle">Temporary id cleared</text><text x="188.5" y="272" text-anchor="middle">only after the move</text><rect class="dg-ex" x="16" y="308" width="345" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Ava answers, connects Garmin, then signs up by email</text><text class="dg-sub" x="28" y="348">Her profile and Garmin link are on the new account</text></svg>
