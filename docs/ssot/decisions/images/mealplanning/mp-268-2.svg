<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 370" width="100%" role="img" aria-label="What we decided: open on the screen underneath">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: open on the screen underneath</text><line class="dg-edge" x1="214.5" y1="100" x2="214.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="214.5" y1="100" x2="214.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="105.5" y="44" width="218" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="214.5" y="62" text-anchor="middle">General conversation opens.</text><text x="214.5" y="80" text-anchor="middle">No example chips</text><rect class="dg-box" x="123" y="140" width="183" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="214.5" y="158" text-anchor="middle">Screen says something:</text><text x="214.5" y="176" text-anchor="middle">&quot;I see you are</text><text x="214.5" y="194" text-anchor="middle">carb loading&quot;</text><rect class="dg-box" x="105.5" y="236" width="218" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="214.5" y="254" text-anchor="middle">Screen says nothing useful:</text><text x="214.5" y="272" text-anchor="middle">the personal Opener</text><rect class="dg-ex" x="16" y="326" width="397" height="32" rx="8"/><text class="dg-sub" x="28" y="348">Offline, rate limit, out of trial: one visible outcome each.</text></svg>
