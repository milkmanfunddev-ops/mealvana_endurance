<text class="dg-title" x="16" y="24">What we decided: Anthropic only</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="156"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">Oct 3, 7pm</text><text class="dg-sub" x="50" y="73">Anthropic has an outage</text><circle cx="30" cy="103" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="108" font-weight="700">7:05pm</text><text class="dg-sub" x="50" y="126">Lee taps send. The call is refused</text><circle cx="30" cy="156" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="161" font-weight="700">7:05pm</text><text class="dg-sub" x="50" y="179">He sees &quot;Vana is unavailable</text><text class="dg-sub" x="50" y="195">right now&quot;; nothing is charged</text></svg>
