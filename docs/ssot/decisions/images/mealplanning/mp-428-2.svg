<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 327 484" width="100%" role="img" aria-label="Fifteen questions, twelve clauses">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Fifteen questions, twelve clauses</text><line class="dg-edge" x1="163.5" y1="82" x2="163.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="150.5" y1="178" x2="110.7" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="174.6" y1="178" x2="208.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="163.5" y1="178" x2="163.5" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="44" y="44" width="239" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="163.5" y="62" text-anchor="middle">15 questions from build agents</text><rect class="dg-box" x="16" y="140" width="295" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="163.5" y="158" text-anchor="middle">12 clauses; tick any you disagree with</text><rect class="dg-box" x="42" y="236" width="99" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="91.5" y="254" text-anchor="middle">No work:</text><text x="91.5" y="272" text-anchor="middle">3, 4, 5, 7</text><rect class="dg-box" x="165" y="236" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="225" y="254" text-anchor="middle">Built, except</text><text x="225" y="272" text-anchor="middle">the move: 1</text><rect class="dg-box" x="72" y="332" width="183" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="163.5" y="350" text-anchor="middle">To build:</text><text x="163.5" y="368" text-anchor="middle">2, 6, 8, 9 (the list),</text><text x="163.5" y="386" text-anchor="middle">10, 11, 12</text><rect class="dg-ex" x="16" y="422" width="295" height="50" rx="8"/><text class="dg-sub" x="28" y="444">Only clause 10, the glass Show more sheet,</text><text class="dg-sub" x="28" y="462">changes what an athlete sees.</text></svg>
