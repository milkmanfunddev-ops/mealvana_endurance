ght="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="287.5" y="350" text-anchor="middle">Old owner closed</text><text x="287.5" y="368" text-anchor="middle">at transfer time</text><rect class="dg-box" x="174.5" y="428" width="106" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="227.5" y="446" text-anchor="middle">New owner&#39;s</text><text x="227.5" y="464" text-anchor="middle">row written</text><rect class="dg-ex" x="16" y="500" width="423" height="68" rx="8"/><text class="dg-sub" x="28" y="522">Sandbox trial starts 2026-09-15 10:00: active_until 09-22, TRIAL</text><text class="dg-sub" x="28" y="540">A renewal dated 09-14 arrives late: ignored</text><text class="dg-sub" x="28" y="558">Signed-in users may select, never insert (42501)</text></svg>
