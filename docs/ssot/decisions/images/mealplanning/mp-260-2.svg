<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 370" width="100%" role="img" aria-label="Each meal slot keeps its colour">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Each meal slot keeps its colour</text><rect class="dg-box" x="50" y="44" width="99" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="99.5" y="62" text-anchor="middle">Breakfast:</text><text x="99.5" y="80" text-anchor="middle">orange</text><rect class="dg-box" x="173" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="243.5" y="62" text-anchor="middle">Lunch:</text><text x="243.5" y="80" text-anchor="middle">electrolyte dark</text><rect class="dg-box" x="69" y="140" width="96" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="117" y="158" text-anchor="middle">Dinner:</text><text x="117" y="176" text-anchor="middle">purple</text><rect class="dg-box" x="189" y="140" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="242" y="158" text-anchor="middle">Snack:</text><text x="242" y="176" text-anchor="middle">dragonfruit</text><rect class="dg-box" x="62.5" y="236" width="239" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="182" y="254" text-anchor="middle">No meal icon is drawn (mp-145)</text><rect class="dg-ex" x="16" y="308" width="332" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Custom widgets: the Plan, Meals, Shopping selector</text><text class="dg-sub" x="28" y="348">and the servings stepper.</text></svg>
