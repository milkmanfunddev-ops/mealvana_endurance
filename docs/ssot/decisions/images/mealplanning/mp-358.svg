<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 562" width="100%" role="img" aria-label="Every plan read takes the period">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Every plan read takes the period</text><line class="dg-edge" x1="302" y1="100" x2="302" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="302" y1="100" x2="302" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="302" y1="196" x2="302" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="302" y1="292" x2="302" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="302" y1="196" x2="302" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="210.5" y="44" width="183" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="302" y="62" text-anchor="middle">Settings</text><text x="302" y="80" text-anchor="middle">starts Monday, 10 days</text><rect class="dg-box" x="207" y="140" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="302" y="158" text-anchor="middle">Which week</text><text x="302" y="176" text-anchor="middle">weekStartFor(date, mon)</text><rect class="dg-box" x="217.5" y="236" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="302" y="254" text-anchor="middle">Which cook days</text><text x="302" y="272" text-anchor="middle">offsets scaled to 10</text><rect class="dg-box" x="200" y="332" width="204" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="302" y="350" text-anchor="middle">Block · opener · coverage</text><text x="302" y="368" text-anchor="middle">in-view section</text><rect class="dg-box" x="221" y="428" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="302" y="446" text-anchor="middle">The period before</text><text x="302" y="464" text-anchor="middle">back 10 days, not 7</text><rect class="dg-ex" x="16" y="500" width="572" height="50" rx="8"/><text class="dg-sub" x="28" y="522">Saturday 2026-09-12, Monday start: week of 09-07, not the Sunday 09-06</text><text class="dg-sub" x="28" y="540">Before the fix: &quot;no plan this week&quot; over a real plan, and a debrief that never found it</text></svg>
