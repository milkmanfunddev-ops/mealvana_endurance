<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 583 236" width="100%" role="img" aria-label="Which plans Previous plans lists">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Which plans Previous plans lists</text><rect class="dg-box" x="16" y="44" width="264" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Other option: every archived plan</text><line x1="28" y1="74" x2="268" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">This week&#39;s confirmed plan</text><text class="dg-sub" x="28" y="109">Plans a later plan replaced</text><text class="dg-sub" x="28" y="126">Drafts another confirm archived</text><text class="dg-sub" x="28" y="143">Every plan archived before 16 Sep</text><rect class="dg-box" x="296" y="44" width="271" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="308" y="66" font-weight="700">This card&#39;s answer: confirmed only</text><line x1="308" y1="74" x2="555" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="308" y="92">This week&#39;s confirmed plan</text><text class="dg-sub" x="308" y="109">Plans a later plan replaced</text><text class="dg-sub" x="308" y="126">Before 16 Sep: only with a</text><text class="dg-sub" x="308" y="143">confirmed list, check-in or debrief</text><rect class="dg-ex" x="16" y="174" width="551" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Each listed plan: open, servings, remove, rename, delete, use again.</text><text class="dg-sub" x="28" y="214">Adding a new meal to an earlier plan is open (mp-681).</text></svg>
