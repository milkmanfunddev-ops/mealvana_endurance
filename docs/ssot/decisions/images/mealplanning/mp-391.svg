<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 559 370" width="100%" role="img" aria-label="Same as last time">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Same as last time</text><line class="dg-edge" x1="279.5" y1="82" x2="279.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="252.4" y1="196" x2="213.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="309.7" y1="196" x2="352.8" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="198.5" y="44" width="162" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="279.5" y="62" text-anchor="middle">Last confirmed plan</text><rect class="dg-box" x="153" y="140" width="253" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="279.5" y="158" text-anchor="middle">Meals copied at</text><text x="279.5" y="176" text-anchor="middle">the servings they were cooked at</text><rect class="dg-box" x="95" y="236" width="183" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="186.5" y="254" text-anchor="middle">Already in the draft?</text><text x="186.5" y="272" text-anchor="middle">skipped, never doubled</text><rect class="dg-box" x="302" y="236" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="383" y="254" text-anchor="middle">Never rescaled</text><text x="383" y="272" text-anchor="middle">no period is stored</text><rect class="dg-ex" x="16" y="308" width="527" height="50" rx="8"/><text class="dg-sub" x="28" y="330">A 7-day plan copied into a 10-day period comes across unscaled, and Vana says so</text><text class="dg-sub" x="28" y="348">A second tap changes nothing (mp-380 would make an honest rescale possible)</text></svg>
