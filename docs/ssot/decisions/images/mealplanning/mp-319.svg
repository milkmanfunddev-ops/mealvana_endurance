<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 421 236" width="100%" role="img" aria-label="Proposed, then rejected: offers by script">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: offers by script</text><rect class="dg-box" x="16" y="44" width="180" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Rejected: two scripts</text><line x1="28" y1="74" x2="184" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Apple script: all</text><text class="dg-sub" x="28" y="109">175 countries, dev only</text><text class="dg-sub" x="28" y="126">Google script: dev only</text><text class="dg-sub" x="28" y="143">Live apps refused</text><rect class="dg-box" x="212" y="44" width="193" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="224" y="66" font-weight="700">Then, and now</text><line x1="224" y1="74" x2="393" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="224" y="92">17 Sep: Lee asks for setup</text><text class="dg-sub" x="224" y="109">in the browser instead</text><text class="dg-sub" x="224" y="126">Later: mp-452 goes back</text><text class="dg-sub" x="224" y="143">to the scripts</text><rect class="dg-ex" x="16" y="174" width="389" height="50" rx="8"/><text class="dg-sub" x="28" y="196">The offer: seven days free on the monthly</text><text class="dg-sub" x="28" y="214">and annual plans, one trial per person</text></svg>
