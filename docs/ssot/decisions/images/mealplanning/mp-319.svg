nds</text><rect class="dg-ex" x="16" y="404" width="358" height="68" rx="8"/><text class="dg-sub" x="28" y="426">mealvana_pro_monthly and _annual: FREE_TRIAL ONE_WEEK</text><text class="dg-sub" x="28" y="444">Play offer free-week, one phase P7D, Mongolia left out</text><text class="dg-sub" x="28" y="462">A new Apple territory means running add-trial again</text></svg>
