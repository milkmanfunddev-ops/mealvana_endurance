<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 484" width="100%" role="img" aria-label="What Vana gets from each entry point">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What Vana gets from each entry point</text><line class="dg-edge" x1="137.8" y1="82" x2="115.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="285.3" y1="82" x2="300.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="115.5" y1="274" x2="115.5" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="295.8" y1="274" x2="299.6" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="81.5" y="44" width="127" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="145" y="62" text-anchor="middle">Events screens</text><rect class="dg-box" x="232.5" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="280.5" y="62" text-anchor="middle">Plan tab</text><rect class="dg-box" x="17" y="140" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="105" y="158" text-anchor="middle">Doll + EVENTS AHEAD</text><text x="105" y="176" text-anchor="middle">(all upcoming events)</text><rect class="dg-box" x="217" y="140" width="176" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="305" y="158" text-anchor="middle">Doll + the day&#39;s plan</text><rect class="dg-box" x="38" y="236" width="155" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="115.5" y="254" text-anchor="middle">Plan tab note card</text><rect class="dg-box" x="217" y="236" width="155" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="294.5" y="254" text-anchor="middle">New meal plan or +</text><rect class="dg-box" x="31" y="332" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="115.5" y="350" text-anchor="middle">The day&#39;s chat,</text><text x="115.5" y="368" text-anchor="middle">same as the launcher</text><rect class="dg-box" x="224" y="332" width="155" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="301.5" y="350" text-anchor="middle">A new chat;</text><text x="301.5" y="368" text-anchor="middle">launcher unchanged</text><rect class="dg-ex" x="16" y="404" width="378" height="68" rx="8"/><text class="dg-sub" x="28" y="426">An athlete on the events screens asks about</text><text class="dg-sub" x="28" y="444">the second race, and Vana knows it.</text><text class="dg-sub" x="28" y="462">Any other screen adds no section; the Doll never changes.</text></svg>
