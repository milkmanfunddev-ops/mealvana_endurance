<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 475" width="100%" role="img" aria-label="What we decided: only jobs nobody reads move">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: only jobs nobody</text><text class="dg-title" x="16" y="44">reads move</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="326"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Chat</text><text class="dg-sub" x="50" y="73">Athlete talks to Vana: Haiku 4.5</text><circle cx="30" cy="103" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="108" font-weight="700">Log a meal</text><text class="dg-sub" x="50" y="126">Athlete describes a meal or sends a photo:</text><text class="dg-sub" x="50" y="142">still Sonnet</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Long chat</text><text class="dg-sub" x="50" y="195">The rolling summary of older messages:</text><text class="dg-sub" x="50" y="211">the cheapest model that matched</text><circle cx="30" cy="241" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="246" font-weight="700">Saved meal</text><text class="dg-sub" x="50" y="264">A saved meal joins the plan. Its</text><text class="dg-sub" x="50" y="280">ingredient list: the cheapest model</text><text class="dg-sub" x="50" y="296">that matched</text><circle cx="30" cy="326" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="331" font-weight="700">Goes idle</text><text class="dg-sub" x="50" y="349">The conversation goes idle. Extraction:</text><text class="dg-sub" x="50" y="365">the cheapest model that matched</text><rect class="dg-ex" x="16" y="393" width="313" height="50" rx="8"/><text class="dg-sub" x="28" y="415">Matched = the same structured answer</text><text class="dg-sub" x="28" y="433">on 20 stored dev conversations, checked by hand</text></g></svg>
