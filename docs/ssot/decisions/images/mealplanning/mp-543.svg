<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 388" width="100%" role="img" aria-label="Prod webhook events, before and after cutover">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Prod webhook events, before and after cutover</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">Today</text><text class="dg-sub" x="50" y="73">purchase, renewal, one-off:</text><text class="dg-sub" x="50" y="89">adds bought credits</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Cutover 6</text><text class="dg-sub" x="50" y="142">deploy new revenuecat-webhook</text><circle cx="30" cy="172" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="177" font-weight="700">Cutover 6b</text><text class="dg-sub" x="50" y="195">switch integration to</text><text class="dg-sub" x="50" y="211">every event type</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">After</text><text class="dg-sub" x="50" y="264">refund ends server AI access</text><text class="dg-sub" x="50" y="280">the same day</text><rect class="dg-ex" x="16" y="308" width="288" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Refund on 10 Oct, paid to 29 Oct</text><text class="dg-sub" x="28" y="348">Without 6b: server answers AI until 29 Oct</text><text class="dg-sub" x="28" y="366">With 6b: refused from 10 Oct</text></svg>
