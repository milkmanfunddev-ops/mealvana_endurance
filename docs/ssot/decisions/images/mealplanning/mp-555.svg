<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 484" width="100%" role="img" aria-label="An old anonymous install signs up">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An old anonymous install signs up</text><line class="dg-edge" x1="160" y1="100" x2="160" y2="140" marker-end="url(#dg-arrow)"/><rect x="125.5" y="111" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="124" text-anchor="middle">any route</text><line class="dg-edge" x1="141" y1="196" x2="114" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="155" y1="260.1" x2="179" y2="258.5" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="219" y1="274" x2="179.2" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="86" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">opens new build</text><text x="160" y="80" text-anchor="middle">anonymous session</text><rect class="dg-box" x="96.5" y="140" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="158" text-anchor="middle">account screen</text><text x="160" y="176" text-anchor="middle">no back button</text><rect class="dg-box" x="35" y="236" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="95" y="254" text-anchor="middle">sign-up links</text><text x="95" y="272" text-anchor="middle">onto old user</text><rect class="dg-box" x="179" y="236" width="106" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="232" y="254" text-anchor="middle">grace claim</text><rect class="dg-box" x="110.5" y="332" width="99" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="350" text-anchor="middle">gate reads</text><text x="160" y="368" text-anchor="middle">the grant</text><rect class="dg-ex" x="16" y="404" width="288" height="68" rx="8"/><text class="dg-sub" x="28" y="426">No server profile, or offline:</text><text class="dg-sub" x="28" y="444">the phone&#39;s profile is kept under the</text><text class="dg-sub" x="28" y="462">same user and queued for upload.</text></svg>
