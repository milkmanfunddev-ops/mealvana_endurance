<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 448" width="100%" role="img" aria-label="The feature list, top to bottom">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The feature list, top to bottom</text><rect class="dg-box" x="20" y="44" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="87" y="62" text-anchor="middle">A fuel plan for</text><text x="87" y="80" text-anchor="middle">every session</text><rect class="dg-box" x="178" y="44" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="245" y="62" text-anchor="middle">Vana, your</text><text x="245" y="80" text-anchor="middle">nutrition coach</text><rect class="dg-box" x="27" y="140" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="90.5" y="158" text-anchor="middle">Shopping lists</text><text x="90.5" y="176" text-anchor="middle">from your plan</text><rect class="dg-box" x="178" y="140" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="241.5" y="158" text-anchor="middle">Your training,</text><text x="241.5" y="176" text-anchor="middle">already there</text><rect class="dg-box" x="46.5" y="236" width="239" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="166" y="254" text-anchor="middle">Also includes: recipes, brick,</text><text x="166" y="272" text-anchor="middle">hydration, formulas, targets</text><rect class="dg-box" x="99" y="332" width="134" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="166" y="350" text-anchor="middle">Not listed:</text><text x="166" y="368" text-anchor="middle">Kroger delivery</text><rect class="dg-ex" x="16" y="404" width="300" height="32" rx="8"/><text class="dg-sub" x="28" y="426">Every AI feature sits under the one Vana line</text></svg>
