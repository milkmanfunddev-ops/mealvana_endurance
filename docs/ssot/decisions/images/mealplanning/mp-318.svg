<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 388" width="100%" role="img" aria-label="What opens the server gate">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What opens the server gate</text><line class="dg-edge" x1="232" y1="72" x2="256" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="213" y1="168" x2="237" y2="168" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="213" y1="264" x2="237" y2="264" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="279.2" y1="236" x2="175.8" y2="100" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="77" y="44" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="154.5" y="62" text-anchor="middle">active_until &gt; now</text><text x="154.5" y="80" text-anchor="middle">from the webhook</text><rect class="dg-box" x="256" y="44" width="96" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="304" y="62" text-anchor="middle">Vana call</text><text x="304" y="80" text-anchor="middle">passes</text><rect class="dg-box" x="65" y="140" width="148" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="139" y="158" text-anchor="middle">users.is_internal</text><text x="139" y="176" text-anchor="middle">(app-written)</text><rect class="dg-box" x="237" y="140" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="300.5" y="158" text-anchor="middle">No longer</text><text x="300.5" y="176" text-anchor="middle">opens the gate</text><rect class="dg-box" x="65" y="236" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="139" y="254" text-anchor="middle">RevenueCat</text><text x="139" y="272" text-anchor="middle">promotional grant</text><rect class="dg-box" x="237" y="236" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="300.5" y="254" text-anchor="middle">Webhook writes</text><text x="300.5" y="272" text-anchor="middle">the row</text><rect class="dg-ex" x="16" y="308" width="397" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Tester marks the device internal: gate still closed</text><text class="dg-sub" x="28" y="348">Promotional grant to 2027-01-01: row lands, gate opens</text><text class="dg-sub" x="28" y="366">Dev Vana functions keep the old gate until their next deploy</text></svg>
