<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359 522" width="100%" role="img" aria-label="This card&#39;s answer: one row per meal">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: one row per meal</text><line class="dg-edge" x1="155.6" y1="100" x2="121.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="204.6" y1="100" x2="240.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="179.5" y1="100" x2="179.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="107.2" y1="214" x2="162.3" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="179.5" y1="406" x2="179.5" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="77.5" y="44" width="204" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="179.5" y="62" text-anchor="middle">A plan meal row</text><text x="179.5" y="80" text-anchor="middle">name, meal type, servings</text><rect class="dg-box" x="16" y="140" width="148" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="90" y="158" text-anchor="middle">Tap: a sheet with</text><text x="90" y="176" text-anchor="middle">servings, Swap,</text><text x="90" y="194" text-anchor="middle">Remove, Ate it</text><rect class="dg-box" x="188" y="140" width="155" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="265.5" y="158" text-anchor="middle">Swipe right:</text><text x="265.5" y="176" text-anchor="middle">removed, with Undo</text><rect class="dg-box" x="98.5" y="236" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="179.5" y="254" text-anchor="middle">Swipe left: swap</text><text x="179.5" y="272" text-anchor="middle">(same plan-meal id)</text><rect class="dg-box" x="63.5" y="332" width="232" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="179.5" y="350" text-anchor="middle">Ate it: waits for the server,</text><text x="179.5" y="368" text-anchor="middle">logs the meal from the plan,</text><text x="179.5" y="386" text-anchor="middle">one serving off</text><rect class="dg-box" x="105.5" y="428" width="148" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="179.5" y="446" text-anchor="middle">No servings left:</text><text x="179.5" y="464" text-anchor="middle">Ate it hides</text></svg>
