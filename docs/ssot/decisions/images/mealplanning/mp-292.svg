<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 489" width="100%" role="img" aria-label="Verbatim to forty, then rolling">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Verbatim to forty, then rolling</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="326"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Messages 1 to 39</text><text class="dg-sub" x="50" y="73">Every message replayed verbatim</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="108" font-weight="700">Message 30</text><text class="dg-sub" x="50" y="126">Summary of the oldest 20 written</text><text class="dg-sub" x="50" y="142">in the background; turn returns first</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Message 40</text><text class="dg-sub" x="50" y="195">Replay is one summary plus the last 20;</text><text class="dg-sub" x="50" y="211">summary stored on the conversation row</text><text class="dg-sub" x="50" y="227">keyed by the message index it covers</text><circle cx="30" cy="257" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="262" font-weight="700">Message 60</text><text class="dg-sub" x="50" y="280">Same again, rolling: one rolled</text><text class="dg-sub" x="50" y="296">summary plus the last 20</text><circle cx="30" cy="326" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="331" font-weight="700">Mid-conversation</text><text class="dg-sub" x="50" y="349">Episode writer and its opening-half</text><text class="dg-sub" x="50" y="365">prompt removed; the end-of-conversation</text><text class="dg-sub" x="50" y="381">episode row stays</text><rect class="dg-ex" x="16" y="409" width="332" height="68" rx="8"/><text class="dg-sub" x="28" y="431">Turn 40 asks about the meal picked in turn 3:</text><text class="dg-sub" x="28" y="449">turn 3 sits in the summary; Vana names the meal.</text><text class="dg-sub" x="28" y="467">Eval: a 45-turn conversation answers about turn 3.</text></svg>
