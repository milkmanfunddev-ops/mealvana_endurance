<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 274" width="100%" role="img" aria-label="Proposed, then rejected: the tester switch">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: the tester</text><text class="dg-title" x="16" y="44">switch</text><g transform="translate(0 20)"><rect class="dg-box" x="16" y="44" width="154" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Proposed</text><line x1="28" y1="74" x2="158" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Late event: ignored</text><text class="dg-sub" x="28" y="109">Seven taps set a</text><text class="dg-sub" x="28" y="126">server flag: Vana</text><text class="dg-sub" x="28" y="143">answers, no purchase</text><rect class="dg-box" x="186" y="44" width="201" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="198" y="66" font-weight="700">Decided (mp-318, mp-503)</text><line x1="198" y1="74" x2="375" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="198" y="92">Every event: ask</text><text class="dg-sub" x="198" y="109">RevenueCat the end date</text><text class="dg-sub" x="198" y="126">Tester subscribes in</text><text class="dg-sub" x="198" y="143">TestFlight, charged $0</text><rect class="dg-ex" x="16" y="174" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="196">A Tester taps the version seven times:</text><text class="dg-sub" x="28" y="214">proposed: Vana answers at once</text><text class="dg-sub" x="28" y="232">decided: Vana answers after a $0 TestFlight purchase</text></g></svg>
