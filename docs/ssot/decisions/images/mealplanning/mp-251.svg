<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 387 580" width="100%" role="img" aria-label="Store events and the tester switch">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Store events and the tester switch</text><line class="dg-edge" x1="167.4" y1="100" x2="130.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="222.7" y1="100" x2="264.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="193.5" y1="100" x2="193.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="265.9" y1="196" x2="131.6" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="167.4" y1="292" x2="130.1" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="130.1" y1="388" x2="167.4" y2="428" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="251.9" y1="388" x2="217.6" y2="428" marker-end="url(#dg-arrow)"/><rect x="206.75" y="399" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="234.75" y="412" text-anchor="middle">testers</text><rect class="dg-box" x="123" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="193.5" y="62" text-anchor="middle">RevenueCat event</text><text x="193.5" y="80" text-anchor="middle">arrives</text><rect class="dg-box" x="16" y="140" width="176" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="104" y="158" text-anchor="middle">Older than stored row</text><text x="104" y="176" text-anchor="middle">acknowledged, ignored</text><rect class="dg-box" x="216" y="140" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="293.5" y="158" text-anchor="middle">Newer: entitlement</text><text x="293.5" y="176" text-anchor="middle">row updated</text><rect class="dg-box" x="126.5" y="236" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="193.5" y="254" text-anchor="middle">Transfer: moves</text><text x="193.5" y="272" text-anchor="middle">between users</text><rect class="dg-box" x="33.5" y="332" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="104" y="350" text-anchor="middle">Entitlement row</text><text x="104" y="368" text-anchor="middle">the real paywall</text><rect class="dg-box" x="198.5" y="332" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="276" y="350" text-anchor="middle">Seven-tap switch</text><text x="276" y="368" text-anchor="middle">sets internal flag</text><rect class="dg-box" x="133.5" y="428" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="193.5" y="446" text-anchor="middle">Tab gate and</text><text x="193.5" y="464" text-anchor="middle">function gate</text><rect class="dg-ex" x="16" y="500" width="355" height="68" rx="8"/><text class="dg-sub" x="28" y="522">A 10:00 renewal arrives after the 10:05 cancel:</text><text class="dg-sub" x="28" y="540">older than the stored row, acknowledged, ignored.</text><text class="dg-sub" x="28" y="558">Tester taps 7 times: flag set, both gates open.</text></svg>
