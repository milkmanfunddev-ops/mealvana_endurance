<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 275" width="100%" role="img" aria-label="If the context were left out and fetched by tool (rejected)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">If the context were left out and fetched by tool (rejected)</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="204"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">3 Oct 07:00</text><text class="dg-sub" x="50" y="73">Athlete opens a planning conversation.</text><text class="dg-sub" x="50" y="89">The prompt carries no context block</text><circle cx="30" cy="119" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="124" font-weight="700">07:01</text><text class="dg-sub" x="50" y="142">Asks for dinners this week.</text><text class="dg-sub" x="50" y="158">Vana knows the athlete only</text><text class="dg-sub" x="50" y="174">if she thinks to call a tool</text><circle cx="30" cy="204" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="209" font-weight="700">07:02</text><text class="dg-sub" x="50" y="227">A reply that skipped the tool</text><text class="dg-sub" x="50" y="243">plans as if for a stranger</text></svg>
