<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 478 237" width="100%" role="img" aria-label="An athlete enters a coach&#39;s Code">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An athlete enters a coach&#39;s Code</text><rect class="dg-box" x="16" y="44" width="222" height="97" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">A: reload their coaches now</text><line x1="28" y1="74" x2="226" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">pairing request made</text><text class="dg-sub" x="28" y="109">coach list reloaded</text><text class="dg-sub" x="28" y="126">pending request shows</text><rect class="dg-box" x="254" y="44" width="208" height="97" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="266" y="66" font-weight="700">B: wait for the next sync</text><line x1="266" y1="74" x2="450" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="266" y="92">pairing request made</text><text class="dg-sub" x="266" y="109">coach list unchanged</text><text class="dg-sub" x="266" y="126">shows after next sync</text><rect class="dg-ex" x="16" y="157" width="446" height="68" rx="8"/><text class="dg-sub" x="28" y="179">&quot;Your coach will see your request to pair.&quot;</text><text class="dg-sub" x="28" y="197">A: the request is in their list at once.</text><text class="dg-sub" x="28" y="215">B: they may enter it again: &quot;already used&quot;.</text></svg>
