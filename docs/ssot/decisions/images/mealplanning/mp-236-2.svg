<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449 388" width="100%" role="img" aria-label="What we decided: the composer&#39;s plus menu">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: the composer&#39;s plus menu</text><line class="dg-edge" x1="207.7" y1="82" x2="156.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="238.3" y1="82" x2="280.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="224.5" y1="82" x2="224.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="140" y="44" width="169" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="224.5" y="62" text-anchor="middle">Plus in the composer</text><rect class="dg-box" x="61" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="131.5" y="158" text-anchor="middle">Snap my fridge:</text><text x="131.5" y="176" text-anchor="middle">no credit charge</text><rect class="dg-box" x="226" y="140" width="162" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="307" y="158" text-anchor="middle">Use what I have:</text><text x="307" y="176" text-anchor="middle">top 8 of the</text><text x="307" y="194" text-anchor="middle">athlete&#39;s own foods</text><rect class="dg-box" x="161" y="236" width="127" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="224.5" y="254" text-anchor="middle">Browse meals:</text><text x="224.5" y="272" text-anchor="middle">a tick adds to</text><text x="224.5" y="290" text-anchor="middle">the Draft</text><rect class="dg-ex" x="16" y="326" width="417" height="50" rx="8"/><text class="dg-sub" x="28" y="348">&quot;Use these&quot; writes pantry items and marks shopping rows as had.</text><text class="dg-sub" x="28" y="366">Web: no camera, no mic.</text></svg>
