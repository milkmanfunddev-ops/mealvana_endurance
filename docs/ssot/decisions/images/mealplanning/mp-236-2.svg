<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 310" width="100%" role="img" aria-label="The plus menu&#39;s four choices">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The plus menu&#39;s four choices</text><rect class="dg-box" x="25.5" y="44" width="162" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="106.5" y="62" text-anchor="middle">Snap my fridge:</text><text x="106.5" y="80" text-anchor="middle">draws its cost from</text><text x="106.5" y="98" text-anchor="middle">the Monthly budget</text><rect class="dg-box" x="211.5" y="44" width="127" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="275" y="62" text-anchor="middle">Choose a photo</text><rect class="dg-box" x="36" y="140" width="141" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="106.5" y="158" text-anchor="middle">Use what I have:</text><text x="106.5" y="176" text-anchor="middle">up to 8 chips of</text><text x="106.5" y="194" text-anchor="middle">their own foods</text><rect class="dg-box" x="201" y="140" width="127" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="264.5" y="158" text-anchor="middle">Browse meals:</text><text x="264.5" y="176" text-anchor="middle">a tick adds it</text><text x="264.5" y="194" text-anchor="middle">to the Draft</text><rect class="dg-ex" x="16" y="230" width="332" height="68" rx="8"/><text class="dg-sub" x="28" y="252">Use what I have: chips from 30 days of logs, saved</text><text class="dg-sub" x="28" y="270">meals and the last plan. &quot;Use these&quot; saves them.</text><text class="dg-sub" x="28" y="288">Web: no camera, no mic.</text></svg>
