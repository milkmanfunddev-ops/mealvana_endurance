ss="dg-box" x="31.5" y="332" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="105.5" y="350" text-anchor="middle">Turn 2 reads</text><text x="105.5" y="368" text-anchor="middle">the cached prefix</text><rect class="dg-box" x="203.5" y="332" width="155" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="281" y="350" text-anchor="middle">Per-message recall</text><text x="281" y="368" text-anchor="middle">stays a tool</text><rect class="dg-box" x="103.5" y="428" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="195" y="446" text-anchor="middle">vana_calls: cache-read</text><text x="195" y="464" text-anchor="middle">tokens beside input</text><rect class="dg-ex" x="16" y="500" width="358" height="68" rx="8"/><text class="dg-sub" x="28" y="522">Dev account, turn 1: cache read 0, full input price.</text><text class="dg-sub" x="28" y="540">Turn 2, no writes: block byte-identical, read above 0.</text><text class="dg-sub" x="28" y="558">Eval case whose second turn reads zero: case fails.</text></svg>
