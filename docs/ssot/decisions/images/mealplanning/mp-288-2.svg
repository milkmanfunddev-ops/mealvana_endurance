<text class="dg-title" x="16" y="24">This card&#39;s answer: a flag on the</text><text class="dg-title" x="16" y="44">chat call</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="225"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Chat</text><text class="dg-sub" x="50" y="73">Athlete plans her week with Vana</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="108" font-weight="700">Close</text><text class="dg-sub" x="50" y="126">She closes the Vana sheet. The flag rides</text><text class="dg-sub" x="50" y="142">the chat call; the sheet closes at once</text><circle cx="30" cy="172" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="177" font-weight="700">Server</text><text class="dg-sub" x="50" y="195">The server writes the Episode</text><circle cx="30" cy="225" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="230" font-weight="700">+1 min</text><text class="dg-sub" x="50" y="248">App goes to the background: second flag.</text><text class="dg-sub" x="50" y="264">Episode already written, nothing more</text></g></svg>
