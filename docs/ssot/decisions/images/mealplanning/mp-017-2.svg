<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 312" width="100%" role="img" aria-label="An older app meets a new part">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An older app meets a new part</text><line class="dg-edge" x1="91.1" y1="82" x2="173.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="191.4" y1="82" x2="198.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="301.3" y1="82" x2="225.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="184.2" y1="178" x2="132.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="214.7" y1="178" x2="256.4" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="64" y="62" text-anchor="middle">Text</text><rect class="dg-box" x="136" y="44" width="106" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="189" y="62" text-anchor="middle">Meal picker</text><rect class="dg-box" x="266" y="44" width="120" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="326" y="62" text-anchor="middle">New part kind</text><rect class="dg-box" x="153" y="140" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201" y="158" text-anchor="middle">Older app</text><rect class="dg-box" x="44.5" y="236" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="108" y="254" text-anchor="middle">Shows the text</text><text x="108" y="272" text-anchor="middle">and the picker</text><rect class="dg-box" x="195.5" y="236" width="162" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="276.5" y="254" text-anchor="middle">Skips the new part.</text><text x="276.5" y="272" text-anchor="middle">No error</text></svg>
