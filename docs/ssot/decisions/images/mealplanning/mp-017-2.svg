<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 312" width="100%" role="img" aria-label="An older app meets a new part">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An older app meets a new part</text><line class="dg-edge" x1="172.5" y1="100" x2="172.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="155.7" y1="178" x2="104.3" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="186.2" y1="178" x2="227.9" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="70.5" y="44" width="204" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="172.5" y="62" text-anchor="middle">A message: text, a picker</text><text x="172.5" y="80" text-anchor="middle">and a part added later</text><rect class="dg-box" x="124.5" y="140" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="172.5" y="158" text-anchor="middle">Older app</text><rect class="dg-box" x="16" y="236" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="79.5" y="254" text-anchor="middle">Shows the text</text><text x="79.5" y="272" text-anchor="middle">and the picker</text><rect class="dg-box" x="167" y="236" width="162" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="248" y="254" text-anchor="middle">Skips the new part.</text><text x="248" y="272" text-anchor="middle">No error</text></svg>
