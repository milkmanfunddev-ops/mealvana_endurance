<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 544" width="100%" role="img" aria-label="A question the records can settle">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A question the records can settle</text><line class="dg-edge" x1="208" y1="100" x2="208" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="191.7" y1="178" x2="141.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="141.1" y1="274" x2="267.5" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="141" y="44" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="208" y="62" text-anchor="middle">&quot;What races are</text><text x="208" y="80" text-anchor="middle">coming up?&quot;</text><rect class="dg-box" x="113" y="140" width="190" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="208" y="158" text-anchor="middle">Vana calls a tool first</text><rect class="dg-box" x="76" y="236" width="99" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="125.5" y="254" text-anchor="middle">Event list</text><rect class="dg-box" x="199" y="236" width="141" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269.5" y="254" text-anchor="middle">Activity history</text><rect class="dg-box" x="148" y="332" width="120" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="208" y="350" text-anchor="middle">Macro targets</text><rect class="dg-box" x="69" y="428" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="139.5" y="446" text-anchor="middle">Food suggestions</text><text x="139.5" y="464" text-anchor="middle">for a session</text><rect class="dg-box" x="234" y="428" width="113" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="290.5" y="446" text-anchor="middle">Answers from</text><text x="290.5" y="464" text-anchor="middle">the record</text><rect class="dg-ex" x="16" y="500" width="384" height="32" rx="8"/><text class="dg-sub" x="28" y="522">She never asks the athlete for what the app already stores</text></svg>
