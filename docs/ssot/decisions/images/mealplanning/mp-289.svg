<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 508" width="100%" role="img" aria-label="One hand run per store, before release">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One hand run per store, before release</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="379"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Seam test</text><text class="dg-sub" x="50" y="73">Fake webhook events: renewal grants,</text><text class="dg-sub" x="50" y="89">stale event ignored, transfer moves row</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Day 1</text><text class="dg-sub" x="50" y="142">Fresh sandbox account subscribes</text><text class="dg-sub" x="50" y="158">through the introductory offer</text><circle cx="30" cy="188" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="193" font-weight="700">Day 1</text><text class="dg-sub" x="50" y="211">Entitlement active, webhook lands</text><text class="dg-sub" x="50" y="227">the Allowance</text><circle cx="30" cy="257" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="262" font-weight="700">Cancel</text><text class="dg-sub" x="50" y="280">Subscription cancelled: account</text><text class="dg-sub" x="50" y="296">meets the paywall</text><circle cx="30" cy="326" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="331" font-weight="700">Restore</text><text class="dg-sub" x="50" y="349">Restore purchases reopens it</text><circle cx="30" cy="379" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="384" font-weight="700">Release</text><text class="dg-sub" x="50" y="402">Written up with the release;</text><text class="dg-sub" x="50" y="418">never a CI step</text><rect class="dg-ex" x="16" y="446" width="371" height="50" rx="8"/><text class="dg-sub" x="28" y="468">Release 1.27.0: one App Store run, one Play run, logged.</text><text class="dg-sub" x="28" y="486">Webhook seam: 3 fake events, green in CI on every push.</text></svg>
