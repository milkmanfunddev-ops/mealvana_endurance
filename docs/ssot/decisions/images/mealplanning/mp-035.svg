<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 373 388" width="100%" role="img" aria-label="Open episode beside the read-back">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Open episode beside the read-back</text><line class="dg-edge" x1="163.5" y1="100" x2="130.5" y2="140" marker-end="url(#dg-arrow)" style="stroke:var(--pending, #D9730A)"/><rect x="106" y="111" width="82" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="147" y="124" text-anchor="middle">if none yet</text><line class="dg-edge" x1="219.8" y1="100" x2="267.4" y2="140" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="222.1" y="111" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="243.6" y="124" text-anchor="middle">never</text><line class="dg-edge" x1="114.9" y1="236" x2="110.6" y2="196" marker-end="url(#dg-arrow)" style="stroke:var(--ok, #2FB9A6)"/><line class="dg-edge" x1="163.9" y1="236" x2="258.9" y2="178" marker-end="url(#dg-arrow)" style="stroke:var(--ok, #2FB9A6)"/><line class="dg-edge" x1="195.5" y1="264" x2="219.5" y2="264" marker-end="url(#dg-arrow)" style="stroke:var(--ok, #2FB9A6)"/><rect class="dg-box" x="116" y="44" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="186.5" y="62" text-anchor="middle">Open episode</text><text x="186.5" y="80" text-anchor="middle">written mid-talk</text><rect class="dg-box" x="16" y="140" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="107.5" y="158" text-anchor="middle">Episode row</text><text x="107.5" y="176" text-anchor="middle">an existing one stands</text><rect class="dg-box" x="223" y="140" width="134" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="290" y="158" text-anchor="middle">Read-back stamp</text><rect class="dg-box" x="40.5" y="236" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="118" y="254" text-anchor="middle">Full read-back</text><text x="118" y="272" text-anchor="middle">when the talk ends</text><rect class="dg-box" x="219.5" y="236" width="113" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="276" y="254" text-anchor="middle">Margin notes</text><text x="276" y="272" text-anchor="middle">still owed</text><rect class="dg-ex" x="16" y="308" width="341" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Message 21: open episode written, stamp untouched.</text><text class="dg-sub" x="28" y="348">Talk ends: read-back keeps that episode,</text><text class="dg-sub" x="28" y="366">writes the margin notes and stamps it read.</text></svg>
