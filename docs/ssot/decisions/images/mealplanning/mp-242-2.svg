<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 371 466" width="100%" role="img" aria-label="What we decided: the Meals tab">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: the Meals tab</text><line class="dg-edge" x1="173.5" y1="63" x2="197.5" y2="63" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="221.8" y1="82" x2="149.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="175" y1="159" x2="199" y2="159" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="77.5" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="125.5" y="62" text-anchor="middle">Recents</text><rect class="dg-box" x="197.5" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="245.5" y="62" text-anchor="middle">My Foods</text><rect class="dg-box" x="76" y="140" width="99" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="125.5" y="158" text-anchor="middle">Assemblies</text><rect class="dg-box" x="199" y="140" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="247" y="158" text-anchor="middle">Recipes</text><rect class="dg-box" x="94" y="236" width="183" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="185.5" y="254" text-anchor="middle">Search: same cards,</text><text x="185.5" y="272" text-anchor="middle">allergens greyed,</text><text x="185.5" y="290" text-anchor="middle">Vana row at the bottom</text><rect class="dg-box" x="97.5" y="332" width="176" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="185.5" y="350" text-anchor="middle">From a plan row only:</text><text x="185.5" y="368" text-anchor="middle">Add and Swap buttons</text><rect class="dg-ex" x="16" y="422" width="339" height="32" rx="8"/><text class="dg-sub" x="28" y="444">Recents: phone logs offline, the server list online</text></svg>
