<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 391" width="100%" role="img" aria-label="What we decided: four rows for looking">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: four rows for looking</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="262"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Row 1: Recents</text><text class="dg-sub" x="50" y="73">The phone&#39;s logs offline, the server&#39;s list online</text><circle cx="30" cy="103" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="108" font-weight="700">Row 2: My Foods</text><text class="dg-sub" x="50" y="126">The athlete&#39;s own saved foods</text><circle cx="30" cy="156" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="161" font-weight="700">Row 3: Assemblies</text><text class="dg-sub" x="50" y="179">Meals put together, not cooked</text><circle cx="30" cy="209" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="214" font-weight="700">Row 4: Recipes</text><text class="dg-sub" x="50" y="232">Meals with method steps</text><circle cx="30" cy="262" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="267" font-weight="700">Search</text><text class="dg-sub" x="50" y="285">Same cards, allergen meals greyed,</text><text class="dg-sub" x="50" y="301">a Vana row at the bottom</text><rect class="dg-ex" x="16" y="329" width="358" height="50" rx="8"/><text class="dg-sub" x="28" y="351">Add and Swap show only when the athlete</text><text class="dg-sub" x="28" y="369">came from a plan row to swap a meal.</text></svg>
