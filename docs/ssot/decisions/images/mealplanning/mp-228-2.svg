<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 271" width="100%" role="img" aria-label="Two recovery openers, one look">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Two recovery openers, one look</text><rect class="dg-box" x="16" y="44" width="186" height="131" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="28" y="66" font-weight="700">Urgent</text><line x1="28" y1="74" x2="190" y2="74" stroke="var(--accent, #F78B14)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Names the next session</text><text class="dg-sub" x="28" y="109">Carbs through the</text><text class="dg-sub" x="28" y="126">next 4 hours</text><text class="dg-sub" x="28" y="143">20 to 30 g protein within</text><text class="dg-sub" x="28" y="160">a couple of hours</text><rect class="dg-box" x="218" y="44" width="206" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="230" y="66" font-weight="700">Relaxed</text><line x1="230" y1="74" x2="412" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="230" y="92">No rush, no deadline</text><text class="dg-sub" x="230" y="109">Next session 8 to 24 h away:</text><text class="dg-sub" x="230" y="126">earlier rather than later</text><text class="dg-sub" x="230" y="143">20 to 30 g protein within</text><text class="dg-sub" x="230" y="160">a couple of hours</text><rect class="dg-ex" x="16" y="191" width="408" height="68" rx="8"/><text class="dg-sub" x="28" y="213">Both: orange launcher, &quot;Recovery fuel?&quot; pill (not yet ruled).</text><text class="dg-sub" x="28" y="231">Relaxed, next session in 12 hours: no rush,</text><text class="dg-sub" x="28" y="249">eat earlier rather than later today.</text></svg>
