<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 426" width="100%" role="img" aria-label="What we decided: two openers, one look">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: two openers, one look</text><line class="dg-edge" x1="160" y1="82" x2="160" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="82" x2="160" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="214" x2="160" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="310" x2="160" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="68.5" y="44" width="183" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">Recovery moment tapped</text><rect class="dg-box" x="68.5" y="140" width="183" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="158" text-anchor="middle">Urgent: names the next</text><text x="160" y="176" text-anchor="middle">session; carbs through</text><text x="160" y="194" text-anchor="middle">the next 4 hours</text><rect class="dg-box" x="51" y="236" width="218" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="254" text-anchor="middle">Relaxed: no rush, no</text><text x="160" y="272" text-anchor="middle">deadline; 8 to 24 h away:</text><text x="160" y="290" text-anchor="middle">&quot;earlier rather than later&quot;</text><rect class="dg-box" x="33.5" y="332" width="253" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="350" text-anchor="middle">Both: 20 to 30 g protein within</text><text x="160" y="368" text-anchor="middle">a couple of hours; orange pill</text><text x="160" y="386" text-anchor="middle">&quot;Recovery fuel?&quot; (not yet ruled)</text></svg>
