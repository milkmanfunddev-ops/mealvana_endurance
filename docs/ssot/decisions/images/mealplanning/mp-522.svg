<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 201" width="100%" role="img" aria-label="Fill in unpriced calls, or not?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Fill in unpriced calls, or not?</text><rect class="dg-box" x="16" y="44" width="251" height="97" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">Keep the count</text><line x1="28" y1="74" x2="255" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">100 calls, 97 priced by the Gateway</text><text class="dg-sub" x="28" y="109">Cost shown for the 97,</text><text class="dg-sub" x="28" y="126">with &quot;97 of 100 priced&quot; beside it</text><rect class="dg-box" x="283" y="44" width="251" height="97" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="295" y="66" font-weight="700">Price the gap</text><line x1="295" y1="74" x2="522" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="295" y="92">100 calls, 97 priced by the Gateway</text><text class="dg-sub" x="295" y="109">3 priced from the budget&#39;s table</text><text class="dg-sub" x="295" y="126">One whole cost, no count</text><rect class="dg-ex" x="16" y="157" width="518" height="32" rx="8"/><text class="dg-sub" x="28" y="179">The weekly view today works as on the left</text></svg>
