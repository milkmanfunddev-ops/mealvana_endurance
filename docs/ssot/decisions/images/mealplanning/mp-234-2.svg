<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 368" width="100%" role="img" aria-label="What we decided: the bar holds the Draft">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: the bar holds the Draft</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">Start</text><text class="dg-sub" x="50" y="73">Bar reads &quot;Your plan · 0 meals&quot;</text><circle cx="30" cy="103" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="108" font-weight="700">Picks 1-2</text><text class="dg-sub" x="50" y="126">Tiles: remove with Undo, a slot chip,</text><text class="dg-sub" x="50" y="142">a servings stepper.</text><text class="dg-sub" x="50" y="158">&quot;Review plan&quot; is the secondary button</text><circle cx="30" cy="188" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="193" font-weight="700">Pick 3</text><text class="dg-sub" x="50" y="211">&quot;Review plan&quot; becomes the main button</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">Review</text><text class="dg-sub" x="50" y="264">Review sheet, grouped by cooking session</text><text class="dg-sub" x="50" y="280">when batch cooking is on.</text><text class="dg-sub" x="50" y="296">Confirm is here and only here</text><rect class="dg-ex" x="16" y="324" width="391" height="32" rx="8"/><text class="dg-sub" x="28" y="346">The bar never touches the plan already active on the phone.</text></svg>
