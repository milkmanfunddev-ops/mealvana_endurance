<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 239" width="100%" role="img" aria-label="Do the store products offer the free week?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Do the store products offer the free</text><text class="dg-title" x="16" y="44">week?</text><g transform="translate(0 20)"><rect class="dg-box" x="16" y="44" width="161" height="97" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="28" y="66" font-weight="700">Offer set up</text><line x1="28" y1="74" x2="165" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Plan cards show the</text><text class="dg-sub" x="28" y="109">trial note and the</text><text class="dg-sub" x="28" y="126">price after the trial</text><rect class="dg-box" x="193" y="44" width="187" height="97" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="205" y="66" font-weight="700">No offer (seen on dev)</text><line x1="205" y1="74" x2="368" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="205" y="92">Plan cards show</text><text class="dg-sub" x="205" y="109">the price only</text><text class="dg-sub" x="205" y="126">No trial terms</text><rect class="dg-ex" x="16" y="157" width="364" height="50" rx="8"/><text class="dg-sub" x="28" y="179">Dev simulator, new account: no trial note shown.</text><text class="dg-sub" x="28" y="197">Prod paywall goes to Apple review on 25 September.</text></g></svg>
