<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 580" width="100%" role="img" aria-label="Season and budget, no deals">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Season and budget, no deals</text><line class="dg-edge" x1="100.4" y1="100" x2="131.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="281.9" y1="100" x2="274.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="208" y1="196" x2="208" y2="332" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="173.5" y="255" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="208" y="268" text-anchor="middle">not built</text><line class="dg-edge" x1="143.1" y1="274" x2="200.9" y2="428" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="266.6" y1="274" x2="214.4" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="30.5" y="44" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="94" y="62" text-anchor="middle">Month</text><text x="94" y="80" text-anchor="middle">(static table)</text><rect class="dg-box" x="181.5" y="44" width="204" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="283.5" y="62" text-anchor="middle">Athlete once said</text><text x="283.5" y="80" text-anchor="middle">&#39;keep it under N dollars&#39;</text><rect class="dg-box" x="148" y="140" width="120" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="208" y="158" text-anchor="middle">Pricing data</text><text x="208" y="176" text-anchor="middle">(none exists)</text><rect class="dg-box" x="83" y="236" width="106" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="136" y="254" text-anchor="middle">SEASON line</text><rect class="dg-box" x="213" y="236" width="120" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="273" y="254" text-anchor="middle">BUDGET clause</text><rect class="dg-box" x="130.5" y="332" width="155" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="208" y="350" text-anchor="middle">Deals, coupons,</text><text x="208" y="368" text-anchor="middle">list cost estimate</text><rect class="dg-box" x="144.5" y="428" width="127" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="208" y="446" text-anchor="middle">Vana&#39;s context</text><rect class="dg-ex" x="16" y="500" width="384" height="68" rx="8"/><text class="dg-sub" x="28" y="522">14 Sep: the month table gives SEASON for September.</text><text class="dg-sub" x="28" y="540">Dana said &#39;keep it under 80 dollars&#39; in August: BUDGET 80.</text><text class="dg-sub" x="28" y="558">No coupon step, no price on the shopping list.</text></svg>
