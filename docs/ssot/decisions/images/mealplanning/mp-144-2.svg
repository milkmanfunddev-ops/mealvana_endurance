<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377 310" width="100%" role="img" aria-label="What we decided: one vote, two effects">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: one vote, two effects</text><line class="dg-edge" x1="124.2" y1="82" x2="110.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="258.6" y1="82" x2="274" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="75.5" y="44" width="106" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="128.5" y="62" text-anchor="middle">Thumbs down</text><rect class="dg-box" x="205.5" y="44" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="253.5" y="62" text-anchor="middle">Thumbs up</text><rect class="dg-box" x="21.5" y="140" width="162" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="102.5" y="158" text-anchor="middle">Out of Vana&#39;s</text><text x="102.5" y="176" text-anchor="middle">suggestions, still</text><text x="102.5" y="194" text-anchor="middle">there when browsing</text><rect class="dg-box" x="207.5" y="140" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="281.5" y="158" text-anchor="middle">A little higher</text><text x="281.5" y="176" text-anchor="middle">in search (+0.10)</text><rect class="dg-ex" x="16" y="230" width="345" height="68" rx="8"/><text class="dg-sub" x="28" y="252">One vote per person per meal.</text><text class="dg-sub" x="28" y="270">Tap the same thumb again and the vote clears.</text><text class="dg-sub" x="28" y="288">Admins also get a review box; athletes never see it.</text></svg>
