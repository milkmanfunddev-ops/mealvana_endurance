<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 236" width="100%" role="img" aria-label="Is the webhook&#39;s event list part of the no-phone gate?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Is the webhook&#39;s event list part of the no-phone gate?</text><rect class="dg-box" x="16" y="44" width="264" height="114" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: mp-463&#39;s list only</text><line x1="28" y1="74" x2="268" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Products, prices, free weeks,</text><text class="dg-sub" x="28" y="109">offerings, a granted account, its row</text><text class="dg-sub" x="28" y="126">Webhook left to the cutover runbook</text><text class="dg-sub" x="28" y="143">Log GREEN on 24 Sep</text><rect class="dg-box" x="296" y="44" width="257" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="308" y="66" font-weight="700">This card&#39;s answer: check C7 too</text><line x1="308" y1="74" x2="541" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="308" y="92">Both webhooks must hear every</text><text class="dg-sub" x="308" y="109">lifecycle event, no env filter</text><text class="dg-sub" x="308" y="126">Prod heard 3 event types</text><text class="dg-sub" x="308" y="143">Log RED on 24 Sep</text><rect class="dg-ex" x="16" y="174" width="537" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Prod webhook on 24 Sep: initial purchase, renewal, non-renewing purchase.</text><text class="dg-sub" x="28" y="214">An App Store cancellation would never reach the prod server.</text></svg>
