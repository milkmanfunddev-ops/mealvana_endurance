<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 455" width="100%" role="img" aria-label="What we decided: how a plan is shaped">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: how a plan is shaped</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="326"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="55" font-weight="700">Meal types</text><text class="dg-sub" x="50" y="73">The athlete picks which ones.</text><text class="dg-sub" x="50" y="89">This one: lunches and dinners only</text><circle cx="30" cy="119" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="124" font-weight="700">Plan period</text><text class="dg-sub" x="50" y="142">A week, the default.</text><text class="dg-sub" x="50" y="158">The athlete can change it</text><circle cx="30" cy="188" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="193" font-weight="700">Suggestions</text><text class="dg-sub" x="50" y="211">Meals they liked or</text><text class="dg-sub" x="50" y="227">already cooked come first</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">Batch cooking on</text><text class="dg-sub" x="50" y="280">A few meals cooked at one sitting,</text><text class="dg-sub" x="50" y="296">scaled to last the week</text><circle cx="30" cy="326" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="331" font-weight="700">Plan bar</text><text class="dg-sub" x="50" y="349">Counts servings against the week,</text><text class="dg-sub" x="50" y="365">not against 14 fixed slots</text><rect class="dg-ex" x="16" y="393" width="371" height="50" rx="8"/><text class="dg-sub" x="28" y="415">Batch cooking off: planned day by day.</text><text class="dg-sub" x="28" y="433">&quot;Draft it for me&quot;: fixed rules pick, Vana only presents.</text></svg>
