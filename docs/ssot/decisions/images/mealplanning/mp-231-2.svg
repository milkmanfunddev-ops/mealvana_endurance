<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481 484" width="100%" role="img" aria-label="What we decided: how a cooking period fills up">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: how a cooking period fills up</text><line class="dg-edge" x1="206" y1="118" x2="185.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="286" y1="118" x2="313.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="189.1" y1="214" x2="211.7" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="331.9" y1="196" x2="256.1" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="138.5" y="44" width="204" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="240.5" y="62" text-anchor="middle">Cooking period:</text><text x="240.5" y="80" text-anchor="middle">a week unless the athlete</text><text x="240.5" y="98" text-anchor="middle">changes it</text><rect class="dg-box" x="56" y="140" width="190" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="151" y="158" text-anchor="middle">Batch cooking on:</text><text x="151" y="176" text-anchor="middle">servings scale to cover</text><text x="151" y="194" text-anchor="middle">the period</text><rect class="dg-box" x="270" y="140" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="347.5" y="158" text-anchor="middle">Batch cooking off:</text><text x="347.5" y="176" text-anchor="middle">planned day by day</text><rect class="dg-box" x="142" y="236" width="197" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="240.5" y="254" text-anchor="middle">Plan bar counts servings</text><text x="240.5" y="272" text-anchor="middle">against the period</text><rect class="dg-box" x="135" y="332" width="211" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="240.5" y="350" text-anchor="middle">Walk, coverage and review</text><text x="240.5" y="368" text-anchor="middle">follow the day-by-day mode</text><rect class="dg-ex" x="16" y="422" width="449" height="50" rx="8"/><text class="dg-sub" x="28" y="444">Only the meal types the athlete plans are walked, in no fixed order.</text><text class="dg-sub" x="28" y="462">Liked or already cooked meals are suggested first.</text></svg>
