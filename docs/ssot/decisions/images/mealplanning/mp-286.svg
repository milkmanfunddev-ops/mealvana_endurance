<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 466" width="100%" role="img" aria-label="Coaches walk through the same gate">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Coaches walk through the same gate</text><line class="dg-edge" x1="153.4" y1="82" x2="199" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="282.8" y1="82" x2="241.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="269.5" y1="292" x2="241" y2="332" marker-end="url(#dg-arrow)"/><rect x="211.25" y="303" width="88" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="255.25" y="316" text-anchor="middle">new proposal</text><line class="dg-edge" x1="221" y1="332" x2="221" y2="196" marker-end="url(#dg-arrow)"/><rect x="170.5" y="255" width="101" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="221" y="268" text-anchor="middle">gate unchanged</text><rect class="dg-box" x="75" y="44" width="127" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="138.5" y="62" text-anchor="middle">Coach signs in</text><rect class="dg-box" x="226" y="44" width="141" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="296.5" y="62" text-anchor="middle">Athlete signs in</text><rect class="dg-box" x="136.5" y="140" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="221" y="158" text-anchor="middle">One gate, one trial,</text><text x="221" y="176" text-anchor="middle">one subscription</text><rect class="dg-box" x="89" y="236" width="113" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="145.5" y="254" text-anchor="middle">Coach branch</text><text x="145.5" y="272" text-anchor="middle">in the code</text><rect class="dg-box" x="226" y="236" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="289.5" y="254" text-anchor="middle">Xuan&#39;s paywall</text><text x="289.5" y="272" text-anchor="middle">document</text><rect class="dg-box" x="126" y="332" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="221" y="350" text-anchor="middle">Later: RevenueCat grant</text><text x="221" y="368" text-anchor="middle">on the coach role</text><rect class="dg-ex" x="16" y="404" width="410" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Coach Dana signs up 1 Sep, buys nothing: locked on 8 Sep.</text><text class="dg-sub" x="28" y="444">Coach rule arrives: a grant on her role, nothing else changes.</text></svg>
