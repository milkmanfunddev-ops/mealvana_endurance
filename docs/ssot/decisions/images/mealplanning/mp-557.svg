<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 484" width="100%" role="img" aria-label="A lapsed account&#39;s AI taps">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A lapsed account&#39;s AI taps</text><line class="dg-edge" x1="160" y1="100" x2="160" y2="236" marker-end="url(#dg-arrow)"/><rect x="135.5" y="159" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="172" text-anchor="middle">router</text><line class="dg-edge" x1="160" y1="196" x2="160" y2="236" marker-end="url(#dg-arrow)"/><rect x="138.5" y="207" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="220" text-anchor="middle">guard</text><rect class="dg-box" x="75.5" y="44" width="169" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">routes: Vana, Jade,</text><text x="160" y="80" text-anchor="middle">meal photo, describe</text><rect class="dg-box" x="65" y="140" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="158" text-anchor="middle">buttons: Analyze,</text><text x="160" y="176" text-anchor="middle">photo re-scan, launcher</text><rect class="dg-box" x="112" y="236" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="254" text-anchor="middle">paywall</text><rect class="dg-box" x="79" y="332" width="162" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="160" y="350" text-anchor="middle">buy credits, Vana</text><text x="160" y="368" text-anchor="middle">settings: stay open</text><rect class="dg-ex" x="16" y="404" width="288" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Lapsed taps Analyze on &#39;porridge&#39;:</text><text class="dg-sub" x="28" y="444">the paywall opens over log-meal,</text><text class="dg-sub" x="28" y="462">describe-meal is never called.</text></svg>
