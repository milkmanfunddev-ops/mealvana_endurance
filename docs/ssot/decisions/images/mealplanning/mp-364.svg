<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 466" width="100%" role="img" aria-label="What the opener speaks to">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the opener speaks to</text><line class="dg-edge" x1="260" y1="82" x2="260" y2="140" marker-end="url(#dg-arrow)"/><rect x="245" y="102" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="260" y="115" text-anchor="middle">yes</text><line class="dg-edge" x1="260" y1="82" x2="260" y2="236" marker-end="url(#dg-arrow)"/><rect x="248.5" y="150" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="260" y="163" text-anchor="middle">no</text><line class="dg-edge" x1="234.6" y1="292" x2="198.3" y2="332" marker-end="url(#dg-arrow)"/><rect x="188.45" y="303" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="216.45" y="316" text-anchor="middle">differs</text><line class="dg-edge" x1="296.7" y1="292" x2="349.1" y2="332" marker-end="url(#dg-arrow)"/><rect x="304.9" y="303" width="36" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="322.9" y="316" text-anchor="middle">same</text><rect class="dg-box" x="165" y="44" width="190" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="260" y="62" text-anchor="middle">A moment that resolves?</text><rect class="dg-box" x="182.5" y="140" width="155" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="260" y="158" text-anchor="middle">Open on the moment</text><rect class="dg-box" x="144" y="236" width="232" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="260" y="254" text-anchor="middle">Screen names a thing?</text><text x="260" y="272" text-anchor="middle">resolve with id, then without</text><rect class="dg-box" x="79" y="332" width="204" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="181" y="350" text-anchor="middle">Open on what is on screen</text><rect class="dg-box" x="307" y="332" width="134" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="374" y="350" text-anchor="middle">Personal opener</text><rect class="dg-ex" x="16" y="404" width="488" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Event screen: the race 8 days out, no greeting, two quick replies</text><text class="dg-sub" x="28" y="444">Settings, or someone else&#39;s id: the personal opener about today&#39;s fuelling</text></svg>
