<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 279" width="100%" role="img" aria-label="If votes were copied to a new table (rejected)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">If votes were copied to a new</text><text class="dg-title" x="16" y="44">table (rejected)</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">2 Oct</text><text class="dg-sub" x="50" y="73">Athlete gives the salmon bowl</text><text class="dg-sub" x="50" y="89">a thumbs down</text><circle cx="30" cy="119" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="124" font-weight="700">2 Oct</text><text class="dg-sub" x="50" y="142">Written twice: meal feedback and a</text><text class="dg-sub" x="50" y="158">new meal preferences table</text><circle cx="30" cy="188" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="193" font-weight="700">Later</text><text class="dg-sub" x="50" y="211">The copies drift: search and Vana</text><text class="dg-sub" x="50" y="227">can disagree about the salmon bowl</text></g></svg>
