<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 388" width="100%" role="img" aria-label="Where a meal vote lives">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where a meal vote lives</text><line class="dg-edge" x1="171.9" y1="100" x2="136.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="228.2" y1="100" x2="272.8" y2="140" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="229" y="111" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="250.5" y="124" text-anchor="middle">never</text><line class="dg-edge" x1="136.1" y1="196" x2="171.9" y2="236" marker-end="url(#dg-arrow)"/><rect x="106.5" y="207" width="95" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="154" y="220" text-anchor="middle">read in place</text><rect class="dg-box" x="123" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="197" y="62" text-anchor="middle">Thumbs up or down</text><text x="197" y="80" text-anchor="middle">on a meal</text><rect class="dg-box" x="16" y="140" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="111" y="158" text-anchor="middle">Meal feedback table</text><text x="111" y="176" text-anchor="middle">(already drives search)</text><rect class="dg-box" x="230" y="140" width="148" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="304" y="158" text-anchor="middle">New meal</text><text x="304" y="176" text-anchor="middle">preferences table</text><rect class="dg-box" x="109" y="236" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="197" y="254" text-anchor="middle">LIKES line in context</text><text x="197" y="272" text-anchor="middle">read every turn</text><rect class="dg-ex" x="16" y="308" width="362" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Dana: thumbs up salmon bowl, thumbs down oats, 12 Sep.</text><text class="dg-sub" x="28" y="348">Next turn&#39;s context: LIKES salmon bowl, not oats.</text><text class="dg-sub" x="28" y="366">Formula Kit&#39;s product preferences are untouched.</text></svg>
