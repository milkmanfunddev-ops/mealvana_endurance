<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 388" width="100%" role="img" aria-label="What the open episode reads">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the open episode reads</text><line class="dg-edge" x1="173.4" y1="100" x2="137.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="222.6" y1="100" x2="256.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="117.6" y1="196" x2="124.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="204" y1="264" x2="228" y2="264" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="110.5" y="44" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="62" text-anchor="middle">Transcript at the cap</text><text x="198.5" y="80" text-anchor="middle">20 messages</text><rect class="dg-box" x="42" y="140" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="112.5" y="158" text-anchor="middle">Messages 1 to 10</text><text x="112.5" y="176" text-anchor="middle">the opening half</text><rect class="dg-box" x="207" y="140" width="148" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="281" y="158" text-anchor="middle">Messages 11 to 20</text><text x="281" y="176" text-anchor="middle">the recent half</text><rect class="dg-box" x="56" y="236" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="130" y="254" text-anchor="middle">Prompt asks for</text><text x="130" y="272" text-anchor="middle">names and numbers</text><rect class="dg-box" x="228" y="236" width="113" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="284.5" y="254" text-anchor="middle">One-sentence</text><text x="284.5" y="272" text-anchor="middle">episode</text><rect class="dg-ex" x="16" y="308" width="365" height="68" rx="8"/><text class="dg-sub" x="28" y="330">20 messages: the episode reads messages 1 to 10.</text><text class="dg-sub" x="28" y="348">Whole transcript: recent topics, opening gone (failed).</text><text class="dg-sub" x="28" y="366">Past about 40 messages the front is lost again.</text></svg>
