<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449 484" width="100%" role="img" aria-label="What we decided: a picker and its chips">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: a picker and its chips</text><line class="dg-edge" x1="224.5" y1="82" x2="224.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="224.5" y1="82" x2="224.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="219.2" y1="82" x2="148.9" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="230" y1="82" x2="302.4" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="119" y="44" width="211" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="224.5" y="62" text-anchor="middle">Vana&#39;s turn shows a picker</text><rect class="dg-box" x="115.5" y="140" width="218" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="224.5" y="158" text-anchor="middle">Tap a meal:</text><text x="224.5" y="176" text-anchor="middle">detail opens, nothing added</text><rect class="dg-box" x="143.5" y="236" width="162" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="224.5" y="254" text-anchor="middle">Tick a meal:</text><text x="224.5" y="272" text-anchor="middle">it joins the Draft,</text><text x="224.5" y="290" text-anchor="middle">swap circle appears</text><rect class="dg-box" x="64.5" y="332" width="148" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="138.5" y="350" text-anchor="middle">Turn names chips:</text><text x="138.5" y="368" text-anchor="middle">Vana&#39;s words in</text><text x="138.5" y="386" text-anchor="middle">the app&#39;s buttons</text><rect class="dg-box" x="236.5" y="332" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="310.5" y="350" text-anchor="middle">Turn names none:</text><text x="310.5" y="368" text-anchor="middle">the app&#39;s own set</text><rect class="dg-ex" x="16" y="422" width="417" height="50" rx="8"/><text class="dg-sub" x="28" y="444">App&#39;s set: I like these, Next: &lt;type&gt; or That&#39;s my week,</text><text class="dg-sub" x="28" y="462">Other options, Something else…. Tapping a chip sends its label.</text></svg>
