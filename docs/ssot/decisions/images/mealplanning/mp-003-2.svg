<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 328" width="100%" role="img" aria-label="What we decided: a tag on each conversation">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: a tag on each conversation</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="257"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="55" font-weight="700">Mon</text><text class="dg-sub" x="50" y="73">Athlete taps New meal plan.</text><text class="dg-sub" x="50" y="89">New conversation, tagged meal-planning</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Wed</text><text class="dg-sub" x="50" y="142">Athlete asks a question from a button.</text><text class="dg-sub" x="50" y="158">New conversation, tagged general;</text><text class="dg-sub" x="50" y="174">Monday&#39;s is not continued</text><circle cx="30" cy="204" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="209" font-weight="700">Wed</text><text class="dg-sub" x="50" y="227">The opener reads the tag: general</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">Later</text><text class="dg-sub" x="50" y="280">History lists both. The athlete</text><text class="dg-sub" x="50" y="296">can go back to Monday&#39;s plan</text></svg>
