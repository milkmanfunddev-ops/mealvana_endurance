<text class="dg-title" x="16" y="24">Ticket 14: opening on our app</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="172"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="55" font-weight="700">0 s</text><text class="dg-sub" x="50" y="73">The app plays silently in a phone frame:</text><text class="dg-sub" x="50" y="89">timeline, Vana, meal plan</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">About 4 s</text><text class="dg-sub" x="50" y="142">Slides over to four headline features</text><circle cx="30" cy="172" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="177" font-weight="700">Scrolling on</text><text class="dg-sub" x="50" y="195">&quot;Also includes&quot; and the rest;</text><text class="dg-sub" x="50" y="211">AI features under one Vana line</text><rect class="dg-ex" x="16" y="239" width="294" height="50" rx="8"/><text class="dg-sub" x="28" y="261">Reduce Motion on: the clip&#39;s first frame,</text><text class="dg-sub" x="28" y="279">then straight to the features.</text></svg>
