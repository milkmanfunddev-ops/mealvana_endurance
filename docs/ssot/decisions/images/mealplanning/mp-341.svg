<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 462 466" width="100%" role="img" aria-label="Grant, spend, forfeit">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Grant, spend, forfeit</text><line class="dg-edge" x1="205" y1="72" x2="229" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="289.4" y1="100" x2="255.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="231" y1="236" x2="231" y2="196" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="222.5" y1="360" x2="246.5" y2="360" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="64" y="44" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="134.5" y="62" text-anchor="middle">INITIAL_PURCHASE</text><text x="134.5" y="80" text-anchor="middle">or RENEWAL</text><rect class="dg-box" x="229" y="44" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="313.5" y="62" text-anchor="middle">grant_allowance 300</text><text x="313.5" y="80" text-anchor="middle">window to period end</text><rect class="dg-box" x="122" y="140" width="218" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="231" y="158" text-anchor="middle">Debiting call</text><text x="231" y="176" text-anchor="middle">allowance first, then packs</text><rect class="dg-box" x="69.5" y="236" width="323" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="231" y="254" text-anchor="middle">ensure_allowance before it:</text><text x="231" y="272" text-anchor="middle">expired? forfeit; active, no window? grant</text><rect class="dg-box" x="67.5" y="332" width="155" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="145" y="350" text-anchor="middle">EXPIRATION</text><text x="145" y="368" text-anchor="middle">(not CANCELLATION)</text><rect class="dg-box" x="246.5" y="332" width="148" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="320.5" y="350" text-anchor="middle">forfeit_allowance</text><text x="320.5" y="368" text-anchor="middle">packs untouched</text><rect class="dg-ex" x="16" y="404" width="430" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Annual plan: the roll grants a new window on each anniversary day</text><text class="dg-sub" x="28" y="444">Trial cancelled on day 3: access to day 7, forfeit at expiry</text></svg>
