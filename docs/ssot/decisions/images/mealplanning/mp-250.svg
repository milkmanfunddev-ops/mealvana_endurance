<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 256" width="100%" role="img" aria-label="Proposed, then rejected: ship it hidden">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: ship it</text><text class="dg-title" x="16" y="44">hidden</text><g transform="translate(0 20)"><rect class="dg-box" x="16" y="44" width="180" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Proposed: ship hidden</text><line x1="28" y1="74" x2="184" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Live app, no Food tab</text><text class="dg-sub" x="28" y="109">Pro screen, no Buy</text><text class="dg-sub" x="28" y="126">Team switches it</text><text class="dg-sub" x="28" y="143">on later</text><rect class="dg-box" x="212" y="44" width="154" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="224" y="66" font-weight="700">Decided (mp-270)</text><line x1="224" y1="74" x2="354" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="224" y="92">Nothing ships hidden</text><text class="dg-sub" x="224" y="109">Trial and purchase</text><text class="dg-sub" x="224" y="126">go live first</text><text class="dg-sub" x="224" y="143">Then meal planning</text><rect class="dg-ex" x="16" y="174" width="350" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Paywall and trial live 1 October:</text><text class="dg-sub" x="28" y="214">meal planning cannot reach the live app before then</text></g></svg>
