<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 484" width="100%" role="img" aria-label="Where home lives and who reads it">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where home lives and who reads it</text><line class="dg-edge" x1="173.4" y1="100" x2="137.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="119.6" y1="196" x2="129.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="243.5" y1="178" x2="171.7" y2="236" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="186.1" y="198" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="207.6" y="211" text-anchor="middle">never</text><line class="dg-edge" x1="154.9" y1="292" x2="180.6" y2="332" marker-end="url(#dg-arrow)"/><rect x="152.75" y="303" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="167.75" y="316" text-anchor="middle">set</text><line class="dg-edge" x1="271.8" y1="274" x2="222.4" y2="332" marker-end="url(#dg-arrow)"/><rect x="212.60000000000002" y="294" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="247.10000000000002" y="307" text-anchor="middle">home null</text><rect class="dg-box" x="121" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="62" text-anchor="middle">Athlete tells Vana</text><text x="198.5" y="80" text-anchor="middle">where home is</text><rect class="dg-box" x="56" y="140" width="113" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="112.5" y="158" text-anchor="middle">Profile tool</text><text x="112.5" y="176" text-anchor="middle">geocodes it</text><rect class="dg-box" x="193" y="140" width="148" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="267" y="158" text-anchor="middle">A settings screen</text><rect class="dg-box" x="59.5" y="236" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="137" y="254" text-anchor="middle">User record: city,</text><text x="137" y="272" text-anchor="middle">lat, lon, timezone</text><rect class="dg-box" x="238.5" y="236" width="99" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="288" y="254" text-anchor="middle">Race venue</text><rect class="dg-box" x="131.5" y="332" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="350" text-anchor="middle">Weather and</text><text x="198.5" y="368" text-anchor="middle">Kroger coverage</text><rect class="dg-ex" x="16" y="404" width="365" height="68" rx="8"/><text class="dg-sub" x="28" y="426">&#39;I live in Birmingham&#39; sets city, 33.52, -86.81, tz.</text><text class="dg-sub" x="28" y="444">Weather and Kroger read Birmingham, not the race venue.</text><text class="dg-sub" x="28" y="462">Device schema version 21 adds the four columns.</text></svg>
