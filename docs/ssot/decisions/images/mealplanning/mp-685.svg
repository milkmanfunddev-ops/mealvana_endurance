<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 218" width="100%" role="img" aria-label="A giveaway that allows 1 redemption">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A giveaway that allows 1 redemption</text><rect class="dg-box" x="16" y="44" width="292" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Other option: delete with the account</text><line x1="28" y1="74" x2="296" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Athlete redeems the giveaway</text><text class="dg-sub" x="28" y="109">Deletes the account: row goes</text><text class="dg-sub" x="28" y="126">Signs up again</text><text class="dg-sub" x="28" y="143">Giveaway works a second time</text><rect class="dg-box" x="324" y="44" width="292" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="336" y="66" font-weight="700">This card&#39;s answer: row kept, no user</text><line x1="336" y1="74" x2="604" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="336" y="92">Athlete redeems the giveaway</text><text class="dg-sub" x="336" y="109">Deletes the account: row stays</text><text class="dg-sub" x="336" y="126">Signs up again</text><text class="dg-sub" x="336" y="143">Told the giveaway is used</text><rect class="dg-ex" x="16" y="174" width="600" height="32" rx="8"/><text class="dg-sub" x="28" y="196">A coach&#39;s own Codes still go when the coach is deleted.</text></svg>
