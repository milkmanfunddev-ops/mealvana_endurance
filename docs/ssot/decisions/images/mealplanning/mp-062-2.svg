<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 388" width="100%" role="img" aria-label="What we decided: four ways out, one motion">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: four ways out, one motion</text><line class="dg-edge" x1="97.7" y1="82" x2="147.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="222.3" y1="82" x2="172.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="102.9" y1="178" x2="137.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="225.8" y1="178" x2="185.6" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="35" y="44" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="91.5" y="62" text-anchor="middle">Drag grabber</text><rect class="dg-box" x="172" y="44" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="228.5" y="62" text-anchor="middle">Close button</text><rect class="dg-box" x="24.5" y="140" width="134" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="91.5" y="158" text-anchor="middle">Tap dimmed area</text><rect class="dg-box" x="182.5" y="140" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="239" y="158" text-anchor="middle">Back gesture</text><rect class="dg-box" x="72" y="236" width="176" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="254" text-anchor="middle">Sheet shrinks into</text><text x="160" y="272" text-anchor="middle">the launcher&#39;s centre</text><text x="160" y="290" text-anchor="middle">about 470 ms</text><rect class="dg-ex" x="16" y="326" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="348">Opening is the reverse rise: 360 ms.</text><text class="dg-sub" x="28" y="366">The sheet never slides off the screen.</text></svg>
