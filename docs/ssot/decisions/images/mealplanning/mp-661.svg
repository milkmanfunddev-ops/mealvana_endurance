<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507 370" width="100%" role="img" aria-label="Does a used code stay used after account delete?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Does a used code stay used after account delete?</text><line class="dg-edge" x1="253.5" y1="100" x2="253.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="234.1" y1="178" x2="175" y2="236" marker-end="url(#dg-arrow)"/><rect x="196.05" y="198" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="204.55" y="211" text-anchor="middle">A</text><line class="dg-edge" x1="270.3" y1="178" x2="321.7" y2="236" marker-end="url(#dg-arrow)"/><rect x="287.5" y="198" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="296" y="211" text-anchor="middle">B</text><rect class="dg-box" x="162" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="253.5" y="62" text-anchor="middle">Athlete redeems a code</text><text x="253.5" y="80" text-anchor="middle">1 code_redemptions row</text><rect class="dg-box" x="144.5" y="140" width="218" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="253.5" y="158" text-anchor="middle">Athlete deletes the account</text><rect class="dg-box" x="65.5" y="236" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="146.5" y="254" text-anchor="middle">A: redemption kept,</text><text x="146.5" y="272" text-anchor="middle">code stays spent</text><rect class="dg-box" x="251.5" y="236" width="190" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="346.5" y="254" text-anchor="middle">B (today): row deleted,</text><text x="346.5" y="272" text-anchor="middle">count goes down</text><rect class="dg-ex" x="16" y="308" width="475" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Wave 5: DEVCOACH30 count 2 -&gt; 1 after the delete.</text><text class="dg-sub" x="28" y="348">Under B a once-only giveaway could be redeemed again after a new signup.</text></svg>
