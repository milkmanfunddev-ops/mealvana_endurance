<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 421 236" width="100%" role="img" aria-label="Should a Grant say where it came from?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Should a Grant say where it came from?</text><rect class="dg-box" x="16" y="44" width="206" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">B: as today</text><line x1="28" y1="74" x2="210" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">&quot;Subscribed&quot;</text><text class="dg-sub" x="28" y="109">&quot;Ends on September 15, 2027.</text><text class="dg-sub" x="28" y="126">It won&#39;t renew.&quot;</text><text class="dg-sub" x="28" y="143">No Manage button</text><rect class="dg-box" x="238" y="44" width="167" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="250" y="66" font-weight="700">A: says what it is</text><line x1="250" y1="74" x2="393" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="250" y="92">&quot;Gift from your coach&quot;</text><text class="dg-sub" x="250" y="109">or &quot;Grace month&quot;</text><text class="dg-sub" x="250" y="126">with its end date</text><rect class="dg-ex" x="16" y="174" width="389" height="50" rx="8"/><text class="dg-sub" x="28" y="196">An athlete who never paid holds Pro</text><text class="dg-sub" x="28" y="214">through a Grant from their coach&#39;s Code.</text></svg>
