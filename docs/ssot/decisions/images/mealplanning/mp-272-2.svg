<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 370" width="100%" role="img" aria-label="What we decided: Vana names, the app draws">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: Vana names, the app draws</text><line class="dg-edge" x1="183.8" y1="82" x2="133" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="218" y1="82" x2="271.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="143" y1="214" x2="168.3" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="268.9" y1="196" x2="228.6" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="98.5" y="44" width="204" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="200.5" y="62" text-anchor="middle">Vana&#39;s turn with a picker</text><rect class="dg-box" x="16" y="140" width="169" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="100.5" y="158" text-anchor="middle">Names 2 to 4 labels:</text><text x="100.5" y="176" text-anchor="middle">drawn in the app&#39;s</text><text x="100.5" y="194" text-anchor="middle">own chips</text><rect class="dg-box" x="209" y="140" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="297" y="158" text-anchor="middle">Names none, or empty:</text><text x="297" y="176" text-anchor="middle">the app&#39;s own set</text><rect class="dg-box" x="109" y="236" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="200.5" y="254" text-anchor="middle">Tap a chip: its label</text><text x="200.5" y="272" text-anchor="middle">is sent as the message</text><rect class="dg-ex" x="16" y="326" width="369" height="32" rx="8"/><text class="dg-sub" x="28" y="348">Vana never draws or styles a chip.</text></svg>
