<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 466" width="100%" role="img" aria-label="Why 300 a month">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Why 300 a month</text><line class="dg-edge" x1="127.5" y1="100" x2="127.5" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="304.9" y1="100" x2="146.6" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="212.9" y1="196" x2="142.1" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="198.3" y1="292" x2="156.7" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="201.5" y1="360" x2="225.5" y2="360" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="43" y="44" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="127.5" y="62" text-anchor="middle">Weekly planning talk</text><text x="127.5" y="80" text-anchor="middle">6 turns x 4.3 = 26</text><rect class="dg-box" x="236" y="44" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="324" y="62" text-anchor="middle">Three questions a day</text><text x="324" y="80" text-anchor="middle">90</text><rect class="dg-box" x="139.5" y="140" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="227.5" y="158" text-anchor="middle">Three meal logs a day</text><text x="227.5" y="176" text-anchor="middle">90</text><rect class="dg-box" x="132.5" y="236" width="190" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="227.5" y="254" text-anchor="middle">One coach insight a day</text><text x="227.5" y="272" text-anchor="middle">30</text><rect class="dg-box" x="53.5" y="332" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="127.5" y="350" text-anchor="middle">About 236 credits</text><text x="127.5" y="368" text-anchor="middle">a month</text><rect class="dg-box" x="225.5" y="332" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="313.5" y="350" text-anchor="middle">Allowance 300</text><text x="313.5" y="368" text-anchor="middle">a quarter of headroom</text><rect class="dg-ex" x="16" y="404" width="423" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Worst per-call price, all 300 spent: about $3.60 against $9.99</text><text class="dg-sub" x="28" y="444">Considered 250 (too tight at 236) and 500 (about $6.50 exposure)</text></svg>
