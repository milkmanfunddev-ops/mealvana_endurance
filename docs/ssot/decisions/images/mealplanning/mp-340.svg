<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 273" width="100%" role="img" aria-label="Proposed, then rejected: 300 credits a month">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: 300 credits a</text><text class="dg-title" x="16" y="44">month</text><g transform="translate(0 20)"><rect class="dg-box" x="16" y="44" width="180" height="131" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Rejected: 300 credits</text><line x1="28" y1="74" x2="184" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Weekly planning: 26</text><text class="dg-sub" x="28" y="109">Questions: 90</text><text class="dg-sub" x="28" y="126">Meal logs: 90</text><text class="dg-sub" x="28" y="143">Coach insight: 30</text><text class="dg-sub" x="28" y="160">About 236, plus room</text><rect class="dg-box" x="212" y="44" width="154" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="224" y="66" font-weight="700">Decided (mp-430)</text><line x1="224" y1="74" x2="354" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="224" y="92">$4.00 a month</text><text class="dg-sub" x="224" y="109">Each AI call costs</text><text class="dg-sub" x="224" y="126">what it really costs</text><text class="dg-sub" x="224" y="143">No credit count</text><rect class="dg-ex" x="16" y="191" width="350" height="50" rx="8"/><text class="dg-sub" x="28" y="213">300 credits spent at the worst price per call:</text><text class="dg-sub" x="28" y="231">about $3.60 against a $9.99 subscription</text></g></svg>
