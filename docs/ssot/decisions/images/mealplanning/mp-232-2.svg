<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 356" width="100%" role="img" aria-label="This card&#39;s answer: asked once, and a change asks first">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: asked once, and a</text><text class="dg-title" x="16" y="44">change asks first</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="55" font-weight="700">First plan</text><text class="dg-sub" x="50" y="73">Never chosen: Vana asks before lunches.</text><text class="dg-sub" x="50" y="89">The answer is saved</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">Later plans</text><text class="dg-sub" x="50" y="142">No question. Settings has the same switch</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Mid-plan</text><text class="dg-sub" x="50" y="195">Athlete switches it off.</text><text class="dg-sub" x="50" y="211">Vana: for good, or just this week?</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">Then</text><text class="dg-sub" x="50" y="264">Vana: rebuild the plan, or keep it?</text><rect class="dg-ex" x="16" y="292" width="391" height="32" rx="8"/><text class="dg-sub" x="28" y="314">Off: no cooking sessions, each meal is &quot;make the night of&quot;.</text></g></svg>
