<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 301" width="100%" role="img" aria-label="A Sandbox purchase on production">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A Sandbox purchase on production</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="172"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Install</text><text class="dg-sub" x="50" y="73">A tester installs the store build</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="108" font-weight="700">Subscribe</text><text class="dg-sub" x="50" y="126">Free TestFlight subscription, a Sandbox</text><text class="dg-sub" x="50" y="142">event: the $4.00 month is granted</text><circle cx="30" cy="172" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="177" font-weight="700">Buy a pack</text><text class="dg-sub" x="50" y="195">$19.99 pack in Sandbox, charged nothing:</text><text class="dg-sub" x="50" y="211">$5.00 of real budget is added</text><rect class="dg-ex" x="16" y="239" width="294" height="50" rx="8"/><text class="dg-sub" x="28" y="261">Options: a smaller tester budget;</text><text class="dg-sub" x="28" y="279">the month but no packs; or accept it</text></svg>
