<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 289" width="100%" role="img" aria-label="The app works out the numbers">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The app works out the numbers</text><rect class="dg-box" x="16.5" y="44" width="161" height="131" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28.5" y="66" font-weight="700">Other option</text><line x1="28.5" y1="74" x2="165.5" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28.5" y="92">The model writes the</text><text class="dg-sub" x="28.5" y="109">race fuelling targets</text><text class="dg-sub" x="28.5" y="126">itself</text><text class="dg-sub" x="28.5" y="143">→ two asks can get</text><text class="dg-sub" x="28.5" y="160">two different answers</text><rect class="dg-box" x="193.5" y="44" width="180" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="205.5" y="66" font-weight="700">This card&#39;s answer</text><line x1="205.5" y1="74" x2="361.5" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="205.5" y="92">The app&#39;s calculator,</text><text class="dg-sub" x="205.5" y="109">built on the ratified</text><text class="dg-sub" x="205.5" y="126">specs, gives the targets</text><text class="dg-sub" x="205.5" y="143">→ Vana only puts them</text><text class="dg-sub" x="205.5" y="160">into words</text><rect class="dg-ex" x="16" y="191" width="358" height="86" rx="8"/><text class="dg-sub" x="28" y="213">Example: &quot;What do I take on race day?&quot; Pre, during and</text><text class="dg-sub" x="28" y="231">post targets come from the app, the same every time.</text><text class="dg-sub" x="28" y="249">Meal search drops anything that breaks an allergy or</text><text class="dg-sub" x="28" y="267">the athlete&#39;s diet before Vana sees it.</text></svg>
