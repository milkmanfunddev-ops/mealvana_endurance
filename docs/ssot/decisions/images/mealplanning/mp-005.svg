<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 502" width="100%" role="img" aria-label="Numbers come from tools, never Vana">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Numbers come from tools, never Vana</text><line class="dg-edge" x1="179.9" y1="100" x2="145.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="143.5" y1="196" x2="174.9" y2="236" marker-end="url(#dg-arrow)"/><rect x="137.7" y="207" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="159.2" y="220" text-anchor="middle">calls</text><line class="dg-edge" x1="173.4" y1="310" x2="155.2" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="252.5" y1="310" x2="281.3" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="126.5" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="204" y="62" text-anchor="middle">Athlete asks about</text><text x="204" y="80" text-anchor="middle">fuelling or races</text><rect class="dg-box" x="16" y="140" width="211" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="121.5" y="158" text-anchor="middle">Vana</text><text x="121.5" y="176" text-anchor="middle">presents what tools return</text><rect class="dg-box" x="251" y="140" width="141" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="321.5" y="158" text-anchor="middle">Vana invents a</text><text x="321.5" y="176" text-anchor="middle">number or a meal</text><rect class="dg-box" x="109" y="236" width="190" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="204" y="254" text-anchor="middle">Tools: upcoming events,</text><text x="204" y="272" text-anchor="middle">activity history,</text><text x="204" y="290" text-anchor="middle">macro targets, foods</text><rect class="dg-box" x="30" y="332" width="204" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="132" y="350" text-anchor="middle">Deterministic module</text><text x="132" y="368" text-anchor="middle">pre, during, post targets</text><rect class="dg-box" x="258" y="332" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="318" y="350" text-anchor="middle">The athlete&#39;s</text><text x="318" y="368" text-anchor="middle">own records</text><rect class="dg-ex" x="16" y="422" width="376" height="68" rx="8"/><text class="dg-sub" x="28" y="444">&#39;What races are coming up?&#39; The events tool answers:</text><text class="dg-sub" x="28" y="462">Birmingham Half, 12 Oct. Its fuelling targets come from</text><text class="dg-sub" x="28" y="480">the module; Vana reads them out and adds nothing.</text></svg>
