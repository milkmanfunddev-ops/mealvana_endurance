<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 484" width="100%" role="img" aria-label="Webhook in, gate reads, nothing else writes">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Webhook in, gate reads, nothing else writes</text><line class="dg-edge" x1="196.9" y1="100" x2="162.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="243" y1="100" x2="274.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="162.6" y1="196" x2="196.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="198" y1="292" x2="165" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="161" y="44" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="221" y="62" text-anchor="middle">RevenueCat</text><text x="221" y="80" text-anchor="middle">(always wins)</text><rect class="dg-box" x="75" y="140" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="138.5" y="158" text-anchor="middle">Webhook writes</text><text x="138.5" y="176" text-anchor="middle">the two fields</text><rect class="dg-box" x="226" y="140" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="296.5" y="158" text-anchor="middle">Event older than</text><text x="296.5" y="176" text-anchor="middle">the row: ignored</text><rect class="dg-box" x="119" y="236" width="204" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="221" y="254" text-anchor="middle">user_entitlements:</text><text x="221" y="272" text-anchor="middle">active until, period type</text><rect class="dg-box" x="57.5" y="332" width="169" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="142" y="350" text-anchor="middle">Server checks each</text><text x="142" y="368" text-anchor="middle">paid call against it</text><rect class="dg-box" x="250.5" y="332" width="134" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="317.5" y="350" text-anchor="middle">App-side grant:</text><text x="317.5" y="368" text-anchor="middle">never</text><rect class="dg-ex" x="16" y="404" width="410" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Renewal 3 Oct: active until 3 Nov, period type normal.</text><text class="dg-sub" x="28" y="444">A late event stamped 1 Sep arrives after: ignored.</text><text class="dg-sub" x="28" y="462">Restore on the phone: client refetches, next webhook corrects.</text></svg>
