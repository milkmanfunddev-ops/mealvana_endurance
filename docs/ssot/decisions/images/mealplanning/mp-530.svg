<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 370" width="100%" role="img" aria-label="Who the grace month covers">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Who the grace month covers</text><line class="dg-edge" x1="172.5" y1="100" x2="172.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="146.4" y1="196" x2="109.1" y2="236" marker-end="url(#dg-arrow)"/><rect x="112.75" y="207" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="127.75" y="220" text-anchor="middle">yes</text><line class="dg-edge" x1="193.5" y1="196" x2="223.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="197" y="207" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="208.5" y="220" text-anchor="middle">no</text><rect class="dg-box" x="77.5" y="44" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="172.5" y="62" text-anchor="middle">Registered account,</text><text x="172.5" y="80" text-anchor="middle">created before the flip</text><rect class="dg-box" x="98.5" y="140" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="172.5" y="158" text-anchor="middle">Grant to at least</text><text x="172.5" y="176" text-anchor="middle">flip + 30 days?</text><rect class="dg-box" x="23" y="236" width="120" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="83" y="254" text-anchor="middle">Mark founding</text><text x="83" y="272" text-anchor="middle">only</text><rect class="dg-box" x="167" y="236" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="244.5" y="254" text-anchor="middle">Grant 30 days,</text><text x="244.5" y="272" text-anchor="middle">then mark founding</text><rect class="dg-ex" x="16" y="308" width="313" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Dev dry run: 76 selected, 75 grant, 1 mark only</text><text class="dg-sub" x="28" y="348">Second run on the same account: grants nobody</text></svg>
