<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 484" width="100%" role="img" aria-label="A new note meets the store">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A new note meets the store</text><line class="dg-edge" x1="205" y1="82" x2="205" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="180.9" y1="196" x2="146.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="236.2" y1="196" x2="280.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="205" y1="196" x2="205" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="120.5" y="44" width="169" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="62" text-anchor="middle">New sentence arrives</text><rect class="dg-box" x="117" y="140" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="158" text-anchor="middle">Embed it</text><text x="205" y="176" text-anchor="middle">(meaning fingerprint)</text><rect class="dg-box" x="27.5" y="236" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="122.5" y="254" text-anchor="middle">Match at 0.95 or above:</text><text x="122.5" y="272" text-anchor="middle">refresh confirmed date</text><rect class="dg-box" x="241.5" y="236" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="312" y="254" text-anchor="middle">Below 0.95:</text><text x="312" y="272" text-anchor="middle">insert a new row</text><rect class="dg-box" x="117" y="332" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="205" y="350" text-anchor="middle">Embedding call fails:</text><text x="205" y="368" text-anchor="middle">write it anyway</text><rect class="dg-ex" x="16" y="404" width="378" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Stored: &#39;Long runs are on Wednesdays&#39; (confirmed 2 Sep).</text><text class="dg-sub" x="28" y="444">&#39;Wednesday is my long run&#39; scores 0.97: confirmed 14 Sep.</text><text class="dg-sub" x="28" y="462">&#39;I hate beetroot&#39; scores 0.12: a second row.</text></svg>
