<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481 388" width="100%" role="img" aria-label="One height; Vana hands off to app screens">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One height; Vana hands off to app screens</text><line class="dg-edge" x1="216.4" y1="100" x2="182.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="263.7" y1="100" x2="296.8" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="162.1" y1="196" x2="167.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="315" y1="178" x2="322.8" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="124.5" y="44" width="232" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="240.5" y="62" text-anchor="middle">Athlete asks in the sheet</text><text x="240.5" y="80" text-anchor="middle">(one height, contents scroll)</text><rect class="dg-box" x="98" y="140" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="158" y="158" text-anchor="middle">The app has a</text><text x="158" y="176" text-anchor="middle">screen for it</text><rect class="dg-box" x="242" y="140" width="141" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="312.5" y="158" text-anchor="middle">No screen for it</text><rect class="dg-box" x="98" y="236" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="172" y="254" text-anchor="middle">Hand-off button</text><text x="172" y="272" text-anchor="middle">opens that screen</text><rect class="dg-box" x="270" y="236" width="113" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="326.5" y="254" text-anchor="middle">Vana answers</text><text x="326.5" y="272" text-anchor="middle">in the sheet</text><rect class="dg-ex" x="16" y="308" width="449" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Meal plan: meal-planning page. Fuel a workout: new activity.</text><text class="dg-sub" x="28" y="348">Plan an event: event screen. Carb loading: the picks.</text><text class="dg-sub" x="28" y="366">Close button or drag down dismisses; full screen only by its button.</text></svg>
