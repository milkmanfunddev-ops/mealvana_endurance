<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 473" width="100%" role="img" aria-label="Deleting a confirmed plan&#39;s list today">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Deleting a confirmed plan&#39;s list today</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="326"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Confirm</text><text class="dg-sub" x="50" y="73">Plan confirmed; the server builds</text><text class="dg-sub" x="50" y="89">its list (15 rows)</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="124" font-weight="700">⋯ Delete list</text><text class="dg-sub" x="50" y="142">Same dialog as any list:</text><text class="dg-sub" x="50" y="158">&quot;Everything on it goes with it.&quot;</text><circle cx="30" cy="188" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="193" font-weight="700">Delete</text><text class="dg-sub" x="50" y="211">List and its 15 rows gone;</text><text class="dg-sub" x="50" y="227">plan still confirmed, no list</text><circle cx="30" cy="257" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="262" font-weight="700">Shopping tab</text><text class="dg-sub" x="50" y="280">Opens an archived draft&#39;s</text><text class="dg-sub" x="50" y="296">list as if it were current</text><circle cx="30" cy="326" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="331" font-weight="700">Next plan edit</text><text class="dg-sub" x="50" y="349">The list is rebuilt</text><text class="dg-sub" x="50" y="365">(mp-244; not yet seen)</text><rect class="dg-ex" x="16" y="393" width="365" height="68" rx="8"/><text class="dg-sub" x="28" y="415">Wave 11, 24 Sep: plan be6abf2f stayed confirmed</text><text class="dg-sub" x="28" y="433">after list 03c4c52b was deleted; the tab showed</text><text class="dg-sub" x="28" y="451">draft 54a02440&#39;s 6-item list (Findings 19-001, 19-002).</text></svg>
