<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 676" width="100%" role="img" aria-label="Typed feedback lands in the inbox">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Typed feedback lands in the inbox</text><line class="dg-edge" x1="147" y1="100" x2="178.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="200.5" y1="196" x2="200.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="184.7" y1="196" x2="107.7" y2="332" marker-end="url(#dg-arrow)"/><rect x="60.19999999999999" y="255" width="172" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="146.2" y="268" text-anchor="middle">first step: find the path</text><line class="dg-edge" x1="214.1" y1="196" x2="279.9" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="200.5" y1="196" x2="200.5" y2="428" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><line class="dg-edge" x1="107.2" y1="370" x2="190.3" y2="524" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="279.3" y1="388" x2="210.2" y2="524" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="281.4" y1="100" x2="204" y2="524" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="51" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="125" y="62" text-anchor="middle">Athlete types a</text><text x="125" y="80" text-anchor="middle">complaint to Vana</text><rect class="dg-box" x="223" y="44" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="286.5" y="62" text-anchor="middle">Athlete shakes</text><text x="286.5" y="80" text-anchor="middle">the phone</text><rect class="dg-box" x="98.5" y="140" width="204" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="200.5" y="158" text-anchor="middle">Feedback row saved:</text><text x="200.5" y="176" text-anchor="middle">words, sentiment, conv id</text><rect class="dg-box" x="116" y="236" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="200.5" y="254" text-anchor="middle">Feedback-saved reply</text><text x="200.5" y="272" text-anchor="middle">unchanged</text><rect class="dg-box" x="16" y="332" width="162" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="97" y="350" text-anchor="middle">Wiredash server API</text><rect class="dg-box" x="202" y="332" width="183" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="293.5" y="350" text-anchor="middle">Client files it on the</text><text x="293.5" y="368" text-anchor="middle">feedback-saved part</text><rect class="dg-box" x="109" y="428" width="183" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="200.5" y="446" text-anchor="middle">Neither: ticket stops,</text><text x="200.5" y="464" text-anchor="middle">question on the page</text><rect class="dg-box" x="123" y="524" width="155" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="200.5" y="542" text-anchor="middle">One Wiredash inbox</text><rect class="dg-ex" x="16" y="596" width="369" height="68" rx="8"/><text class="dg-sub" x="28" y="618">Typed: &quot;the plan repeats salmon&quot;, sentiment negative.</text><text class="dg-sub" x="28" y="636">Inbox entry: those words, negative, conversation 7f3a.</text><text class="dg-sub" x="28" y="654">No API and no client path: stop, ask on the page.</text></svg>
