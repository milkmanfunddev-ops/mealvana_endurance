<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 484" width="100%" role="img" aria-label="Typed feedback joins shaken reports">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Typed feedback joins shaken reports</text><line class="dg-edge" x1="211.5" y1="100" x2="211.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="184.4" y1="196" x2="145.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="240.7" y1="196" x2="282.3" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="145.6" y1="292" x2="184.4" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="282.3" y1="292" x2="240.7" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="144.5" y="44" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="211.5" y="62" text-anchor="middle">Complaint typed</text><text x="211.5" y="80" text-anchor="middle">to Vana</text><rect class="dg-box" x="120" y="140" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="211.5" y="158" text-anchor="middle">Feedback row saved;</text><text x="211.5" y="176" text-anchor="middle">the reply is unchanged</text><rect class="dg-box" x="30.5" y="236" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="118.5" y="254" text-anchor="middle">Filed through</text><text x="118.5" y="272" text-anchor="middle">Wiredash&#39;s server API</text><rect class="dg-box" x="230.5" y="236" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="311.5" y="254" text-anchor="middle">Or filed by the app</text><text x="311.5" y="272" text-anchor="middle">on the saved reply</text><rect class="dg-box" x="134" y="332" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="211.5" y="350" text-anchor="middle">The Wiredash inbox</text><text x="211.5" y="368" text-anchor="middle">shaken reports use</text><rect class="dg-ex" x="16" y="404" width="391" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Typed: &quot;the plan repeats salmon&quot;, sentiment negative.</text><text class="dg-sub" x="28" y="444">Inbox entry: those words, negative, the conversation id.</text><text class="dg-sub" x="28" y="462">Neither path exists: the ticket stops and asks on the page.</text></svg>
