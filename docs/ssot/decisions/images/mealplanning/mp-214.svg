<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 383 288" width="100%" role="img" aria-label="Say what is needed, then stop">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Say what is needed, then stop</text><rect class="dg-box" x="16" y="44" width="161" height="148" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Other option</text><line x1="28" y1="74" x2="165" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">A sentence cap per</text><text class="dg-sub" x="28" y="109">kind of turn</text><text class="dg-sub" x="28" y="126">Ask: &quot;Is a gel enough</text><text class="dg-sub" x="28" y="143">for my 3-hour ride?&quot;</text><text class="dg-sub" x="28" y="160">→ cut at the cap, the</text><text class="dg-sub" x="28" y="177">useful part is lost</text><rect class="dg-box" x="193" y="44" width="174" height="148" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="205" y="66" font-weight="700">This card&#39;s answer</text><line x1="205" y1="74" x2="355" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="205" y="92">No sentence count</text><text class="dg-sub" x="205" y="109">Same ask: → answered</text><text class="dg-sub" x="205" y="126">in full, then she stops</text><text class="dg-sub" x="205" y="143">Sending the athlete to</text><text class="dg-sub" x="205" y="160">a screen: one sentence</text><rect class="dg-ex" x="16" y="208" width="351" height="68" rx="8"/><text class="dg-sub" x="28" y="230">Always: no emoji, no talk about weight,</text><text class="dg-sub" x="28" y="248">food framed as minimums to reach,</text><text class="dg-sub" x="28" y="266">medical questions go to a professional.</text></svg>
