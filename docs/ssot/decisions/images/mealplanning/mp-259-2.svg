<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 484" width="100%" role="img" aria-label="Where the sheet&#39;s numbers come from">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where the sheet&#39;s numbers come from</text><line class="dg-edge" x1="176" y1="118" x2="176" y2="236" marker-end="url(#dg-arrow)"/><rect x="158" y="168" width="36" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="176" y="181" text-anchor="middle">wins</text><line class="dg-edge" x1="176" y1="196" x2="176" y2="236" marker-end="url(#dg-arrow)"/><rect x="99.5" y="207" width="153" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="176" y="220" text-anchor="middle">loses where it differs</text><line class="dg-edge" x1="150.9" y1="292" x2="115.1" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="164" y1="356.1" x2="188" y2="354.9" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="67" y="44" width="218" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="176" y="62" text-anchor="middle">Existing tokens:</text><text x="176" y="80" text-anchor="middle">radius 24 (glass, tab bar),</text><text x="176" y="98" text-anchor="middle">scrim 60% (calendar sheet)</text><rect class="dg-box" x="91.5" y="140" width="169" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="176" y="158" text-anchor="middle">Design export:</text><text x="176" y="176" text-anchor="middle">radius 26, scrim 45%</text><rect class="dg-box" x="112.5" y="236" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="176" y="254" text-anchor="middle">Component spec</text><text x="176" y="272" text-anchor="middle">written first</text><rect class="dg-box" x="16" y="332" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="90" y="350" text-anchor="middle">Built once in the</text><text x="90" y="368" text-anchor="middle">shared library</text><rect class="dg-box" x="188" y="332" width="148" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="262" y="350" text-anchor="middle">App shell uses it</text><rect class="dg-ex" x="16" y="422" width="320" height="50" rx="8"/><text class="dg-sub" x="28" y="444">Launcher: 52 px, speech-bubble outline,</text><text class="dg-sub" x="28" y="462">in the tab bar&#39;s reserved slot.</text></svg>
