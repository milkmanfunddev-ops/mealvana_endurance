<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 370" width="100%" role="img" aria-label="One path for an empty wallet">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One path for an empty wallet</text><line class="dg-edge" x1="192" y1="72" x2="216" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="271.3" y1="100" x2="229.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="177.5" y1="196" x2="144.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="232.7" y1="196" x2="278.8" y2="236" marker-end="url(#dg-arrow)"/><rect x="205.25" y="207" width="101" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="255.75" y="220" text-anchor="middle">never the Gate</text><rect class="dg-box" x="16" y="44" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="104" y="62" text-anchor="middle">Athlete taps a button</text><text x="104" y="80" text-anchor="middle">that uses AI</text><rect class="dg-box" x="216" y="44" width="169" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="300.5" y="62" text-anchor="middle">Server: wallet empty</text><text x="300.5" y="80" text-anchor="middle">answers 402</text><rect class="dg-box" x="123" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="200.5" y="158" text-anchor="middle">One shared handler</text><text x="200.5" y="176" text-anchor="middle">in the app</text><rect class="dg-box" x="23" y="236" width="197" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="121.5" y="254" text-anchor="middle">Top-up sheet: allowance,</text><text x="121.5" y="272" text-anchor="middle">renewal date, two packs</text><rect class="dg-box" x="244" y="236" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="311" y="254" text-anchor="middle">Rest of the app</text><text x="311" y="272" text-anchor="middle">keeps working</text><rect class="dg-ex" x="16" y="308" width="369" height="50" rx="8"/><text class="dg-sub" x="28" y="330">20 Oct: month used up, taps Analyze on a photo.</text><text class="dg-sub" x="28" y="348">Sheet: renews 8 Nov, packs $4.99 and $19.99.</text></svg>
