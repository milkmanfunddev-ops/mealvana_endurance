<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 236" width="100%" role="img" aria-label="Reaching the founding prices before 1 October">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Reaching the founding prices before 1 October</text><rect class="dg-box" x="16" y="44" width="278" height="114" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: make founding current</text><line x1="28" y1="74" x2="282" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">The project&#39;s current offering</text><text class="dg-sub" x="28" y="109">switches to founding for the run</text><text class="dg-sub" x="28" y="126">Live App Store and Play buyers</text><text class="dg-sub" x="28" y="143">see $12.49 for those minutes</text><rect class="dg-box" x="310" y="44" width="320" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="322" y="66" font-weight="700">This card&#39;s answer: one-customer override</text><line x1="322" y1="74" x2="618" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="322" y="92">Only the sandbox customer</text><text class="dg-sub" x="322" y="109">is set to founding in RevenueCat</text><text class="dg-sub" x="322" y="126">Everyone else still sees $24.99</text><text class="dg-sub" x="322" y="143">Override cleared after the run</text><rect class="dg-ex" x="16" y="174" width="614" height="50" rx="8"/><text class="dg-sub" x="28" y="196">26 Sep: Lee&#39;s fresh sandbox account sees $12.49 beside $24.99 struck through;</text><text class="dg-sub" x="28" y="214">a real customer buying at the same moment pays $24.99.</text></svg>
