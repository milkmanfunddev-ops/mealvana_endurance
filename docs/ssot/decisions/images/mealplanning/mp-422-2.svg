<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 504" width="100%" role="img" aria-label="What we decided: Vana repeats the editor&#39;s number">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: Vana repeats</text><text class="dg-title" x="16" y="44">the editor&#39;s number</text><g transform="translate(0 20)"><line class="dg-edge" x1="163" y1="118" x2="163" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="163" y1="214" x2="163" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="163" y1="310" x2="163" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="64.5" y="44" width="197" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="163" y="62" text-anchor="middle">Draft: phase, sub-phase,</text><text x="163" y="80" text-anchor="middle">durations, activities,</text><text x="163" y="98" text-anchor="middle">food ids + amounts, name</text><rect class="dg-box" x="82" y="140" width="162" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="163" y="158" text-anchor="middle">Server looks the</text><text x="163" y="176" text-anchor="middle">names up in the</text><text x="163" y="194" text-anchor="middle">athlete&#39;s own foods</text><rect class="dg-box" x="82" y="236" width="162" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="163" y="254" text-anchor="middle">Formula notes carry</text><text x="163" y="272" text-anchor="middle">the editor&#39;s carb</text><text x="163" y="290" text-anchor="middle">total: 133 g</text><rect class="dg-box" x="78.5" y="332" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="163" y="350" text-anchor="middle">Vana says 133 g.</text><text x="163" y="368" text-anchor="middle">She never adds it up</text><rect class="dg-ex" x="16" y="422" width="294" height="50" rx="8"/><text class="dg-sub" x="28" y="444">On the simulator the editor showed 133 g and</text><text class="dg-sub" x="28" y="462">Vana said 142 g. Once built, she says 133 g.</text></g></svg>
