<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 348" width="100%" role="img" aria-label="Why a Grant never reached the dev row">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Why a Grant never reached the</text><text class="dg-title" x="16" y="44">dev row</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="257"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">21 Sep</text><text class="dg-sub" x="50" y="73">A throwaway dev account gets</text><text class="dg-sub" x="50" y="89">a Grant by hand in RevenueCat</text><circle cx="30" cy="119" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="124" font-weight="700">21 Sep</text><text class="dg-sub" x="50" y="142">RevenueCat logs every Grant</text><text class="dg-sub" x="50" y="158">as a real (production) event</text><circle cx="30" cy="188" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="193" font-weight="700">21 Sep</text><text class="dg-sub" x="50" y="211">Dev&#39;s connection takes test events only:</text><text class="dg-sub" x="50" y="227">nothing reaches the dev webhook</text><circle cx="30" cy="257" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="262" font-weight="700">21 Sep</text><text class="dg-sub" x="50" y="280">The prod webhook gets it and ignores it.</text><text class="dg-sub" x="50" y="296">The dev row never changes</text></g></svg>
