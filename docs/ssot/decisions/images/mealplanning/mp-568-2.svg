<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 315" width="100%" role="img" aria-label="What we decided: saved with the message it came on">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: saved with the message it came on</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="204"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Sept 22</text><text class="dg-sub" x="50" y="73">Lee opens Vana from the Plan tab.</text><text class="dg-sub" x="50" y="89">Turn one carries &quot;screen: Plan tab&quot;,</text><text class="dg-sub" x="50" y="105">saved with his message</text><circle cx="30" cy="135" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="140" font-weight="700">Sept 23</text><text class="dg-sub" x="50" y="158">Turn two sends turn one unchanged</text><text class="dg-sub" x="50" y="174">and adds its own screen line</text><circle cx="30" cy="204" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="209" font-weight="700">Sept 23</text><text class="dg-sub" x="50" y="227">The 16,000 tokens before it are read</text><text class="dg-sub" x="50" y="243">from the prompt cache, not written again</text><rect class="dg-ex" x="16" y="271" width="294" height="32" rx="8"/><text class="dg-sub" x="28" y="293">The chat summary skips both lines</text></svg>
