<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 292" width="100%" role="img" aria-label="A lapsed account taps something">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A lapsed account taps something</text><line class="dg-edge" x1="111.1" y1="100" x2="123.4" y2="140" marker-end="url(#dg-arrow)"/><rect x="89.25" y="111" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="117.25" y="124" text-anchor="middle">refused</text><line class="dg-edge" x1="259" y1="100" x2="262" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="49.5" y="44" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="102.5" y="62" text-anchor="middle">an edit,</text><text x="102.5" y="80" text-anchor="middle">AI, connect</text><rect class="dg-box" x="179.5" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="257" y="62" text-anchor="middle">sign out, restore,</text><text x="257" y="80" text-anchor="middle">disconnect</text><rect class="dg-box" x="72" y="140" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="132" y="158" text-anchor="middle">paywall;</text><text x="132" y="176" text-anchor="middle">nothing saved</text><rect class="dg-box" x="216" y="140" width="96" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="264" y="158" text-anchor="middle">runs</text><text x="264" y="176" text-anchor="middle">as today</text><rect class="dg-ex" x="16" y="212" width="352" height="68" rx="8"/><text class="dg-sub" x="28" y="234">3 Oct, lapsed: Save on a new brick opens the paywall,</text><text class="dg-sub" x="28" y="252">nothing reaches Drift or the sync queue.</text><text class="dg-sub" x="28" y="270">Disconnect Garmin still disconnects.</text></svg>
