<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 484" width="100%" role="img" aria-label="Haiku by default, cost on record">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Haiku by default, cost on record</text><line class="dg-edge" x1="184" y1="82" x2="130.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="216.4" y1="82" x2="262" y2="140" marker-end="url(#dg-arrow)" style="stroke:var(--muted, #8A7A8C)"/><rect x="198.2" y="102" width="82" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="239.2" y="115" text-anchor="middle">only if set</text><line class="dg-edge" x1="102.7" y1="196" x2="99.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="224.1" y1="196" x2="138.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="116.7" y1="274" x2="173.9" y2="332" marker-end="url(#dg-arrow)"/><rect x="120.80000000000001" y="294" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="145.3" y="307" text-anchor="middle">tokens</text><rect class="dg-box" x="148.5" y="44" width="106" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201.5" y="62" text-anchor="middle">A Vana turn</text><rect class="dg-box" x="34.5" y="140" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="105" y="158" text-anchor="middle">Claude Haiku 4.5</text><text x="105" y="176" text-anchor="middle">default</text><rect class="dg-box" x="199.5" y="140" width="169" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="284" y="158" text-anchor="middle">Sonnet</text><text x="284" y="176" text-anchor="middle">environment override</text><rect class="dg-box" x="48.5" y="236" width="99" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="98" y="254" text-anchor="middle">AI Gateway</text><rect class="dg-box" x="171.5" y="236" width="183" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="263" y="254" text-anchor="middle">Embeddings</text><text x="263" y="272" text-anchor="middle">text-embedding-3-small</text><rect class="dg-box" x="106.5" y="332" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="201.5" y="350" text-anchor="middle">Each eval case records</text><text x="201.5" y="368" text-anchor="middle">input and output tokens</text><rect class="dg-ex" x="16" y="404" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Dev with no override: every chat turn runs on Haiku 4.5.</text><text class="dg-sub" x="28" y="444">Eval case &#39;rest-day lunch&#39;: 1,480 in, 210 out, pass.</text><text class="dg-sub" x="28" y="462">A move to Sonnet is argued from those columns.</text></svg>
