<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 597 218" width="100%" role="img" aria-label="A renewal webhook lands 2.5 minutes late">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A renewal webhook lands 2.5 minutes late</text><rect class="dg-box" x="16" y="44" width="250" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Other option: refuse at the end</text><line x1="28" y1="74" x2="254" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Period ends 11:36:56</text><text class="dg-sub" x="28" y="109">11:38 Vana call: refused</text><text class="dg-sub" x="28" y="126">11:39:30 renewal lands</text><text class="dg-sub" x="28" y="143">A paying athlete was refused</text><rect class="dg-box" x="282" y="44" width="299" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="294" y="66" font-weight="700">This card&#39;s answer: 15 min if renewing</text><line x1="294" y1="74" x2="569" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="294" y="92">Period ends 11:36:56</text><text class="dg-sub" x="294" y="109">11:38 Vana call: answered</text><text class="dg-sub" x="294" y="126">11:39:30 renewal lands</text><text class="dg-sub" x="294" y="143">Cancelled plan: refused at 11:36:56</text><rect class="dg-ex" x="16" y="174" width="565" height="32" rx="8"/><text class="dg-sub" x="28" y="196">A late EXPIRATION at 13:00 still records the end as 11:36:56.</text></svg>
