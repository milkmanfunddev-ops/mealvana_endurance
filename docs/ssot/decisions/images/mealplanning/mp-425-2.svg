<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 426" width="100%" role="img" aria-label="What we decided: a 10-day batch">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: a 10-day batch</text><line class="dg-edge" x1="174.5" y1="72" x2="198.5" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="104.9" y1="100" x2="106.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="199" y1="172.6" x2="223" y2="171.4" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="278.6" y1="100" x2="287.4" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="33.5" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="104" y="62" text-anchor="middle">Period: 10 days,</text><text x="104" y="80" text-anchor="middle">lunch and dinner</text><rect class="dg-box" x="198.5" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="272.5" y="62" text-anchor="middle">Counted against</text><text x="272.5" y="80" text-anchor="middle">10 x 2 = 20 meals</text><rect class="dg-box" x="16" y="140" width="183" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="107.5" y="158" text-anchor="middle">3 lunches + 3 dinners,</text><text x="107.5" y="176" text-anchor="middle">10 / 3 rounded up = 4</text><text x="107.5" y="194" text-anchor="middle">servings each</text><rect class="dg-box" x="223" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="293.5" y="158" text-anchor="middle">24 servings</text><text x="293.5" y="176" text-anchor="middle">against 20 meals</text><rect class="dg-box" x="84.5" y="236" width="211" height="74" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="190" y="254" text-anchor="middle">Per-day planner: 1 serving</text><text x="190" y="272" text-anchor="middle">a pick; 2 servings cover</text><text x="190" y="290" text-anchor="middle">2 nights</text><rect class="dg-box" x="70.5" y="332" width="239" height="74" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="190" y="350" text-anchor="middle">Same as last time: last</text><text x="190" y="368" text-anchor="middle">period&#39;s meals, same servings,</text><text x="190" y="386" text-anchor="middle">no meal doubled</text></svg>
