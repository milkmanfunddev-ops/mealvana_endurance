middle">RevenueCat webhook</text><rect class="dg-box" x="216" y="140" width="141" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="286.5" y="158" text-anchor="middle">Event older than</text><text x="286.5" y="176" text-anchor="middle">the row: ignored</text><rect class="dg-box" x="16" y="236" width="204" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="118" y="254" text-anchor="middle">Entitlement row:</text><text x="118" y="272" text-anchor="middle">active until, period type</text><rect class="dg-box" x="244" y="236" width="134" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="311" y="254" text-anchor="middle">App-side insert</text><text x="311" y="272" text-anchor="middle">or grant</text><rect class="dg-box" x="51" y="332" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="121.5" y="350" text-anchor="middle">requirePro reads</text><text x="121.5" y="368" text-anchor="middle">the two fields</text><rect class="dg-box" x="216" y="332" width="127" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="279.5" y="350" text-anchor="middle">Pro gate flag</text><text x="279.5" y="368" text-anchor="middle">and config key</text><rect class="dg-box" x="109" y="428" width="176" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="197" y="446" text-anchor="middle">Vana or debiting call</text><rect class="dg-ex" x="16" y="500" width="362" height="68" rx="8"/><text class="dg-sub" x="28" y="522">Sandbox monthly on dev: row gets active until +7 days,</text><text class="dg-sub" x="28" y="540">period type trial; the next Vana call passes the gate.</text><text class="dg-sub" x="28" y="558">An event dated before the row&#39;s event changes nothing.</text></svg>
