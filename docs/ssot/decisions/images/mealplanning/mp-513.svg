<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 236" width="100%" role="img" aria-label="Is the drafted trial wording right?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Is the drafted trial wording right?</text><rect class="dg-box" x="16" y="44" width="193" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="28" y="66" font-weight="700">Store trial of 7 days</text><line x1="28" y1="74" x2="197" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="28" y="92">&quot;7 days free&quot;</text><text class="dg-sub" x="28" y="109">&quot;Nothing is charged during</text><text class="dg-sub" x="28" y="126">the free week&quot;</text><text class="dg-sub" x="28" y="143">Reads right</text><rect class="dg-box" x="225" y="44" width="243" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="237" y="66" font-weight="700">If a store&#39;s trial were 3 days</text><line x1="237" y1="74" x2="456" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="237" y="92">&quot;3 days free&quot;</text><text class="dg-sub" x="237" y="109">&quot;Nothing is charged during</text><text class="dg-sub" x="237" y="126">the free week&quot;</text><text class="dg-sub" x="237" y="143">Reads wrong</text><rect class="dg-ex" x="16" y="174" width="452" height="50" rx="8"/><text class="dg-sub" x="28" y="196">The number of days comes from the store;</text><text class="dg-sub" x="28" y="214">the word &quot;week&quot; is fixed.</text></svg>
