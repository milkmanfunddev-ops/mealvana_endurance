<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 370" width="100%" role="img" aria-label="Vana&#39;s voice">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Vana&#39;s voice</text><rect class="dg-box" x="92.5" y="44" width="218" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="201.5" y="62" text-anchor="middle">Kept: to the point,</text><text x="201.5" y="80" text-anchor="middle">minimums framing, no weight</text><text x="201.5" y="98" text-anchor="middle">talk, medical referrals</text><rect class="dg-box" x="62.5" y="140" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="129.5" y="158" text-anchor="middle">One exclamation</text><text x="129.5" y="176" text-anchor="middle">at a milestone</text><rect class="dg-box" x="220.5" y="140" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="280.5" y="158" text-anchor="middle">Emoji: banned</text><text x="280.5" y="176" text-anchor="middle">everywhere</text><rect class="dg-box" x="110" y="236" width="183" height="74" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="201.5" y="254" text-anchor="middle">Gone: sentence counts</text><text x="201.5" y="272" text-anchor="middle">and a required athlete</text><text x="201.5" y="290" text-anchor="middle">fact per turn</text><rect class="dg-ex" x="16" y="326" width="371" height="32" rx="8"/><text class="dg-sub" x="28" y="348">Brief because nothing is padded, not because of a number</text></svg>
