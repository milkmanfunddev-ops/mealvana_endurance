<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377 312" width="100%" role="img" aria-label="What we decided: steps say where they came from">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: steps say where they</text><text class="dg-title" x="16" y="44">came from</text><g transform="translate(0 20)"><line class="dg-edge" x1="159.4" y1="118" x2="142.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="224.3" y1="118" x2="245.7" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="114.5" y="44" width="148" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="188.5" y="62" text-anchor="middle">Each meal records</text><text x="188.5" y="80" text-anchor="middle">where its steps</text><text x="188.5" y="98" text-anchor="middle">came from</text><rect class="dg-box" x="32" y="140" width="162" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="113" y="158" text-anchor="middle">Word for word:</text><text x="113" y="176" text-anchor="middle">&quot;as published by X&quot;</text><text x="113" y="194" text-anchor="middle">and a link</text><rect class="dg-box" x="218" y="140" width="127" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="281.5" y="158" text-anchor="middle">Written by AI:</text><text x="281.5" y="176" text-anchor="middle">a sparkle</text><text x="281.5" y="194" text-anchor="middle">with a tooltip</text><rect class="dg-ex" x="16" y="230" width="345" height="50" rx="8"/><text class="dg-sub" x="28" y="252">Another source or a simple assembly is labelled too.</text><text class="dg-sub" x="28" y="270">Macros sit in a fold-out marked approximate.</text></g></svg>
