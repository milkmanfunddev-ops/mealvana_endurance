<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481 256" width="100%" role="img" aria-label="Which route means which plan">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Which route means which plan</text><line class="dg-edge" x1="190" y1="72" x2="214" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="256.5" y1="168" x2="280.5" y2="168" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="70" y="44" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="130" y="62" text-anchor="middle">Route plan or</text><text x="130" y="80" text-anchor="middle">current plan</text><rect class="dg-box" x="214" y="44" width="197" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="312.5" y="62" text-anchor="middle">Session screen:</text><text x="312.5" y="80" text-anchor="middle">the activity&#39;s fuel plan</text><rect class="dg-box" x="80.5" y="140" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="168.5" y="158" text-anchor="middle">Food route with</text><text x="168.5" y="176" text-anchor="middle">the Plan tab selected</text><rect class="dg-box" x="280.5" y="140" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="340.5" y="158" text-anchor="middle">Plan tab:</text><text x="340.5" y="176" text-anchor="middle">the meal plan</text><rect class="dg-ex" x="16" y="212" width="449" height="32" rx="8"/><text class="dg-sub" x="28" y="234">On a ride&#39;s session screen, Vana is told about the ride&#39;s fuel plan.</text></svg>
