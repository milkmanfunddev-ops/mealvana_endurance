<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 387 370" width="100%" role="img" aria-label="What we decided: where the Gate reads, who moves you">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: where the Gate reads, who moves you</text><line class="dg-edge" x1="132.6" y1="100" x2="168.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="259.4" y1="100" x2="220.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="163.6" y1="196" x2="120.8" y2="236" marker-end="url(#dg-arrow)"/><rect x="127.19999999999999" y="207" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="142.2" y="220" text-anchor="middle">yes</text><line class="dg-edge" x1="224.6" y1="196" x2="268.9" y2="236" marker-end="url(#dg-arrow)"/><rect x="235.25" y="207" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="246.75" y="220" text-anchor="middle">no</text><rect class="dg-box" x="26.5" y="44" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="107.5" y="62" text-anchor="middle">Phone: RevenueCat&#39;s</text><text x="107.5" y="80" text-anchor="middle">saved copy</text><rect class="dg-box" x="212.5" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="286.5" y="62" text-anchor="middle">Web: the server&#39;s</text><text x="286.5" y="80" text-anchor="middle">Entitlement row</text><rect class="dg-box" x="95" y="140" width="197" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="193.5" y="158" text-anchor="middle">Gate: open?</text><text x="193.5" y="176" text-anchor="middle">(at most 2 s at startup)</text><rect class="dg-box" x="16" y="236" width="169" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="100.5" y="254" text-anchor="middle">Router: into the app</text><rect class="dg-box" x="209" y="236" width="162" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="290" y="254" text-anchor="middle">Router: the paywall</text><rect class="dg-ex" x="16" y="308" width="355" height="50" rx="8"/><text class="dg-sub" x="28" y="330">8 Oct: buys on the paywall, the saved copy</text><text class="dg-sub" x="28" y="348">updates, the router moves them into the app</text></svg>
