<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 237" width="100%" role="img" aria-label="Five minutes or an hour">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Five minutes or an hour</text><rect class="dg-box" x="16" y="44" width="186" height="97" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Five minutes</text><line x1="28" y1="74" x2="190" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">first turn 2.2¢</text><text class="dg-sub" x="28" y="109">cold again after a pause</text><text class="dg-sub" x="28" y="126">43% read before this wave</text><rect class="dg-box" x="218" y="44" width="174" height="97" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="230" y="66" font-weight="700">An hour</text><line x1="230" y1="74" x2="380" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="230" y="92">first turn 3.2¢</text><text class="dg-sub" x="230" y="109">warm for the whole chat</text><text class="dg-sub" x="230" y="126">85% read over ten turns</text><rect class="dg-ex" x="16" y="157" width="376" height="68" rx="8"/><text class="dg-sub" x="28" y="179">Lee, Sept 22: turn 1 costs 3.2¢,</text><text class="dg-sub" x="28" y="197">turns 2 to 10 cost 0.2 to 0.5¢ each,</text><text class="dg-sub" x="28" y="215">0.8¢ a turn on average.</text></svg>
