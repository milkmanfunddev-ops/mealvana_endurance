<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 385" width="100%" role="img" aria-label="This card&#39;s answer: one draft per conversation">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: one draft per</text><text class="dg-title" x="16" y="44">conversation</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="294"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Week start</text><text class="dg-sub" x="50" y="73">Last confirmed plan on the Plan tab</text><circle cx="30" cy="103" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="108" font-weight="700">Monday</text><text class="dg-sub" x="50" y="126">Conversation A: its own draft</text><circle cx="30" cy="156" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="161" font-weight="700">Wednesday</text><text class="dg-sub" x="50" y="179">Conversation B: another draft</text><circle cx="30" cy="209" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="214" font-weight="700">Wednesday</text><text class="dg-sub" x="50" y="232">Athlete confirms B. A&#39;s draft and the old</text><text class="dg-sub" x="50" y="248">confirmed plan are archived.</text><text class="dg-sub" x="50" y="264">The Plan tab shows B</text><circle cx="30" cy="294" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="299" font-weight="700">Later</text><text class="dg-sub" x="50" y="317">New meal plan: that plan is archived,</text><text class="dg-sub" x="50" y="333">a fresh empty draft starts</text></g></svg>
