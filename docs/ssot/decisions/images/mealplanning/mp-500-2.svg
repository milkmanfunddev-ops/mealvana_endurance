<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 388" width="100%" role="img" aria-label="Ticket 16: the Subscription screen">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 16: the Subscription screen</text><line class="dg-edge" x1="169" y1="100" x2="169" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="144.2" y1="196" x2="108.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="188.2" y1="196" x2="215.6" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="98.5" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="169" y="62" text-anchor="middle">Settings:</text><text x="169" y="80" text-anchor="middle">Subscription row</text><rect class="dg-box" x="81" y="140" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="169" y="158" text-anchor="middle">Plan status</text><text x="169" y="176" text-anchor="middle">and what Pro includes</text><rect class="dg-box" x="16" y="236" width="120" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="76" y="254" text-anchor="middle">Plan ended:</text><text x="76" y="272" text-anchor="middle">Upgrade opens</text><text x="76" y="290" text-anchor="middle">the paywall</text><rect class="dg-box" x="160" y="236" width="162" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="241" y="254" text-anchor="middle">Has a subscription:</text><text x="241" y="272" text-anchor="middle">Manage opens</text><text x="241" y="290" text-anchor="middle">the store page</text><rect class="dg-ex" x="16" y="326" width="306" height="50" rx="8"/><text class="dg-sub" x="28" y="348">Status: trial with its end date, active with</text><text class="dg-sub" x="28" y="366">its renewal date, founding member, or ended.</text></svg>
