<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 331 256" width="100%" role="img" aria-label="One terms block, both paywalls">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One terms block, both paywalls</text><line class="dg-edge" x1="106.5" y1="82" x2="146.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="238.8" y1="82" x2="189.4" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="93.5" y="62" text-anchor="middle">Onboarding paywall</text><rect class="dg-box" x="195" y="44" width="120" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="255" y="62" text-anchor="middle">Paywall sheet</text><rect class="dg-box" x="18" y="140" width="295" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="165.5" y="158" text-anchor="middle">Trial terms, price after the trial,</text><text x="165.5" y="176" text-anchor="middle">renewal terms, terms and privacy links</text><rect class="dg-ex" x="16" y="212" width="299" height="32" rx="8"/><text class="dg-sub" x="28" y="234">1 Dec: 7 days free, then $24.99 a month</text></svg>
