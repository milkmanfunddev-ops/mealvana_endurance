<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 292" width="100%" role="img" aria-label="A sheet only when a screen is under it">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A sheet only when a screen is under it</text><line class="dg-edge" x1="175.8" y1="100" x2="134.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="234.2" y1="100" x2="275.8" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="131" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="62" text-anchor="middle">Paywall opens for</text><text x="205" y="80" text-anchor="middle">a lapsed account</text><rect class="dg-box" x="17" y="140" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="105" y="158" text-anchor="middle">A screen is under it:</text><text x="105" y="176" text-anchor="middle">sheet you can close</text><rect class="dg-box" x="217" y="140" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="305" y="158" text-anchor="middle">Nothing under it:</text><text x="305" y="176" text-anchor="middle">full screen, no close</text><rect class="dg-ex" x="16" y="212" width="378" height="68" rx="8"/><text class="dg-sub" x="28" y="234">9 Oct, Subscribe tapped on Settings: sheet over Settings.</text><text class="dg-sub" x="28" y="252">Same day, link to Vana from an email: full screen.</text><text class="dg-sub" x="28" y="270">Onboarding&#39;s paywall is always full screen.</text></svg>
