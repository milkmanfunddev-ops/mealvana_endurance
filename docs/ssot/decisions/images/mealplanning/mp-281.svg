<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 388" width="100%" role="img" aria-label="Allowance first, packs when it is empty">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Allowance first, packs when it is empty</text><line class="dg-edge" x1="148.5" y1="100" x2="147" y2="140" marker-end="url(#dg-arrow)"/><rect x="126.25" y="111" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="147.75" y="124" text-anchor="middle">grant</text><line class="dg-edge" x1="307.5" y1="100" x2="307.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="167" y1="196" x2="197" y2="236" marker-end="url(#dg-arrow)"/><rect x="141" y="207" width="82" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="182" y="220" text-anchor="middle">spent first</text><line class="dg-edge" x1="281.4" y1="196" x2="244.1" y2="236" marker-end="url(#dg-arrow)"/><rect x="225.25" y="207" width="75" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="262.75" y="220" text-anchor="middle">when empty</text><rect class="dg-box" x="72" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="149.5" y="62" text-anchor="middle">Renewal event,</text><text x="149.5" y="80" text-anchor="middle">each billing month</text><rect class="dg-box" x="251" y="44" width="113" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="307.5" y="62" text-anchor="middle">Pack bought:</text><text x="307.5" y="80" text-anchor="middle">50 or 250</text><rect class="dg-box" x="68.5" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="146" y="158" text-anchor="middle">Monthly allowance:</text><text x="146" y="176" text-anchor="middle">no roll-over</text><rect class="dg-box" x="247.5" y="140" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="307.5" y="158" text-anchor="middle">Pack credits:</text><text x="307.5" y="176" text-anchor="middle">never expire</text><rect class="dg-box" x="133.5" y="236" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="218" y="254" text-anchor="middle">One call, one credit</text><text x="218" y="272" text-anchor="middle">(six functions)</text><rect class="dg-ex" x="16" y="308" width="404" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Annual plan bought 3 Sep: grants on 3 Oct, 3 Nov, 3 Dec...</text><text class="dg-sub" x="28" y="348">Trial day one gets the full month; cancel forfeits the rest.</text><text class="dg-sub" x="28" y="366">Number set with the paywall copy, from the per-call cost log.</text></svg>
