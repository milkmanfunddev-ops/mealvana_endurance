<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 271" width="100%" role="img" aria-label="The first line is about the athlete">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The first line is about the athlete</text><rect class="dg-box" x="16" y="44" width="180" height="131" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Other option</text><line x1="28" y1="74" x2="184" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">&quot;Hi! How can I help?&quot;</text><text class="dg-sub" x="28" y="109">plus example-question</text><text class="dg-sub" x="28" y="126">chips or an intro card,</text><text class="dg-sub" x="28" y="143">or a wait while the last</text><text class="dg-sub" x="28" y="160">chat is summarised</text><rect class="dg-box" x="212" y="44" width="186" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="224" y="66" font-weight="700">This card&#39;s answer</text><line x1="224" y1="74" x2="386" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="224" y="92">&quot;Tonight&#39;s run is at</text><text class="dg-sub" x="224" y="109">5:30. Want me to walk</text><text class="dg-sub" x="224" y="126">you through fuelling it?&quot;</text><text class="dg-sub" x="224" y="143">→ sent at once, from</text><text class="dg-sub" x="224" y="160">what she already holds</text><rect class="dg-ex" x="16" y="191" width="382" height="68" rx="8"/><text class="dg-sub" x="28" y="213">She leads with the most relevant thing she knows:</text><text class="dg-sub" x="28" y="231">the next workout, the weather, what is on screen,</text><text class="dg-sub" x="28" y="249">or something the athlete told her before.</text></svg>
