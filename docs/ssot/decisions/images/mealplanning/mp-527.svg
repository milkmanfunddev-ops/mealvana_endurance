<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 201" width="100%" role="img" aria-label="Pad the instructions, or leave them?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Pad the instructions, or leave them?</text><rect class="dg-box" x="16" y="44" width="219" height="97" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">Pad to the minimum</text><line x1="28" y1="74" x2="223" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">About 600 tokens grow to 1,024</text><text class="dg-sub" x="28" y="109">A cache hit reads them cheaply</text><text class="dg-sub" x="28" y="126">A miss pays for 400 extra</text><rect class="dg-box" x="251" y="44" width="251" height="97" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="263" y="66" font-weight="700">Leave them</text><line x1="263" y1="74" x2="490" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="263" y="92">About 600 tokens, never cached</text><text class="dg-sub" x="263" y="109">Every call pays full price for them</text><text class="dg-sub" x="263" y="126">The saving is the photo cap</text><rect class="dg-ex" x="16" y="157" width="486" height="32" rx="8"/><text class="dg-sub" x="28" y="179">Anthropic caches nothing under about 1,024 tokens</text></svg>
