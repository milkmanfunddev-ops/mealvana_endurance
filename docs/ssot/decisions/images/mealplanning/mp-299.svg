<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377 494" width="100%" role="img" aria-label="One green run on each store">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One green run on each store</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="347"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Day 1, subscribe</text><text class="dg-sub" x="50" y="73">Fresh sandbox account on the store;</text><text class="dg-sub" x="50" y="89">wizard subscribes via the intro offer</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">Day 1, check</text><text class="dg-sub" x="50" y="142">Entitlement active; Allowance landed</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="177" font-weight="700">Cancel</text><text class="dg-sub" x="50" y="195">Wizard cancels; the paywall appears</text><circle cx="30" cy="225" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="230" font-weight="700">Restore</text><text class="dg-sub" x="50" y="248">Restore brings the entitlement back</text><circle cx="30" cy="278" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="283" font-weight="700">Log</text><text class="dg-sub" x="50" y="301">Each step recorded in a dated log</text><text class="dg-sub" x="50" y="317">under docs/release, ships with it</text><circle cx="30" cy="347" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="352" font-weight="700">Release gate</text><text class="dg-sub" x="50" y="370">No meal-planning release without</text><text class="dg-sub" x="50" y="386">a green run on both stores</text><rect class="dg-ex" x="16" y="414" width="345" height="68" rx="8"/><text class="dg-sub" x="28" y="436">App Store sandbox 2026-09-16: six steps green.</text><text class="dg-sub" x="28" y="454">Play sandbox: cancel step red. Release stays blocked</text><text class="dg-sub" x="28" y="472">until the Play run is repeated green.</text></svg>
