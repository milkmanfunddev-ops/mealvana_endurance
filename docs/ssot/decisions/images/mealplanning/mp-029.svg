<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339 370" width="100%" role="img" aria-label="Two notes that disagree">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Two notes that disagree</text><line class="dg-edge" x1="111.1" y1="100" x2="145.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="227.9" y1="100" x2="193.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="147.5" y1="196" x2="116" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="194.6" y1="196" x2="230.4" y2="236" marker-end="url(#dg-arrow)" style="stroke:var(--muted, #8A7A8C)"/><rect x="178" y="207" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="212.5" y="220" text-anchor="middle">not built</text><rect class="dg-box" x="16.5" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="87" y="62" text-anchor="middle">&#39;I&#39;m vegetarian&#39;</text><text x="87" y="80" text-anchor="middle">March</text><rect class="dg-box" x="181.5" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="252" y="62" text-anchor="middle">&#39;I eat fish now&#39;</text><text x="252" y="80" text-anchor="middle">September</text><rect class="dg-box" x="81.5" y="140" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="169.5" y="158" text-anchor="middle">Memory store</text><text x="169.5" y="176" text-anchor="middle">both rows stay, dated</text><rect class="dg-box" x="20" y="236" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="94" y="254" text-anchor="middle">Model reads both,</text><text x="94" y="272" text-anchor="middle">weighs the newer</text><rect class="dg-box" x="192" y="236" width="127" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="255.5" y="254" text-anchor="middle">Mark the older</text><text x="255.5" y="272" text-anchor="middle">as superseded</text><rect class="dg-ex" x="16" y="308" width="307" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Dana: vegetarian (3 Mar), eats fish (9 Sep).</text><text class="dg-sub" x="28" y="348">Plan built 14 Sep leans on the September note.</text></svg>
