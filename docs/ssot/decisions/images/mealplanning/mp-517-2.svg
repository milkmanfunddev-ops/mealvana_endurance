<text class="dg-title" x="16" y="24">This card&#39;s answer: all three stay</text><text class="dg-title" x="16" y="44">on Haiku</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">21 Sep</text><text class="dg-sub" x="50" y="73">Test on 20 dev conversations, about 25 cents.</text><text class="dg-sub" x="50" y="89">No cheap model gave the same answers</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">After</text><text class="dg-sub" x="50" y="142">All three jobs stay on Haiku 4.5,</text><text class="dg-sub" x="50" y="158">read from one setting of their own</text><circle cx="30" cy="188" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="193" font-weight="700">Later</text><text class="dg-sub" x="50" y="211">A new candidate is a rerun of the</text><text class="dg-sub" x="50" y="227">script and one setting changed</text></g></svg>
