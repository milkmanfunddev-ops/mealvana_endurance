<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 369" width="100%" role="img" aria-label="Other option: if the Doll grew for every screen">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Other option: if the Doll grew for</text><text class="dg-title" x="16" y="44">every screen</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="204"/><circle cx="30" cy="50" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="55" font-weight="700">3 Oct 07:00</text><text class="dg-sub" x="50" y="73">Athlete opens Vana on the Plan tab.</text><text class="dg-sub" x="50" y="89">The Doll carries the plan, formulas</text><text class="dg-sub" x="50" y="105">and events ahead, needed or not</text><circle cx="30" cy="135" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="140" font-weight="700">07:05</text><text class="dg-sub" x="50" y="158">Asks about dinner. All of those</text><text class="dg-sub" x="50" y="174">lines go out again with this turn</text><circle cx="30" cy="204" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="209" font-weight="700">Later</text><text class="dg-sub" x="50" y="227">A new entry point is added.</text><text class="dg-sub" x="50" y="243">Its lines join the Doll</text><text class="dg-sub" x="50" y="259">for every athlete, on every screen</text><rect class="dg-ex" x="16" y="287" width="352" height="50" rx="8"/><text class="dg-sub" x="28" y="309">The Doll keeps growing and changing,</text><text class="dg-sub" x="28" y="327">so the prompt cache breaks and every turn costs more.</text></g></svg>
