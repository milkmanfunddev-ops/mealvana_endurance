<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 289" width="100%" role="img" aria-label="One Doll, read from the records">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One Doll, read from the records</text><rect class="dg-box" x="46" y="44" width="167" height="131" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="58" y="66" font-weight="700">Other option</text><line x1="58" y1="74" x2="201" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="58" y="92">A separate preferences</text><text class="dg-sub" x="58" y="109">table: a second copy</text><text class="dg-sub" x="58" y="126">of the athlete&#39;s data</text><text class="dg-sub" x="58" y="143">→ the copy lags, so</text><text class="dg-sub" x="58" y="160">she plans a beef chili</text><rect class="dg-box" x="229" y="44" width="167" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="241" y="66" font-weight="700">This card&#39;s answer</text><line x1="241" y1="74" x2="384" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="241" y="92">A short, fixed digest</text><text class="dg-sub" x="241" y="109">built fresh each turn</text><text class="dg-sub" x="241" y="126">from the records</text><text class="dg-sub" x="241" y="143">→ next turn she knows:</text><text class="dg-sub" x="241" y="160">no meat this week</text><rect class="dg-ex" x="16" y="191" width="410" height="86" rx="8"/><text class="dg-sub" x="28" y="213">Example: the athlete switches to vegetarian in their profile.</text><text class="dg-sub" x="28" y="231">The same Doll goes to every conversation, from any screen,</text><text class="dg-sub" x="28" y="249">with a season line and any budget; deeper detail she looks</text><text class="dg-sub" x="28" y="267">up with a tool. Also considered: the whole context every turn.</text></svg>
