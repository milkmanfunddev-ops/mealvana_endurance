<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 388" width="100%" role="img" aria-label="One Doll for all, one section in view">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One Doll for all, one section in view</text><line class="dg-edge" x1="195" y1="100" x2="162" y2="140" marker-end="url(#dg-arrow)"/><rect x="154" y="111" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="178.5" y="124" text-anchor="middle">always</text><line class="dg-edge" x1="246.1" y1="100" x2="286.4" y2="140" marker-end="url(#dg-arrow)"/><rect x="222.25" y="111" width="88" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="266.25" y="124" text-anchor="middle">only in view</text><line class="dg-edge" x1="264.3" y1="196" x2="192.7" y2="236" marker-end="url(#dg-arrow)"/><rect x="207" y="207" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="228.5" y="220" text-anchor="middle">more?</text><rect class="dg-box" x="147.5" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="218" y="62" text-anchor="middle">Any entry point</text><text x="218" y="80" text-anchor="middle">sends route + id</text><rect class="dg-box" x="54.5" y="140" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="139" y="158" text-anchor="middle">Doll: same digest</text><text x="139" y="176" text-anchor="middle">for everyone, capped</text><rect class="dg-box" x="247.5" y="140" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="314.5" y="158" text-anchor="middle">One section for</text><text x="314.5" y="176" text-anchor="middle">what is in view</text><rect class="dg-box" x="68.5" y="236" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="142.5" y="254" text-anchor="middle">Deeper detail:</text><text x="142.5" y="272" text-anchor="middle">a tool, on demand</text><rect class="dg-box" x="240.5" y="236" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="304" y="254" text-anchor="middle">Doll grows for</text><text x="304" y="272" text-anchor="middle">one screen</text><rect class="dg-ex" x="16" y="308" width="404" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Formula screen: Doll + a FORMULA section of a few lines.</text><text class="dg-sub" x="28" y="348">Events screen: Doll + EVENTS AHEAD. Plan tab: the day&#39;s plan.</text><text class="dg-sub" x="28" y="366">Doll is 250 to 500 tokens, under a tenth of the prompt.</text></svg>
