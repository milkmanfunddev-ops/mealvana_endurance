<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339 264" width="100%" role="img" aria-label="If the screen line were a hidden message (rejected)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">If the screen line were a hidden message (rejected)</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="135"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Sept 22</text><text class="dg-sub" x="50" y="73">Lee opens Vana from the Plan tab.</text><text class="dg-sub" x="50" y="89">&quot;screen: Plan tab&quot; is stored</text><text class="dg-sub" x="50" y="105">as a hidden athlete message</text><circle cx="30" cy="135" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="140" font-weight="700">Sept 23</text><text class="dg-sub" x="50" y="158">Lee reopens the chat. The app shows</text><text class="dg-sub" x="50" y="174">&quot;screen: Plan tab&quot; as if he typed it</text><rect class="dg-ex" x="16" y="202" width="307" height="50" rx="8"/><text class="dg-sub" x="28" y="224">Also considered: a column on the conversation,</text><text class="dg-sub" x="28" y="242">which loses its place for an opener mid-thread</text></svg>
