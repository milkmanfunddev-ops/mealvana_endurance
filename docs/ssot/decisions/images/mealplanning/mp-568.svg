<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 484" width="100%" role="img" aria-label="What a replayed turn carries">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What a replayed turn carries</text><line class="dg-edge" x1="163" y1="100" x2="163" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="163" y1="196" x2="163" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="163" y1="292" x2="163" y2="332" marker-end="url(#dg-arrow)"/><rect x="125.5" y="303" width="75" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="163" y="316" text-anchor="middle">same bytes</text><rect class="dg-box" x="71.5" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="163" y="62" text-anchor="middle">turn 1: Lee&#39;s message</text><text x="163" y="80" text-anchor="middle">+ screen line (stored)</text><rect class="dg-box" x="47" y="140" width="232" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="163" y="158" text-anchor="middle">opener reply</text><text x="163" y="176" text-anchor="middle">+ hidden instruction (stored)</text><rect class="dg-box" x="75" y="236" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="163" y="254" text-anchor="middle">turn 2 replays turn 1</text><text x="163" y="272" text-anchor="middle">byte for byte</text><rect class="dg-box" x="61" y="332" width="204" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="163" y="350" text-anchor="middle">cache read: 16,000 tokens</text><rect class="dg-ex" x="16" y="404" width="294" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Sept 22: &#39;screen: Plan tab&#39; rides on turn 1.</text><text class="dg-sub" x="28" y="444">Sept 23: turn 2 sends turn 1 unchanged,</text><text class="dg-sub" x="28" y="462">so the prefix is read, not written again.</text></svg>
