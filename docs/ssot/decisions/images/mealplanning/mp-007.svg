<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 371 422" width="100%" role="img" aria-label="Example: the first turns of a new plan">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Example: the first turns of a new</text><text class="dg-title" x="16" y="44">plan</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="331"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">Athlete</text><text class="dg-sub" x="50" y="73">Taps New meal plan</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="108" font-weight="700">Vana: a read of the week</text><text class="dg-sub" x="50" y="126">&quot;Big week: two runs midweek and a long ride</text><text class="dg-sub" x="50" y="142">on Saturday.&quot; No meals yet</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Vana: one question</text><text class="dg-sub" x="50" y="195">&quot;Who&#39;s eating with you this week?&quot;</text><circle cx="30" cy="225" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="230" font-weight="700">Athlete answers</text><text class="dg-sub" x="50" y="248">&quot;Just me and my partner.&quot;</text><circle cx="30" cy="278" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="283" font-weight="700">First meal picker</text><text class="dg-sub" x="50" y="301">Follows the answer: meals for two</text><circle cx="30" cy="331" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="336" font-weight="700">If the athlete asks something off topic</text><text class="dg-sub" x="50" y="354">She answers it in full, then offers to get back</text><text class="dg-sub" x="50" y="370">to picking. The draft is kept</text></g></svg>
