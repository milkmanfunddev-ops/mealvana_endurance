<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 370" width="100%" role="img" aria-label="Allowance follows RevenueCat&#39;s answer">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Allowance follows RevenueCat&#39;s answer</text><line class="dg-edge" x1="172.5" y1="100" x2="172.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="145.4" y1="196" x2="106.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="194.5" y1="196" x2="226" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="102" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="172.5" y="62" text-anchor="middle">Trial expiration</text><text x="172.5" y="80" text-anchor="middle">event</text><rect class="dg-box" x="105.5" y="140" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="172.5" y="158" text-anchor="middle">RevenueCat:</text><text x="172.5" y="176" text-anchor="middle">pro still live?</text><rect class="dg-box" x="16" y="236" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="79.5" y="254" text-anchor="middle">Yes (grant):</text><text x="79.5" y="272" text-anchor="middle">Allowance kept</text><rect class="dg-box" x="167" y="236" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="248" y="254" text-anchor="middle">No:</text><text x="248" y="272" text-anchor="middle">Allowance forfeited</text><rect class="dg-ex" x="16" y="308" width="313" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Grace month to 31 Oct, trial lapses 12 Oct</text><text class="dg-sub" x="28" y="348">Credits stay until the grant ends</text></svg>
