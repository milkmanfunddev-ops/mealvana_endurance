<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 441" width="100%" role="img" aria-label="This card&#39;s answer: an edit rewinds the conversation">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: an edit</text><text class="dg-title" x="16" y="44">rewinds the conversation</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="326"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Message 1</text><text class="dg-sub" x="50" y="73">Athlete: &quot;Plan my week&quot;. Vana replies;</text><text class="dg-sub" x="50" y="89">her reply keeps a copy of the Draft</text><circle cx="30" cy="119" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="124" font-weight="700">Message 2</text><text class="dg-sub" x="50" y="142">Athlete: &quot;Thai food please&quot;</text><text class="dg-sub" x="50" y="158">Vana replies; the athlete ticks meals</text><circle cx="30" cy="188" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="193" font-weight="700">Edit</text><text class="dg-sub" x="50" y="211">Athlete edits message 2 to &quot;Italian&quot;</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">Rewind</text><text class="dg-sub" x="50" y="264">Message 2 and every reply after it deleted.</text><text class="dg-sub" x="50" y="280">The Draft goes back to the copy kept</text><text class="dg-sub" x="50" y="296">before message 2</text><circle cx="30" cy="326" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="331" font-weight="700">Resend</text><text class="dg-sub" x="50" y="349">The Italian version goes to Vana</text><rect class="dg-ex" x="16" y="377" width="313" height="32" rx="8"/><text class="dg-sub" x="28" y="399">A rewind past the first turn empties the Draft.</text></g></svg>
