<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 370" width="100%" role="img" aria-label="The clip, second by second">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The clip, second by second</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">0 s</text><text class="dg-sub" x="50" y="73">Clip starts: fuelling timeline,</text><text class="dg-sub" x="50" y="89">Vana&#39;s answer, a week&#39;s meal plan</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">Any time</text><text class="dg-sub" x="50" y="142">A tap moves on to the features</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="177" font-weight="700">3 s</text><text class="dg-sub" x="50" y="195">Clip failed or never started:</text><text class="dg-sub" x="50" y="211">moves on anyway</text><circle cx="30" cy="241" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="246" font-weight="700">4.0 s</text><text class="dg-sub" x="50" y="264">Ends on the plan held still,</text><text class="dg-sub" x="50" y="280">then slides over in 480 ms</text><rect class="dg-ex" x="16" y="308" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Reduce Motion on: opens on the features,</text><text class="dg-sub" x="28" y="348">a small still of the first frame at the top</text></svg>
