<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 406" width="100%" role="img" aria-label="One status: ended, trial, founding, active">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One status: ended, trial, founding,</text><text class="dg-title" x="16" y="44">active</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="273"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="55" font-weight="700">1 Oct</text><text class="dg-sub" x="50" y="73">Starts a Trial on a founding plan.</text><text class="dg-sub" x="50" y="89">Shows: trial, ending October 8, 2026</text><text class="dg-sub" x="50" y="105">(trial comes before founding)</text><circle cx="30" cy="135" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="140" font-weight="700">8 Oct</text><text class="dg-sub" x="50" y="158">The Trial converts.</text><text class="dg-sub" x="50" y="174">Shows: founding</text><circle cx="30" cy="204" r="7" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)" stroke-width="2"/><text x="50" y="209" font-weight="700">20 Oct</text><text class="dg-sub" x="50" y="227">Cancels. Still founding, but the line reads</text><text class="dg-sub" x="50" y="243">&quot;Ends on {date}. It won&#39;t renew.&quot;</text><circle cx="30" cy="273" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="278" font-weight="700">After the end date</text><text class="dg-sub" x="50" y="296">Shows: ended (ended comes first)</text><rect class="dg-ex" x="16" y="324" width="352" height="50" rx="8"/><text class="dg-sub" x="28" y="346">Active shows only when none of the other three apply.</text><text class="dg-sub" x="28" y="364">Founding: the product they bought, not today&#39;s offer.</text></g></svg>
