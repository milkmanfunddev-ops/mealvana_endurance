<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 292" width="100%" role="img" aria-label="The first status that applies">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The first status that applies</text><line class="dg-edge" x1="148" y1="63" x2="172" y2="63" marker-end="url(#dg-arrow)"/><rect x="148.5" y="54" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="67" text-anchor="middle">no</text><line class="dg-edge" x1="200" y1="82" x2="138.9" y2="140" marker-end="url(#dg-arrow)"/><rect x="157.95" y="102" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="169.45" y="115" text-anchor="middle">no</text><line class="dg-edge" x1="177.5" y1="167.7" x2="201.5" y2="164.8" marker-end="url(#dg-arrow)"/><rect x="178" y="157.25" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="189.5" y="170.25" text-anchor="middle">no</text><rect class="dg-box" x="52" y="44" width="96" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="100" y="62" text-anchor="middle">1. Ended</text><rect class="dg-box" x="172" y="44" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="220" y="62" text-anchor="middle">2. Trial</text><rect class="dg-box" x="22.5" y="140" width="155" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="100" y="158" text-anchor="middle">3. Founding</text><text x="100" y="176" text-anchor="middle">(bought a founding</text><text x="100" y="194" text-anchor="middle">product)</text><rect class="dg-box" x="201.5" y="140" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="249.5" y="158" text-anchor="middle">4. Active</text><rect class="dg-ex" x="16" y="230" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="252">Trial on a founding plan from 1 Oct: trial,</text><text class="dg-sub" x="28" y="270">ends October 8, 2026; then founding</text></svg>
