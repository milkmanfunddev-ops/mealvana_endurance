<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 370" width="100%" role="img" aria-label="Both webhooks take every environment">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Both webhooks take every environment</text><line class="dg-edge" x1="154" y1="100" x2="122.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="196.9" y1="100" x2="226.8" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="106.9" y1="178" x2="104.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="241.6" y1="178" x2="243.6" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="81" y="44" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="176" y="62" text-anchor="middle">RevenueCat event</text><text x="176" y="80" text-anchor="middle">(sandbox or production)</text><rect class="dg-box" x="54.5" y="140" width="106" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="107.5" y="158" text-anchor="middle">Dev webhook</text><rect class="dg-box" x="184.5" y="140" width="113" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="241" y="158" text-anchor="middle">Prod webhook</text><rect class="dg-box" x="47.5" y="236" width="113" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="104" y="254" text-anchor="middle">User exists:</text><text x="104" y="272" text-anchor="middle">row written</text><rect class="dg-box" x="184.5" y="236" width="120" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="244.5" y="254" text-anchor="middle">No such user:</text><text x="244.5" y="272" text-anchor="middle">acked, no-op</text><rect class="dg-ex" x="16" y="308" width="320" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Grace grant on a dev account: a production event</text><text class="dg-sub" x="28" y="348">Dev row written; prod drops it (no such user)</text></svg>
