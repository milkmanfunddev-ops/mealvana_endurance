<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 235" width="100%" role="img" aria-label="Proposed, then rejected: Sunday weeks">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: Sunday weeks</text><rect class="dg-box" x="16" y="44" width="166" height="131" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Proposed (rejected)</text><line x1="28" y1="74" x2="170" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Every week: Sunday</text><text class="dg-sub" x="28" y="109">Starts Sun 4 Oct</text><text class="dg-sub" x="28" y="126">Cooking Sun 4, Wed 7</text><text class="dg-sub" x="28" y="143">and Fri 9 Oct</text><text class="dg-sub" x="28" y="160">No way to change it</text><rect class="dg-box" x="198" y="44" width="167" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="210" y="66" font-weight="700">Decided instead</text><line x1="210" y1="74" x2="353" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="210" y="92">Athlete sets start day</text><text class="dg-sub" x="210" y="109">and length</text><text class="dg-sub" x="210" y="126">Monday, 7 days:</text><text class="dg-sub" x="210" y="143">starts Mon 5 Oct</text><text class="dg-sub" x="210" y="160">Cook days follow</text><rect class="dg-ex" x="16" y="191" width="349" height="32" rx="8"/><text class="dg-sub" x="28" y="213">Sunday and 7 days stay the defaults</text></svg>
