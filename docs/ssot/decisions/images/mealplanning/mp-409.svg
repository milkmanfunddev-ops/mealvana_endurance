<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 466" width="100%" role="img" aria-label="Where the named chips live">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where the named chips live</text><line class="dg-edge" x1="257" y1="82" x2="257" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="257" y1="82" x2="257" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="257" y1="196" x2="257" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="204" y="44" width="106" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="257" y="62" text-anchor="middle">A Vana turn</text><rect class="dg-box" x="179.5" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="257" y="158" text-anchor="middle">meal_picker part</text><text x="257" y="176" text-anchor="middle">chips: 2..4 labels</text><rect class="dg-box" x="155" y="236" width="204" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="257" y="254" text-anchor="middle">pantry, batch, rule parts</text><text x="257" y="272" text-anchor="middle">no chips field</text><rect class="dg-box" x="151.5" y="332" width="211" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="257" y="350" text-anchor="middle">The strip under the picker</text><text x="257" y="368" text-anchor="middle">draws the labels</text><rect class="dg-ex" x="16" y="404" width="482" height="50" rx="8"/><text class="dg-sub" x="28" y="426">A picker turn naming &#39;Salmon instead&#39; and &#39;Keep it quick&#39; shows those two</text><text class="dg-sub" x="28" y="444">A pantry question naming chips has nowhere to draw them: not carried</text></svg>
