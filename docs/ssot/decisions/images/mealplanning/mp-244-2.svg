="198.5" y="386" text-anchor="middle">and their recipes</text><rect class="dg-ex" x="16" y="422" width="365" height="50" rx="8"/><text class="dg-sub" x="28" y="444">The phone never computes the list.</text><text class="dg-sub" x="28" y="462">Had items hidden; only Vana&#39;s &quot;Add back&quot; restores them.</text></g></svg>
