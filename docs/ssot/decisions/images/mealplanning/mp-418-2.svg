<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 425" width="100%" role="img" aria-label="This card&#39;s answer: look the photo up each time">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: look the</text><text class="dg-title" x="16" y="44">photo up each time</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="310"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Last week</text><text class="dg-sub" x="50" y="73">Plan confirmed with a meal</text><text class="dg-sub" x="50" y="89">that has no Dish photo</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Today</text><text class="dg-sub" x="50" y="142">A Tester adds a Dish photo</text><text class="dg-sub" x="50" y="158">to that meal</text><circle cx="30" cy="188" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="193" font-weight="700">Plan opens</text><text class="dg-sub" x="50" y="211">Plan tab, plan bar and review sheet</text><text class="dg-sub" x="50" y="227">look it up: the photo shows</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">In twice</text><text class="dg-sub" x="50" y="280">The photo shows on both rows</text><circle cx="30" cy="310" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="315" font-weight="700">Offline</text><text class="dg-sub" x="50" y="333">Plan rows show no photos</text><rect class="dg-ex" x="16" y="361" width="288" height="32" rx="8"/><text class="dg-sub" x="28" y="383">The photo is never copied onto the plan</text></g></svg>
