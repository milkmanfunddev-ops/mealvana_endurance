<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 466" width="100%" role="img" aria-label="What we decided: look the photo up every time">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: look the photo up every time</text><line class="dg-edge" x1="204" y1="100" x2="204" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="174.8" y1="196" x2="133.2" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="233.2" y1="196" x2="274.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="204" y1="100" x2="204" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="112.5" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="204" y="62" text-anchor="middle">Plan shown: Plan tab,</text><text x="204" y="80" text-anchor="middle">plan bar, review sheet</text><rect class="dg-box" x="105.5" y="140" width="197" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="204" y="158" text-anchor="middle">Look up the library Meal</text><text x="204" y="176" text-anchor="middle">by meal id, every time</text><rect class="dg-box" x="16" y="236" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="104" y="254" text-anchor="middle">Dish photo: shown,</text><text x="104" y="272" text-anchor="middle">on every row it is on</text><rect class="dg-box" x="216" y="236" width="176" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="304" y="254" text-anchor="middle">No photo, or it fails</text><text x="304" y="272" text-anchor="middle">to load: nothing</text><rect class="dg-box" x="126.5" y="332" width="155" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="204" y="350" text-anchor="middle">Offline: no photos</text><rect class="dg-ex" x="16" y="404" width="376" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Never copied onto the plan row, so a later</text><text class="dg-sub" x="28" y="444">photo change reaches plans already made</text></svg>
