<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 273" width="100%" role="img" aria-label="Proposed, then rejected: read back on open">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: read back on</text><text class="dg-title" x="16" y="44">open</text><g transform="translate(0 20)"><rect class="dg-box" x="16" y="44" width="174" height="131" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Proposed (rejected)</text><line x1="28" y1="74" x2="178" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">6 Oct, 19:30: chat</text><text class="dg-sub" x="28" y="109">closes, nothing written</text><text class="dg-sub" x="28" y="126">7 Oct: next chat opens,</text><text class="dg-sub" x="28" y="143">one call reads it back</text><text class="dg-sub" x="28" y="160">The opener waits for it</text><rect class="dg-box" x="206" y="44" width="174" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="218" y="66" font-weight="700">Decided instead</text><line x1="218" y1="74" x2="368" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="218" y="92">6 Oct, 19:30: chat</text><text class="dg-sub" x="218" y="109">closes, Episode written</text><text class="dg-sub" x="218" y="126">7 Oct: next chat opens,</text><text class="dg-sub" x="218" y="143">the opener reads it</text><text class="dg-sub" x="218" y="160">No wait</text><rect class="dg-ex" x="16" y="191" width="364" height="50" rx="8"/><text class="dg-sub" x="28" y="213">Rejected on 14 Sep: the opener waited</text><text class="dg-sub" x="28" y="231">for the read-back</text></g></svg>
