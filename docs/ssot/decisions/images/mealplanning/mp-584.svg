<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 236" width="100%" role="img" aria-label="After a refused save, stay put and quiet?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">After a refused save, stay put and quiet?</text><rect class="dg-box" x="16" y="44" width="187" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Today, on some screens</text><line x1="28" y1="74" x2="191" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Paywall opens</text><text class="dg-sub" x="28" y="109">&quot;Saved&quot; shows behind it,</text><text class="dg-sub" x="28" y="126">or the screen closes</text><text class="dg-sub" x="28" y="143">and the typing is lost</text><rect class="dg-box" x="219" y="44" width="167" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="231" y="66" font-weight="700">Proposed: stay put</text><line x1="231" y1="74" x2="374" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="231" y="92">Paywall opens</text><text class="dg-sub" x="231" y="109">The screen stays open,</text><text class="dg-sub" x="231" y="126">typing kept</text><text class="dg-sub" x="231" y="143">No &quot;saved&quot; message</text><rect class="dg-ex" x="16" y="174" width="370" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Trial ended unpaid on 8 October.</text><text class="dg-sub" x="28" y="214">On 9 October the athlete edits a meal log, taps Save.</text></svg>
