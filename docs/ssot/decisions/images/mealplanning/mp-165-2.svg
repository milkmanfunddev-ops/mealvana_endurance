<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 276" width="100%" role="img" aria-label="This card&#39;s answer: the version number decides">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: the version</text><text class="dg-title" x="16" y="44">number decides</text><g transform="translate(0 20)"><line class="dg-edge" x1="150" y1="72" x2="174" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="206.9" y1="100" x2="138.1" y2="140" marker-end="url(#dg-arrow)"/><rect x="157.5" y="111" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="172.5" y="124" text-anchor="middle">yes</text><line class="dg-edge" x1="256.1" y1="100" x2="257.7" y2="140" marker-end="url(#dg-arrow)"/><rect x="245.39999999999998" y="111" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="256.9" y="124" text-anchor="middle">no</text><rect class="dg-box" x="16" y="44" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="83" y="62" text-anchor="middle">Server content</text><text x="83" y="80" text-anchor="middle">version goes up</text><rect class="dg-box" x="174" y="44" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="255" y="62" text-anchor="middle">Higher than the</text><text x="255" y="80" text-anchor="middle">phone&#39;s stored one?</text><rect class="dg-box" x="19.5" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="90" y="158" text-anchor="middle">Yes: What&#39;s New</text><text x="90" y="176" text-anchor="middle">on the main tabs</text><rect class="dg-box" x="184.5" y="140" width="148" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="258.5" y="158" text-anchor="middle">No: nothing shows</text><rect class="dg-ex" x="16" y="212" width="320" height="32" rx="8"/><text class="dg-sub" x="28" y="234">Phones only. No release needed.</text></g></svg>
