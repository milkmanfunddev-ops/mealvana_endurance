<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 237" width="100%" role="img" aria-label="Ticket 03: the paywall&#39;s current prices">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 03: the paywall&#39;s current prices</text><rect class="dg-box" x="16" y="44" width="140" height="97" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">Normal offering</text><line x1="28" y1="74" x2="144" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">$24.99 a month</text><text class="dg-sub" x="28" y="109">$199.99 a year</text><text class="dg-sub" x="28" y="126">Free week</text><rect class="dg-box" x="172" y="44" width="206" height="97" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="184" y="66" font-weight="700">Founding offering</text><line x1="184" y1="74" x2="366" y2="74" stroke="var(--accent, #F78B14)" stroke-width="1"/><text class="dg-sub" x="184" y="92">$12.49 and $99.99</text><text class="dg-sub" x="184" y="109">Normal prices struck through</text><text class="dg-sub" x="184" y="126">&quot;Founding member&quot; line</text><rect class="dg-ex" x="16" y="157" width="362" height="68" rx="8"/><text class="dg-sub" x="28" y="179">Switched in RevenueCat, no app release.</text><text class="dg-sub" x="28" y="197">Trial terms, price after, terms and privacy</text><text class="dg-sub" x="28" y="215">on screen in both.</text></svg>
