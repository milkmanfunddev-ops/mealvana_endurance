<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 237" width="100%" role="img" aria-label="The paywall sheet in light and dark mode">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The paywall sheet in light and dark mode</text><rect class="dg-box" x="31" y="44" width="166" height="97" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="43" y="66" font-weight="700">Phone in light mode</text><line x1="43" y1="74" x2="185" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="43" y="92">App behind: cream</text><text class="dg-sub" x="43" y="109">Sheet: dark glass</text><text class="dg-sub" x="43" y="126">Text: light</text><rect class="dg-box" x="213" y="44" width="159" height="97" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="225" y="66" font-weight="700">Phone in dark mode</text><line x1="225" y1="74" x2="360" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="225" y="92">App behind: dark</text><text class="dg-sub" x="225" y="109">Sheet: dark glass</text><text class="dg-sub" x="225" y="126">Text: light</text><rect class="dg-ex" x="16" y="157" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="179">Only the app behind the sheet follows the phone&#39;s mode.</text><text class="dg-sub" x="28" y="197">Light mode: tap Subscribe over the cream Settings screen</text><text class="dg-sub" x="28" y="215">and a dark glass paywall slides up over it.</text></svg>
