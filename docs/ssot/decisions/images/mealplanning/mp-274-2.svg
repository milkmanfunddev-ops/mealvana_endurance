<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 371 466" width="100%" role="img" aria-label="The draft travels with the message">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The draft travels with the message</text><line class="dg-edge" x1="185.5" y1="100" x2="185.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="185.5" y1="100" x2="185.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="185.5" y1="214" x2="185.5" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="185.5" y1="292" x2="185.5" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="94" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="185.5" y="62" text-anchor="middle">Draft on screen,</text><text x="185.5" y="80" text-anchor="middle">unsaved edits included</text><rect class="dg-box" x="69.5" y="140" width="232" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="185.5" y="158" text-anchor="middle">Set fields: phase, sub-phase,</text><text x="185.5" y="176" text-anchor="middle">durations, activities,</text><text x="185.5" y="194" text-anchor="middle">component ids and quantities</text><rect class="dg-box" x="97.5" y="236" width="176" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="185.5" y="254" text-anchor="middle">Name,</text><text x="185.5" y="272" text-anchor="middle">at most 40 characters</text><rect class="dg-box" x="80" y="332" width="211" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="185.5" y="350" text-anchor="middle">Server checks the shape,</text><text x="185.5" y="368" text-anchor="middle">builds the FORMULA section</text><rect class="dg-ex" x="16" y="422" width="339" height="32" rx="8"/><text class="dg-sub" x="28" y="444">The one screen where more than ids and dates travel</text></svg>
