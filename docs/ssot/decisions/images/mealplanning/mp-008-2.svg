<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 219" width="100%" role="img" aria-label="Lead with what matters, never a greeting">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Lead with what matters, never a greeting</text><rect class="dg-box" x="16" y="44" width="159" height="97" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">A greeting (never)</text><line x1="28" y1="74" x2="163" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">&quot;Hi! How can I help</text><text class="dg-sub" x="28" y="109">you today?&quot;</text><rect class="dg-box" x="191" y="44" width="194" height="97" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="203" y="66" font-weight="700">The most relevant thing</text><line x1="203" y1="74" x2="373" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="203" y="92">&quot;Tonight&#39;s run is at 5:30.</text><text class="dg-sub" x="203" y="109">Want me to walk you</text><text class="dg-sub" x="203" y="126">through fuelling it?&quot;</text><rect class="dg-ex" x="16" y="157" width="369" height="50" rx="8"/><text class="dg-sub" x="28" y="179">Vana weighs the weather, races, holidays, the screen</text><text class="dg-sub" x="28" y="197">and what the athlete said before, then leads with one.</text></svg>
