<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 408" width="100%" role="img" aria-label="Weigh everything, lead with one">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Weigh everything, lead with one</text><line class="dg-edge" x1="196" y1="82" x2="196" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="129.8" y1="178" x2="179.7" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="254.3" y1="196" x2="214.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="196" y1="274" x2="196" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="96" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="64" y="62" text-anchor="middle">Weather</text><rect class="dg-box" x="136" y="44" width="120" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="196" y="62" text-anchor="middle">Race schedule</text><rect class="dg-box" x="280" y="44" width="96" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="328" y="62" text-anchor="middle">Holidays</text><rect class="dg-box" x="39.5" y="140" width="148" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="113.5" y="158" text-anchor="middle">What is on screen</text><rect class="dg-box" x="211.5" y="140" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="282" y="158" text-anchor="middle">What the athlete</text><text x="282" y="176" text-anchor="middle">has said before</text><rect class="dg-box" x="80" y="236" width="232" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="196" y="254" text-anchor="middle">The most relevant thing today</text><rect class="dg-box" x="108" y="332" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="196" y="350" text-anchor="middle">Opener leads with it.</text><text x="196" y="368" text-anchor="middle">Never a greeting</text></svg>
