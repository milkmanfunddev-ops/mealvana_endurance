<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 274" width="100%" role="img" aria-label="Ticket 11: chips that settle or navigate">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 11: chips that settle or navigate</text><line class="dg-edge" x1="195" y1="100" x2="195" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="100" y="44" width="190" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="195" y="62" text-anchor="middle">Today: &quot;Every meal&quot; tap</text><text x="195" y="80" text-anchor="middle">is a 21,000-token turn</text><rect class="dg-box" x="107" y="140" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="195" y="158" text-anchor="middle">After: the setting is</text><text x="195" y="176" text-anchor="middle">saved, no model</text><rect class="dg-ex" x="16" y="212" width="358" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Draft my whole week, Same as last time,</text><text class="dg-sub" x="28" y="252">Open shopping list, Lay it across the week, Use these.</text></svg>
