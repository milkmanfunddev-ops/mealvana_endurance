<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 408" width="100%" role="img" aria-label="Look it up first, then ask">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Look it up first, then ask</text><line class="dg-edge" x1="160" y1="100" x2="160" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="100" x2="160" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="146.4" y1="196" x2="80.6" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="177.5" y1="292" x2="202.5" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="68.5" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">Vana needs to know</text><text x="160" y="80" text-anchor="middle">something for the plan</text><rect class="dg-box" x="40.5" y="140" width="239" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="158" text-anchor="middle">On file or in a tool?</text><text x="160" y="176" text-anchor="middle">e.g. schedule, diet, allergies</text><rect class="dg-box" x="47.5" y="236" width="225" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="254" text-anchor="middle">The app cannot know it</text><text x="160" y="272" text-anchor="middle">e.g. who is eating this week</text><rect class="dg-box" x="19" y="332" width="96" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="67" y="350" text-anchor="middle">Use it.</text><text x="67" y="368" text-anchor="middle">Never ask</text><rect class="dg-box" x="139" y="332" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="220" y="350" text-anchor="middle">Ask, when it</text><text x="220" y="368" text-anchor="middle">matters to the plan</text></svg>
