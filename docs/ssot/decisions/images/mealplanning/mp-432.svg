<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 484" width="100%" role="img" aria-label="The cost work, in order">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The cost work, in order</text><line class="dg-edge" x1="122" y1="68.4" x2="146" y2="66.8" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="259" y1="66.9" x2="283" y2="68.6" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="283" y1="94" x2="179.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="180" y1="168" x2="204" y2="168" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="252.5" y1="196" x2="221" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="106" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="69" y="62" text-anchor="middle">1. Log what</text><text x="69" y="80" text-anchor="middle">is missing</text><rect class="dg-box" x="146" y="44" width="113" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="202.5" y="62" text-anchor="middle">2. Cache fix</text><rect class="dg-box" x="283" y="44" width="99" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="332.5" y="62" text-anchor="middle">3. Monthly</text><text x="332.5" y="80" text-anchor="middle">budget</text><rect class="dg-box" x="53" y="140" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="116.5" y="158" text-anchor="middle">4. Byte-stable</text><text x="116.5" y="176" text-anchor="middle">replay</text><rect class="dg-box" x="204" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="274.5" y="158" text-anchor="middle">5. Openers fetch</text><text x="274.5" y="176" text-anchor="middle">data first</text><rect class="dg-box" x="128.5" y="236" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="199" y="254" text-anchor="middle">6. 50-meal test</text><text x="199" y="272" text-anchor="middle">for meal logging</text><rect class="dg-box" x="111" y="332" width="176" height="74" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="199" y="350" text-anchor="middle">Not now: on-device</text><text x="199" y="368" text-anchor="middle">model, batch API,</text><text x="199" y="386" text-anchor="middle">cheaper-model routing</text><rect class="dg-ex" x="16" y="422" width="366" height="50" rx="8"/><text class="dg-sub" x="28" y="444">Cache fix: a typical athlete $2.86 -&gt; $1.64 a month.</text><text class="dg-sub" x="28" y="462">On-device model: under 5%, and no room for a turn.</text></svg>
