<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 352" width="100%" role="img" aria-label="After Vana saves feedback">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">After Vana saves feedback</text><line class="dg-edge" x1="167.1" y1="82" x2="121.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="196.9" y1="82" x2="242.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="104" y1="196" x2="110.4" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="257.9" y1="196" x2="248.6" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="118.5" y="44" width="127" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="182" y="62" text-anchor="middle">Feedback saved</text><rect class="dg-box" x="29" y="140" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="99.5" y="158" text-anchor="middle">Plain complaint:</text><text x="99.5" y="176" text-anchor="middle">the silent kind</text><rect class="dg-box" x="194" y="140" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="264.5" y="158" text-anchor="middle">Complaint with</text><text x="264.5" y="176" text-anchor="middle">a question in it</text><rect class="dg-box" x="65.5" y="236" width="96" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="113.5" y="254" text-anchor="middle">Turn ends</text><rect class="dg-box" x="185.5" y="236" width="113" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="242" y="254" text-anchor="middle">Vana answers</text><text x="242" y="272" text-anchor="middle">the question</text><rect class="dg-ex" x="16" y="308" width="332" height="32" rx="8"/><text class="dg-sub" x="28" y="330">&quot;Too spicy, is there a milder one?&quot; gets an answer</text></svg>
