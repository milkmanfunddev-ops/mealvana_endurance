<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 352" width="100%" role="img" aria-label="What we decided: Show more, counted only when opened">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: Show more, counted only when opened</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Picker</text><text class="dg-sub" x="50" y="73">Vana shows a picker. Behind Show more:</text><text class="dg-sub" x="50" y="89">the rest of the same search, up to 24 meals</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">Not opened</text><text class="dg-sub" x="50" y="142">Those meals do not count as shown.</text><text class="dg-sub" x="50" y="158">Other options can still offer them</text><circle cx="30" cy="188" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="193" font-weight="700">Opened</text><text class="dg-sub" x="50" y="211">Now they count as shown</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">Tick</text><text class="dg-sub" x="50" y="264">A tick in the sheet shows on the picker</text><text class="dg-sub" x="50" y="280">at once, and the other way round</text><rect class="dg-ex" x="16" y="308" width="371" height="32" rx="8"/><text class="dg-sub" x="28" y="330">Nothing left behind it: the Show more chip is not drawn.</text></svg>
