<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 466" width="100%" role="img" aria-label="What the app is sent about the budget">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the app is sent about the budget</text><line class="dg-edge" x1="206.6" y1="100" x2="176.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="261.9" y1="100" x2="311.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="227.5" y1="100" x2="227.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="227.5" y1="100" x2="227.5" y2="332" marker-end="url(#dg-arrow)"/><rect x="203" y="207" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="227.5" y="220" text-anchor="middle">lapsed</text><rect class="dg-box" x="115" y="44" width="225" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="227.5" y="62" text-anchor="middle">Wallet</text><text x="227.5" y="80" text-anchor="middle">(micro-dollars, server only)</text><rect class="dg-box" x="67.5" y="140" width="190" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="162.5" y="158" text-anchor="middle">Share of the month used</text><rect class="dg-box" x="281.5" y="140" width="106" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="334.5" y="158" text-anchor="middle">Refill date</text><rect class="dg-box" x="139.5" y="236" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="227.5" y="254" text-anchor="middle">Bought extra,</text><text x="227.5" y="272" text-anchor="middle">as a share of a month</text><rect class="dg-box" x="153.5" y="332" width="148" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="227.5" y="350" text-anchor="middle">No open month:</text><text x="227.5" y="368" text-anchor="middle">no share, no date</text><rect class="dg-ex" x="16" y="404" width="423" height="50" rx="8"/><text class="dg-sub" x="28" y="426">$4.99 pack = 0.25 of a month, $19.99 pack = 1.25</text><text class="dg-sub" x="28" y="444">$1.60 of $4.00 used = share 0.40; the app never sees the dollars</text></svg>
