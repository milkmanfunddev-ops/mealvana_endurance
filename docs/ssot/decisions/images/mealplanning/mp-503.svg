<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 388" width="100%" role="img" aria-label="The row copies RevenueCat, not the event">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The row copies RevenueCat, not the event</text><line class="dg-edge" x1="198.5" y1="100" x2="198.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="176.5" y1="196" x2="145" y2="236" marker-end="url(#dg-arrow)"/><rect x="145.75" y="207" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160.75" y="220" text-anchor="middle">yes</text><line class="dg-edge" x1="222.6" y1="196" x2="256.9" y2="236" marker-end="url(#dg-arrow)"/><rect x="228.25" y="207" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="239.75" y="220" text-anchor="middle">no</text><rect class="dg-box" x="135" y="44" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="62" text-anchor="middle">Any pro event</text><text x="198.5" y="80" text-anchor="middle">(trial lapses)</text><rect class="dg-box" x="117.5" y="140" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="198.5" y="158" text-anchor="middle">Ask RevenueCat:</text><text x="198.5" y="176" text-anchor="middle">current pro expiry?</text><rect class="dg-box" x="52.5" y="236" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="123" y="254" text-anchor="middle">pro live:</text><text x="123" y="272" text-anchor="middle">row = its expiry</text><rect class="dg-box" x="217.5" y="236" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="281" y="254" text-anchor="middle">no pro:</text><text x="281" y="272" text-anchor="middle">row closes now</text><rect class="dg-ex" x="16" y="308" width="365" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Grant to 31 Oct, trial expires 12 Oct</text><text class="dg-sub" x="28" y="348">RevenueCat still says 31 Oct: row stays open</text><text class="dg-sub" x="28" y="366">RevenueCat down: answer 500, write nothing, redelivered</text></svg>
