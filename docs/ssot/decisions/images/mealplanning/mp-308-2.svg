<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 373 310" width="100%" role="img" aria-label="Ticket 30: filling a cooking period">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 30: filling a cooking period</text><line class="dg-edge" x1="164.5" y1="100" x2="133.1" y2="140" marker-end="url(#dg-arrow)"/><rect x="120.80000000000001" y="111" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="148.8" y="124" text-anchor="middle">batches</text><line class="dg-edge" x1="215.7" y1="100" x2="257.3" y2="140" marker-end="url(#dg-arrow)"/><rect x="205.5" y="111" width="62" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="236.5" y="124" text-anchor="middle">does not</text><rect class="dg-box" x="105.5" y="44" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="186.5" y="62" text-anchor="middle">Settings: a cooking</text><text x="186.5" y="80" text-anchor="middle">period of 10 days</text><rect class="dg-box" x="16" y="140" width="176" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="104" y="158" text-anchor="middle">Batches: a few meals,</text><text x="104" y="176" text-anchor="middle">servings scale to</text><text x="104" y="194" text-anchor="middle">cover 10 days</text><rect class="dg-box" x="216" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="286.5" y="158" text-anchor="middle">Does not batch:</text><text x="286.5" y="176" text-anchor="middle">plans day by day</text><rect class="dg-ex" x="16" y="230" width="341" height="68" rx="8"/><text class="dg-sub" x="28" y="252">Coverage counts servings against the 10 days.</text><text class="dg-sub" x="28" y="270">The walk covers only the meal types they plan.</text><text class="dg-sub" x="28" y="288">One tap drafts the period from last time.</text></svg>
