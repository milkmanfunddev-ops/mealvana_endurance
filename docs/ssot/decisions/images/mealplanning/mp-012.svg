<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 332" width="100%" role="img" aria-label="Other option: if the server kept the clamp">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Other option: if the server kept</text><text class="dg-title" x="16" y="44">the clamp</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Vana writes</text><text class="dg-sub" x="50" y="73">A planning turn of three sentences.</text><text class="dg-sub" x="50" y="89">The tokens are already paid for</text><circle cx="30" cy="119" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="124" font-weight="700">Server</text><text class="dg-sub" x="50" y="142">Cuts it to two sentences</text><circle cx="30" cy="172" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="177" font-weight="700">Athlete sees</text><text class="dg-sub" x="50" y="195">Two sentences. The prompt&#39;s work</text><text class="dg-sub" x="50" y="211">does not show on screen</text><circle cx="30" cy="241" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="246" font-weight="700">Reopens</text><text class="dg-sub" x="50" y="264">The transcript holds the two.</text><text class="dg-sub" x="50" y="280">The third is lost</text></g></svg>
