<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 337" width="100%" role="img" aria-label="The 45-day cut late in an annual year">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The 45-day cut late in an annual</text><text class="dg-title" x="16" y="44">year</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">1 Oct 2026</text><text class="dg-sub" x="50" y="73">Athlete buys the annual plan.</text><text class="dg-sub" x="50" y="89">Access runs to 1 Oct 2027</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">1 Nov 2026</text><text class="dg-sub" x="50" y="142">Calls Vana: access runs 334 days on.</text><text class="dg-sub" x="50" y="158">Counted as annual</text><circle cx="30" cy="188" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="193" font-weight="700">1 Sep 2027</text><text class="dg-sub" x="50" y="211">Calls Vana: access runs 30 days on.</text><text class="dg-sub" x="50" y="227">Counted as monthly, which is wrong</text><rect class="dg-ex" x="16" y="255" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="277">Fix: keep the store product id on the row</text><text class="dg-sub" x="28" y="295">(reopens mp-285), or accept the drift</text></g></svg>
