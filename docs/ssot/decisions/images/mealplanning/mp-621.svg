<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 484" width="100%" role="img" aria-label="One testing-wave run, through the harness">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One testing-wave run, through the harness</text><line class="dg-edge" x1="203.4" y1="100" x2="229.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="289.5" y1="100" x2="264.5" y2="140" marker-end="url(#dg-arrow)"/><rect x="203.5" y="111" width="147" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="277" y="124" text-anchor="middle">released once running</text><line class="dg-edge" x1="226" y1="196" x2="196" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="273.1" y1="196" x2="310.4" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="310.4" y1="292" x2="273.1" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="137.5" y="44" width="96" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="185.5" y="62" text-anchor="middle">Slot lock</text><text x="185.5" y="80" text-anchor="middle">2 at once</text><rect class="dg-box" x="257.5" y="44" width="99" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="307" y="62" text-anchor="middle">Build lock</text><text x="307" y="80" text-anchor="middle">1 at once</text><rect class="dg-box" x="155.5" y="140" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="247" y="158" text-anchor="middle">Agent drives the app</text><text x="247" y="176" text-anchor="middle">checks RC, DB, console</text><rect class="dg-box" x="97.5" y="236" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="175" y="254" text-anchor="middle">Cost counter</text><text x="175" y="272" text-anchor="middle">3 plans, 5 AI logs</text><rect class="dg-box" x="276.5" y="236" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="336.5" y="254" text-anchor="middle">Findings</text><text x="336.5" y="272" text-anchor="middle">one file each</text><rect class="dg-box" x="166" y="332" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="247" y="350" text-anchor="middle">Index</text><text x="247" y="368" text-anchor="middle">open? then not done</text><rect class="dg-ex" x="16" y="404" width="462" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Ticket 14 takes slot 2 of 2, builds while ticket 29 waits,</text><text class="dg-sub" x="28" y="444">counts plan 1 of 3, and writes 14-01 (bug) and 14-02 (follow-up test).</text><text class="dg-sub" x="28" y="462">The index exits non-zero: 2 Findings open.</text></svg>
