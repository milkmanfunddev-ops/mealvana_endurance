<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 388" width="100%" role="img" aria-label="Three seams, two ways to run them">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Three seams, two ways to run them</text><line class="dg-edge" x1="141.9" y1="100" x2="184.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="275.2" y1="100" x2="227.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="196.5" y1="260" x2="220.5" y2="258.8" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="20.5" y="44" width="183" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="112" y="62" text-anchor="middle">Server pure functions,</text><text x="112" y="80" text-anchor="middle">fake database</text><rect class="dg-box" x="227.5" y="44" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="308.5" y="62" text-anchor="middle">Client controllers,</text><text x="308.5" y="80" text-anchor="middle">notifier + goldens</text><rect class="dg-box" x="141.5" y="140" width="127" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="205" y="158" text-anchor="middle">CI, every push</text><rect class="dg-box" x="27.5" y="236" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="112" y="254" text-anchor="middle">Live personalisation</text><text x="112" y="272" text-anchor="middle">evals against dev</text><rect class="dg-box" x="220.5" y="236" width="162" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="301.5" y="254" text-anchor="middle">By hand, on purpose</text><rect class="dg-ex" x="16" y="308" width="378" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Never in CI: eval scripts and the end-to-end plan build.</text><text class="dg-sub" x="28" y="348">In CI: the Pro-gate flow checks the tab and routes agree.</text><text class="dg-sub" x="28" y="366">Tests feed producer-shaped rows, never prompt wording.</text></svg>
