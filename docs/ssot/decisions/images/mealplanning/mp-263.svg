<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 310" width="100%" role="img" aria-label="Which tests run where">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Which tests run where</text><line class="dg-edge" x1="124.4" y1="100" x2="118.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="288.8" y1="100" x2="302.2" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="79" y="44" width="99" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="128.5" y="62" text-anchor="middle">Every push</text><text x="128.5" y="80" text-anchor="middle">(CI)</text><rect class="dg-box" x="202" y="44" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="279.5" y="62" text-anchor="middle">Someone starts it,</text><text x="279.5" y="80" text-anchor="middle">against dev</text><rect class="dg-box" x="30" y="140" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="114.5" y="158" text-anchor="middle">Runs: the Gate test,</text><text x="114.5" y="176" text-anchor="middle">tab and routes agree</text><rect class="dg-box" x="223" y="140" width="183" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="314.5" y="158" text-anchor="middle">Runs: eval, lifecycle,</text><text x="314.5" y="176" text-anchor="middle">personalisation,</text><text x="314.5" y="194" text-anchor="middle">full plan-build test</text><rect class="dg-ex" x="16" y="230" width="404" height="68" rx="8"/><text class="dg-sub" x="28" y="252">Three places: server functions, live checks, app controllers.</text><text class="dg-sub" x="28" y="270">The personalisation eval pays for model calls,</text><text class="dg-sub" x="28" y="288">so it never runs on a push.</text></svg>
