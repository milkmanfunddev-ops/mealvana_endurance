<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 484" width="100%" role="img" aria-label="Where the tests sit">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where the tests sit</text><line class="dg-edge" x1="293.1" y1="100" x2="223.1" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="107.5" y="62" text-anchor="middle">Server pure functions,</text><text x="107.5" y="80" text-anchor="middle">fake database</text><rect class="dg-box" x="223" y="44" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="307.5" y="62" text-anchor="middle">Live personalisation</text><text x="307.5" y="80" text-anchor="middle">evals, by hand, dev</text><rect class="dg-box" x="112.5" y="140" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="204" y="158" text-anchor="middle">App controllers:</text><text x="204" y="176" text-anchor="middle">real notifier, goldens</text><rect class="dg-box" x="88" y="236" width="232" height="74" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="204" y="254" text-anchor="middle">Never in CI: eval, lifecycle,</text><text x="204" y="272" text-anchor="middle">personalisation scripts,</text><text x="204" y="290" text-anchor="middle">end-to-end plan-build test</text><rect class="dg-box" x="102" y="332" width="204" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="204" y="350" text-anchor="middle">In CI: the Pro-gate flow,</text><text x="204" y="368" text-anchor="middle">tab and routes agree</text><rect class="dg-ex" x="16" y="422" width="376" height="50" rx="8"/><text class="dg-sub" x="28" y="444">Tests feed producer-shaped rows and never</text><text class="dg-sub" x="28" y="462">assert on prompt wording.</text></svg>
