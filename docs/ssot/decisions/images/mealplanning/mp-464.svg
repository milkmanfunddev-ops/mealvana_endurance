<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 263" width="100%" role="img" aria-label="Other option: if we logged taps two weeks first">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Other option: if we logged taps</text><text class="dg-title" x="16" y="44">two weeks first</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="172"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Tap</text><text class="dg-sub" x="50" y="73">Athlete taps &quot;Other options&quot; under dinners</text><circle cx="30" cy="103" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="108" font-weight="700">Then</text><text class="dg-sub" x="50" y="126">The tap goes to Vana as a typed message:</text><text class="dg-sub" x="50" y="142">a full planning turn of about 21,000 tokens</text><circle cx="30" cy="172" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="177" font-weight="700">For two weeks</text><text class="dg-sub" x="50" y="195">Every such tap keeps costing a turn</text><text class="dg-sub" x="50" y="211">from the monthly budget</text></g></svg>
