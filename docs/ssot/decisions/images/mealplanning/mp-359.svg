<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 562" width="100%" role="img" aria-label="One section for what is in view">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One section for what is in view</text><line class="dg-edge" x1="226.1" y1="100" x2="200.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="269.1" y1="100" x2="304.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="200.4" y1="196" x2="226.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="244" y1="292" x2="244" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="244" y1="370" x2="244" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="187.5" y="44" width="113" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="244" y="62" text-anchor="middle">Client sends</text><text x="244" y="80" text-anchor="middle">route + id</text><rect class="dg-box" x="108.5" y="140" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="182.5" y="158" text-anchor="middle">Screen table row</text><text x="182.5" y="176" text-anchor="middle">names the section</text><rect class="dg-box" x="280.5" y="140" width="99" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="330" y="158" text-anchor="middle">No row</text><text x="330" y="176" text-anchor="middle">no section</text><rect class="dg-box" x="138.5" y="236" width="211" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="244" y="254" text-anchor="middle">Section built, capped at 6</text><text x="244" y="272" text-anchor="middle">&quot;and more&quot;</text><rect class="dg-box" x="142" y="332" width="204" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="244" y="350" text-anchor="middle">Rides on the user message</text><rect class="dg-box" x="149" y="428" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="244" y="446" text-anchor="middle">Context block unchanged</text><text x="244" y="464" text-anchor="middle">cache still reads</text><rect class="dg-ex" x="16" y="500" width="456" height="50" rx="8"/><text class="dg-sub" x="28" y="522">/events: EVENTS AHEAD Chattanooga 70.3 2026-09-20 (8d) | … | and more</text><text class="dg-sub" x="28" y="540">A new entry point adds one row to the table and nothing else</text></svg>
