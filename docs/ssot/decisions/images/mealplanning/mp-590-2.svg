<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 253" width="100%" role="img" aria-label="Glass sheet: three choices for Xuan">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Glass sheet: three choices for Xuan</text><rect class="dg-box" x="16" y="44" width="208" height="131" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">v1 defaults (in the spec)</text><line x1="28" y1="74" x2="212" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">No grabber</text><text class="dg-sub" x="28" y="109">Full height, up to</text><text class="dg-sub" x="28" y="126">the status bar</text><text class="dg-sub" x="28" y="143">Platform&#39;s standard</text><text class="dg-sub" x="28" y="160">slide-up and curve</text><rect class="dg-box" x="240" y="44" width="180" height="131" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="252" y="66" font-weight="700">Xuan decides</text><line x1="252" y1="74" x2="408" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="252" y="92">Grabber: yes or no</text><text class="dg-sub" x="252" y="109">Gap at the top: how much</text><text class="dg-sub" x="252" y="126">Entrance: timing, curve</text><rect class="dg-ex" x="16" y="191" width="404" height="50" rx="8"/><text class="dg-sub" x="28" y="213">Whatever Xuan picks applies to every sheet</text><text class="dg-sub" x="28" y="231">built on the glass sheet, not only the paywall.</text></svg>
