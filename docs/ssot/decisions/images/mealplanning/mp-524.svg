<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 427 253" width="100%" role="img" aria-label="Amend the playbook, or move the alerts?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Amend the playbook, or move the alerts?</text><rect class="dg-box" x="16" y="44" width="193" height="131" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">A: amend the playbook</text><line x1="28" y1="74" x2="197" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">A database job posts</text><text class="dg-sub" x="28" y="109">to the alert function</text><text class="dg-sub" x="28" y="126">Address and token in Vault</text><text class="dg-sub" x="28" y="143">Playbook §5 gains</text><text class="dg-sub" x="28" y="160">an exception</text><rect class="dg-box" x="225" y="44" width="186" height="131" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="237" y="66" font-weight="700">B: move both alerts</text><line x1="237" y1="74" x2="399" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="237" y="92">A scheduled function,</text><text class="dg-sub" x="237" y="109">or a Sentry cron monitor</text><text class="dg-sub" x="237" y="126">No database job calls</text><text class="dg-sub" x="237" y="143">a function</text><text class="dg-sub" x="237" y="160">Playbook stays as written</text><rect class="dg-ex" x="16" y="191" width="395" height="50" rx="8"/><text class="dg-sub" x="28" y="213">Raw-retention alert, landed 2026-09-20:</text><text class="dg-sub" x="28" y="231">A keeps it as built; B rebuilds it before production.</text></svg>
