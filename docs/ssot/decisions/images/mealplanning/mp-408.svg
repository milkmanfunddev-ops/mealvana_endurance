<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 580" width="100%" role="img" aria-label="A chip list is clamped twice">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A chip list is clamped twice</text><line class="dg-edge" x1="257" y1="100" x2="257" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="257" y1="196" x2="257" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="257" y1="292" x2="257" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="257" y1="370" x2="257" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="183" y="44" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="257" y="62" text-anchor="middle">Model names chips</text><text x="257" y="80" text-anchor="middle">up to 8 accepted</text><rect class="dg-box" x="141" y="140" width="232" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="257" y="158" text-anchor="middle">Server clamps</text><text x="257" y="176" text-anchor="middle">trim, dedupe, cap 4, drop &lt; 2</text><rect class="dg-box" x="169" y="236" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="257" y="254" text-anchor="middle">Wire schema</text><text x="257" y="272" text-anchor="middle">refuses anything else</text><rect class="dg-box" x="162" y="332" width="190" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="257" y="350" text-anchor="middle">App parser clamps again</text><rect class="dg-box" x="162" y="428" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="257" y="446" text-anchor="middle">Legal list: named chips</text><text x="257" y="464" text-anchor="middle">else the app&#39;s own set</text><rect class="dg-ex" x="16" y="500" width="482" height="68" rx="8"/><text class="dg-sub" x="28" y="522">Model says: Salmon instead, Keep it quick, Salmon instead, Skip, More veg</text><text class="dg-sub" x="28" y="540">Server sends 4: Salmon instead, Keep it quick, Skip, More veg</text><text class="dg-sub" x="28" y="558">Model says only: Salmon instead -&gt; under two, dropped, app set shows</text></svg>
