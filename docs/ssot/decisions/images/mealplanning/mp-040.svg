<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 388" width="100%" role="img" aria-label="How Vana finds what she knows">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">How Vana finds what she knows</text><line class="dg-edge" x1="191.8" y1="82" x2="142.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="224.8" y1="82" x2="276.2" y2="140" marker-end="url(#dg-arrow)" style="stroke:var(--muted, #8A7A8C)"/><rect x="216" y="102" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="250.5" y="115" text-anchor="middle">not built</text><line class="dg-edge" x1="147.3" y1="196" x2="188.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="134" y="44" width="148" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="208" y="62" text-anchor="middle">Athlete&#39;s message</text><rect class="dg-box" x="37.5" y="140" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="118.5" y="158" text-anchor="middle">Embedding recall</text><text x="118.5" y="176" text-anchor="middle">(similarity search)</text><rect class="dg-box" x="223.5" y="140" width="155" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="301" y="158" text-anchor="middle">Trained preference</text><text x="301" y="176" text-anchor="middle">model per athlete</text><rect class="dg-box" x="127" y="236" width="162" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="208" y="254" text-anchor="middle">Memories in context</text><rect class="dg-ex" x="16" y="308" width="384" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Dana asks &#39;what&#39;s good before a long ride?&#39;</text><text class="dg-sub" x="28" y="348">Recall pulls her 3 closest Memories by similarity.</text><text class="dg-sub" x="28" y="366">Nothing is trained; weeks of data per person do not exist.</text></svg>
