<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 236" width="100%" role="img" aria-label="Background AI for a lapsed account?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Background AI for a lapsed account?</text><rect class="dg-box" x="16" y="44" width="166" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">A: the app skips it</text><line x1="28" y1="74" x2="170" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Opens the Food tab</text><text class="dg-sub" x="28" y="109">No AI call is sent</text><rect class="dg-box" x="198" y="44" width="201" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="210" y="66" font-weight="700">B: the server refuses it</text><line x1="210" y1="74" x2="387" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="210" y="92">Opens the Food tab</text><text class="dg-sub" x="210" y="109">The app calls Vana</text><text class="dg-sub" x="210" y="126">Server refuses; an error</text><text class="dg-sub" x="210" y="143">may show on the screen</text><rect class="dg-ex" x="16" y="174" width="383" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Trial ended unpaid on 8 October.</text><text class="dg-sub" x="28" y="214">On 9 October the athlete opens the Food tab.</text></svg>
