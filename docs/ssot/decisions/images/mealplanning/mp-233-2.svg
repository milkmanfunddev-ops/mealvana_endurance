ked up</text><rect class="dg-box" x="174.5" y="332" width="113" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="231" y="350" text-anchor="middle">Day guidance</text><text x="231" y="368" text-anchor="middle">computed</text><rect class="dg-box" x="157" y="428" width="148" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="231" y="446" text-anchor="middle">Vana phrases it.</text><text x="231" y="464" text-anchor="middle">No meal or number</text><text x="231" y="482" text-anchor="middle">of her own</text><rect class="dg-ex" x="16" y="518" width="430" height="32" rx="8"/><text class="dg-sub" x="28" y="540">Race-week rule only when a race exists. Race day: no carb number.</text></svg>
