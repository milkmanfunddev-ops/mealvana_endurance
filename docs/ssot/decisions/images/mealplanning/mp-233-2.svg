<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 406" width="100%" role="img" aria-label="The app decides, Vana words it">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The app decides, Vana words it</text><line class="dg-edge" x1="115.8" y1="100" x2="110.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="282.6" y1="100" x2="280" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="140" y1="214" x2="160.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="245.7" y1="214" x2="226.8" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="42" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="119.5" y="62" text-anchor="middle">Athlete&#39;s numbers,</text><text x="119.5" y="80" text-anchor="middle">workouts and logs</text><rect class="dg-box" x="221" y="44" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="284.5" y="62" text-anchor="middle">Meal library +</text><text x="284.5" y="80" text-anchor="middle">saved meals</text><rect class="dg-box" x="35" y="140" width="141" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="105.5" y="158" text-anchor="middle">Staples and day</text><text x="105.5" y="176" text-anchor="middle">guidance: worked</text><text x="105.5" y="194" text-anchor="middle">out by the app</text><rect class="dg-box" x="200" y="140" width="155" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="277.5" y="158" text-anchor="middle">Search: drops what</text><text x="277.5" y="176" text-anchor="middle">breaks allergies</text><text x="277.5" y="194" text-anchor="middle">or diet</text><rect class="dg-box" x="121" y="236" width="148" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="195" y="254" text-anchor="middle">Vana words it.</text><text x="195" y="272" text-anchor="middle">No meal or number</text><text x="195" y="290" text-anchor="middle">of her own</text><rect class="dg-ex" x="16" y="326" width="358" height="68" rx="8"/><text class="dg-sub" x="28" y="348">A vegetarian never sees a meat dish: the search</text><text class="dg-sub" x="28" y="366">removes it before Vana sees the list.</text><text class="dg-sub" x="28" y="384">Staples wait in the chat until the athlete ticks them.</text></svg>
