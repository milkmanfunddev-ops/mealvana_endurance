<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 271" width="100%" role="img" aria-label="A photo, or nothing at all">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A photo, or nothing at all</text><rect class="dg-box" x="29.5" y="44" width="180" height="131" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="41.5" y="66" font-weight="700">Other option</text><line x1="41.5" y1="74" x2="197.5" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="41.5" y="92">Salmon bowl  [photo]</text><text class="dg-sub" x="41.5" y="109">Lentil curry  [photo]</text><text class="dg-sub" x="41.5" y="126">Chicken wrap  [grey box]</text><text class="dg-sub" x="41.5" y="143">A placeholder or icon</text><text class="dg-sub" x="41.5" y="160">where no photo exists</text><rect class="dg-box" x="225.5" y="44" width="174" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="237.5" y="66" font-weight="700">This card&#39;s answer</text><line x1="237.5" y1="74" x2="387.5" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="237.5" y="92">Salmon bowl  [photo]</text><text class="dg-sub" x="237.5" y="109">Lentil curry  [photo]</text><text class="dg-sub" x="237.5" y="126">Chicken wrap</text><text class="dg-sub" x="237.5" y="143">No box, no icon: the</text><text class="dg-sub" x="237.5" y="160">row just has no picture</text><rect class="dg-ex" x="16" y="191" width="397" height="68" rx="8"/><text class="dg-sub" x="28" y="213">Example rows. Plans look the Dish photo up from the library,</text><text class="dg-sub" x="28" y="231">so a photo added to the chicken wrap later shows in plans</text><text class="dg-sub" x="28" y="249">already made, the same one the Meals tab shows.</text></svg>
