<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 562" width="100%" role="img" aria-label="The Gate&#39;s three answers">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The Gate&#39;s three answers</text><line class="dg-edge" x1="185.5" y1="82" x2="145.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="214.7" y1="82" x2="264.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="198.5" y1="82" x2="198.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="125.4" y1="196" x2="120.2" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="283.7" y1="196" x2="262.8" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="198.5" y1="292" x2="198.5" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="150.5" y="44" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="198.5" y="62" text-anchor="middle">The Gate</text><rect class="dg-box" x="49" y="140" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="126.5" y="158" text-anchor="middle">open</text><text x="126.5" y="176" text-anchor="middle">Pro live, or Admin</text><rect class="dg-box" x="228" y="140" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="288" y="158" text-anchor="middle">lapsed</text><text x="288" y="176" text-anchor="middle">held pro once</text><rect class="dg-box" x="145.5" y="236" width="106" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="198.5" y="254" text-anchor="middle">never</text><text x="198.5" y="272" text-anchor="middle">no pro ever</text><rect class="dg-box" x="71.5" y="332" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="119.5" y="350" text-anchor="middle">The app</text><rect class="dg-box" x="191.5" y="332" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="258.5" y="350" text-anchor="middle">Read-only app,</text><text x="258.5" y="368" text-anchor="middle">bar + Subscribe</text><rect class="dg-box" x="145.5" y="428" width="106" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="198.5" y="446" text-anchor="middle">Paywall,</text><text x="198.5" y="464" text-anchor="middle">stays there</text><rect class="dg-ex" x="16" y="500" width="365" height="50" rx="8"/><text class="dg-sub" x="28" y="522">Trial ends unpaid 8 Oct: on 9 Oct they read their plan;</text><text class="dg-sub" x="28" y="540">an edit or a question to Vana opens the paywall</text></svg>
