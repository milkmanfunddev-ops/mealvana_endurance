<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 321 370" width="100%" role="img" aria-label="The Gate&#39;s two answers">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The Gate&#39;s two answers</text><line class="dg-edge" x1="148.7" y1="82" x2="112.8" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="176.7" y1="82" x2="226.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="85.4" y1="196" x2="70.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="241.4" y1="196" x2="229.1" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="112.5" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160.5" y="62" text-anchor="middle">The Gate</text><rect class="dg-box" x="18" y="140" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="95.5" y="158" text-anchor="middle">open</text><text x="95.5" y="176" text-anchor="middle">Pro live, or Admin</text><rect class="dg-box" x="197" y="140" width="106" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="250" y="158" text-anchor="middle">closed</text><text x="250" y="176" text-anchor="middle">no live Pro</text><rect class="dg-box" x="16" y="236" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="64" y="254" text-anchor="middle">The app</text><rect class="dg-box" x="136" y="236" width="169" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="220.5" y="254" text-anchor="middle">Full-screen paywall,</text><text x="220.5" y="272" text-anchor="middle">no close</text><rect class="dg-ex" x="16" y="308" width="289" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Trial ends unpaid 8 Oct: on 9 Oct</text><text class="dg-sub" x="28" y="348">the app opens on the paywall.</text></svg>
