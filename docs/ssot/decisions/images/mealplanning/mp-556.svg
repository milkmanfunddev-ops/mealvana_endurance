<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 388" width="100%" role="img" aria-label="The plan-ended bar">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The plan-ended bar</text><line class="dg-edge" x1="160" y1="82" x2="160" y2="140" marker-end="url(#dg-arrow)"/><rect x="122.5" y="102" width="75" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="115" text-anchor="middle">sits above</text><line class="dg-edge" x1="160" y1="196" x2="160" y2="236" marker-end="url(#dg-arrow)"/><rect x="125.5" y="207" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="220" text-anchor="middle">Subscribe</text><line class="dg-edge" x1="160" y1="236" x2="160" y2="196" marker-end="url(#dg-arrow)"/><rect x="142" y="207" width="36" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="220" text-anchor="middle">back</text><rect class="dg-box" x="65" y="44" width="190" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="160" y="62" text-anchor="middle">Plan ended  [Subscribe]</text><rect class="dg-box" x="65" y="140" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="158" text-anchor="middle">any screen, read-only</text><text x="160" y="176" text-anchor="middle">(tabs and pushed pages)</text><rect class="dg-box" x="93" y="236" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="254" text-anchor="middle">paywall pushed</text><text x="160" y="272" text-anchor="middle">over the screen</text><rect class="dg-ex" x="16" y="308" width="288" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Lapsed on the Plan tab: tap Subscribe,</text><text class="dg-sub" x="28" y="348">the paywall opens; back returns to the</text><text class="dg-sub" x="28" y="366">same Plan tab, still read-only.</text></svg>
