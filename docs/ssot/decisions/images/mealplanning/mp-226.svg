<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 484" width="100%" role="img" aria-label="When a moment may ring">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">When a moment may ring</text><line class="dg-edge" x1="182.6" y1="100" x2="156.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="202.5" y1="163.8" x2="226.5" y2="162.3" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="199.5" y="154.05" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="214.5" y="167.05" text-anchor="middle">yes</text><line class="dg-edge" x1="138" y1="196" x2="136.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="125.75" y="207" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="137.25" y="220" text-anchor="middle">no</text><line class="dg-edge" x1="216.5" y1="264" x2="240.5" y2="264" marker-end="url(#dg-arrow)"/><rect x="213.5" y="255" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="228.5" y="268" text-anchor="middle">yes</text><line class="dg-edge" x1="123.3" y1="292" x2="105.8" y2="332" marker-end="url(#dg-arrow)"/><rect x="103.05" y="303" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="114.55" y="316" text-anchor="middle">no</text><line class="dg-edge" x1="171" y1="360" x2="195" y2="360" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="98.5" y="44" width="204" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="200.5" y="62" text-anchor="middle">A moment raises</text><text x="200.5" y="80" text-anchor="middle">(pre-workout or recovery)</text><rect class="dg-box" x="75.5" y="140" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="139" y="158" text-anchor="middle">Two rings</text><text x="139" y="176" text-anchor="middle">already today?</text><rect class="dg-box" x="226.5" y="140" width="99" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="276" y="158" text-anchor="middle">Not raised</text><rect class="dg-box" x="54.5" y="236" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="135.5" y="254" text-anchor="middle">Rang for this</text><text x="135.5" y="272" text-anchor="middle">workout and window?</text><rect class="dg-box" x="240.5" y="236" width="106" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="293.5" y="254" text-anchor="middle">Stays live,</text><text x="293.5" y="272" text-anchor="middle">no new ring</text><rect class="dg-box" x="16" y="332" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="93.5" y="350" text-anchor="middle">Waits for a</text><text x="93.5" y="368" text-anchor="middle">launcher on screen</text><rect class="dg-box" x="195" y="332" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="290" y="350" text-anchor="middle">Rings; stored on</text><text x="290" y="368" text-anchor="middle">device per user per day</text><rect class="dg-ex" x="16" y="404" width="369" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Morning ride 7:00, evening run 18:00: four windows.</text><text class="dg-sub" x="28" y="444">Two rang by 8:10, so the evening ones are not raised.</text><text class="dg-sub" x="28" y="462">Overlap: the window that closes sooner speaks.</text></svg>
