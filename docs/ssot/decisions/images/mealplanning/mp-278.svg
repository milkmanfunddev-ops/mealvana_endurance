<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377 580" width="100%" role="img" aria-label="The opener speaks from what exists">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The opener speaks from what exists</text><line class="dg-edge" x1="173.6" y1="82" x2="128" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="201.5" y1="82" x2="241.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="188.5" y1="82" x2="188.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="118.6" y1="196" x2="179.9" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="249.5" y1="196" x2="196" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="188.5" y1="292" x2="188.5" y2="332" marker-end="url(#dg-arrow)"/><rect x="157.5" y="303" width="62" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="188.5" y="316" text-anchor="middle">left out</text><rect class="dg-box" x="111" y="44" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="188.5" y="62" text-anchor="middle">Conversation opens</text><rect class="dg-box" x="46" y="140" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="106" y="158" text-anchor="middle">Memory table,</text><text x="106" y="176" text-anchor="middle">as it stands</text><rect class="dg-box" x="190" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="260.5" y="158" text-anchor="middle">Newest episodes,</text><text x="260.5" y="176" text-anchor="middle">as they stand</text><rect class="dg-box" x="121.5" y="236" width="134" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="188.5" y="254" text-anchor="middle">Last episode</text><text x="188.5" y="272" text-anchor="middle">not yet written</text><rect class="dg-box" x="100.5" y="332" width="176" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="188.5" y="350" text-anchor="middle">Opener speaks at once</text><rect class="dg-box" x="42.5" y="428" width="141" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="113" y="446" text-anchor="middle">Wait up to 3.5 s</text><text x="113" y="464" text-anchor="middle">for a read-back</text><rect class="dg-box" x="207.5" y="428" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="271" y="446" text-anchor="middle">Athlete&#39;s last</text><text x="271" y="464" text-anchor="middle">words fallback</text><rect class="dg-ex" x="16" y="500" width="345" height="68" rx="8"/><text class="dg-sub" x="28" y="522">07:02, last night&#39;s episode not written yet:</text><text class="dg-sub" x="28" y="540">Vana opens from the memory table and older episodes.</text><text class="dg-sub" x="28" y="558">Wait: 0 s. Nothing stretched to cover the gap.</text></svg>
