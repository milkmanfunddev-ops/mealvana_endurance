<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 243" width="100%" role="img" aria-label="If Bedrock were the fallback (rejected)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">If Bedrock were the fallback (rejected)</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="172"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">Oct 3, 7pm</text><text class="dg-sub" x="50" y="73">Anthropic has an outage</text><circle cx="30" cy="103" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="108" font-weight="700">7:05pm</text><text class="dg-sub" x="50" y="126">Lee taps send. The call goes to Bedrock,</text><text class="dg-sub" x="50" y="142">which has none of his prompt cached</text><circle cx="30" cy="172" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="177" font-weight="700">7:05pm</text><text class="dg-sub" x="50" y="195">Vana answers from a cold start,</text><text class="dg-sub" x="50" y="211">at full price</text></svg>
