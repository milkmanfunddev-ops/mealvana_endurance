<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 453 219" width="100%" role="img" aria-label="When Anthropic is down">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">When Anthropic is down</text><rect class="dg-box" x="16" y="44" width="180" height="97" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Considered: fall back</text><line x1="28" y1="74" x2="184" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">call goes to Bedrock</text><text class="dg-sub" x="28" y="109">cold cache there</text><text class="dg-sub" x="28" y="126">full price, slow turn</text><rect class="dg-box" x="212" y="44" width="225" height="97" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="224" y="66" font-weight="700">Decided: Anthropic only</text><line x1="224" y1="74" x2="425" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="224" y="92">call is refused</text><text class="dg-sub" x="224" y="109">&#39;Vana is unavailable right now&#39;</text><text class="dg-sub" x="224" y="126">nothing charged</text><rect class="dg-ex" x="16" y="157" width="421" height="50" rx="8"/><text class="dg-sub" x="28" y="179">Oct 3, 7pm outage: Lee taps send,</text><text class="dg-sub" x="28" y="197">sees the unavailable line, pays nothing.</text></svg>
