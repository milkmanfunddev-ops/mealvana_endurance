<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 598" width="100%" role="img" aria-label="The Doll is assembled, not copied">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The Doll is assembled, not copied</text><line class="dg-edge" x1="116.6" y1="82" x2="121.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="250.8" y1="82" x2="147.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="185.9" y1="178" x2="147.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="242" y1="267.1" x2="218" y2="268.3" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="121.3" y1="310" x2="120.4" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="228" y1="356.6" x2="204" y2="355.3" marker-end="url(#dg-arrow)"/><rect x="178.5" y="346.95000000000005" width="75" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="216" y="359.95000000000005" text-anchor="middle">on request</text><rect class="dg-box" x="63" y="44" width="106" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="116" y="62" text-anchor="middle">User record</text><rect class="dg-box" x="193" y="44" width="141" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="263.5" y="62" text-anchor="middle">Calendar, events</text><rect class="dg-box" x="121" y="140" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="158" text-anchor="middle">Meal votes, survey</text><rect class="dg-box" x="28" y="236" width="190" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="123" y="254" text-anchor="middle">Assembled on the server</text><text x="123" y="272" text-anchor="middle">at request time</text><text x="123" y="290" text-anchor="middle">only this turn&#39;s facts</text><rect class="dg-box" x="242" y="236" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="305.5" y="254" text-anchor="middle">Memory table</text><text x="305.5" y="272" text-anchor="middle">the Doll&#39;s own</text><rect class="dg-box" x="35" y="332" width="169" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="119.5" y="350" text-anchor="middle">Prompt for this turn</text><rect class="dg-box" x="228" y="332" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="295" y="350" text-anchor="middle">Tools reach</text><text x="295" y="368" text-anchor="middle">anything deeper</text><rect class="dg-box" x="128" y="428" width="141" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="198.5" y="446" text-anchor="middle">Separate profile</text><text x="198.5" y="464" text-anchor="middle">copy</text><rect class="dg-ex" x="16" y="518" width="365" height="68" rx="8"/><text class="dg-sub" x="28" y="540">Turn on 14 Sep: the block holds this week&#39;s 3 workouts,</text><text class="dg-sub" x="28" y="558">the 12 Oct race and 2 memories. Last year&#39;s meal votes</text><text class="dg-sub" x="28" y="576">come through a tool. No field is stored twice.</text></svg>
