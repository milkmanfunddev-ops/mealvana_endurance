<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 580" width="100%" role="img" aria-label="What syncs, and when">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What syncs, and when</text><line class="dg-edge" x1="160" y1="100" x2="160" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="274" x2="160" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="136" y1="447" x2="160" y2="447" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="54.5" y="44" width="211" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="160" y="62" text-anchor="middle">Meal library, about 1,900:</text><text x="160" y="80" text-anchor="middle">stays on the server</text><rect class="dg-box" x="30" y="140" width="260" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="158" text-anchor="middle">Search and detail ask the server;</text><text x="160" y="176" text-anchor="middle">session cache; local text</text><text x="160" y="194" text-anchor="middle">search as fallback</text><rect class="dg-box" x="82.5" y="236" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="254" text-anchor="middle">Plans and Memories</text><rect class="dg-box" x="51" y="332" width="218" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="350" text-anchor="middle">Sync on first load and</text><text x="160" y="368" text-anchor="middle">on Plan tab pull-to-refresh</text><rect class="dg-box" x="40" y="428" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="88" y="446" text-anchor="middle">App start</text><rect class="dg-box" x="160" y="428" width="120" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="220" y="446" text-anchor="middle">Nothing syncs</text><rect class="dg-ex" x="16" y="518" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="540">Trial or paid is read from the store;</text><text class="dg-sub" x="28" y="558">nothing about it is synced.</text></svg>
