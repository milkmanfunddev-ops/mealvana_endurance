<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 336" width="100%" role="img" aria-label="What we decided: shares, and no bar without a month">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: shares, and no bar without a month</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="225"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">1 Oct</text><text class="dg-sub" x="50" y="73">Athlete subscribes; the month opens</text><circle cx="30" cy="103" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="108" font-weight="700">10 Oct</text><text class="dg-sub" x="50" y="126">Buys the $4.99 pack.</text><text class="dg-sub" x="50" y="142">Sent as 0.25 of a month bought</text><circle cx="30" cy="172" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="177" font-weight="700">31 Oct</text><text class="dg-sub" x="50" y="195">Subscription lapses: no open month</text><circle cx="30" cy="225" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="230" font-weight="700">2 Nov</text><text class="dg-sub" x="50" y="248">Opens Vana settings: no share,</text><text class="dg-sub" x="50" y="264">no refill date, the bar draws nothing</text><rect class="dg-ex" x="16" y="292" width="288" height="32" rx="8"/><text class="dg-sub" x="28" y="314">The $19.99 pack is sent as 1.25 of a month</text></svg>
