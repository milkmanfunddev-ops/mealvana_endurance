<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 426" width="100%" role="img" aria-label="What we decided: three small builds">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: three small builds</text><line class="dg-edge" x1="94.7" y1="118" x2="109.8" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="285.6" y1="100" x2="297.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="197" y1="196" x2="197" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="148" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="90" y="62" text-anchor="middle">Admin review:</text><text x="90" y="80" text-anchor="middle">Good or Not good,</text><text x="90" y="98" text-anchor="middle">a reason, Send</text><rect class="dg-box" x="188" y="44" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="283" y="62" text-anchor="middle">Recipe: one origin line</text><text x="283" y="80" text-anchor="middle">under Directions</text><rect class="dg-box" x="133.5" y="140" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="197" y="158" text-anchor="middle">Feedback typed</text><text x="197" y="176" text-anchor="middle">to Vana</text><rect class="dg-box" x="23" y="236" width="183" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="114.5" y="254" text-anchor="middle">Server confirms, then</text><text x="114.5" y="272" text-anchor="middle">&quot;sent&quot;; team reads the</text><text x="114.5" y="290" text-anchor="middle">database, app version</text><rect class="dg-box" x="230" y="236" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="300.5" y="254" text-anchor="middle">The only link to</text><text x="300.5" y="272" text-anchor="middle">the original</text><rect class="dg-box" x="116" y="332" width="162" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="197" y="350" text-anchor="middle">Wiredash inbox with</text><text x="197" y="368" text-anchor="middle">shake reports,</text><text x="197" y="386" text-anchor="middle">label &quot;vana-chat&quot;</text></svg>
