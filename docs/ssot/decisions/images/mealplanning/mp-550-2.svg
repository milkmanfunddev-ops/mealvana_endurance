<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 370" width="100%" role="img" aria-label="When the wallet cannot answer">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">When the wallet cannot answer</text><line class="dg-edge" x1="195" y1="82" x2="195" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="166.9" y1="196" x2="126.6" y2="236" marker-end="url(#dg-arrow)"/><rect x="118.75" y="207" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="146.75" y="220" text-anchor="middle">answers</text><line class="dg-edge" x1="215.1" y1="196" x2="243.9" y2="236" marker-end="url(#dg-arrow)"/><rect x="205" y="207" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="229.5" y="220" text-anchor="middle">errors</text><rect class="dg-box" x="114" y="44" width="162" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="195" y="62" text-anchor="middle">Lee sends a message</text><rect class="dg-box" x="96.5" y="140" width="197" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="195" y="158" text-anchor="middle">Server asks the database</text><text x="195" y="176" text-anchor="middle">to set the cost aside</text><rect class="dg-box" x="35" y="236" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="98.5" y="254" text-anchor="middle">Set aside:</text><text x="98.5" y="272" text-anchor="middle">the model runs</text><rect class="dg-box" x="186" y="236" width="169" height="74" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="270.5" y="254" text-anchor="middle">Database error:</text><text x="270.5" y="272" text-anchor="middle">&quot;Vana is unavailable</text><text x="270.5" y="290" text-anchor="middle">right now&quot;</text><rect class="dg-ex" x="16" y="326" width="358" height="32" rx="8"/><text class="dg-sub" x="28" y="348">On an error: no top-up sheet, and the model never runs</text></svg>
