<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 371 388" width="100%" role="img" aria-label="The dev buttons switch in Settings">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The dev buttons switch in Settings</text><line class="dg-edge" x1="115.4" y1="82" x2="121.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="254.6" y1="82" x2="282.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="116.9" y1="196" x2="106.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="167" y1="196" x2="228.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="65.5" y="44" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="113.5" y="62" text-anchor="middle">Dev build</text><rect class="dg-box" x="185.5" y="44" width="120" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="245.5" y="62" text-anchor="middle">Release build</text><rect class="dg-box" x="25.5" y="140" width="197" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="124" y="158" text-anchor="middle">Settings shows a switch,</text><text x="124" y="176" text-anchor="middle">on by default</text><rect class="dg-box" x="246.5" y="140" width="99" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="296" y="158" text-anchor="middle">No switch,</text><text x="296" y="176" text-anchor="middle">no buttons</text><rect class="dg-box" x="25.5" y="236" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="99.5" y="254" text-anchor="middle">On: accessibility</text><text x="99.5" y="272" text-anchor="middle">and wrench shown</text><rect class="dg-box" x="197.5" y="236" width="148" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="271.5" y="254" text-anchor="middle">Off: both hidden,</text><text x="271.5" y="272" text-anchor="middle">no restart</text><rect class="dg-ex" x="16" y="308" width="339" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Per tester, per device, remembered across launches.</text><text class="dg-sub" x="28" y="348">Off clears the launcher for simulator captures.</text><text class="dg-sub" x="28" y="366">No build-time flag.</text></svg>
