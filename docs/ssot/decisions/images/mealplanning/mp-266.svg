<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449 317" width="100%" role="img" aria-label="A new account: trial, then purchase">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A new account: trial, then purchase</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Day 1</text><text class="dg-sub" x="50" y="73">Signs up.</text><text class="dg-sub" x="50" y="89">Whole app open, meal planning included.</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="124" font-weight="700">Day 7</text><text class="dg-sub" x="50" y="142">Last day of the trial.</text><text class="dg-sub" x="50" y="158">Everything still open.</text><circle cx="30" cy="188" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="193" font-weight="700">Day 8</text><text class="dg-sub" x="50" y="211">Trial over. Tapping the launcher</text><text class="dg-sub" x="50" y="227">opens the paywall: buy or stop.</text><rect class="dg-ex" x="16" y="255" width="417" height="50" rx="8"/><text class="dg-sub" x="28" y="277">Signed up 1 Sep: trial runs 1 to 7 Sep, paywall from 8 Sep.</text><text class="dg-sub" x="28" y="295">Buy: $9.99 a month or $69.99 a year. No free tier, no Pro tier.</text></svg>
