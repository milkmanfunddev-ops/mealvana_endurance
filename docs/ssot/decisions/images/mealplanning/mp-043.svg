<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 484" width="100%" role="img" aria-label="How the server learns what is on screen">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">How the server learns what is on screen</text><line class="dg-edge" x1="174.4" y1="100" x2="135.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="227.6" y1="100" x2="264.9" y2="140" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="224.75" y="111" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="246.25" y="124" text-anchor="middle">never</text><line class="dg-edge" x1="114.6" y1="196" x2="123.4" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="150.5" y1="292" x2="180.5" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="210.5" y1="264" x2="234.5" y2="264" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect class="dg-box" x="124" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201.5" y="62" text-anchor="middle">Screen the athlete</text><text x="201.5" y="80" text-anchor="middle">asks from</text><rect class="dg-box" x="31" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="108.5" y="158" text-anchor="middle">Client sends route</text><text x="108.5" y="176" text-anchor="middle">+ id, date, slot</text><rect class="dg-box" x="210" y="140" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="291" y="158" text-anchor="middle">Client writes names</text><text x="291" y="176" text-anchor="middle">or free text</text><rect class="dg-box" x="48.5" y="236" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="129.5" y="254" text-anchor="middle">Server resolves ids</text><text x="129.5" y="272" text-anchor="middle">into one sentence</text><rect class="dg-box" x="234.5" y="236" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="294.5" y="254" text-anchor="middle">Never written</text><text x="294.5" y="272" text-anchor="middle">to a table</text><rect class="dg-box" x="124" y="332" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="201.5" y="350" text-anchor="middle">Vana answers about</text><text x="201.5" y="368" text-anchor="middle">what is in front</text><rect class="dg-ex" x="16" y="404" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Fuel log open: route plan, activity id, 14 Sep, no slot.</text><text class="dg-sub" x="28" y="444">Server: &#39;the fuel plan for Sunday&#39;s 90-minute ride&#39;.</text><text class="dg-sub" x="28" y="462">Nothing saved; the next message sends the ids again.</text></svg>
