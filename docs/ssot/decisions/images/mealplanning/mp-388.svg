<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 370" width="100%" role="img" aria-label="What the retirement removes">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the retirement removes</text><line class="dg-edge" x1="232" y1="100" x2="295" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="336.5" y1="100" x2="338" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="230.1" y1="196" x2="300.4" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="286.8" y1="196" x2="212.2" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="128" y="44" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="188" y="62" text-anchor="middle">Insight panel</text><text x="188" y="80" text-anchor="middle">deleted</text><rect class="dg-box" x="272" y="44" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="335.5" y="62" text-anchor="middle">Its controller</text><text x="335.5" y="80" text-anchor="middle">deleted</text><rect class="dg-box" x="117.5" y="140" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="181" y="158" text-anchor="middle">Saving writes</text><text x="181" y="176" text-anchor="middle">no new insight</text><rect class="dg-box" x="268.5" y="140" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="339" y="158" text-anchor="middle">Ask Vana</text><text x="339" y="176" text-anchor="middle">the conversation</text><rect class="dg-box" x="86" y="236" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="254" text-anchor="middle">ai-coach function</text><text x="160" y="272" text-anchor="middle">and client kept</text><rect class="dg-box" x="258" y="236" width="183" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="349.5" y="254" text-anchor="middle">Insight already stored</text><text x="349.5" y="272" text-anchor="middle">left as it is</text><rect class="dg-ex" x="16" y="308" width="495" height="50" rx="8"/><text class="dg-sub" x="28" y="330">mp-209 retires the coach-facing surface, not the function other callers use</text><text class="dg-sub" x="28" y="348">mp-395 asks whether the stored insight columns retire too</text></svg>
