<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 466" width="100%" role="img" aria-label="A second code from the same coach">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A second code from the same coach</text><line class="dg-edge" x1="205" y1="100" x2="205" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="179.9" y1="196" x2="144.1" y2="236" marker-end="url(#dg-arrow)"/><rect x="153.5" y="207" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="162" y="220" text-anchor="middle">A</text><line class="dg-edge" x1="227" y1="196" x2="258.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="234.25" y="207" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="242.75" y="220" text-anchor="middle">B</text><line class="dg-edge" x1="205" y1="196" x2="205" y2="332" marker-end="url(#dg-arrow)"/><rect x="196.5" y="255" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="205" y="268" text-anchor="middle">C</text><rect class="dg-box" x="85.5" y="44" width="239" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="205" y="62" text-anchor="middle">Athlete enters DEVCOACH30</text><text x="205" y="80" text-anchor="middle">pending pairing with the coach</text><rect class="dg-box" x="85.5" y="140" width="239" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="158" text-anchor="middle">Same athlete enters DEVCOACH18</text><text x="205" y="176" text-anchor="middle">(same coach)</text><rect class="dg-box" x="55.5" y="236" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="119" y="254" text-anchor="middle">A: refused,</text><text x="119" y="272" text-anchor="middle">already paired</text><rect class="dg-box" x="206.5" y="236" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="280.5" y="254" text-anchor="middle">B: recorded,</text><text x="280.5" y="272" text-anchor="middle">&#39;already pending&#39;</text><rect class="dg-box" x="124" y="332" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="350" text-anchor="middle">C (today): &#39;coach</text><text x="205" y="368" text-anchor="middle">will see a request&#39;</text><rect class="dg-ex" x="16" y="404" width="378" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Today: two redemptions spent, one pairing,</text><text class="dg-sub" x="28" y="444">RevenueCat coach_code goes from DEVCOACH30 to DEVCOACH18.</text></svg>
