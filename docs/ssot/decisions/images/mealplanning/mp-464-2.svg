<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339 243" width="100%" role="img" aria-label="What we decided: the tap acts at once">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: the tap acts at once</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="172"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Tap</text><text class="dg-sub" x="50" y="73">Athlete taps &quot;Other options&quot; under dinners</text><circle cx="30" cy="103" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="108" font-weight="700">At once</text><text class="dg-sub" x="50" y="126">The next picker appears, with no line</text><text class="dg-sub" x="50" y="142">from Vana. Nothing drawn from the budget</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Next typed message</text><text class="dg-sub" x="50" y="195">Vana answers and sees the tap and</text><text class="dg-sub" x="50" y="211">the picker it produced</text></svg>
