<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 580" width="100%" role="img" aria-label="The context block stays short on purpose">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The context block stays short on purpose</text><line class="dg-edge" x1="182" y1="82" x2="182" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="182" y1="196" x2="182" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="169" y1="274" x2="129.2" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="198.2" y1="274" x2="247.6" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="113.4" y1="388" x2="118.2" y2="428" marker-end="url(#dg-arrow)"/><rect x="94.30000000000001" y="399" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="115.80000000000001" y="412" text-anchor="middle">under</text><line class="dg-edge" x1="154.1" y1="388" x2="217.1" y2="428" marker-end="url(#dg-arrow)"/><rect x="167.6" y="399" width="36" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="185.6" y="412" text-anchor="middle">over</text><line class="dg-edge" x1="263.6" y1="388" x2="252.4" y2="428" marker-end="url(#dg-arrow)"/><rect x="243" y="399" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="258" y="412" text-anchor="middle">yes</text><rect class="dg-box" x="108" y="44" width="148" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="182" y="62" text-anchor="middle">Athlete&#39;s records</text><rect class="dg-box" x="111.5" y="140" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="182" y="158" text-anchor="middle">Context builder,</text><text x="182" y="176" text-anchor="middle">every turn</text><rect class="dg-box" x="122" y="236" width="120" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="182" y="254" text-anchor="middle">Context block</text><rect class="dg-box" x="32.5" y="332" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="110" y="350" text-anchor="middle">Token count</text><text x="110" y="368" text-anchor="middle">against the budget</text><rect class="dg-box" x="211.5" y="332" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="271.5" y="350" text-anchor="middle">A field no</text><text x="271.5" y="368" text-anchor="middle">prompt reads?</text><rect class="dg-box" x="67.5" y="428" width="106" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="120.5" y="446" text-anchor="middle">Test passes</text><rect class="dg-box" x="197.5" y="428" width="99" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="247" y="446" text-anchor="middle">Test fails</text><rect class="dg-ex" x="16" y="500" width="332" height="68" rx="8"/><text class="dg-sub" x="28" y="522">Build the block for 3 representative athletes.</text><text class="dg-sub" x="28" y="540">Over the budget, or a field no prompt reads: fail.</text><text class="dg-sub" x="28" y="558">The budget number is set when the test lands.</text></svg>
