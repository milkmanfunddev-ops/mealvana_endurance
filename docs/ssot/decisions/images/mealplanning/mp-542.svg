<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 274" width="100%" role="img" aria-label="Our own accounts are not skipped">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Our own accounts are not skipped</text><line class="dg-edge" x1="182" y1="100" x2="182" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="76.5" y="44" width="211" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="182" y="62" text-anchor="middle">Registered before the flip</text><text x="182" y="80" text-anchor="middle">(ours included)</text><rect class="dg-box" x="80" y="140" width="204" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="182" y="158" text-anchor="middle">30 days + founding member</text><rect class="dg-ex" x="16" y="212" width="332" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Dev dry run: 76 selected, test@test.com among them</text><text class="dg-sub" x="28" y="252">No domain list, no internal-flag rule to keep up</text></svg>
