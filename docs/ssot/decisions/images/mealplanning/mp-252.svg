<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 406" width="100%" role="img" aria-label="Where Vana runs">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where Vana runs</text><line class="dg-edge" x1="155.5" y1="82" x2="195.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="263.6" y1="82" x2="230.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="186.4" y1="196" x2="146.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="241.2" y1="196" x2="279.3" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="94.5" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="142.5" y="62" text-anchor="middle">The app</text><rect class="dg-box" x="214.5" y="44" width="120" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="274.5" y="62" text-anchor="middle">The prototype</text><rect class="dg-box" x="95" y="140" width="239" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="214.5" y="158" text-anchor="middle">Three Supabase edge functions:</text><text x="214.5" y="176" text-anchor="middle">chat, action, day notes</text><rect class="dg-box" x="30" y="236" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="118" y="254" text-anchor="middle">Reads as the athlete:</text><text x="118" y="272" text-anchor="middle">row rules filter</text><rect class="dg-box" x="230" y="236" width="169" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="314.5" y="254" text-anchor="middle">Service key only:</text><text x="314.5" y="272" text-anchor="middle">call logs, pair</text><text x="314.5" y="290" text-anchor="middle">refresh, macro fills</text><rect class="dg-ex" x="16" y="326" width="397" height="68" rx="8"/><text class="dg-sub" x="28" y="348">Both clients use the same stream format.</text><text class="dg-sub" x="28" y="366">Lee sends a message: the chat function sees only Lee&#39;s rows.</text><text class="dg-sub" x="28" y="384">No Vercel service.</text></svg>
