chor="middle">vana-chat</text><rect class="dg-box" x="136" y="236" width="106" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="189" y="254" text-anchor="middle">vana-action</text><rect class="dg-box" x="266" y="236" width="127" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="329.5" y="254" text-anchor="middle">vana-day-notes</text><rect class="dg-box" x="99" y="332" width="211" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="204.5" y="350" text-anchor="middle">Database as the caller</text><text x="204.5" y="368" text-anchor="middle">row-level security filters</text><rect class="dg-box" x="120" y="428" width="169" height="74" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="204.5" y="446" text-anchor="middle">Service key only for</text><text x="204.5" y="464" text-anchor="middle">logs, pair refresh,</text><text x="204.5" y="482" text-anchor="middle">macro fills</text><rect class="dg-ex" x="16" y="518" width="377" height="68" rx="8"/><text class="dg-sub" x="28" y="540">Lee asks Vana: the app calls vana-chat as Lee.</text><text class="dg-sub" x="28" y="558">The query sees Lee&#39;s rows only; the call log line</text><text class="dg-sub" x="28" y="576">is the one write made with the service key.</text></svg>
