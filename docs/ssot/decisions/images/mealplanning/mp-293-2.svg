<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 335" width="100%" role="img" aria-label="The next conversation knows the last one">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The next conversation knows the last one</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Evening</text><text class="dg-sub" x="50" y="73">Athlete closes the Vana sheet;</text><text class="dg-sub" x="50" y="89">the app sends the idle signal</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Right after</text><text class="dg-sub" x="50" y="142">The server writes the Episode and any</text><text class="dg-sub" x="50" y="158">missed Memories, once</text><circle cx="30" cy="188" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="193" font-weight="700">Next morning</text><text class="dg-sub" x="50" y="211">The opener arrives at once and knows</text><text class="dg-sub" x="50" y="227">what last night established</text><rect class="dg-ex" x="16" y="255" width="384" height="68" rx="8"/><text class="dg-sub" x="28" y="277">A second idle signal for that conversation writes nothing.</text><text class="dg-sub" x="28" y="295">Idle is also sent when the app goes to the background</text><text class="dg-sub" x="28" y="313">or a new conversation starts.</text></svg>
