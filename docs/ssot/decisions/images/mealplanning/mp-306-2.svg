<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 388" width="100%" role="img" aria-label="The general opener reads the screen first">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The general opener reads the screen first</text><line class="dg-edge" x1="194.7" y1="82" x2="143.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="230.2" y1="82" x2="287.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="120.5" y1="196" x2="123.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="308.9" y1="196" x2="300.1" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="116.5" y="44" width="190" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="211.5" y="62" text-anchor="middle">Athlete opens the sheet</text><rect class="dg-box" x="27" y="140" width="183" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="118.5" y="158" text-anchor="middle">Screen names an event,</text><text x="118.5" y="176" text-anchor="middle">a meal or a session</text><rect class="dg-box" x="234" y="140" width="162" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="315" y="158" text-anchor="middle">Screen says nothing</text><text x="315" y="176" text-anchor="middle">useful</text><rect class="dg-box" x="55" y="236" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="125.5" y="254" text-anchor="middle">First line is</text><text x="125.5" y="272" text-anchor="middle">about that thing</text><rect class="dg-box" x="220" y="236" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="294" y="254" text-anchor="middle">The most relevant</text><text x="294" y="272" text-anchor="middle">personal thing</text><rect class="dg-ex" x="16" y="308" width="391" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Open the sheet on an event and Vana opens on that event.</text><text class="dg-sub" x="28" y="348">The three example chips are gone from the empty chat.</text><text class="dg-sub" x="28" y="366">Offline, rate limit and out-of-trial keep one outcome each.</text></svg>
