<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 370" width="100%" role="img" aria-label="How many servings a pick gets">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">How many servings a pick gets</text><line class="dg-edge" x1="246.1" y1="82" x2="213" y2="140" marker-end="url(#dg-arrow)"/><rect x="214.55" y="102" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="229.55" y="115" text-anchor="middle">yes</text><line class="dg-edge" x1="273.8" y1="82" x2="325.2" y2="140" marker-end="url(#dg-arrow)"/><rect x="288" y="102" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="299.5" y="115" text-anchor="middle">no</text><line class="dg-edge" x1="214.5" y1="196" x2="239.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="204" y="44" width="106" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="257" y="62" text-anchor="middle">Batch mode?</text><rect class="dg-box" x="116" y="140" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="197" y="158" text-anchor="middle">Servings = days / 3</text><text x="197" y="176" text-anchor="middle">rounded up</text><rect class="dg-box" x="302" y="140" width="96" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="350" y="158" text-anchor="middle">Per-day</text><text x="350" y="176" text-anchor="middle">1 serving</text><rect class="dg-box" x="183" y="236" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="257" y="254" text-anchor="middle">7 days -&gt; 3</text><text x="257" y="272" text-anchor="middle">10 -&gt; 4 · 14 -&gt; 5</text><rect class="dg-ex" x="16" y="308" width="482" height="50" rx="8"/><text class="dg-sub" x="28" y="330">A batch is three meals per type, one per cooking session</text><text class="dg-sub" x="28" y="348">No pick defaults to four any more — that was the fourteen-slot assumption</text></svg>
