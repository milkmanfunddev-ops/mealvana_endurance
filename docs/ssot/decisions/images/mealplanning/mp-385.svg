<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 658" width="100%" role="img" aria-label="A draft on the wire">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A draft on the wire</text><line class="dg-edge" x1="325" y1="100" x2="325" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="325" y1="196" x2="325" y2="236" marker-end="url(#dg-arrow)"/><rect x="310" y="207" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="325" y="220" text-anchor="middle">yes</text><line class="dg-edge" x1="325" y1="196" x2="325" y2="332" marker-end="url(#dg-arrow)"/><rect x="313.5" y="255" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="325" y="268" text-anchor="middle">no</text><line class="dg-edge" x1="325" y1="292" x2="325" y2="428" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="325" y1="388" x2="325" y2="524" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="240.5" y="44" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="325" y="62" text-anchor="middle">Editor sends</text><text x="325" y="80" text-anchor="middle">route + draft fields</text><rect class="dg-box" x="240.5" y="140" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="325" y="158" text-anchor="middle">Route declares</text><text x="325" y="176" text-anchor="middle">the formula section?</text><rect class="dg-box" x="226.5" y="236" width="197" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="325" y="254" text-anchor="middle">Validate: closed sets,</text><text x="325" y="272" text-anchor="middle">id shapes, caps, name 40</text><rect class="dg-box" x="240.5" y="332" width="169" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="325" y="350" text-anchor="middle">Draft dropped whole</text><text x="325" y="368" text-anchor="middle">no section, no error</text><rect class="dg-box" x="219.5" y="428" width="211" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="325" y="446" text-anchor="middle">FORMULA section</text><text x="325" y="464" text-anchor="middle">names resolved server-side</text><rect class="dg-box" x="237" y="524" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="325" y="542" text-anchor="middle">Rest of the Situation</text><text x="325" y="560" text-anchor="middle">still resolves</text><rect class="dg-ex" x="16" y="596" width="618" height="50" rx="8"/><text class="dg-sub" x="28" y="618">The editor route carries the draft; /food with a draft is dropped and still reports the screen</text><text class="dg-sub" x="28" y="636">Client sends food ids; the server reads their names under the athlete&#39;s own access</text></svg>
