<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 406" width="100%" role="img" aria-label="Budgets per turn and per athlete">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Budgets per turn and per athlete</text><line class="dg-edge" x1="181.9" y1="100" x2="144.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="234.1" y1="100" x2="271.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="142.4" y1="196" x2="176.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="273.6" y1="196" x2="239.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="130.5" y="44" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="208" y="62" text-anchor="middle">Athlete sends</text><text x="208" y="80" text-anchor="middle">at most 4 per 10 s</text><rect class="dg-box" x="41" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="118.5" y="158" text-anchor="middle">Planning turn</text><text x="118.5" y="176" text-anchor="middle">up to 6 tool steps</text><rect class="dg-box" x="220" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="297.5" y="158" text-anchor="middle">General turn</text><text x="297.5" y="176" text-anchor="middle">up to 8 tool steps</text><rect class="dg-box" x="106" y="236" width="204" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="208" y="254" text-anchor="middle">Answer</text><text x="208" y="272" text-anchor="middle">system prompt ~900 tokens</text><text x="208" y="290" text-anchor="middle">compact tool outputs</text><rect class="dg-ex" x="16" y="326" width="384" height="68" rx="8"/><text class="dg-sub" x="28" y="348">Sends at 0, 2, 4 and 6 s go through; a fifth at 8 s waits.</text><text class="dg-sub" x="28" y="366">A planning turn stops at its sixth tool step and answers;</text><text class="dg-sub" x="28" y="384">a general turn gets two more.</text></svg>
