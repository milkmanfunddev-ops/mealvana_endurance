<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377 370" width="100%" role="img" aria-label="How much one Vana turn may do">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">How much one Vana turn may do</text><line class="dg-edge" x1="162.4" y1="100" x2="125.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="214.6" y1="100" x2="251.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="127.8" y1="196" x2="169" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="249.2" y1="196" x2="208" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="111" y="44" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="188.5" y="62" text-anchor="middle">Athlete sends</text><text x="188.5" y="80" text-anchor="middle">at most 4 per 10 s</text><rect class="dg-box" x="21.5" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="99" y="158" text-anchor="middle">Planning turn</text><text x="99" y="176" text-anchor="middle">up to 6 tool steps</text><rect class="dg-box" x="200.5" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="278" y="158" text-anchor="middle">General turn</text><text x="278" y="176" text-anchor="middle">up to 8 tool steps</text><rect class="dg-box" x="132" y="236" width="113" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="188.5" y="254" text-anchor="middle">Vana answers</text><rect class="dg-ex" x="16" y="308" width="345" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Five sends inside 10 seconds: one more than allowed.</text><text class="dg-sub" x="28" y="348">Standing instructions stay near 900 tokens.</text></svg>
