<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 466" width="100%" role="img" aria-label="The budget for each turn">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The budget for each turn</text><line class="dg-edge" x1="183" y1="82" x2="183" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="156.9" y1="196" x2="119.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="209.1" y1="196" x2="246.4" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="122.3" y1="292" x2="163.5" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="243.7" y1="292" x2="202.5" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="88" y="44" width="190" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="183" y="62" text-anchor="middle">Athlete sends a message</text><rect class="dg-box" x="116" y="140" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="183" y="158" text-anchor="middle">At most 4 sends</text><text x="183" y="176" text-anchor="middle">per 10 seconds</text><rect class="dg-box" x="16" y="236" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="93.5" y="254" text-anchor="middle">Planning turn</text><text x="93.5" y="272" text-anchor="middle">up to 6 tool steps</text><rect class="dg-box" x="195" y="236" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="272.5" y="254" text-anchor="middle">General turn</text><text x="272.5" y="272" text-anchor="middle">up to 8 tool steps</text><rect class="dg-box" x="126.5" y="332" width="113" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="183" y="350" text-anchor="middle">Vana answers</text><rect class="dg-ex" x="16" y="404" width="334" height="50" rx="8"/><text class="dg-sub" x="28" y="426">System prompt about 900 tokens.</text><text class="dg-sub" x="28" y="444">Tool outputs kept compact.</text></svg>
