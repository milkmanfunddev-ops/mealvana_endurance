<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 484" width="100%" role="img" aria-label="What a call takes, and what comes back">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What a call takes, and what comes back</text><line class="dg-edge" x1="229.5" y1="100" x2="199.5" y2="140" marker-end="url(#dg-arrow)"/><rect x="199.5" y="111" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="214.5" y="124" text-anchor="middle">yes</text><line class="dg-edge" x1="278.6" y1="100" x2="318.9" y2="140" marker-end="url(#dg-arrow)"/><rect x="287.25" y="111" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="298.75" y="124" text-anchor="middle">no</text><line class="dg-edge" x1="199.5" y1="196" x2="229.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="189" y1="196" x2="240" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="197.5" y="44" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="250.5" y="62" text-anchor="middle">Call starts</text><text x="250.5" y="80" text-anchor="middle">wallet &gt; 0?</text><rect class="dg-box" x="94" y="140" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="178.5" y="158" text-anchor="middle">Reserve the estimate</text><text x="178.5" y="176" text-anchor="middle">or what is left</text><rect class="dg-box" x="287" y="140" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="347" y="158" text-anchor="middle">Empty wallet:</text><text x="347" y="176" text-anchor="middle">top-up sheet</text><rect class="dg-box" x="152" y="236" width="197" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="250.5" y="254" text-anchor="middle">Cost more:</text><text x="250.5" y="272" text-anchor="middle">take the rest, stop at 0</text><rect class="dg-box" x="159" y="332" width="183" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="250.5" y="350" text-anchor="middle">Cost less:</text><text x="250.5" y="368" text-anchor="middle">bought part back first</text><rect class="dg-ex" x="16" y="404" width="469" height="68" rx="8"/><text class="dg-sub" x="28" y="426">$0.05 left, estimate $0.08: the call runs on $0.05, the next is refused</text><text class="dg-sub" x="28" y="444">Reserved $0.08, cost $0.10: $0.02 more taken, wallet stops at $0</text><text class="dg-sub" x="28" y="462">Reserved $0.08, cost $0.03: $0.05 back, bought budget first</text></svg>
