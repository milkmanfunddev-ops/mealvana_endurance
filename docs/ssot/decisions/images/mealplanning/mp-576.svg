<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479 178" width="100%" role="img" aria-label="Screen only, or the wire too?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Screen only, or the wire too?</text><rect class="dg-box" x="16" y="44" width="219" height="114" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">Screen only (done)</text><line x1="28" y1="74" x2="223" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Row arrives: balance 3,000,000</text><text class="dg-sub" x="28" y="109">micro-dollars</text><text class="dg-sub" x="28" y="126">Phone shows 50% used</text><text class="dg-sub" x="28" y="143">Dollars still reach the phone</text><rect class="dg-box" x="251" y="44" width="212" height="114" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="263" y="66" font-weight="700">Wire too (new ticket)</text><line x1="263" y1="74" x2="451" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="263" y="92">Server sends only the shares:</text><text class="dg-sub" x="263" y="109">50% used, refills Oct 15</text><text class="dg-sub" x="263" y="126">No dollars reach the phone</text><text class="dg-sub" x="263" y="143">Needs a server change</text></svg>
