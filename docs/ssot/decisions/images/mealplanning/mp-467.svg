<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 274" width="100%" role="img" aria-label="Ticket 02: a ceiling on every key">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 02: a ceiling on every key</text><line class="dg-edge" x1="104" y1="100" x2="159" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="190.1" y1="100" x2="194.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="283.6" y1="100" x2="232.9" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="99" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="65.5" y="62" text-anchor="middle">Production</text><text x="65.5" y="80" text-anchor="middle">$150</text><rect class="dg-box" x="139" y="44" width="96" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="187" y="62" text-anchor="middle">Dev</text><text x="187" y="80" text-anchor="middle">$40</text><rect class="dg-box" x="259" y="44" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="319" y="62" text-anchor="middle">Evals, agents</text><text x="319" y="80" text-anchor="middle">$25</text><rect class="dg-box" x="109.5" y="140" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="197.5" y="158" text-anchor="middle">Hard stop at the cap:</text><text x="197.5" y="176" text-anchor="middle">&quot;Vana is unavailable&quot;</text><rect class="dg-ex" x="16" y="212" width="363" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Never the top-up sheet when the fault is ours.</text><text class="dg-sub" x="28" y="252">One exact AI SDK version in every function.</text></svg>
