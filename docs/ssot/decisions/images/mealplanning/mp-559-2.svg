<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 406" width="100%" role="img" aria-label="Annual on top, one Continue button">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Annual on top, one Continue button</text><rect class="dg-box" x="131" y="44" width="148" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="205" y="62" text-anchor="middle">Annual · Save 33%</text><text x="205" y="80" text-anchor="middle">$199.99 a year</text><text x="205" y="98" text-anchor="middle">$16.67 a month</text><rect class="dg-box" x="141.5" y="140" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="158" text-anchor="middle">Monthly</text><text x="205" y="176" text-anchor="middle">$24.99 a month</text><rect class="dg-box" x="157" y="236" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="205" y="254" text-anchor="middle">Continue</text><rect class="dg-ex" x="16" y="326" width="378" height="68" rx="8"/><text class="dg-sub" x="28" y="348">The billed price is printed larger than the per-month one</text><text class="dg-sub" x="28" y="366">Saving rounded down: 33.3% shows as 33%</text><text class="dg-sub" x="28" y="384">Terms and links stay in the scroll, not the glass tray</text></svg>
