<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 370" width="100%" role="img" aria-label="The pinned tray (glass)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The pinned tray (glass)</text><rect class="dg-box" x="58" y="44" width="204" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="62" text-anchor="middle">Annual: $199.99 a year</text><text x="160" y="80" text-anchor="middle">$16.67 a month · Save 33%</text><rect class="dg-box" x="65" y="140" width="190" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="158" text-anchor="middle">Monthly: $24.99 a month</text><rect class="dg-box" x="112" y="236" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="254" text-anchor="middle">Continue</text><rect class="dg-ex" x="16" y="308" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Saving rounded down: 33.3% shows as 33%</text><text class="dg-sub" x="28" y="348">Terms and links stay in the scroll</text></svg>
