<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 348" width="100%" role="img" aria-label="What we decided: two windows, worked out on the phone">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: two windows,</text><text class="dg-title" x="16" y="44">worked out on the phone</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="257"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="55" font-weight="700">Before the run</text><text class="dg-sub" x="50" y="73">Window open, run not started,</text><text class="dg-sub" x="50" y="89">no meal logged: &quot;Fuel tonight&#39;s run?&quot;</text><circle cx="30" cy="119" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="124" font-weight="700">Run starts</text><text class="dg-sub" x="50" y="142">Its start has passed:</text><text class="dg-sub" x="50" y="158">no pre-workout moment now</text><circle cx="30" cy="188" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="193" font-weight="700">After the run</text><text class="dg-sub" x="50" y="211">An hour of endurance, nothing logged:</text><text class="dg-sub" x="50" y="227">&quot;Recovery fuel?&quot;</text><circle cx="30" cy="257" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="262" font-weight="700">Any day</text><text class="dg-sub" x="50" y="280">Strength or import-only sessions:</text><text class="dg-sub" x="50" y="296">nothing</text></g></svg>
