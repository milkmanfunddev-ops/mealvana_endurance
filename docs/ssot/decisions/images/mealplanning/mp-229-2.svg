<text class="dg-title" x="16" y="24">This card&#39;s answer: plan beats</text><text class="dg-title" x="16" y="44">arrive as the opener</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="257"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="55" font-weight="700">Saturday</text><text class="dg-sub" x="50" y="73">Opens the app. Cook session tomorrow:</text><text class="dg-sub" x="50" y="89">Vana opens with a prep-day check-in</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">Saturday, later</text><text class="dg-sub" x="50" y="142">Opens again: the check-in is stamped</text><text class="dg-sub" x="50" y="158">and does not repeat</text><circle cx="30" cy="188" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="193" font-weight="700">Up to 14 days</text><text class="dg-sub" x="50" y="211">A finished week not yet debriefed:</text><text class="dg-sub" x="50" y="227">debrief as the next opener</text><circle cx="30" cy="257" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="262" font-weight="700">18:00</text><text class="dg-sub" x="50" y="280">Local notification exists, off by default</text></g></svg>
