<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449 254" width="100%" role="img" aria-label="Where the launcher shows">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where the launcher shows</text><rect class="dg-box" x="34" y="44" width="206" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="46" y="66" font-weight="700">Before: a deny-list</text><line x1="46" y1="74" x2="228" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="46" y="92">Shows everywhere except</text><text class="dg-sub" x="46" y="109">auth and paywall screens</text><text class="dg-sub" x="46" y="126">and thirty flow patterns,</text><text class="dg-sub" x="46" y="143">plus three route workarounds</text><rect class="dg-box" x="256" y="44" width="159" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="268" y="66" font-weight="700">Now: three screens</text><line x1="268" y1="74" x2="403" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="268" y="92">Main tabs</text><text class="dg-sub" x="268" y="109">Meal-planning screen</text><text class="dg-sub" x="268" y="126">Coach formulas</text><text class="dg-sub" x="268" y="143">Nowhere else</text><rect class="dg-ex" x="16" y="174" width="417" height="68" rx="8"/><text class="dg-sub" x="28" y="196">Launcher on the Timeline, the Food tab and the formula library.</text><text class="dg-sub" x="28" y="214">A form pushed over any of them hides it.</text><text class="dg-sub" x="28" y="232">The deny lists and the three workarounds are deleted.</text></svg>
