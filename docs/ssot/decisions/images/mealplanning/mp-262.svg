<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 598" width="100%" role="img" aria-label="Two ratifiers, one portable record">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Two ratifiers, one portable record</text><line class="dg-edge" x1="151.5" y1="82" x2="182" y2="140" marker-end="url(#dg-arrow)"/><rect x="138.75" y="102" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="166.75" y="115" text-anchor="middle">approve</text><line class="dg-edge" x1="251.5" y1="82" x2="221" y2="140" marker-end="url(#dg-arrow)"/><rect x="208.25" y="102" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="236.25" y="115" text-anchor="middle">approve</text><line class="dg-edge" x1="173.9" y1="214" x2="157.4" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="201.5" y1="214" x2="201.5" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="93.5" y="44" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="141.5" y="62" text-anchor="middle">Lee</text><rect class="dg-box" x="213.5" y="44" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="261.5" y="62" text-anchor="middle">Xuan</text><rect class="dg-box" x="120.5" y="140" width="162" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="201.5" y="158" text-anchor="middle">Decisions page</text><text x="201.5" y="176" text-anchor="middle">docs/ssot/decisions</text><text x="201.5" y="194" text-anchor="middle">in the app repo</text><rect class="dg-box" x="55.5" y="236" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="136.5" y="254" text-anchor="middle">Settled once either</text><text x="136.5" y="272" text-anchor="middle">has approved</text><rect class="dg-box" x="241.5" y="236" width="106" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="294.5" y="254" text-anchor="middle">QA repo</text><text x="294.5" y="272" text-anchor="middle">not touched</text><rect class="dg-box" x="117" y="332" width="169" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="201.5" y="350" text-anchor="middle">Prototype repo</text><text x="201.5" y="368" text-anchor="middle">no TypeScript copied</text><rect class="dg-box" x="103" y="428" width="197" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="201.5" y="446" text-anchor="middle">Any other laptop opens</text><text x="201.5" y="464" text-anchor="middle">the same page and skills</text><rect class="dg-ex" x="16" y="518" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="540">Xuan approves mp-262 from her laptop on 15 Sep: settled.</text><text class="dg-sub" x="28" y="558">Lee&#39;s laptop shows the same verdict; QA repo unchanged.</text><text class="dg-sub" x="28" y="576">SQL migrations live in the app repo, not the prototype.</text></svg>
