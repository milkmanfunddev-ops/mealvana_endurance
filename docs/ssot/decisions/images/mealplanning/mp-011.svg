<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 236" width="100%" role="img" aria-label="Proposed, then rejected: lengths per turn">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: lengths per turn</text><rect class="dg-box" x="16" y="44" width="206" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Proposed (rejected)</text><line x1="28" y1="74" x2="210" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Picking: at most 2 sentences</text><text class="dg-sub" x="28" y="109">Presenting: up to 4,</text><text class="dg-sub" x="28" y="126">with one athlete fact</text><text class="dg-sub" x="28" y="143">Explaining: no limit</text><rect class="dg-box" x="238" y="44" width="180" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="250" y="66" font-weight="700">Decided instead</text><line x1="250" y1="74" x2="406" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="250" y="92">Short and to the point</text><text class="dg-sub" x="250" y="109">No sentence count</text><text class="dg-sub" x="250" y="126">No required athlete fact</text><text class="dg-sub" x="250" y="143">Emoji banned everywhere</text><rect class="dg-ex" x="16" y="174" width="402" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Both: one exclamation mark for a milestone,</text><text class="dg-sub" x="28" y="214">no weight talk, medical questions sent to a professional.</text></svg>
