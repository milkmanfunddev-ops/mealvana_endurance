<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 455" width="100%" role="img" aria-label="One column, two summaries">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One column, two summaries</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="326"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="55" font-weight="700">30</text><text class="dg-sub" x="50" y="73">Lead write in the background:</text><text class="dg-sub" x="50" y="89">summary of messages 1 to 20</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">40</text><text class="dg-sub" x="50" y="142">Applied: summary through 20</text><text class="dg-sub" x="50" y="158">plus messages 21 to 40 verbatim</text><circle cx="30" cy="188" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="193" font-weight="700">50</text><text class="dg-sub" x="50" y="211">Lead write: summary through 40,</text><text class="dg-sub" x="50" y="227">kept beside the one through 20</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">60</text><text class="dg-sub" x="50" y="280">Applied: rolled summary through 40</text><text class="dg-sub" x="50" y="296">plus 41 to 60 verbatim</text><circle cx="30" cy="326" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="331" font-weight="700">61</text><text class="dg-sub" x="50" y="349">Rolled summary plus 21 verbatim;</text><text class="dg-sub" x="50" y="365">boundaries stay at multiples of 20</text><rect class="dg-ex" x="16" y="393" width="540" height="50" rx="8"/><text class="dg-sub" x="28" y="415">summary_index 40; column holds &quot;Through message 20: …&quot; and &quot;Through message 40: …&quot;</text><text class="dg-sub" x="28" y="433">Nothing stored by 40: all verbatim, and the turn writes the catch-up</text></svg>
