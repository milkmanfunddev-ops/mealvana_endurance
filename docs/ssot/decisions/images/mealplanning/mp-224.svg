<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 387 484" width="100%" role="img" aria-label="Window length and session end">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Window length and session end</text><line class="dg-edge" x1="101.1" y1="100" x2="106.9" y2="140" marker-end="url(#dg-arrow)"/><rect x="82.5" y="111" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="104" y="124" text-anchor="middle">first</text><line class="dg-edge" x1="232.8" y1="100" x2="161.2" y2="140" marker-end="url(#dg-arrow)"/><rect x="166" y="111" width="62" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="197" y="124" text-anchor="middle">fallback</text><line class="dg-edge" x1="113" y1="196" x2="116" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="199" y1="264" x2="223" y2="264" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="209.1" y1="332" x2="284.9" y2="196" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect class="dg-box" x="19.5" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="97" y="62" text-anchor="middle">Stored pre-workout</text><text x="97" y="80" text-anchor="middle">minutes</text><rect class="dg-box" x="198.5" y="44" width="169" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="283" y="62" text-anchor="middle">Authority default</text><text x="283" y="80" text-anchor="middle">duration + intensity</text><rect class="dg-box" x="16" y="140" width="190" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="111" y="158" text-anchor="middle">Window length</text><text x="111" y="176" text-anchor="middle">clamped if created late</text><rect class="dg-box" x="230" y="140" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="300.5" y="158" text-anchor="middle">Session end</text><text x="300.5" y="176" text-anchor="middle">start + duration</text><rect class="dg-box" x="37" y="236" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="118" y="254" text-anchor="middle">Device sends window</text><text x="118" y="272" text-anchor="middle">to the server</text><rect class="dg-box" x="223" y="236" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="286.5" y="254" text-anchor="middle">Vana names the</text><text x="286.5" y="272" text-anchor="middle">same window</text><rect class="dg-box" x="112.5" y="332" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="193.5" y="350" text-anchor="middle">Completed timestamp</text><text x="193.5" y="368" text-anchor="middle">never read</text><rect class="dg-ex" x="16" y="404" width="355" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Ride created 4:50 pm for 5:00, window 90 min:</text><text class="dg-sub" x="28" y="444">clamped, opens at 4:50 pm, not 3:30.</text><text class="dg-sub" x="28" y="462">Started 5:04, ran 58 min: session ends 6:02 pm.</text></svg>
