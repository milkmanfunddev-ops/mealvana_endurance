<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507 370" width="100%" role="img" aria-label="An idle signal">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An idle signal</text><line class="dg-edge" x1="248.5" y1="72" x2="272.5" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="167.4" y1="100" x2="157.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="206.5" y1="168" x2="230.5" y2="168" marker-end="url(#dg-arrow)"/><rect x="203.5" y="159" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="218.5" y="172" text-anchor="middle">yes</text><line class="dg-edge" x1="153.1" y1="196" x2="157.4" y2="236" marker-end="url(#dg-arrow)"/><rect x="143.75" y="207" width="23" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="155.25" y="220" text-anchor="middle">no</text><line class="dg-edge" x1="325.1" y1="196" x2="329.4" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="100.5" y="44" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="174.5" y="62" text-anchor="middle">App: sheet closed</text><text x="174.5" y="80" text-anchor="middle">idle: true</text><rect class="dg-box" x="272.5" y="44" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="339.5" y="62" text-anchor="middle">202 at once</text><text x="339.5" y="80" text-anchor="middle">conversation id</text><rect class="dg-box" x="93.5" y="140" width="113" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="150" y="158" text-anchor="middle">read_back_at</text><text x="150" y="176" text-anchor="middle">claim free?</text><rect class="dg-box" x="230.5" y="140" width="183" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="322" y="158" text-anchor="middle">Background write</text><text x="322" y="176" text-anchor="middle">episode + missed notes</text><rect class="dg-box" x="93.5" y="236" width="134" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="160.5" y="254" text-anchor="middle">Already claimed</text><text x="160.5" y="272" text-anchor="middle">writes nothing</text><rect class="dg-box" x="251.5" y="236" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="332.5" y="254" text-anchor="middle">Failed or too short</text><text x="332.5" y="272" text-anchor="middle">claim released</text><rect class="dg-ex" x="16" y="308" width="475" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Sheet closed at night: 202 in the same call, episode lands on DEV</text><text class="dg-sub" x="28" y="348">Second close, same conversation: claim taken, nothing written, no credit</text></svg>
