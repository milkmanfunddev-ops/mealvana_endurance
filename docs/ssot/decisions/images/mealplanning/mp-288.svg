<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 580" width="100%" role="img" aria-label="Idle rides the chat call">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Idle rides the chat call</text><line class="dg-edge" x1="145.8" y1="82" x2="140.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="259.5" y1="100" x2="160" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="190.5" y1="196" x2="160.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="137.5" y1="292" x2="134.5" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="184.6" y1="292" x2="248.9" y2="332" marker-end="url(#dg-arrow)"/><rect x="169.25" y="303" width="95" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="216.75" y="316" text-anchor="middle">second signal</text><line class="dg-edge" x1="150" y1="292" x2="201" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="90" y="44" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="146.5" y="62" text-anchor="middle">Sheet closes</text><rect class="dg-box" x="227" y="44" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="280" y="62" text-anchor="middle">App goes to</text><text x="280" y="80" text-anchor="middle">background</text><rect class="dg-box" x="141" y="140" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="211.5" y="158" text-anchor="middle">New conversation</text><text x="211.5" y="176" text-anchor="middle">starts</text><rect class="dg-box" x="62" y="236" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="139.5" y="254" text-anchor="middle">Chat call with</text><text x="139.5" y="272" text-anchor="middle">idle flag, no wait</text><rect class="dg-box" x="241" y="236" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="301" y="254" text-anchor="middle">Separate idle</text><text x="301" y="272" text-anchor="middle">endpoint</text><rect class="dg-box" x="62" y="332" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="132.5" y="350" text-anchor="middle">No episode yet:</text><text x="132.5" y="368" text-anchor="middle">server writes it</text><rect class="dg-box" x="227" y="332" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="294" y="350" text-anchor="middle">Episode exists:</text><text x="294" y="368" text-anchor="middle">writes nothing</text><rect class="dg-box" x="130.5" y="428" width="162" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="211.5" y="446" text-anchor="middle">Offline: dropped,</text><text x="211.5" y="464" text-anchor="middle">read back next open</text><rect class="dg-ex" x="16" y="500" width="391" height="68" rx="8"/><text class="dg-sub" x="28" y="522">Dana closes the sheet 19:02: flag sent, sheet gone at once.</text><text class="dg-sub" x="28" y="540">Backgrounds the app 19:03: second flag, episode exists.</text><text class="dg-sub" x="28" y="558">On a plane: flag dropped; notes were saved in the turn.</text></svg>
