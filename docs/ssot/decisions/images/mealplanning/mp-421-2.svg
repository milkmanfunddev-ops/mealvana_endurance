<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 352" width="100%" role="img" aria-label="What the opener speaks to first">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the opener speaks to first</text><line class="dg-edge" x1="211.5" y1="100" x2="211.5" y2="140" marker-end="url(#dg-arrow)"/><rect x="177" y="111" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="211.5" y="124" text-anchor="middle">none live</text><line class="dg-edge" x1="211.5" y1="196" x2="211.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="161" y="207" width="101" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="211.5" y="220" text-anchor="middle">nothing useful</text><rect class="dg-box" x="130.5" y="44" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="211.5" y="62" text-anchor="middle">1. A live moment</text><text x="211.5" y="80" text-anchor="middle">(a fuelling window)</text><rect class="dg-box" x="102.5" y="140" width="218" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="211.5" y="158" text-anchor="middle">2. The screen underneath,</text><text x="211.5" y="176" text-anchor="middle">if it says something useful</text><rect class="dg-box" x="120" y="236" width="183" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="211.5" y="254" text-anchor="middle">3. The personal opener</text><rect class="dg-ex" x="16" y="308" width="391" height="32" rx="8"/><text class="dg-sub" x="28" y="330">Plan tab with a plan: the plan. Formula editor: the formula</text></svg>
