<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 388" width="100%" role="img" aria-label="The prompt, turn after turn">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The prompt, turn after turn</text><line class="dg-edge" x1="112" y1="63" x2="136" y2="63" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="232" y1="63" x2="256" y2="63" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="275.2" y1="82" x2="150.8" y2="140" marker-end="url(#dg-arrow)"/><rect x="149.5" y="102" width="127" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="213" y="115" text-anchor="middle">cached prefix ends</text><line class="dg-edge" x1="158" y1="162" x2="182" y2="163.4" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="212.7" y1="236" x2="304.7" y2="82" marker-end="url(#dg-arrow)"/><rect x="166.2" y="150" width="185" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="258.7" y="163" text-anchor="middle">not taken: breaks the cache</text><rect class="dg-box" x="16" y="44" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="64" y="62" text-anchor="middle">Tools</text><rect class="dg-box" x="136" y="44" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="184" y="62" text-anchor="middle">Persona</text><rect class="dg-box" x="256" y="44" width="120" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="316" y="62" text-anchor="middle">Context block</text><rect class="dg-box" x="62" y="140" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="110" y="158" text-anchor="middle">Messages</text><rect class="dg-box" x="182" y="140" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="256" y="158" text-anchor="middle">Last user message</text><text x="256" y="176" text-anchor="middle">+ [SITUATION ...]</text><rect class="dg-box" x="125.5" y="236" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="196" y="254" text-anchor="middle">Situation in the</text><text x="196" y="272" text-anchor="middle">system prompt</text><rect class="dg-ex" x="16" y="308" width="360" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Turn 2, 07:40, after a ride:</text><text class="dg-sub" x="28" y="348">system prompt identical to turn 1</text><text class="dg-sub" x="28" y="366">last message ends: [SITUATION right now they are ...]</text></svg>
