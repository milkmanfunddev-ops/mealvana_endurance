<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 263" width="100%" role="img" aria-label="This card&#39;s answer: freeze, then sweep">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: freeze, then</text><text class="dg-title" x="16" y="44">sweep</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="172"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Night 1</text><text class="dg-sub" x="50" y="73">Finished weeks are frozen into the rollup</text><text class="dg-sub" x="50" y="89">while all their raw rows are still there</text><circle cx="30" cy="119" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="124" font-weight="700">Then</text><text class="dg-sub" x="50" y="142">Raw rows older than 90 days are deleted</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Each night</text><text class="dg-sub" x="50" y="195">A week missing raw rows is not rewritten:</text><text class="dg-sub" x="50" y="211">it keeps its full figure</text></g></svg>
