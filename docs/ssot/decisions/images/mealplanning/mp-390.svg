<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 370" width="100%" role="img" aria-label="What coverage counts">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What coverage counts</text><line class="dg-edge" x1="211.8" y1="100" x2="165.8" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="276.2" y1="100" x2="322.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="141.5" y1="178" x2="133.7" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="340.8" y1="178" x2="331.2" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="159.5" y="44" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="244" y="62" text-anchor="middle">Denominator</text><text x="244" y="80" text-anchor="middle">days x types planned</text><rect class="dg-box" x="56" y="140" width="176" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="144" y="158" text-anchor="middle">Batch: count servings</text><rect class="dg-box" x="256" y="140" width="176" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="344" y="158" text-anchor="middle">Per-day: count nights</text><rect class="dg-box" x="59.5" y="236" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="130" y="254" text-anchor="middle">Explicit walk</text><text x="130" y="272" text-anchor="middle">widens the types</text><rect class="dg-box" x="224.5" y="236" width="204" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="326.5" y="254" text-anchor="middle">No walk set</text><text x="326.5" y="272" text-anchor="middle">dinner + lunch, as before</text><rect class="dg-ex" x="16" y="308" width="456" height="50" rx="8"/><text class="dg-sub" x="28" y="330">10 days, dinners and lunches: 20 slots, servings counted against them</text><text class="dg-sub" x="28" y="348">An athlete who never set a walk sees the numbers they saw before</text></svg>
