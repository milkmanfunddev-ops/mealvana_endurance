<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 237" width="100%" role="img" aria-label="Confirm the email before or after grace?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Confirm the email before or after grace?</text><rect class="dg-box" x="16" y="44" width="201" height="97" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">A: let it in unconfirmed</text><line x1="28" y1="74" x2="205" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Signs up by email</text><text class="dg-sub" x="28" y="109">The redirect lets the</text><text class="dg-sub" x="28" y="126">unconfirmed account in</text><rect class="dg-box" x="233" y="44" width="215" height="97" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="245" y="66" font-weight="700">B: confirm after the claim</text><line x1="245" y1="74" x2="436" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="245" y="92">Signs up by email</text><text class="dg-sub" x="245" y="109">Legacy grace claimed first</text><text class="dg-sub" x="245" y="126">Asked to confirm after that</text><rect class="dg-ex" x="16" y="157" width="432" height="68" rx="8"/><text class="dg-sub" x="28" y="179">Old install from 20 July signs up by email on 2 October.</text><text class="dg-sub" x="28" y="197">Today, with confirmation on, it would be sent back</text><text class="dg-sub" x="28" y="215">to sign-up and the claim refused.</text></svg>
