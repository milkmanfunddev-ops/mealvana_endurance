<text class="dg-title" x="16" y="24">This card&#39;s answer: a button only for a</text><text class="dg-title" x="16" y="44">named thing</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="225"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Ask</text><text class="dg-sub" x="50" y="73">Athlete: &quot;help me carb load&quot;</text><text class="dg-sub" x="50" y="89">(no event named)</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Vana</text><text class="dg-sub" x="50" y="142">Asks which event, offers no button yet</text><circle cx="30" cy="172" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="177" font-weight="700">Named</text><text class="dg-sub" x="50" y="195">Athlete names the event</text><circle cx="30" cy="225" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="230" font-weight="700">Button</text><text class="dg-sub" x="50" y="248">Opens the carb-loading picks</text><text class="dg-sub" x="50" y="264">for that event</text><rect class="dg-ex" x="16" y="292" width="378" height="32" rx="8"/><text class="dg-sub" x="28" y="314">Fuelling button: edits the named workout, never adds one.</text></g></svg>
