<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 256" width="100%" role="img" aria-label="Proposed, then rejected: plan in full screen">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: plan in full</text><text class="dg-title" x="16" y="44">screen</text><g transform="translate(0 20)"><rect class="dg-box" x="16" y="44" width="167" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="28" y="66" font-weight="700">Proposed</text><line x1="28" y1="74" x2="171" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Athlete picks a meal</text><text class="dg-sub" x="28" y="109">in the sheet: the</text><text class="dg-sub" x="28" y="126">full-screen chat opens</text><text class="dg-sub" x="28" y="143">to hold the plan</text><rect class="dg-box" x="199" y="44" width="161" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="211" y="66" font-weight="700">Decided (mp-265)</text><line x1="211" y1="74" x2="348" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="211" y="92">Vana offers a button</text><text class="dg-sub" x="211" y="109">to the meal-planning</text><text class="dg-sub" x="211" y="126">page; the sheet keeps</text><text class="dg-sub" x="211" y="143">one height</text><rect class="dg-ex" x="16" y="174" width="344" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Athlete asks for a week of dinners: one tap on</text><text class="dg-sub" x="28" y="214">Vana&#39;s button opens the meal-planning page.</text></g></svg>
