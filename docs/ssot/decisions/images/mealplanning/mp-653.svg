<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 539 640" width="100%" role="img" aria-label="Where an idea Finding goes at triage">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where an idea Finding goes at triage</text><line class="dg-edge" x1="269.5" y1="82" x2="269.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="269.5" y1="178" x2="269.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="261" y="198" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="269.5" y="211" text-anchor="middle">A</text><line class="dg-edge" x1="269.5" y1="178" x2="269.5" y2="332" marker-end="url(#dg-arrow)"/><rect x="261" y="246" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="269.5" y="259" text-anchor="middle">B</text><line class="dg-edge" x1="269.5" y1="178" x2="269.5" y2="428" marker-end="url(#dg-arrow)"/><rect x="261" y="294" width="17" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="269.5" y="307" text-anchor="middle">C</text><line class="dg-edge" x1="269.5" y1="274" x2="269.5" y2="524" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="269.5" y1="370" x2="269.5" y2="524" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="269.5" y1="466" x2="269.5" y2="524" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="101" y="44" width="337" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269.5" y="62" text-anchor="middle">Idea Finding: &#39;show the plan&#39;s cost per day&#39;</text><rect class="dg-box" x="153.5" y="140" width="232" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269.5" y="158" text-anchor="middle">Triage with Lee, after wave 3</text><rect class="dg-box" x="108" y="236" width="323" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269.5" y="254" text-anchor="middle">A: becomes a proposal card, Finding closed</text><rect class="dg-box" x="143" y="332" width="253" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269.5" y="350" text-anchor="middle">B: won&#39;t-fix unless Lee picks it</text><rect class="dg-box" x="129" y="428" width="281" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269.5" y="446" text-anchor="middle">C: stays triaged, loop ignores ideas</text><rect class="dg-box" x="83.5" y="524" width="372" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="269.5" y="542" text-anchor="middle">Loop can finish once bugs and follow-ups are done</text><rect class="dg-ex" x="16" y="578" width="507" height="50" rx="8"/><text class="dg-sub" x="28" y="600">Today: 12 bugs closed, 1 idea at &#39;triaged&#39; -&gt; index exits 1, loop never ends.</text><text class="dg-sub" x="28" y="618">Any of A, B or C lets it exit 0.</text></svg>
