<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 263" width="100%" role="img" aria-label="Other option: if the flip were 1 Oct 00:00 UTC">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Other option: if the flip were 1</text><text class="dg-title" x="16" y="44">Oct 00:00 UTC</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="172"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">30 Sep 7 pm</text><text class="dg-sub" x="50" y="73">Cut-off passes (7 pm Central).</text><text class="dg-sub" x="50" y="89">No paywall yet</text><circle cx="30" cy="119" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="124" font-weight="700">30 Sep 8 pm</text><text class="dg-sub" x="50" y="142">Athlete makes an account</text><circle cx="30" cy="172" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="177" font-weight="700">1 Oct 9 am</text><text class="dg-sub" x="50" y="195">Lee switches the paywall on.</text><text class="dg-sub" x="50" y="211">The athlete gets no grace month</text></g></svg>
