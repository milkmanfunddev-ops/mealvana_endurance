<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 259" width="100%" role="img" aria-label="If meal logging moved off Sonnet now (rejected)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">If meal logging moved off Sonnet now (rejected)</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="55" font-weight="700">Now</text><text class="dg-sub" x="50" y="73">Build a 50-meal test to find a cheaper</text><text class="dg-sub" x="50" y="89">model for the described meal and photo</text><circle cx="30" cy="119" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="124" font-weight="700">Then</text><text class="dg-sub" x="50" y="142">Athlete describes a meal: the cheapest</text><text class="dg-sub" x="50" y="158">model that passed reads it</text><circle cx="30" cy="188" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="193" font-weight="700">Saving</text><text class="dg-sub" x="50" y="211">About 40 to 57 cents per athlete a month,</text><text class="dg-sub" x="50" y="227">for a model the athlete&#39;s meals depend on</text></svg>
