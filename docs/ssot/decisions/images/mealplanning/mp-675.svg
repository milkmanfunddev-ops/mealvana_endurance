<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 531 235" width="100%" role="img" aria-label="What an earlier plan can do">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What an earlier plan can do</text><rect class="dg-box" x="16" y="44" width="225" height="131" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: view only</text><line x1="28" y1="74" x2="229" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Open week of 14 Sep: view only</text><text class="dg-sub" x="28" y="109">Reuse: only &quot;same as last time&quot;</text><text class="dg-sub" x="28" y="126">(copies the newest plan)</text><text class="dg-sub" x="28" y="143">No edit, rename or delete</text><rect class="dg-box" x="257" y="44" width="258" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="269" y="66" font-weight="700">This card&#39;s answer: a list</text><line x1="269" y1="74" x2="503" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="269" y="92">Open week of 14 Sep: edit,</text><text class="dg-sub" x="269" y="109">rename or delete it</text><text class="dg-sub" x="269" y="126">Use this plan again: a draft</text><text class="dg-sub" x="269" y="143">for week of 4 Oct, same 4 dinners</text><text class="dg-sub" x="269" y="160">Confirm: it becomes this week&#39;s plan</text><rect class="dg-ex" x="16" y="191" width="499" height="32" rx="8"/><text class="dg-sub" x="28" y="213">5 Oct: the 14 Sep plan stays in the list as it was.</text></svg>
