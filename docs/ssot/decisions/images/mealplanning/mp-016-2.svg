<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 312" width="100%" role="img" aria-label="Which text is kept when the transcript is stored">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Which text is kept when the transcript is stored</text><line class="dg-edge" x1="163.7" y1="100" x2="116.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="221.3" y1="100" x2="256" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="94.1" y1="178" x2="96.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="275.7" y1="178" x2="285.3" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="123" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="197" y="62" text-anchor="middle">Vana writes text,</text><text x="197" y="80" text-anchor="middle">then calls a tool</text><rect class="dg-box" x="30" y="140" width="127" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="93.5" y="158" text-anchor="middle">Any other tool</text><rect class="dg-box" x="181" y="140" width="183" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="272.5" y="158" text-anchor="middle">Only a choice question</text><rect class="dg-box" x="16" y="236" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="97" y="254" text-anchor="middle">Text dropped</text><text x="97" y="272" text-anchor="middle">from the transcript</text><rect class="dg-box" x="202" y="236" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="290" y="254" text-anchor="middle">Text kept.</text><text x="290" y="272" text-anchor="middle">Still there on reload</text></svg>
