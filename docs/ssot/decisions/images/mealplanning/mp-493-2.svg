<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 352" width="100%" role="img" aria-label="One paywall, two ways in">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One paywall, two ways in</text><line class="dg-edge" x1="211.5" y1="100" x2="211.5" y2="140" marker-end="url(#dg-arrow)"/><rect x="170.5" y="111" width="82" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="211.5" y="124" text-anchor="middle">slides over</text><line class="dg-edge" x1="183.4" y1="196" x2="143.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="240.7" y1="196" x2="282.3" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="109.5" y="44" width="204" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="211.5" y="62" text-anchor="middle">About 4 s clip of our app</text><text x="211.5" y="80" text-anchor="middle">in a phone frame</text><rect class="dg-box" x="120" y="140" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="211.5" y="158" text-anchor="middle">Features, plans pinned</text><text x="211.5" y="176" text-anchor="middle">above one Continue</text><rect class="dg-box" x="27" y="236" width="176" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="115" y="254" text-anchor="middle">Never subscribed:</text><text x="115" y="272" text-anchor="middle">full screen, no close</text><rect class="dg-box" x="227" y="236" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="311.5" y="254" text-anchor="middle">Lapsed: a sheet over</text><text x="311.5" y="272" text-anchor="middle">the app, can close</text><rect class="dg-ex" x="16" y="308" width="391" height="32" rx="8"/><text class="dg-sub" x="28" y="330">1 Oct: annual picked, $99.99 a year, $8.33 a month, 33% off</text></svg>
