<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 274" width="100%" role="img" aria-label="Ticket 12: picker chips">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 12: picker chips</text><line class="dg-edge" x1="198.3" y1="82" x2="148.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="230.1" y1="82" x2="277.6" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="137" y="44" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="214.5" y="62" text-anchor="middle">Tap &quot;I like these&quot;</text><rect class="dg-box" x="51" y="140" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="125" y="158" text-anchor="middle">Next is a picker:</text><text x="125" y="176" text-anchor="middle">no model</text><rect class="dg-box" x="223" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="300.5" y="158" text-anchor="middle">Next is a question</text><text x="300.5" y="176" text-anchor="middle">or wrap-up: Vana</text><rect class="dg-ex" x="16" y="212" width="397" height="50" rx="8"/><text class="dg-sub" x="28" y="234">&quot;Other options&quot;, &quot;No recipe only&quot;, &quot;Under 20 min&quot;: no model.</text><text class="dg-sub" x="28" y="252">&quot;Different protein&quot; stays with Vana.</text></svg>
