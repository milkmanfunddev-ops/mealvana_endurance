<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 580" width="100%" role="img" aria-label="Bytes and counts, not dollars">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Bytes and counts, not dollars</text><line class="dg-edge" x1="128" y1="100" x2="186.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="283.6" y1="100" x2="130.9" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="214.1" y1="196" x2="289.9" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="271.1" y1="388" x2="221.9" y2="428" marker-end="url(#dg-arrow)"/><rect x="196" y="399" width="101" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="246.5" y="412" text-anchor="middle">never asserted</text><rect class="dg-box" x="24.5" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="116" y="62" text-anchor="middle">Context block</text><text x="116" y="80" text-anchor="middle">built twice, no writes</text><rect class="dg-box" x="231.5" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="302" y="62" text-anchor="middle">History replayed</text><text x="302" y="80" text-anchor="middle">at 39, 40, 61</text><rect class="dg-box" x="145.5" y="140" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="158" text-anchor="middle">Eval case,</text><text x="198.5" y="176" text-anchor="middle">second turn</text><rect class="dg-box" x="100" y="236" width="197" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="198.5" y="254" text-anchor="middle">Byte-identical;</text><text x="198.5" y="272" text-anchor="middle">write or new day differs</text><rect class="dg-box" x="17.5" y="332" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="112.5" y="350" text-anchor="middle">Verbatim; summary + 20;</text><text x="112.5" y="368" text-anchor="middle">rolled summary + 20</text><rect class="dg-box" x="231.5" y="332" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="305.5" y="350" text-anchor="middle">Cache-read tokens</text><text x="305.5" y="368" text-anchor="middle">above zero</text><rect class="dg-box" x="114" y="428" width="169" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="198.5" y="446" text-anchor="middle">Dollar cost per turn</text><rect class="dg-ex" x="16" y="500" width="365" height="68" rx="8"/><text class="dg-sub" x="28" y="522">39 messages: all verbatim. 40: one summary plus 20.</text><text class="dg-sub" x="28" y="540">61: one rolled summary plus 20; turn returns first.</text><text class="dg-sub" x="28" y="558">Eval case 7, turn two reads 0 cache tokens: case fails.</text></svg>
