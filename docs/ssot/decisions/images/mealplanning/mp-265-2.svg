<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 390" width="100%" role="img" aria-label="This card&#39;s answer: where each ask goes">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: where each ask</text><text class="dg-title" x="16" y="44">goes</text><g transform="translate(0 20)"><line class="dg-edge" x1="164" y1="66.7" x2="188" y2="67.9" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160.5" y1="162.6" x2="184.5" y2="163.9" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="171" y1="258.9" x2="195" y2="260.1" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="23" y="44" width="141" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="93.5" y="62" text-anchor="middle">Question or chat</text><rect class="dg-box" x="188" y="44" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="265.5" y="62" text-anchor="middle">Stays in the sheet</text><text x="265.5" y="80" text-anchor="middle">(one height)</text><rect class="dg-box" x="26.5" y="140" width="134" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="93.5" y="158" text-anchor="middle">&quot;Plan my meals&quot;</text><rect class="dg-box" x="184.5" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="262" y="158" text-anchor="middle">Button to the</text><text x="262" y="176" text-anchor="middle">meal-planning page</text><rect class="dg-box" x="16" y="236" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="93.5" y="254" text-anchor="middle">Full-screen button</text><rect class="dg-box" x="195" y="236" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="272.5" y="254" text-anchor="middle">Same conversation,</text><text x="272.5" y="272" text-anchor="middle">bigger</text><rect class="dg-ex" x="16" y="308" width="334" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Fuelling a workout: new-activity screen.</text><text class="dg-sub" x="28" y="348">Planning an event: event screen.</text></g></svg>
