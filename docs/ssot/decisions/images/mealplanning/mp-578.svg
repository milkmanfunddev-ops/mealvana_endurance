<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479 201" width="100%" role="img" aria-label="Keep the sliver pack, or hide it?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Keep the sliver pack, or hide it?</text><rect class="dg-box" x="16" y="44" width="219" height="97" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">Keep it</text><line x1="28" y1="74" x2="223" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Sheet on dev shows three packs</text><text class="dg-sub" x="28" y="109">&quot;A sliver of a month of Vana&quot;,</text><text class="dg-sub" x="28" y="126">$0.99, about 0.5% of a month</text><rect class="dg-box" x="251" y="44" width="212" height="97" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="263" y="66" font-weight="700">Hide it</text><line x1="263" y1="74" x2="451" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="263" y="92">Sheet shows two packs</text><text class="dg-sub" x="263" y="109">A quarter of a month, $4.99</text><text class="dg-sub" x="263" y="126">A month and a quarter, $19.99</text><rect class="dg-ex" x="16" y="157" width="447" height="32" rx="8"/><text class="dg-sub" x="28" y="179">The $0.99 pack exists to test purchases</text></svg>
