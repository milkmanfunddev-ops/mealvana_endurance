<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 335" width="100%" role="img" aria-label="Three ways in, one formula">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Three ways in, one formula</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">App opens</text><text class="dg-sub" x="50" y="73">Plain read of the wallet row.</text><text class="dg-sub" x="50" y="89">The phone works out: 50% used</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">Row changes</text><text class="dg-sub" x="50" y="142">Live push of the new row.</text><text class="dg-sub" x="50" y="158">Same arithmetic on the phone</text><circle cx="30" cy="188" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="193" font-weight="700">Lee asks Vana</text><text class="dg-sub" x="50" y="211">The server&#39;s check answers.</text><text class="dg-sub" x="50" y="227">Same arithmetic, same bar</text><rect class="dg-ex" x="16" y="255" width="326" height="68" rx="8"/><text class="dg-sub" x="28" y="277">Row: balance $3.00, $2.00 of the $4.00 grant left</text><text class="dg-sub" x="28" y="295">Bar: 50% used, refills Oct 15, +25% bought</text><text class="dg-sub" x="28" y="313">The screen shows no dollar figure</text></svg>
