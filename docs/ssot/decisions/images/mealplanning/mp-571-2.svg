<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 370" width="100%" role="img" aria-label="Three ways in, one formula">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Three ways in, one formula</text><line class="dg-edge" x1="95.1" y1="82" x2="164.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="203.5" y1="100" x2="200" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="292.1" y1="100" x2="236.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="197.5" y1="196" x2="197.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="72.5" y="62" text-anchor="middle">Server check</text><rect class="dg-box" x="153" y="44" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="206" y="62" text-anchor="middle">Plain read</text><text x="206" y="80" text-anchor="middle">at app open</text><rect class="dg-box" x="283" y="44" width="96" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="331" y="62" text-anchor="middle">Live push</text><text x="331" y="80" text-anchor="middle">on change</text><rect class="dg-box" x="88.5" y="140" width="218" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="197.5" y="158" text-anchor="middle">Same arithmetic</text><text x="197.5" y="176" text-anchor="middle">as the server, on the phone</text><rect class="dg-box" x="95.5" y="236" width="204" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="197.5" y="254" text-anchor="middle">50% used, refills Oct 15,</text><text x="197.5" y="272" text-anchor="middle">+25% of a month bought</text><rect class="dg-ex" x="16" y="308" width="363" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Row: balance $3.00, grant $4.00, $2.00 of it left</text><text class="dg-sub" x="28" y="348">The screen shows no dollar figure</text></svg>
