<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 466" width="100%" role="img" aria-label="What we decided: the plan first">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: the plan first</text><line class="dg-edge" x1="145.1" y1="82" x2="99.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="173" y1="82" x2="212.8" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="101.6" y1="196" x2="135.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="292" x2="160" y2="332" marker-end="url(#dg-arrow)"/><rect x="145" y="303" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="316" text-anchor="middle">tap</text><rect class="dg-box" x="112" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">Food tab</text><rect class="dg-box" x="17.5" y="140" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="77.5" y="158" text-anchor="middle">Plan section:</text><text x="77.5" y="176" text-anchor="middle">opens here</text><rect class="dg-box" x="161.5" y="140" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="232" y="158" text-anchor="middle">Meals, Formulas,</text><text x="232" y="176" text-anchor="middle">Shopping</text><rect class="dg-box" x="79" y="236" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="254" text-anchor="middle">Vana card at</text><text x="160" y="272" text-anchor="middle">the top of the plan</text><rect class="dg-box" x="72" y="332" width="176" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="350" text-anchor="middle">General conversation,</text><text x="160" y="368" text-anchor="middle">not a new plan</text><rect class="dg-ex" x="16" y="404" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="426">No tab of its own; the chat is</text><text class="dg-sub" x="28" y="444">where the athlete goes for more</text></svg>
