<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 484" width="100%" role="img" aria-label="What the athlete does never writes">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the athlete does never writes</text><line class="dg-edge" x1="130.4" y1="82" x2="108.9" y2="236" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><line class="dg-edge" x1="254.4" y1="82" x2="128" y2="236" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><line class="dg-edge" x1="173.4" y1="196" x2="133.1" y2="236" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><line class="dg-edge" x1="136.1" y1="292" x2="180.4" y2="332" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="136.75" y="303" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="158.25" y="316" text-anchor="middle">never</text><line class="dg-edge" x1="257.4" y1="292" x2="219.5" y2="332" marker-end="url(#dg-arrow)" style="stroke:var(--ok, #2FB9A6)"/><rect x="197.45" y="303" width="82" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="238.45" y="316" text-anchor="middle">only writer</text><rect class="dg-box" x="76.5" y="44" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="133" y="62" text-anchor="middle">Meal swapped</text><rect class="dg-box" x="213.5" y="44" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="270" y="62" text-anchor="middle">Meal skipped</text><rect class="dg-box" x="131" y="140" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201.5" y="158" text-anchor="middle">Same meal logged</text><text x="201.5" y="176" text-anchor="middle">again and again</text><rect class="dg-box" x="34.5" y="236" width="141" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="105" y="254" text-anchor="middle">Silent inference</text><text x="105" y="272" text-anchor="middle">from patterns</text><rect class="dg-box" x="199.5" y="236" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="284" y="254" text-anchor="middle">Weekly debrief asks,</text><text x="284" y="272" text-anchor="middle">athlete answers</text><rect class="dg-box" x="153.5" y="332" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201.5" y="350" text-anchor="middle">Memory</text><rect class="dg-ex" x="16" y="404" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Dana swaps oats for eggs on 4 mornings this week.</text><text class="dg-sub" x="28" y="444">No note is written. Sunday&#39;s debrief asks; she says why.</text><text class="dg-sub" x="28" y="462">Her answer becomes the Memory.</text></svg>
