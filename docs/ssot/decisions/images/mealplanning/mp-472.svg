<text class="dg-title" x="16" y="24">Ticket 07: the cache reads what repeats</text><line class="dg-edge" x1="163" y1="100" x2="163" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="64.5" y="44" width="197" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="163" y="62" text-anchor="middle">Today: 43% of a planning</text><text x="163" y="80" text-anchor="middle">turn read from cache</text><rect class="dg-box" x="82" y="140" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="163" y="158" text-anchor="middle">After: 80% or more,</text><text x="163" y="176" text-anchor="middle">about a cent a turn</text><rect class="dg-ex" x="16" y="212" width="294" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Persona, then athlete context: two messages.</text><text class="dg-sub" x="28" y="252">A stored conversation replays byte for byte.</text></svg>
