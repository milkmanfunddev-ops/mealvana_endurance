<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 236" width="100%" role="img" aria-label="After a failed claim: which paywall?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">After a failed claim: which paywall?</text><rect class="dg-box" x="16" y="44" width="229" height="114" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">The Lapsed account&#39;s paywall</text><line x1="28" y1="74" x2="233" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Signs up, claim fails</text><text class="dg-sub" x="28" y="109">Paywall sheet over</text><text class="dg-sub" x="28" y="126">its read-only data</text><text class="dg-sub" x="28" y="143">It can close the sheet</text><rect class="dg-box" x="261" y="44" width="161" height="114" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="273" y="66" font-weight="700">Onboarding paywall</text><line x1="273" y1="74" x2="410" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="273" y="92">Signs up, claim fails</text><text class="dg-sub" x="273" y="109">Full screen, no close</text><text class="dg-sub" x="273" y="126">The same as any new</text><text class="dg-sub" x="273" y="143">account sees</text><rect class="dg-ex" x="16" y="174" width="406" height="50" rx="8"/><text class="dg-sub" x="28" y="196">An install anonymous at the flip signs up</text><text class="dg-sub" x="28" y="214">on 3 October and its claim fails.</text></svg>
