<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 531 218" width="100%" role="img" aria-label="Wait for the ingredient list, or not?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Wait for the ingredient list, or not?</text><rect class="dg-box" x="16" y="44" width="258" height="114" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">Wait inside the turn</text><line x1="28" y1="74" x2="262" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Athlete: add my saved dinner</text><text class="dg-sub" x="28" y="109">Vana waits for a second model</text><text class="dg-sub" x="28" y="126">Reply carries the full shopping list</text><rect class="dg-box" x="290" y="44" width="225" height="114" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="302" y="66" font-weight="700">Build it in the background</text><line x1="302" y1="74" x2="503" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="302" y="92">Athlete: add my saved dinner</text><text class="dg-sub" x="302" y="109">Vana adds it at once</text><text class="dg-sub" x="302" y="126">List shows the dish as one line</text><text class="dg-sub" x="302" y="143">until the ingredients arrive</text><rect class="dg-ex" x="16" y="174" width="499" height="32" rx="8"/><text class="dg-sub" x="28" y="196">Today the turn waits (option on the left)</text></svg>
