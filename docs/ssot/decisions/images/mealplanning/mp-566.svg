<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 237" width="100%" role="img" aria-label="Short phone: stacked or side by side?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Short phone: stacked or side by side?</text><rect class="dg-box" x="16" y="44" width="186" height="97" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">A: stacked (today)</text><line x1="28" y1="74" x2="190" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Annual card above monthly</text><text class="dg-sub" x="28" y="109">Tray takes about 40%</text><text class="dg-sub" x="28" y="126">of the screen&#39;s height</text><rect class="dg-box" x="218" y="44" width="167" height="97" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="230" y="66" font-weight="700">B: side by side</text><line x1="230" y1="74" x2="373" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="230" y="92">Annual and monthly</text><text class="dg-sub" x="230" y="109">share one row</text><text class="dg-sub" x="230" y="126">More room for features</text><rect class="dg-ex" x="16" y="157" width="369" height="68" rx="8"/><text class="dg-sub" x="28" y="179">Founding prices shown: $99.99 a year, $12.49 a month.</text><text class="dg-sub" x="28" y="197">Either way: should the features fade out</text><text class="dg-sub" x="28" y="215">under the ⋯ button at the top?</text></svg>
