<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 388" width="100%" role="img" aria-label="Where past talks go in the context">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where past talks go in the context</text><line class="dg-edge" x1="111.9" y1="100" x2="103.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="169.2" y1="100" x2="242.3" y2="140" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect x="171.25" y="111" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="205.75" y="124" text-anchor="middle">no longer</text><line class="dg-edge" x1="300.9" y1="100" x2="296.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="127.2" y1="196" x2="170.3" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="266.4" y1="196" x2="227.6" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="26.5" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="118" y="62" text-anchor="middle">Episodes</text><text x="118" y="80" text-anchor="middle">conversation summaries</text><rect class="dg-box" x="233.5" y="44" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="304" y="62" text-anchor="middle">Margin notes</text><text x="304" y="80" text-anchor="middle">about the person</text><rect class="dg-box" x="16" y="140" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="97" y="158" text-anchor="middle">LAST TALKS line</text><text x="97" y="176" text-anchor="middle">what they said last</text><rect class="dg-box" x="202" y="140" width="183" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="293.5" y="158" text-anchor="middle">MEMORIES block</text><text x="293.5" y="176" text-anchor="middle">non-episode notes only</text><rect class="dg-box" x="130" y="236" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="200.5" y="254" text-anchor="middle">Context block</text><text x="200.5" y="272" text-anchor="middle">the opener reads</text><rect class="dg-ex" x="16" y="308" width="369" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Before: &#39;last time we planned Tuesday&#39;s ride and</text><text class="dg-sub" x="28" y="348">Thursday&#39;s swim&#39;, a schedule read-out.</text><text class="dg-sub" x="28" y="366">Now, LAST TALKS: &#39;said weeknight cooking is a chore&#39;.</text></svg>
