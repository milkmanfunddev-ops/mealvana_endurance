<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 288" width="100%" role="img" aria-label="Vana reads the settings, never asks">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Vana reads the settings, never asks</text><rect class="dg-box" x="30" y="44" width="154" height="148" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="42" y="66" font-weight="700">Other option</text><line x1="42" y1="74" x2="172" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="42" y="92">Mid-plan Vana stops:</text><text class="dg-sub" x="42" y="109">&quot;Do you batch cook?&quot;</text><text class="dg-sub" x="42" y="126">&quot;Just dinners, or</text><text class="dg-sub" x="42" y="143">lunches too?&quot;</text><text class="dg-sub" x="42" y="160">→ each question is a</text><text class="dg-sub" x="42" y="177">paid model turn</text><rect class="dg-box" x="200" y="44" width="180" height="148" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="212" y="66" font-weight="700">This card&#39;s answer</text><line x1="212" y1="74" x2="368" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="212" y="92">Settings (the defaults):</text><text class="dg-sub" x="212" y="109">batch cooking on,</text><text class="dg-sub" x="212" y="126">dinners only, from</text><text class="dg-sub" x="212" y="143">Sunday for 7 days</text><text class="dg-sub" x="212" y="160">→ she plans straight</text><text class="dg-sub" x="212" y="177">from them</text><rect class="dg-ex" x="16" y="208" width="378" height="68" rx="8"/><text class="dg-sub" x="28" y="230">Example: batch cooking on, a 7-day period: three dinners,</text><text class="dg-sub" x="28" y="248">each cooked in 3 servings (5 servings for 14 days).</text><text class="dg-sub" x="28" y="266">&quot;Lunches too this week&quot; in chat is saved as the setting.</text></svg>
