<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 236" width="100%" role="img" aria-label="Full-screen lapsed paywall: add a close?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Full-screen lapsed paywall: add a close?</text><rect class="dg-box" x="16" y="44" width="186" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">Today: no close</text><line x1="28" y1="74" x2="190" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Full-screen paywall</text><text class="dg-sub" x="28" y="109">Only ways out: subscribe,</text><text class="dg-sub" x="28" y="126">restore, or sign out</text><text class="dg-sub" x="28" y="143">Own data stays hidden</text><rect class="dg-box" x="218" y="44" width="208" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="230" y="66" font-weight="700">Option: close to Plan tab</text><line x1="230" y1="74" x2="414" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="230" y="92">Full-screen paywall</text><text class="dg-sub" x="230" y="109">Taps close</text><text class="dg-sub" x="230" y="126">Reads their plan,</text><text class="dg-sub" x="230" y="143">read-only</text><rect class="dg-ex" x="16" y="174" width="410" height="50" rx="8"/><text class="dg-sub" x="28" y="196">9 October: a lapsed athlete opens a link to Vana</text><text class="dg-sub" x="28" y="214">from an email and lands on the paywall.</text></svg>
