<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 484" width="100%" role="img" aria-label="The kind is a tag, and a fresh start">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The kind is a tag, and a fresh start</text><line class="dg-edge" x1="131.1" y1="82" x2="125.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="292" y1="100" x2="293.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="124" y1="196" x2="131.5" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="270.9" y1="196" x2="156.6" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="148.6" y1="196" x2="275.4" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="295.5" y1="196" x2="300.5" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="59" y="44" width="148" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="133" y="62" text-anchor="middle">Tap New meal plan</text><rect class="dg-box" x="231" y="44" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="291" y="62" text-anchor="middle">Ask Vana cold</text><text x="291" y="80" text-anchor="middle">from a button</text><rect class="dg-box" x="45" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="122.5" y="158" text-anchor="middle">New conversation</text><text x="122.5" y="176" text-anchor="middle">tag: meal-planning</text><rect class="dg-box" x="224" y="140" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="294.5" y="158" text-anchor="middle">New conversation</text><text x="294.5" y="176" text-anchor="middle">tag: general</text><rect class="dg-box" x="134.5" y="236" width="141" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="205" y="254" text-anchor="middle">Continue an</text><text x="205" y="272" text-anchor="middle">old conversation</text><rect class="dg-box" x="48.5" y="332" width="169" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="133" y="350" text-anchor="middle">History list</text><text x="133" y="368" text-anchor="middle">every past one stays</text><rect class="dg-box" x="241.5" y="332" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="301.5" y="350" text-anchor="middle">Opener</text><text x="301.5" y="368" text-anchor="middle">reads the tag</text><rect class="dg-ex" x="16" y="404" width="378" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Mon: New meal plan starts conversation A (meal-planning).</text><text class="dg-sub" x="28" y="444">Wed: a cold question starts conversation B (general).</text><text class="dg-sub" x="28" y="462">History lists A and B; B&#39;s opener reads &#39;general&#39;.</text></svg>
