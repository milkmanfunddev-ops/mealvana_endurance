<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 484" width="100%" role="img" aria-label="Unknown means locked">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Unknown means locked</text><line class="dg-edge" x1="190.8" y1="100" x2="147.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="242" y1="100" x2="272" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="122.6" y1="196" x2="129.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="297.1" y1="196" x2="302.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160.1" y1="292" x2="195.9" y2="332" marker-end="url(#dg-arrow)"/><rect x="156.5" y="303" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="178" y="316" text-anchor="middle">still</text><rect class="dg-box" x="161" y="44" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="221" y="62" text-anchor="middle">Gate asks the</text><text x="221" y="80" text-anchor="middle">entitlement</text><rect class="dg-box" x="57.5" y="140" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="117.5" y="158" text-anchor="middle">Cached answer</text><text x="117.5" y="176" text-anchor="middle">exists</text><rect class="dg-box" x="201.5" y="140" width="183" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="293" y="158" text-anchor="middle">No cache, no answer</text><text x="293" y="176" text-anchor="middle">in a couple of seconds</text><rect class="dg-box" x="61" y="236" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="135" y="254" text-anchor="middle">Cache decides,</text><text x="135" y="272" text-anchor="middle">online or offline</text><rect class="dg-box" x="233" y="236" width="148" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="307" y="254" text-anchor="middle">Paywall with</text><text x="307" y="272" text-anchor="middle">Restore purchases</text><rect class="dg-box" x="129.5" y="332" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="221" y="350" text-anchor="middle">Server re-checks every</text><text x="221" y="368" text-anchor="middle">paid call itself</text><rect class="dg-ex" x="16" y="404" width="410" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Subscriber on a plane: cache says active, app open.</text><text class="dg-sub" x="28" y="444">Fresh install, no network: paywall; Restore works once online.</text><text class="dg-sub" x="28" y="462">A device lying about its cache buys nothing on the server.</text></svg>
