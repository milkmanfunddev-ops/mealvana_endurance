<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 254" width="100%" role="img" aria-label="What should an Admin with no plan see?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What should an Admin with no plan see?</text><rect class="dg-box" x="16" y="44" width="194" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">C: store status (today)</text><line x1="28" y1="74" x2="198" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">&quot;Your plan has ended&quot;</text><text class="dg-sub" x="28" y="109">&quot;Your data is read-only</text><text class="dg-sub" x="28" y="126">until you subscribe&quot;</text><text class="dg-sub" x="28" y="143">Upgrade: leads nowhere</text><rect class="dg-box" x="226" y="44" width="152" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="238" y="66" font-weight="700">A: its own status</text><line x1="238" y1="74" x2="366" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="238" y="92">&quot;Admin access&quot;</text><rect class="dg-ex" x="16" y="174" width="362" height="68" rx="8"/><text class="dg-sub" x="28" y="196">test@test.com, an Admin with no purchase,</text><text class="dg-sub" x="28" y="214">opens Settings, then Subscription.</text><text class="dg-sub" x="28" y="232">B would keep today&#39;s screen without Upgrade.</text></svg>
