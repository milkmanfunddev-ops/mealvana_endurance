<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 466" width="100%" role="img" aria-label="Two kinds of plan change">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Two kinds of plan change</text><line class="dg-edge" x1="171.9" y1="118" x2="114.2" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="223.6" y1="214" x2="243.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="174" y1="214" x2="123.1" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="211.6" y1="214" x2="280.6" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="88" y="44" width="204" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="190" y="62" text-anchor="middle">Saves on the phone first:</text><text x="190" y="80" text-anchor="middle">servings, remove, ticks,</text><text x="190" y="98" text-anchor="middle">notes, settings and more</text><rect class="dg-box" x="98.5" y="140" width="183" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="190" y="158" text-anchor="middle">Waits for the server:</text><text x="190" y="176" text-anchor="middle">pick, swap, plan day,</text><text x="190" y="194" text-anchor="middle">new plan, log, confirm</text><rect class="dg-box" x="33.5" y="236" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="100.5" y="254" text-anchor="middle">Uploads later;</text><text x="100.5" y="272" text-anchor="middle">last write wins</text><rect class="dg-box" x="191.5" y="236" width="155" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="269" y="254" text-anchor="middle">Offline: stopped</text><text x="269" y="272" text-anchor="middle">before any request</text><rect class="dg-box" x="16" y="332" width="190" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="111" y="350" text-anchor="middle">Server write fails:</text><text x="111" y="368" text-anchor="middle">plan restored + message</text><rect class="dg-box" x="230" y="332" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="297" y="350" text-anchor="middle">Server answers:</text><text x="297" y="368" text-anchor="middle">plan updated</text><rect class="dg-ex" x="16" y="422" width="348" height="32" rx="8"/><text class="dg-sub" x="28" y="444">The message says needs a connection, or needs Pro.</text></svg>
