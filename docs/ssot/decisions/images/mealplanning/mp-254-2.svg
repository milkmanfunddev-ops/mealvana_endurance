<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 433 288" width="100%" role="img" aria-label="Two kinds of plan change">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Two kinds of plan change</text><rect class="dg-box" x="16" y="44" width="186" height="148" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="28" y="66" font-weight="700">Phone first</text><line x1="28" y1="74" x2="190" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Servings, remove, session</text><text class="dg-sub" x="28" y="109">Shopping ticks, day slots</text><text class="dg-sub" x="28" y="126">Settings, comments</text><text class="dg-sub" x="28" y="143">Memory delete, meal notes</text><text class="dg-sub" x="28" y="160">Uploads later;</text><text class="dg-sub" x="28" y="177">last write wins</text><rect class="dg-box" x="218" y="44" width="199" height="148" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="230" y="66" font-weight="700">Waits for the server</text><line x1="230" y1="74" x2="405" y2="74" stroke="var(--accent, #F78B14)" stroke-width="1"/><text class="dg-sub" x="230" y="92">Pick, swap, plan day</text><text class="dg-sub" x="230" y="109">New plan, log from plan</text><text class="dg-sub" x="230" y="126">Confirm</text><text class="dg-sub" x="230" y="143">If it fails: plan restored,</text><text class="dg-sub" x="230" y="160">message: needs a connection</text><text class="dg-sub" x="230" y="177">or needs Pro</text><rect class="dg-ex" x="16" y="208" width="401" height="68" rx="8"/><text class="dg-sub" x="28" y="230">No signal: the eggs tick stays.</text><text class="dg-sub" x="28" y="248">Swap on a dinner shows the needs-connection message</text><text class="dg-sub" x="28" y="266">and the dinner is unchanged.</text></svg>
