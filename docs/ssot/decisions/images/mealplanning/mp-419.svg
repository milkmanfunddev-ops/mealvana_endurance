<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 397" width="100%" role="img" aria-label="What we decided: one day with Vana, as built">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: one day with Vana, as built</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="326"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">8 Oct morning</text><text class="dg-sub" x="50" y="73">Athlete plans with Vana. Notes she</text><text class="dg-sub" x="50" y="89">saves on her own show no card</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Sheet closes</text><text class="dg-sub" x="50" y="142">Idle: the server answers at once,</text><text class="dg-sub" x="50" y="158">writes the summary in the background</text><circle cx="30" cy="188" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="193" font-weight="700">Midday</text><text class="dg-sub" x="50" y="211">A thumbs vote outside Vana waits</text><text class="dg-sub" x="50" y="227">for a Vana change or the next day</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">Evening</text><text class="dg-sub" x="50" y="280">Talks again, closes the sheet:</text><text class="dg-sub" x="50" y="296">summarised again, always the latest</text><circle cx="30" cy="326" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="331" font-weight="700">9 Oct</text><text class="dg-sub" x="50" y="349">The list shows the one-sentence</text><text class="dg-sub" x="50" y="365">summary; LAST TALKS reaches Vana</text></svg>
