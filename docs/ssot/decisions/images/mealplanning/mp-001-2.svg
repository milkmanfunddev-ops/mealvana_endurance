<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 201" width="100%" role="img" aria-label="Three placeholder names become one">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Three placeholder names become one</text><rect class="dg-box" x="16" y="44" width="180" height="97" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Before</text><line x1="28" y1="74" x2="184" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Sage: the early canvas</text><text class="dg-sub" x="28" y="109">MealBuddy: Figma concept</text><text class="dg-sub" x="28" y="126">Jade: the shipped chat</text><rect class="dg-box" x="212" y="44" width="186" height="97" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="224" y="66" font-weight="700">Now: Vana</text><line x1="224" y1="74" x2="386" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="224" y="92">From Meal-vana</text><text class="dg-sub" x="224" y="109">No &quot;AI&quot; in the name</text><text class="dg-sub" x="224" y="126">Same in app and prototype</text><rect class="dg-ex" x="16" y="157" width="382" height="32" rx="8"/><text class="dg-sub" x="28" y="179">Not chosen: Mel, Endy, &quot;Mealvana AI&quot;.</text></svg>
