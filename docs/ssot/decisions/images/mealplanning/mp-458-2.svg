<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 371 310" width="100%" role="img" aria-label="What each Code does when entered">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What each Code does when entered</text><rect class="dg-box" x="18.5" y="44" width="141" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="89" y="62" text-anchor="middle">Coach, own Code:</text><text x="89" y="80" text-anchor="middle">becomes a coach,</text><text x="89" y="98" text-anchor="middle">30 days of Pro</text><rect class="dg-box" x="183.5" y="44" width="169" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="268" y="62" text-anchor="middle">Athlete, coach Code:</text><text x="268" y="80" text-anchor="middle">pending pairing</text><text x="268" y="98" text-anchor="middle">with that coach</text><rect class="dg-box" x="29" y="140" width="155" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="106.5" y="158" text-anchor="middle">Influencer Code:</text><text x="106.5" y="176" text-anchor="middle">referral recorded,</text><text x="106.5" y="194" text-anchor="middle">no pairing</text><rect class="dg-box" x="208" y="140" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="275" y="158" text-anchor="middle">Giveaway Code:</text><text x="275" y="176" text-anchor="middle">365 days of Pro</text><rect class="dg-ex" x="16" y="230" width="339" height="68" rx="8"/><text class="dg-sub" x="28" y="252">Only a signed-in account can redeem. Wrong, expired</text><text class="dg-sub" x="28" y="270">or used: a plain reason back. How many times a Code</text><text class="dg-sub" x="28" y="288">works: mp-535.</text></svg>
