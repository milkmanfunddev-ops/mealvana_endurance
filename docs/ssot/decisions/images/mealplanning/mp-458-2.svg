<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 484" width="100%" role="img" aria-label="What a Code does">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What a Code does</text><line class="dg-edge" x1="172.1" y1="100" x2="139.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="217" y1="100" x2="248.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="195" y1="100" x2="195" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="195" y1="100" x2="195" y2="332" marker-end="url(#dg-arrow)" style="stroke:var(--no, #DC2597)"/><rect class="dg-box" x="121" y="44" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="195" y="62" text-anchor="middle">Signed-in account</text><text x="195" y="80" text-anchor="middle">enters a Code</text><rect class="dg-box" x="38.5" y="140" width="141" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="109" y="158" text-anchor="middle">Coach, own Code:</text><text x="109" y="176" text-anchor="middle">marked coach,</text><text x="109" y="194" text-anchor="middle">30 days of pro</text><rect class="dg-box" x="203.5" y="140" width="148" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="277.5" y="158" text-anchor="middle">Athlete, coach or</text><text x="277.5" y="176" text-anchor="middle">influencer Code:</text><text x="277.5" y="194" text-anchor="middle">recorded, pairing</text><rect class="dg-box" x="124.5" y="236" width="141" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="195" y="254" text-anchor="middle">Giveaway Code:</text><text x="195" y="272" text-anchor="middle">365 days of pro,</text><text x="195" y="290" text-anchor="middle">once</text><rect class="dg-box" x="100" y="332" width="190" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="195" y="350" text-anchor="middle">Wrong, expired or used:</text><text x="195" y="368" text-anchor="middle">a plain reason back</text><rect class="dg-ex" x="16" y="422" width="358" height="50" rx="8"/><text class="dg-sub" x="28" y="444">Entered from &quot;Have a code?&quot; on the Onboarding paywall</text><text class="dg-sub" x="28" y="462">or a row in Settings. 24-hour pairing codes unchanged.</text></svg>
