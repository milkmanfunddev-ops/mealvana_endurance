<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 375" width="100%" role="img" aria-label="When does the paywall come up after Pro runs out?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">When does the paywall come up after Pro runs out?</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="262"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">08:50</text><text class="dg-sub" x="50" y="73">Test Store monthly bought; Gate open, timeline shows</text><circle cx="30" cy="103" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="108" font-weight="700">09:15</text><text class="dg-sub" x="50" y="126">Pro expires in RevenueCat; app still on the timeline</text><circle cx="30" cy="156" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="161" font-weight="700">09:15</text><text class="dg-sub" x="50" y="179">A: paywall comes up now, from an expiry timer</text><circle cx="30" cy="209" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="214" font-weight="700">next tap</text><text class="dg-sub" x="50" y="232">C: paywall at the next action that needs Pro</text><circle cx="30" cy="262" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="267" font-weight="700">10:48</text><text class="dg-sub" x="50" y="285">B (today): paywall on the next resume, 93 min later</text><rect class="dg-ex" x="16" y="313" width="462" height="50" rx="8"/><text class="dg-sub" x="28" y="335">Wave 5, ticket 05: expiry 09:15 UTC, app open until a resume at 10:48.</text><text class="dg-sub" x="28" y="353">Server refused AI calls the whole time.</text></svg>
