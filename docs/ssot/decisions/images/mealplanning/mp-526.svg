<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 531 218" width="100%" role="img" aria-label="Charge a not-food photo, or not?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Charge a not-food photo, or not?</text><rect class="dg-box" x="16" y="44" width="245" height="114" rx="10" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="28" y="66" font-weight="700">Charge the athlete</text><line x1="28" y1="74" x2="249" y2="74" stroke="var(--pending, #D9730A)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Athlete logs a photo of a receipt</text><text class="dg-sub" x="28" y="109">Sees &quot;that isn&#39;t food&quot;</text><text class="dg-sub" x="28" y="126">The call comes out of their budget</text><rect class="dg-box" x="277" y="44" width="238" height="114" rx="10" fill="var(--amend-soft, #EDE6F7)" stroke="var(--amend, #7A5AA6)"/><text x="289" y="66" font-weight="700">We carry it</text><line x1="289" y1="74" x2="503" y2="74" stroke="var(--amend, #7A5AA6)" stroke-width="1"/><text class="dg-sub" x="289" y="92">Athlete logs a photo of a receipt</text><text class="dg-sub" x="289" y="109">Sees &quot;that isn&#39;t food&quot;</text><text class="dg-sub" x="289" y="126">Their budget is untouched;</text><text class="dg-sub" x="289" y="143">we pay the Sonnet call</text><rect class="dg-ex" x="16" y="174" width="499" height="32" rx="8"/><text class="dg-sub" x="28" y="196">Today the build charges it (left)</text></svg>
