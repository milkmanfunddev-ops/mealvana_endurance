<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 373 426" width="100%" role="img" aria-label="What we decided: rewrite only what changed">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: rewrite only what</text><text class="dg-title" x="16" y="44">changed</text><g transform="translate(0 20)"><line class="dg-edge" x1="178" y1="77" x2="202" y2="75.8" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="164" y1="168" x2="188" y2="168" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="199" y1="264" x2="223" y2="264" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="23" y="44" width="155" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="100.5" y="62" text-anchor="middle">That day&#39;s meals,</text><text x="100.5" y="80" text-anchor="middle">workouts or macros</text><text x="100.5" y="98" text-anchor="middle">change</text><rect class="dg-box" x="202" y="44" width="148" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="276" y="62" text-anchor="middle">Only that day&#39;s</text><text x="276" y="80" text-anchor="middle">note is rewritten</text><rect class="dg-box" x="30" y="140" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="97" y="158" text-anchor="middle">A meal joins or</text><text x="97" y="176" text-anchor="middle">leaves the plan</text><rect class="dg-box" x="188" y="140" width="155" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="265.5" y="158" text-anchor="middle">Notes of days with</text><text x="265.5" y="176" text-anchor="middle">nothing assigned</text><rect class="dg-box" x="16" y="236" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="107.5" y="254" text-anchor="middle">Draft confirmed, or</text><text x="107.5" y="272" text-anchor="middle">batch cooking switched</text><rect class="dg-box" x="223" y="236" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="290" y="254" text-anchor="middle">All seven notes</text><text x="290" y="272" text-anchor="middle">rewritten</text><rect class="dg-ex" x="16" y="326" width="341" height="68" rx="8"/><text class="dg-sub" x="28" y="348">Swap Thursday&#39;s dinner: Thursday&#39;s note and the</text><text class="dg-sub" x="28" y="366">notes of days with nothing assigned are rewritten.</text><text class="dg-sub" x="28" y="384">Meal marked eaten or plan unchanged: no model call.</text></g></svg>
