ithin 2 s)</text><rect class="dg-box" x="79" y="236" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="127" y="254" text-anchor="middle">The app</text><rect class="dg-box" x="199" y="236" width="106" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="252" y="254" text-anchor="middle">The paywall</text><rect class="dg-box" x="111" y="332" width="162" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="192" y="350" text-anchor="middle">Vana still asks the</text><text x="192" y="368" text-anchor="middle">server: paid row?</text><rect class="dg-ex" x="16" y="404" width="352" height="50" rx="8"/><text class="dg-sub" x="28" y="426">test@test.com: into the app with no purchase;</text><text class="dg-sub" x="28" y="444">Vana refuses until a TestFlight subscription or Grant</text></g></svg>
