<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 236" width="100%" role="img" aria-label="Ticket 07: redeem a code">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 07: redeem a code</text><rect class="dg-box" x="16" y="44" width="206" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="28" y="66" font-weight="700">Coach or influencer code</text><line x1="28" y1="74" x2="210" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Coach enters own code:</text><text class="dg-sub" x="28" y="109">marked coach, 30 days of pro</text><text class="dg-sub" x="28" y="126">Athlete enters it:</text><text class="dg-sub" x="28" y="143">pending pairing</text><rect class="dg-box" x="238" y="44" width="140" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="250" y="66" font-weight="700">Giveaway code</text><line x1="250" y1="74" x2="366" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="250" y="92">365 days of pro,</text><text class="dg-sub" x="250" y="109">once</text><rect class="dg-ex" x="16" y="174" width="362" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Wrong, expired or used: a plain reason.</text><text class="dg-sub" x="28" y="214">Only a signed-in caller can redeem.</text></svg>
