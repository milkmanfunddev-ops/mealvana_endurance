<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 484" width="100%" role="img" aria-label="What we decided: one meal analysis, end to end">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: one meal analysis, end to end</text><line class="dg-edge" x1="160" y1="118" x2="160" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="214" x2="160" y2="236" marker-end="url(#dg-arrow)"/><rect x="142" y="216" width="36" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="229" text-anchor="middle">food</text><line class="dg-edge" x1="160" y1="214" x2="160" y2="332" marker-end="url(#dg-arrow)"/><rect x="129" y="264" width="62" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="160" y="277" text-anchor="middle">not food</text><rect class="dg-box" x="40.5" y="44" width="239" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">Athlete types a meal, or picks</text><text x="160" y="80" text-anchor="middle">a photo capped at 1,000 px</text><text x="160" y="98" text-anchor="middle">on both sides</text><rect class="dg-box" x="40.5" y="140" width="239" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="158" text-anchor="middle">The call&#39;s fixed instructions,</text><text x="160" y="176" text-anchor="middle">cached 1 hour, then the text</text><text x="160" y="194" text-anchor="middle">or photo as the only message</text><rect class="dg-box" x="30" y="236" width="260" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="254" text-anchor="middle">Sonnet lists the items; the</text><text x="160" y="272" text-anchor="middle">function adds them up; a missing</text><text x="160" y="290" text-anchor="middle">slot or confidence: snack, medium</text><rect class="dg-box" x="61.5" y="332" width="197" height="74" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="160" y="350" text-anchor="middle">Not food: code not_food</text><text x="160" y="368" text-anchor="middle">(422); the app shows one</text><text x="160" y="386" text-anchor="middle">warning line</text><rect class="dg-ex" x="16" y="422" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="444">Portrait 750×1000 and landscape 1000×750:</text><text class="dg-sub" x="28" y="462">2,368 input tokens each on dev</text></svg>
