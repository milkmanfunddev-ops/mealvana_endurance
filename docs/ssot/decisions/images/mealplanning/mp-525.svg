<text class="dg-title" x="16" y="24">This card&#39;s answer: one meal</text><text class="dg-title" x="16" y="44">analysis</text><g transform="translate(0 20)"><line class="dg-edge" x1="165.5" y1="118" x2="165.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="137.8" y1="214" x2="121.3" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="200" y1="214" x2="220.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="77.5" y="44" width="176" height="74" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="165.5" y="62" text-anchor="middle">Athlete types a meal,</text><text x="165.5" y="80" text-anchor="middle">or picks a photo</text><text x="165.5" y="98" text-anchor="middle">capped at 1,000 px</text><rect class="dg-box" x="77.5" y="140" width="176" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="165.5" y="158" text-anchor="middle">Fixed instructions</text><text x="165.5" y="176" text-anchor="middle">(cached 1 hour), then</text><text x="165.5" y="194" text-anchor="middle">the text or photo</text><rect class="dg-box" x="16" y="236" width="155" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="93.5" y="254" text-anchor="middle">Food: Sonnet lists</text><text x="93.5" y="272" text-anchor="middle">the items, we add</text><text x="93.5" y="290" text-anchor="middle">them up</text><rect class="dg-box" x="195" y="236" width="120" height="74" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="255" y="254" text-anchor="middle">Not food: one</text><text x="255" y="272" text-anchor="middle">warning line,</text><text x="255" y="290" text-anchor="middle">no macros</text><rect class="dg-ex" x="16" y="326" width="299" height="50" rx="8"/><text class="dg-sub" x="28" y="348">Portrait 750×1000 and landscape 1000×750:</text><text class="dg-sub" x="28" y="366">2,368 input tokens each on dev</text></g></svg>
