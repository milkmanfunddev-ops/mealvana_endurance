<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 347 236" width="100%" role="img" aria-label="Ticket 17: how the paywall appears">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Ticket 17: how the paywall appears</text><rect class="dg-box" x="16" y="44" width="145" height="114" rx="10" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="28" y="66" font-weight="700">Never subscribed</text><line x1="28" y1="74" x2="149" y2="74" stroke="var(--line, #DDD8C8)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Full screen</text><text class="dg-sub" x="28" y="109">No close button</text><rect class="dg-box" x="177" y="44" width="154" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="189" y="66" font-weight="700">Lapsed</text><line x1="189" y1="74" x2="319" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="189" y="92">A glass sheet over</text><text class="dg-sub" x="189" y="109">the read-only app</text><text class="dg-sub" x="189" y="126">Close returns to the</text><text class="dg-sub" x="189" y="143">same screen</text><rect class="dg-ex" x="16" y="174" width="315" height="50" rx="8"/><text class="dg-sub" x="28" y="196">A lapsed athlete taps Subscribe on the</text><text class="dg-sub" x="28" y="214">&quot;plan ended&quot; bar: the sheet opens over it.</text></svg>
