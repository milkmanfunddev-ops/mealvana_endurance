FFFFF)" stroke="var(--line, #DDD8C8)"/><text x="116" y="254" text-anchor="middle">Event screens</text><rect class="dg-box" x="200" y="236" width="141" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="270.5" y="254" text-anchor="middle">Meal-log screens</text><rect class="dg-box" x="150.5" y="332" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="350" text-anchor="middle">Main tabs</text><rect class="dg-box" x="25.5" y="428" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="73.5" y="446" text-anchor="middle">event</text><rect class="dg-box" x="145.5" y="428" width="106" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="198.5" y="446" text-anchor="middle">date + slot</text><rect class="dg-box" x="275.5" y="428" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="323.5" y="446" text-anchor="middle">date</text><rect class="dg-box" x="121" y="524" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="198.5" y="542" text-anchor="middle">Every other screen</text><rect class="dg-box" x="145.5" y="620" width="106" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="198.5" y="638" text-anchor="middle">route alone</text><rect class="dg-ex" x="16" y="692" width="365" height="50" rx="8"/><text class="dg-sub" x="28" y="714">15 screens name a thing; Settings sends only its route.</text><text class="dg-sub" x="28" y="732">Meal detail on 14 Sep sends: route + the meal&#39;s id.</text></svg>
