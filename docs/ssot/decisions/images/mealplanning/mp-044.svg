<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 544" width="100%" role="img" aria-label="What each screen sends with a message">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What each screen sends with a message</text><rect class="dg-box" x="122.5" y="44" width="106" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="175.5" y="62" text-anchor="middle">Plan tab:</text><text x="175.5" y="80" text-anchor="middle">date + plan</text><rect class="dg-box" x="252.5" y="44" width="113" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="309" y="62" text-anchor="middle">Meal detail:</text><text x="309" y="80" text-anchor="middle">the meal</text><rect class="dg-box" x="166.5" y="140" width="155" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="244" y="158" text-anchor="middle">Fuel log, session</text><text x="244" y="176" text-anchor="middle">plan: the activity</text><rect class="dg-box" x="94.5" y="236" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="158" y="254" text-anchor="middle">Event screens:</text><text x="158" y="272" text-anchor="middle">the event</text><rect class="dg-box" x="245.5" y="236" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="319.5" y="254" text-anchor="middle">Meal-log screens:</text><text x="319.5" y="272" text-anchor="middle">date + slot</text><rect class="dg-box" x="194.5" y="332" width="99" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="244" y="350" text-anchor="middle">Main tabs:</text><text x="244" y="368" text-anchor="middle">the date</text><rect class="dg-box" x="110.5" y="428" width="267" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="244" y="446" text-anchor="middle">Every other screen, e.g. Settings:</text><text x="244" y="464" text-anchor="middle">its route alone</text><rect class="dg-ex" x="16" y="500" width="456" height="32" rx="8"/><text class="dg-sub" x="28" y="522">Fifteen screens name what is in view; the rest send only their route.</text></svg>
