<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 236" width="100%" role="img" aria-label="Proposed, then rejected: a 3.5-second wait">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Proposed, then rejected: a 3.5-second wait</text><rect class="dg-box" x="46.5" y="44" width="180" height="114" rx="10" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="58.5" y="66" font-weight="700">Proposed (rejected)</text><line x1="58.5" y1="74" x2="214.5" y2="74" stroke="var(--no, #DC2597)" stroke-width="1"/><text class="dg-sub" x="58.5" y="92">Opener waits up to 3.5 s</text><text class="dg-sub" x="58.5" y="109">for the last chat to be</text><text class="dg-sub" x="58.5" y="126">read back. Late: it uses</text><text class="dg-sub" x="58.5" y="143">the athlete&#39;s last words</text><rect class="dg-box" x="242.5" y="44" width="186" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="254.5" y="66" font-weight="700">Decided instead</text><line x1="254.5" y1="74" x2="416.5" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="254.5" y="92">Opener never waits</text><text class="dg-sub" x="254.5" y="109">Uses the Memories and</text><text class="dg-sub" x="254.5" y="126">episodes that exist now</text><text class="dg-sub" x="254.5" y="143">Missing episode: left out</text><rect class="dg-ex" x="16" y="174" width="443" height="50" rx="8"/><text class="dg-sub" x="28" y="196">A chat about race week closes at 07:00; New meal plan at 07:00.</text><text class="dg-sub" x="28" y="214">Rejected: up to 3.5 s of waiting. Decided: the opener goes at once.</text></svg>
