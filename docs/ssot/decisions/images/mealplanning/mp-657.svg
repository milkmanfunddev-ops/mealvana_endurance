<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 253" width="100%" role="img" aria-label="What the Patrol runner leaves out">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the Patrol runner leaves out</text><rect class="dg-box" x="16" y="44" width="222" height="131" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: AI spend only</text><line x1="28" y1="74" x2="226" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">2 flows left out</text><text class="dg-sub" x="28" y="109">signup, account delete,</text><text class="dg-sub" x="28" y="126">Connect and Google</text><text class="dg-sub" x="28" y="143">skip on a signed-in sim</text><text class="dg-sub" x="28" y="160">and the job goes red</text><rect class="dg-box" x="254" y="44" width="264" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="266" y="66" font-weight="700">This card&#39;s answer: three reasons</text><line x1="266" y1="74" x2="506" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="266" y="92">ai-spend: 2 flows</text><text class="dg-sub" x="266" y="109">clean-install: 3 flows</text><text class="dg-sub" x="266" y="126">interactive-oauth: 1 flow</text><text class="dg-sub" x="266" y="143">any other reason</text><text class="dg-sub" x="266" y="160">is refused</text><rect class="dg-ex" x="16" y="191" width="502" height="50" rx="8"/><text class="dg-sub" x="28" y="213">21 flow files run each night, 6 are left out with a reason</text><text class="dg-sub" x="28" y="231">A new flow joins the run by existing in the flows folder</text></svg>
