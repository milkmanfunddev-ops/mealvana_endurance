<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 580" width="100%" role="img" aria-label="What we decided: after Confirm">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What we decided: after Confirm</text><line class="dg-edge" x1="200.5" y1="82" x2="200.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="200.5" y1="82" x2="200.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="177.7" y1="214" x2="105.2" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="218.6" y1="214" x2="276.3" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="200.5" y1="214" x2="200.5" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="152.5" y="44" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="200.5" y="62" text-anchor="middle">Confirm</text><rect class="dg-box" x="95" y="140" width="211" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="200.5" y="158" text-anchor="middle">&quot;You&#39;re set&quot; card:</text><text x="200.5" y="176" text-anchor="middle">share as text,</text><text x="200.5" y="194" text-anchor="middle">remind me the night before</text><rect class="dg-box" x="119.5" y="236" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="200.5" y="254" text-anchor="middle">Food tab, Shopping,</text><text x="200.5" y="272" text-anchor="middle">tab bar present</text><rect class="dg-box" x="16" y="332" width="155" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="93.5" y="350" text-anchor="middle">Open shopping list</text><rect class="dg-box" x="195" y="332" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="290" y="350" text-anchor="middle">Lay it across the week:</text><text x="290" y="368" text-anchor="middle">read-only day cards</text><rect class="dg-box" x="152.5" y="428" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="200.5" y="446" text-anchor="middle">Adjust</text><rect class="dg-ex" x="16" y="518" width="369" height="50" rx="8"/><text class="dg-sub" x="28" y="540">No calendar, email or PDF in the first version.</text><text class="dg-sub" x="28" y="558">Ignore &quot;Lay it across&quot;: the plan stays a set of meals.</text></svg>
