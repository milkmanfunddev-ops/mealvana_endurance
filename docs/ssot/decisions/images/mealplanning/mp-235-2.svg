<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 402" width="100%" role="img" aria-label="This card&#39;s answer: after Confirm">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">This card&#39;s answer: after Confirm</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="273"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="55" font-weight="700">Confirm</text><text class="dg-sub" x="50" y="73">&quot;You&#39;re set&quot; card: the week, cooking sessions,</text><text class="dg-sub" x="50" y="89">list size. Share as text, or &quot;remind me</text><text class="dg-sub" x="50" y="105">the night before cook day&quot;</text><circle cx="30" cy="135" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="140" font-weight="700">Lands</text><text class="dg-sub" x="50" y="158">Food tab, Shopping open,</text><text class="dg-sub" x="50" y="174">tab bar showing</text><circle cx="30" cy="204" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="209" font-weight="700">Chips</text><text class="dg-sub" x="50" y="227">Open shopping list, Lay it across</text><text class="dg-sub" x="50" y="243">the week, Adjust</text><circle cx="30" cy="273" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="278" font-weight="700">Never lays it out</text><text class="dg-sub" x="50" y="296">The plan stays a set of meals</text><text class="dg-sub" x="50" y="312">with servings, no days attached</text><rect class="dg-ex" x="16" y="340" width="333" height="50" rx="8"/><text class="dg-sub" x="28" y="362">No calendar, email or PDF in the first version.</text><text class="dg-sub" x="28" y="380">Lay it across the week: read-only day cards.</text></svg>
