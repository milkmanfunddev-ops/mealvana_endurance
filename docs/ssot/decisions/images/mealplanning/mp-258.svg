<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 388" width="100%" role="img" aria-label="From dev-only to production">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">From dev-only to production</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="257"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">Until the cutover</text><text class="dg-sub" x="50" y="73">Dev only: nothing pushed to</text><text class="dg-sub" x="50" y="89">the develop or release branches</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Cutover</text><text class="dg-sub" x="50" y="142">The home-location database change</text><text class="dg-sub" x="50" y="158">goes out with it</text><circle cx="30" cy="188" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="193" font-weight="700">Seed</text><text class="dg-sub" x="50" y="211">About 1,922 calls recompute the</text><text class="dg-sub" x="50" y="227">search numbers for every meal</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">Seed done</text><text class="dg-sub" x="50" y="280">Only when every meal has them</text><rect class="dg-ex" x="16" y="308" width="358" height="68" rx="8"/><text class="dg-sub" x="28" y="330">A build in production before the home columns exist</text><text class="dg-sub" x="28" y="348">fails every save of a user&#39;s record.</text><text class="dg-sub" x="28" y="366">Bundled text loads first and beats an old cached copy.</text></svg>
