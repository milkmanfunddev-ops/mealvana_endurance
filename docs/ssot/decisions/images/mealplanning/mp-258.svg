<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 386" width="100%" role="img" aria-label="What reaches prod, and when">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What reaches prod, and when</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="257"/><circle cx="30" cy="50" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="55" font-weight="700">Now</text><text class="dg-sub" x="50" y="73">Meal planning stays on dev.</text><text class="dg-sub" x="50" y="89">Nothing pushed to develop or release.</text><circle cx="30" cy="119" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="124" font-weight="700">Cutover</text><text class="dg-sub" x="50" y="142">Migration runs, schema target 21.</text><text class="dg-sub" x="50" y="158">Prod gets pgvector and the home columns.</text><circle cx="30" cy="188" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)" stroke-width="2"/><text x="50" y="193" font-weight="700">Seed</text><text class="dg-sub" x="50" y="211">Library re-embedded: about 1,922 calls.</text><text class="dg-sub" x="50" y="227">Verify: every row embedded, or not done.</text><circle cx="30" cy="257" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="262" font-weight="700">Build ships</text><text class="dg-sub" x="50" y="280">The users upsert finds its columns.</text><text class="dg-sub" x="50" y="296">Bundled defaults win over a stale cache.</text><rect class="dg-ex" x="16" y="324" width="365" height="50" rx="8"/><text class="dg-sub" x="28" y="346">A build lands before the columns: every sign-in breaks.</text><text class="dg-sub" x="28" y="364">Seed counts as done only when all ~1,922 rows embed.</text></svg>
