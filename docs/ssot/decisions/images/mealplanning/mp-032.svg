<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 373 388" width="100%" role="img" aria-label="What one turn replays">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What one turn replays</text><line class="dg-edge" x1="161.4" y1="100" x2="125.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="210.6" y1="100" x2="244.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="96.4" y1="196" x2="90.6" y2="236" marker-end="url(#dg-arrow)"/><rect x="43" y="207" width="101" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="93.5" y="220" text-anchor="middle">how it started</text><line class="dg-edge" x1="157" y1="264" x2="181" y2="264" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="269" y1="196" x2="269" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="105.5" y="44" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="186.5" y="62" text-anchor="middle">Conversation so far</text><text x="186.5" y="80" text-anchor="middle">34 messages</text><rect class="dg-box" x="30" y="140" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="100.5" y="158" text-anchor="middle">Messages 1 to 14</text><text x="100.5" y="176" text-anchor="middle">not replayed</text><rect class="dg-box" x="195" y="140" width="148" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="269" y="158" text-anchor="middle">Messages 15 to 34</text><text x="269" y="176" text-anchor="middle">replayed</text><rect class="dg-box" x="16" y="236" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="86.5" y="254" text-anchor="middle">Episode sentence</text><text x="86.5" y="272" text-anchor="middle">prepended once</text><rect class="dg-box" x="181" y="236" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="269" y="254" text-anchor="middle">What the model sees</text><text x="269" y="272" text-anchor="middle">episode + 20 messages</text><rect class="dg-ex" x="16" y="308" width="341" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Turn 35 of a 34-message chat: replays 15 to 34.</text><text class="dg-sub" x="28" y="348">The cap bit, so the episode line goes in first.</text><text class="dg-sub" x="28" y="366">Turn 12: all 11 messages, no episode needed.</text></svg>
