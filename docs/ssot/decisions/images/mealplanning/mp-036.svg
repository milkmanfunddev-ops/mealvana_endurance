<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 484" width="100%" role="img" aria-label="Two episode rows, one read">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Two episode rows, one read</text><line class="dg-edge" x1="140.6" y1="100" x2="176.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="257.5" y1="100" x2="224.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="174.4" y1="196" x2="135.6" y2="236" marker-end="url(#dg-arrow)"/><rect x="130.5" y="207" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="155" y="220" text-anchor="middle">before</text><line class="dg-edge" x1="228.6" y1="196" x2="267.4" y2="236" marker-end="url(#dg-arrow)"/><rect x="233" y="207" width="30" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="248" y="220" text-anchor="middle">now</text><line class="dg-edge" x1="201.5" y1="332" x2="201.5" y2="196" marker-end="url(#dg-arrow)" style="stroke:var(--muted, #8A7A8C)"/><rect x="160.5" y="255" width="82" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="201.5" y="268" text-anchor="middle">would block</text><rect class="dg-box" x="48.5" y="44" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="115.5" y="62" text-anchor="middle">Turn 21 inserts</text><text x="115.5" y="80" text-anchor="middle">an episode row</text><rect class="dg-box" x="206.5" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="280.5" y="62" text-anchor="middle">Read-back inserts</text><text x="280.5" y="80" text-anchor="middle">an episode row</text><rect class="dg-box" x="131" y="140" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="201.5" y="158" text-anchor="middle">Two rows for</text><text x="201.5" y="176" text-anchor="middle">one conversation</text><rect class="dg-box" x="27.5" y="236" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="108.5" y="254" text-anchor="middle">Expect one row</text><text x="108.5" y="272" text-anchor="middle">error, episode lost</text><rect class="dg-box" x="213.5" y="236" width="162" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="294.5" y="254" text-anchor="middle">Take the newest row</text><text x="294.5" y="272" text-anchor="middle">episode kept</text><rect class="dg-box" x="131" y="332" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="201.5" y="350" text-anchor="middle">Unique index</text><text x="201.5" y="368" text-anchor="middle">left out for now</text><rect class="dg-ex" x="16" y="404" width="371" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Turn 21 and the read-back both insert at 14:02.</text><text class="dg-sub" x="28" y="444">The read takes the 14:02:07 row, the newer one.</text><text class="dg-sub" x="28" y="462">Before: &#39;expected one row&#39; error, episode gone for good.</text></svg>
