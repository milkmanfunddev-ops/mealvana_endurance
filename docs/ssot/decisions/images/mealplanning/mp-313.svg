<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 484" width="100%" role="img" aria-label="Which memory writes clear the block">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Which memory writes clear the block</text><line class="dg-edge" x1="213" y1="72" x2="237" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="127" y1="196" x2="160" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="248.9" y1="196" x2="210.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="183" y1="292" x2="183" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="197" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="114.5" y="62" text-anchor="middle">Athlete&#39;s tool write</text><text x="114.5" y="80" text-anchor="middle">(remember, plan, pantry)</text><rect class="dg-box" x="237" y="44" width="113" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="293.5" y="62" text-anchor="middle">Stored block</text><text x="293.5" y="80" text-anchor="middle">cleared</text><rect class="dg-box" x="23" y="140" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="104" y="158" text-anchor="middle">Server read-back of</text><text x="104" y="176" text-anchor="middle">last conversation</text><rect class="dg-box" x="209" y="140" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="276" y="158" text-anchor="middle">Episode written</text><text x="276" y="176" text-anchor="middle">at the cap</text><rect class="dg-box" x="123" y="236" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="183" y="254" text-anchor="middle">Block kept</text><text x="183" y="272" text-anchor="middle">(quiet write)</text><rect class="dg-box" x="88" y="332" width="190" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="183" y="350" text-anchor="middle">Next tool write</text><text x="183" y="368" text-anchor="middle">or next day picks it up</text><rect class="dg-ex" x="16" y="404" width="334" height="68" rx="8"/><text class="dg-sub" x="28" y="426">Dev, turn 1 at 09:41, read-back lands at 09:41:07</text><text class="dg-sub" x="28" y="444">Before: block cleared, turn 2 read 0 from cache</text><text class="dg-sub" x="28" y="462">After: block kept, turn 2 read 4980</text></svg>
