<text class="dg-title" x="16" y="24">A payload with no mode</text><line class="dg-edge" x1="225.4" y1="100" x2="185.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="276.5" y1="100" x2="309.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="309.5" y1="196" x2="276.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="169" y="44" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="253.5" y="62" text-anchor="middle">Plan payload</text><text x="253.5" y="80" text-anchor="middle">no batchCooking flag</text><rect class="dg-box" x="90" y="140" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="157" y="158" text-anchor="middle">Server: batch</text><text x="157" y="176" text-anchor="middle">counts servings</text><rect class="dg-box" x="248" y="140" width="169" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="332.5" y="158" text-anchor="middle">App, before: per-day</text><text x="332.5" y="176" text-anchor="middle">counted nights</text><rect class="dg-box" x="151.5" y="236" width="204" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="253.5" y="254" text-anchor="middle">App, now: batch</text><text x="253.5" y="272" text-anchor="middle">one reading on both sides</text><rect class="dg-ex" x="16" y="308" width="475" height="50" rx="8"/><text class="dg-sub" x="28" y="330">One dinner of 4 servings: covered 4, not 1</text><text class="dg-sub" x="28" y="348">The seam test that caught it: batch without coverage computes it locally</text></svg>
