<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 408" width="100%" role="img" aria-label="Where &quot;has this person paid?&quot; comes from">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where &quot;has this person paid?&quot; comes</text><text class="dg-title" x="16" y="44">from</text><g transform="translate(0 20)"><line class="dg-edge" x1="155.9" y1="100" x2="118.6" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="205" y1="100" x2="238" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="211.9" y1="196" x2="141.6" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="262" y1="196" x2="263.5" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="122" y="44" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="182" y="62" text-anchor="middle">RevenueCat</text><text x="182" y="80" text-anchor="middle">(both stores)</text><rect class="dg-box" x="25.5" y="140" width="134" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="92.5" y="158" text-anchor="middle">Server: a copy,</text><text x="92.5" y="176" text-anchor="middle">never grants</text><rect class="dg-box" x="183.5" y="140" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="261" y="158" text-anchor="middle">Phone: a saved</text><text x="261" y="176" text-anchor="middle">copy, never grants</text><rect class="dg-box" x="22" y="236" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="92.5" y="254" text-anchor="middle">Saved copy:</text><text x="92.5" y="272" text-anchor="middle">in, even offline</text><rect class="dg-box" x="187" y="236" width="155" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="264.5" y="254" text-anchor="middle">No copy yet:</text><text x="264.5" y="272" text-anchor="middle">locked till online</text><rect class="dg-ex" x="16" y="308" width="332" height="68" rx="8"/><text class="dg-sub" x="28" y="330">Example: a renewing plan expires 9:00 and the</text><text class="dg-sub" x="28" y="348">renewal lands 9:10. The copy holds to 9:15, so no</text><text class="dg-sub" x="28" y="366">lockout. A cancelled plan or a grant ends at 9:00.</text></g></svg>
