<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 390" width="100%" role="img" aria-label="An AI request from an account without Pro">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An AI request from an account</text><text class="dg-title" x="16" y="44">without Pro</text><g transform="translate(0 20)"><line class="dg-edge" x1="150.6" y1="100" x2="114.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="200.1" y1="100" x2="234.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="98.3" y1="178" x2="102.1" y2="236" marker-end="url(#dg-arrow)"/><rect x="75.69999999999999" y="198" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="100.19999999999999" y="211" text-anchor="middle">no Pro</text><line class="dg-edge" x1="256.5" y1="196" x2="253.5" y2="236" marker-end="url(#dg-arrow)"/><rect x="230.5" y="207" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="255" y="220" text-anchor="middle">no Pro</text><rect class="dg-box" x="67" y="44" width="218" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="176" y="62" text-anchor="middle">Vana, meal description,</text><text x="176" y="80" text-anchor="middle">meal photo or coach insight</text><rect class="dg-box" x="26.5" y="140" width="141" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="97" y="158" text-anchor="middle">App checks first</text><rect class="dg-box" x="191.5" y="140" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="258.5" y="158" text-anchor="middle">Server checks</text><text x="258.5" y="176" text-anchor="middle">before spending</text><rect class="dg-box" x="40.5" y="236" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="104" y="254" text-anchor="middle">Paywall opens,</text><text x="104" y="272" text-anchor="middle">even offline</text><rect class="dg-box" x="191.5" y="236" width="120" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="251.5" y="254" text-anchor="middle">Refused,</text><text x="251.5" y="272" text-anchor="middle">nothing spent</text><rect class="dg-ex" x="16" y="308" width="320" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Example: a lapsed account with bought budget</text><text class="dg-sub" x="28" y="348">left asks Vana for a plan. Refused all the same.</text></g></svg>
