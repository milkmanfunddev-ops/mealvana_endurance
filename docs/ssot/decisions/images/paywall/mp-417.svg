<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 582" width="100%" role="img" aria-label="Onboarding ends in an account, then the paywall">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Onboarding ends in an account,</text><text class="dg-title" x="16" y="44">then the paywall</text><g transform="translate(0 20)"><line class="dg-edge" x1="160" y1="100" x2="160" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="196" x2="160" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="292" x2="160" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="160" y1="388" x2="160" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="82.5" y="44" width="155" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">Onboarding answers</text><text x="160" y="80" text-anchor="middle">kept on the phone</text><rect class="dg-box" x="58" y="140" width="204" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="160" y="158" text-anchor="middle">Account screen</text><text x="160" y="176" text-anchor="middle">says what the trial costs</text><rect class="dg-box" x="58" y="236" width="204" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="160" y="254" text-anchor="middle">6-digit code</text><text x="160" y="272" text-anchor="middle">(when confirmation is on)</text><rect class="dg-box" x="93" y="332" width="134" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="350" text-anchor="middle">Answers move to</text><text x="160" y="368" text-anchor="middle">the new account</text><rect class="dg-box" x="112" y="428" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="160" y="446" text-anchor="middle">Paywall</text><rect class="dg-ex" x="16" y="500" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="522">No guest mode: there is no way past</text><text class="dg-sub" x="28" y="540">the account screen without signing up.</text></g></svg>
