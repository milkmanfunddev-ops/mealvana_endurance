<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 374" width="100%" role="img" aria-label="One free week, then the store charges">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One free week, then the store</text><text class="dg-title" x="16" y="44">charges</text><g transform="translate(0 20)"><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Day 1</text><text class="dg-sub" x="50" y="73">Subscribes in the store with a card on file.</text><text class="dg-sub" x="50" y="89">Pays nothing; the whole app is open.</text><circle cx="30" cy="119" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="124" font-weight="700">Days 2 to 7</text><text class="dg-sub" x="50" y="142">Still free. Can cancel in the store any time.</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">Day 8</text><text class="dg-sub" x="50" y="195">The store charges, unless they cancelled.</text><text class="dg-sub" x="50" y="211">No free tier and no Pro tier to fall back to.</text><circle cx="30" cy="241" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="246" font-weight="700">Any later account</text><text class="dg-sub" x="50" y="264">No second trial for the same person.</text><rect class="dg-ex" x="16" y="292" width="326" height="50" rx="8"/><text class="dg-sub" x="28" y="314">Example: subscribes 1 Oct, free to 7 Oct,</text><text class="dg-sub" x="28" y="332">first charge 8 Oct. The store keeps the clock.</text></g></svg>
