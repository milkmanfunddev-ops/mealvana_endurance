<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 484" width="100%" role="img" aria-label="An admin account and the paywall">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An admin account and the paywall</text><line class="dg-edge" x1="148.2" y1="82" x2="112.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="172.4" y1="82" x2="210.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="96.5" y1="196" x2="98.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="229.6" y1="196" x2="231.2" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="116" y1="292" x2="138.9" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="112" y="44" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="160" y="62" text-anchor="middle">Signs in</text><rect class="dg-box" x="38.5" y="140" width="113" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="95" y="158" text-anchor="middle">Marked admin</text><text x="95" y="176" text-anchor="middle">by hand</text><rect class="dg-box" x="175.5" y="140" width="106" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="228.5" y="158" text-anchor="middle">Anyone else</text><text x="228.5" y="176" text-anchor="middle">without Pro</text><rect class="dg-box" x="40" y="236" width="120" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="100" y="254" text-anchor="middle">Straight into</text><text x="100" y="272" text-anchor="middle">the app</text><rect class="dg-box" x="184" y="236" width="96" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="232" y="254" text-anchor="middle">Paywall</text><rect class="dg-box" x="68.5" y="332" width="183" height="74" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="160" y="350" text-anchor="middle">AI features: refused</text><text x="160" y="368" text-anchor="middle">without a subscription</text><text x="160" y="386" text-anchor="middle">or granted month</text><rect class="dg-ex" x="16" y="422" width="288" height="50" rx="8"/><text class="dg-sub" x="28" y="444">No build switch and no tester shortcut:</text><text class="dg-sub" x="28" y="462">the admin mark is the only exception.</text></svg>
