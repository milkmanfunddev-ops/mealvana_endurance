<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 322" width="100%" role="img" aria-label="What the paywall lists">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What the paywall lists</text><rect class="dg-box" x="16" y="44" width="201" height="182" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: every line</text><line x1="28" y1="74" x2="205" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Fuel plans</text><text class="dg-sub" x="28" y="109">Vana chat</text><text class="dg-sub" x="28" y="126">Meal description</text><text class="dg-sub" x="28" y="143">Meal photos</text><text class="dg-sub" x="28" y="160">Coach insight</text><text class="dg-sub" x="28" y="177">Shopping lists</text><text class="dg-sub" x="28" y="194">Training sync</text><text class="dg-sub" x="28" y="211">Kroger delivery</text><rect class="dg-box" x="233" y="44" width="201" height="182" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="245" y="66" font-weight="700">This card&#39;s answer: four</text><line x1="245" y1="74" x2="422" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="245" y="92">1 Fuel plan, every session</text><text class="dg-sub" x="245" y="109">2 Vana, nutrition coach:</text><text class="dg-sub" x="245" y="126">all the AI features</text><text class="dg-sub" x="245" y="143">3 Shopping lists</text><text class="dg-sub" x="245" y="160">4 Training sync: Garmin,</text><text class="dg-sub" x="245" y="177">TrainingPeaks, FinalSurge</text><rect class="dg-ex" x="16" y="242" width="418" height="68" rx="8"/><text class="dg-sub" x="28" y="264">Also includes: recipes, brick workouts, hydration,</text><text class="dg-sub" x="28" y="282">fuel formulas, daily targets. Kroger is left off:</text><text class="dg-sub" x="28" y="300">delivery does not reach every athlete.</text></svg>
