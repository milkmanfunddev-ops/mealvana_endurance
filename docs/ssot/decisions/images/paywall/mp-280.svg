<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 254" width="100%" role="img" aria-label="Pro ends on 31 Oct: what the athlete sees">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Pro ends on 31 Oct: what the athlete sees</text><rect class="dg-box" x="16" y="44" width="258" height="114" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: read-only</text><line x1="28" y1="74" x2="262" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Paywall can be closed</text><text class="dg-sub" x="28" y="109">Plans and logs visible, not editable</text><text class="dg-sub" x="28" y="126">More screens to build and test</text><rect class="dg-box" x="290" y="44" width="212" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="302" y="66" font-weight="700">This card&#39;s answer</text><line x1="302" y1="74" x2="490" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="302" y="92">Full-screen paywall, no close</text><text class="dg-sub" x="302" y="109">Still signed in, data kept</text><text class="dg-sub" x="302" y="126">Out: subscribe, restore, code</text><text class="dg-sub" x="302" y="143">Pro back: everything returns</text><rect class="dg-ex" x="16" y="174" width="486" height="68" rx="8"/><text class="dg-sub" x="28" y="196">Example: the trial is cancelled and ends 31 Oct.</text><text class="dg-sub" x="28" y="214">1 Nov: the app opens on the paywall. A code</text><text class="dg-sub" x="28" y="232">redeemed on 3 Nov brings every plan back.</text></svg>
