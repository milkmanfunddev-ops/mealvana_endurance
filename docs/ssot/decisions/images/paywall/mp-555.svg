<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 390" width="100%" role="img" aria-label="An install with no account, after the update">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">An install with no account, after</text><text class="dg-title" x="16" y="44">the update</text><g transform="translate(0 20)"><line class="dg-edge" x1="142.4" y1="100" x2="104.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="193.1" y1="100" x2="227.4" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="87.1" y1="178" x2="89.1" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="249.2" y1="196" x2="246" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="81" y="44" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="169" y="62" text-anchor="middle">Opens the new version</text><text x="169" y="80" text-anchor="middle">(no account yet)</text><rect class="dg-box" x="16" y="140" width="141" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="86.5" y="158" text-anchor="middle">Sign-up, no skip</text><rect class="dg-box" x="181" y="140" width="141" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="251.5" y="158" text-anchor="middle">Signs in to an</text><text x="251.5" y="176" text-anchor="middle">existing account</text><rect class="dg-box" x="26.5" y="236" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="90" y="254" text-anchor="middle">Entries kept +</text><text x="90" y="272" text-anchor="middle">free month</text><rect class="dg-box" x="177.5" y="236" width="134" height="38" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="244.5" y="254" text-anchor="middle">No second month</text><rect class="dg-ex" x="16" y="308" width="306" height="50" rx="8"/><text class="dg-sub" x="28" y="330">Claim fails (say, offline)? The app tries</text><text class="dg-sub" x="28" y="348">again at the next start.</text></g></svg>
