<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 301" width="100%" role="img" aria-label="Accounts made before the paywall">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Accounts made before the paywall</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="188"/><circle cx="30" cy="50" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="55" font-weight="700">24 Sep (a week before)</text><text class="dg-sub" x="50" y="73">Email to existing users: a free month is coming.</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="108" font-weight="700">1 Oct (planned)</text><text class="dg-sub" x="50" y="126">Lee switches the paywall on. Every existing account,</text><text class="dg-sub" x="50" y="142">subscribers and team too, gets 30 days of Pro</text><text class="dg-sub" x="50" y="158">and the founding-member mark.</text><circle cx="30" cy="188" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="193" font-weight="700">31 Oct</text><text class="dg-sub" x="50" y="211">The free month ends; the account needs Pro.</text><rect class="dg-ex" x="16" y="239" width="371" height="50" rx="8"/><text class="dg-sub" x="28" y="261">Example: free access already running to 15 Nov</text><text class="dg-sub" x="28" y="279">is kept as it is; that account only gets the mark.</text></svg>
