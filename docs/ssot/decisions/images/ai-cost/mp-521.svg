<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 388" width="100%" role="img" aria-label="What each AI call leaves behind">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What each AI call leaves behind</text><line class="dg-edge" x1="197" y1="82" x2="197" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="157.4" y1="214" x2="133.9" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="239.5" y1="214" x2="264.8" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="144" y="44" width="106" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="197" y="62" text-anchor="middle">A Vana turn</text><rect class="dg-box" x="95" y="140" width="204" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="197" y="158" text-anchor="middle">Row: gateway charge,</text><text x="197" y="176" text-anchor="middle">cache share, tap or type,</text><text x="197" y="194" text-anchor="middle">subscription state</text><rect class="dg-box" x="16" y="236" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="104" y="254" text-anchor="middle">Weekly view:</text><text x="104" y="272" text-anchor="middle">per athlete, per plan</text><rect class="dg-box" x="216" y="236" width="162" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="297" y="254" text-anchor="middle">Alert: one account</text><text x="297" y="272" text-anchor="middle">over $1.50 in a day</text><rect class="dg-ex" x="16" y="326" width="362" height="50" rx="8"/><text class="dg-sub" x="28" y="348">Raw rows kept 90 days; weekly totals kept.</text><text class="dg-sub" x="28" y="366">These numbers put chat on Haiku.</text></svg>
