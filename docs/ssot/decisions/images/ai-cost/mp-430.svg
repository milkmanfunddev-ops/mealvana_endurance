<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 372" width="100%" role="img" aria-label="One account&#39;s month (example)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One account&#39;s month (example)</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="241"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Oct 1</text><text class="dg-sub" x="50" y="73">Budget refills to $4.00, the same for</text><text class="dg-sub" x="50" y="89">every account (trial week: $1.00)</text><circle cx="30" cy="119" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="124" font-weight="700">Every AI call</text><text class="dg-sub" x="50" y="142">Takes off what that call really cost us;</text><text class="dg-sub" x="50" y="158">no message count, no daily cap</text><circle cx="30" cy="188" r="7" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)" stroke-width="2"/><text x="50" y="193" font-weight="700">Oct 31, $0.60 unused</text><text class="dg-sub" x="50" y="211">Does not carry over</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">Nov 1</text><text class="dg-sub" x="50" y="264">$4.00 again</text><rect class="dg-ex" x="16" y="292" width="294" height="68" rx="8"/><text class="dg-sub" x="28" y="314">Cap $4.00, against $7.08 to $10.62 we keep</text><text class="dg-sub" x="28" y="332">from a founding subscription.</text><text class="dg-sub" x="28" y="350">Old credits converted once at 2¢ each.</text></svg>
