<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 365" width="100%" role="img" aria-label="Using up the month (example)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Using up the month (example)</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="294"/><circle cx="30" cy="50" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="55" font-weight="700">Turn starts, 3¢ left</text><text class="dg-sub" x="50" y="73">Vana&#39;s answer finishes, a few cents over</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="108" font-weight="700">Next AI action</text><text class="dg-sub" x="50" y="126">Top-up sheet: how much used, refill date,</text><text class="dg-sub" x="50" y="142">the two packs</text><circle cx="30" cy="172" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="177" font-weight="700">In the chat</text><text class="dg-sub" x="50" y="195">&quot;You&#39;ve used this month&#39;s Vana —</text><text class="dg-sub" x="50" y="211">top up to keep chatting&quot;</text><circle cx="30" cy="241" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="246" font-weight="700">Rest of the app</text><text class="dg-sub" x="50" y="264">Anything without AI keeps working</text><circle cx="30" cy="294" r="7" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)" stroke-width="2"/><text x="50" y="299" font-weight="700">If the fault is ours</text><text class="dg-sub" x="50" y="317">&quot;Vana is unavailable right now&quot;,</text><text class="dg-sub" x="50" y="333">never the top-up sheet</text></svg>
