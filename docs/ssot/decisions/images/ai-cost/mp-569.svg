<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 253" width="100%" role="img" aria-label="Where a Vana call goes">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where a Vana call goes</text><rect class="dg-box" x="16" y="44" width="194" height="131" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: fallbacks</text><line x1="28" y1="74" x2="198" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Anthropic, Bedrock</text><text class="dg-sub" x="28" y="109">or Vertex</text><text class="dg-sub" x="28" y="126">three caches</text><text class="dg-sub" x="28" y="143">fallback = full price</text><rect class="dg-box" x="226" y="44" width="194" height="131" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="238" y="66" font-weight="700">This card&#39;s answer: one</text><line x1="238" y1="74" x2="408" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="238" y="92">Anthropic only</text><text class="dg-sub" x="238" y="109">one cache, kept warm</text><text class="dg-sub" x="238" y="126">down: &quot;Vana is</text><text class="dg-sub" x="238" y="143">unavailable right now&quot;</text><text class="dg-sub" x="238" y="160">charged nothing</text><rect class="dg-ex" x="16" y="191" width="404" height="50" rx="8"/><text class="dg-sub" x="28" y="213">When Anthropic is down, the athlete</text><text class="dg-sub" x="28" y="231">pays nothing for the failed turn.</text></svg>
