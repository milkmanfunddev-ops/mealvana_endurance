<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 292" width="100%" role="img" aria-label="What a meal shows (example)">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What a meal shows (example)</text><line class="dg-edge" x1="118.3" y1="100" x2="120.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="286.5" y1="100" x2="292.9" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="29" y="44" width="176" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="117" y="62" text-anchor="middle">Meal card, plan tile,</text><text x="117" y="80" text-anchor="middle">plan summary</text><rect class="dg-box" x="229" y="44" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="282" y="62" text-anchor="middle">Meal picker</text><text x="282" y="80" text-anchor="middle">small tile</text><rect class="dg-box" x="20" y="140" width="204" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="122" y="158" text-anchor="middle">620 kcal</text><text x="122" y="176" text-anchor="middle">85 g carbs · 35 g protein</text><text x="122" y="194" text-anchor="middle">16 g fat</text><rect class="dg-box" x="248" y="140" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="296" y="158" text-anchor="middle">620 kcal</text><rect class="dg-ex" x="16" y="230" width="332" height="50" rx="8"/><text class="dg-sub" x="28" y="252">Example: a salmon rice bowl.</text><text class="dg-sub" x="28" y="270">Four numbers on by default; small tiles kcal only.</text></svg>
