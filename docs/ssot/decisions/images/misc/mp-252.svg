<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359 448" width="100%" role="img" aria-label="Where Vana runs">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where Vana runs</text><line class="dg-edge" x1="161.8" y1="82" x2="107.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="107.7" y1="178" x2="161.8" y2="236" marker-end="url(#dg-arrow)"/><rect x="84.25" y="198" width="101" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="134.75" y="211" text-anchor="middle">as the athlete</text><line class="dg-edge" x1="163.9" y1="274" x2="116.4" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="191.9" y1="274" x2="229.7" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="119.5" y="44" width="120" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="179.5" y="62" text-anchor="middle">Athlete&#39;s app</text><rect class="dg-box" x="16" y="140" width="148" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="90" y="158" text-anchor="middle">Vana, on Supabase</text><rect class="dg-box" x="188" y="140" width="155" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="265.5" y="158" text-anchor="middle">Prototype&#39;s Vercel</text><text x="265.5" y="176" text-anchor="middle">server: dropped</text><rect class="dg-box" x="131.5" y="236" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="179.5" y="254" text-anchor="middle">Database</text><rect class="dg-box" x="37" y="332" width="113" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="93.5" y="350" text-anchor="middle">Her own</text><text x="93.5" y="368" text-anchor="middle">records: yes</text><rect class="dg-box" x="174" y="332" width="148" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="248" y="350" text-anchor="middle">Another athlete&#39;s</text><text x="248" y="368" text-anchor="middle">records: no</text><rect class="dg-ex" x="16" y="404" width="327" height="32" rx="8"/><text class="dg-sub" x="28" y="426">The database itself decides who reads what.</text></svg>
