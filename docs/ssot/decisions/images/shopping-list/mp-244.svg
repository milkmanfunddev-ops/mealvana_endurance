<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 331 466" width="100%" role="img" aria-label="Where the list comes from">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Where the list comes from</text><line class="dg-edge" x1="100.8" y1="82" x2="144.4" y2="140" marker-end="url(#dg-arrow)"/><rect x="98.1" y="102" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="122.6" y="115" text-anchor="middle">builds</text><line class="dg-edge" x1="223.9" y1="100" x2="189.6" y2="140" marker-end="url(#dg-arrow)"/><rect x="175.75" y="111" width="62" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="206.75" y="124" text-anchor="middle">rebuilds</text><line class="dg-edge" x1="165.5" y1="196" x2="165.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="146.2" y1="292" x2="118.6" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="187.5" y1="292" x2="219" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="141" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="86.5" y="62" text-anchor="middle">Confirm the plan</text><rect class="dg-box" x="181" y="44" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="248" y="62" text-anchor="middle">Later edit</text><text x="248" y="80" text-anchor="middle">(swap a dinner)</text><rect class="dg-box" x="74" y="140" width="183" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="165.5" y="158" text-anchor="middle">Server adds up every</text><text x="165.5" y="176" text-anchor="middle">ingredient in the plan</text><rect class="dg-box" x="95" y="236" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="165.5" y="254" text-anchor="middle">One list:</text><text x="165.5" y="272" text-anchor="middle">&quot;Week of Sep 20&quot;</text><rect class="dg-box" x="49" y="332" width="113" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="105.5" y="350" text-anchor="middle">Shopping tab</text><rect class="dg-box" x="186" y="332" width="96" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="234" y="350" text-anchor="middle">Kroger</text><rect class="dg-ex" x="16" y="404" width="299" height="50" rx="8"/><text class="dg-sub" x="28" y="426">Two dinners both use onions:</text><text class="dg-sub" x="28" y="444">the list shows one onion row, count 2.</text></svg>
