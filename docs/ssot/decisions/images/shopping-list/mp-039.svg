<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 236" width="100%" role="img" aria-label="Does the list show prices?">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--card, #FFFFFF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Does the list show prices?</text><rect class="dg-box" x="16" y="44" width="167" height="114" rx="10" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="28" y="66" font-weight="700">Other option: deals</text><line x1="28" y1="74" x2="171" y2="74" stroke="var(--muted, #8A7A8C)" stroke-width="1"/><text class="dg-sub" x="28" y="92">Vana gathers coupons</text><text class="dg-sub" x="28" y="109">item prices, deals</text><text class="dg-sub" x="28" y="126">the week&#39;s total cost</text><text class="dg-sub" x="28" y="143">no price source to use</text><rect class="dg-box" x="199" y="44" width="201" height="114" rx="10" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="211" y="66" font-weight="700">This card&#39;s answer: none</text><line x1="211" y1="74" x2="388" y2="74" stroke="var(--ok, #2FB9A6)" stroke-width="1"/><text class="dg-sub" x="211" y="92">items and amounts</text><text class="dg-sub" x="211" y="109">no prices or coupons</text><text class="dg-sub" x="211" y="126">no cost estimate</text><text class="dg-sub" x="211" y="143">budget: tell Vana</text><rect class="dg-ex" x="16" y="174" width="384" height="50" rx="8"/><text class="dg-sub" x="28" y="196">Example: &quot;keep it under $80&quot; shapes the</text><text class="dg-sub" x="28" y="214">meals Vana picks; the list shows no prices.</text></svg>
