<title>Mealvana Decisions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sansita:wght@700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --ground: #F8F6EB; --ground-2: #EFECDF; --line: #DDD8C8; --ink: #381633; --ink-2: #5E4A5C; --muted: #8A7A8C;

    --pending: #D9730A; --pending-soft: #FDEBD9; --amend: #7A5AA6; --amend-soft: #EDE6F7; --card: #FFFFFF; --focus: #F78B14;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --ground: #2D1535; --ground-2: #381633; --line: #4E2E4C; --ink: #F8F6EB; --ink-2: #D9CFD8; --muted: #9B8AA3;
    --accent: #FFA05A; --accent-ink: #2B1305; --ok: #3FD4C0; --ok-soft: #22453F; --no: #F060A8; --no-soft: #4A1F3A;
    --pending: #FFA05A; --pending-soft: #4A2E1B; --amend: #B9A0E0; --amend-soft: #3B2C52; --card: #4A2143; --focus: #FFA05A;
  } }
  :root[data-theme="dark"] {
    --ground: #2D1535; --ground-2: #381633; --line: #4E2E4C; --ink: #F8F6EB; --ink-2: #D9CFD8; --muted: #9B8AA3;
    --accent: #FFA05A; --accent-ink: #2B1305; --ok: #3FD4C0; --ok-soft: #22453F; --no: #F060A8; --no-soft: #4A1F3A;
    --pending: #FFA05A; --pending-soft: #4A2E1B; --amend: #B9A0E0; --amend-soft: #3B2C52; --card: #4A2143; --focus: #FFA05A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 "Source Sans 3", "Helvetica Neue", Arial, sans-serif; }
  h1, h2, h3 { font-family: "Sansita", Georgia, serif; font-weight: 700; margin: 0; text-wrap: balance; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--line); background: var(--ground-2); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 14px; }
  nav h1 { font-size: 22px; letter-spacing: .01em; }
  nav .sub { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
  nav .feat { margin-top: 14px; }
  nav .feat > .fname { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px 6px; }
  nav .cat { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 15px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
  nav .cat:hover { background: var(--card); }
  nav .cat.active { background: var(--card); color: var(--ink); font-weight: 600; }
  nav .cat .n { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  nav .cat .n.pend { color: var(--pending); font-weight: 600; }
  nav .cat .n .q { color: var(--amend); font-weight: 600; }
  nav .cat .n .done { color: var(--ok); font-weight: 600; }
  nav .legend { margin-top: 24px; font-size: 12px; color: var(--muted); line-height: 1.9; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header input[type=search] { flex: 1 1 260px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }
  header select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); }
  .status-line { width: 100%; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding: 20px 28px 80px; max-width: 1180px; }
  .cat-head { margin: 10px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .cat-head .fname { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .cat-head h2 { font-size: 28px; }
  .cat-head .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .cat-head .tools .hint { flex-basis: 100%; }
  .discuss { background: var(--ground-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 14px 0 20px; }
  .discuss summary { cursor: pointer; font-weight: 600; }
  .discuss .thread { max-width: 70ch; }
  .change { border: 1px solid var(--amend); border-radius: 8px; padding: 10px 14px; margin: 8px 0; max-width: 70ch; background: var(--card); }
  .change .op { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--amend); }
  .change h4 { margin: 2px 0 6px; font-size: 17px; }

  section.d { display: grid; grid-template-columns: minmax(260px, 6fr) 7fr; gap: 22px; padding: 18px 0 22px; border-bottom: 1px solid var(--line); scroll-margin-top: 90px; }

  .fig img { max-height: 560px; max-width: 100%; border-radius: 6px; object-fit: contain; }
  .fig svg { width: 100%; max-width: 100%; height: auto; }
  .fig .none { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  .fig .none b { display: block; font-size: 32px; font-family: "Sansita", serif; color: var(--line); }
  .cap { font-size: 12px; color: var(--muted); }
  .age { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .age .stale { background: var(--amend-soft); color: var(--amend); border-radius: 999px; padding: 1px 8px; font-weight: 600; }
  .txt h3 { font-size: 20px; margin-bottom: 4px; }
  .ruled { color: var(--ink); }
  #who { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); max-width: 9em; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.proposed { background: var(--pending-soft); color: var(--pending); }
  .pill.approved { background: var(--ok-soft); color: var(--ok); }
  button.linkish { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .pill.rejected { background: var(--no-soft); color: var(--no); }
  .pill.withdrawn { background: var(--ground-2); color: var(--muted); }
  .pill.amended, .pill.open { background: var(--amend-soft); color: var(--amend); }

  section.d.question .txt h3 { color: var(--amend); }

  .part .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .part p { margin: 2px 0 0; white-space: pre-wrap; }
  .answer { margin: 8px 0 4px; max-width: 62ch; font-size: 17px; line-height: 1.55; }

  .txt > .meta.brief { margin-bottom: 4px; }

  .sub-form { margin-top: 10px; display: none; gap: 8px; flex-direction: column; max-width: 62ch; }

  .row { display: flex; gap: 8px; align-items: center; }

  .turn.user { background: var(--ground-2); align-self: flex-end; max-width: 90%; }
  .turn.assistant { background: var(--card); border: 1px solid var(--line); }

  abbr.term { text-decoration: underline dotted var(--amend); text-underline-offset: 3px; cursor: help; }
  .vocab .entry { padding: 12px 0; border-bottom: 1px solid var(--line); max-width: 70ch; }
  .vocab .entry b { font-family: "Sansita", serif; font-size: 18px; }
  .vocab .entry .area { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-left: 8px; }
  .vocab .entry p { margin: 4px 0; }
  .vocab .entry .avoid { font-size: 13px; color: var(--muted); }
  .vocab form { display: grid; gap: 8px; max-width: 70ch; margin: 16px 0 24px; }
  .vocab input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }
  .words { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
  .words abbr { font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--amend-soft); color: var(--amend); text-decoration: none; cursor: help; }
  .qline { margin: 0 0 10px; max-width: 62ch; color: var(--ink-2); font-style: italic; }
  .qline b { font-style: normal; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 8px; }
  ol.clauses { margin: 2px 0 0; padding-left: 22px; max-width: 62ch; }
  ol.clauses li { margin: 3px 0; padding-left: 4px; }
  ol.clauses li.dropped { color: var(--muted); text-decoration: line-through; }
  ol.clauses label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  ol.clauses input { margin-top: 5px; }
  details.more { margin-top: 10px; max-width: 62ch; }
  details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details.more .part { margin-top: 8px; }
  section.d.detail { padding: 12px 0 14px; }
  section.d.detail .txt h3 { font-size: 17px; }
  section.d.detail .fig { min-height: 120px; }
  .detail-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 26px 0 4px; padding: 10px 0; border-top: 2px solid var(--line); }
  .detail-head h3 { font-size: 18px; color: var(--ink-2); }
  details.detail-block > summary { list-style: none; cursor: pointer; }
  details.detail-block > summary::-webkit-details-marker { display: none; }
  .work h3 { font-size: 20px; margin: 26px 0 8px; }
  .work .t { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); max-width: 80ch; }
  .work .t .num { font-family: "Sansita", serif; font-size: 20px; color: var(--muted); }
  .work .t .name { font-weight: 600; }
  .work .t .st { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .work .t .st.owed { color: var(--pending); }
  .work .t .cites { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .work .t .cites button, .work .d-row button { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  .work .d-row { padding: 8px 0; border-bottom: 1px solid var(--line); max-width: 80ch; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .work .lead { color: var(--ink-2); max-width: 70ch; margin: 0 0 6px; }
  .refdoc { max-width: 72ch; }
  .refdoc h1, .refdoc h2, .refdoc h3, .refdoc h4 { margin: 28px 0 8px; }
  .refdoc h1 { font-size: 26px; } .refdoc h2 { font-size: 21px; } .refdoc h3 { font-size: 18px; } .refdoc h4 { font-size: 16px; }
  .refdoc p { margin: 8px 0; }
  .refdoc ul, .refdoc ol { margin: 8px 0; padding-left: 24px; }
  .refdoc li { margin: 4px 0; }
  .refdoc code { font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--ground-2); border-radius: 4px; padding: 1px 5px; }
  .refdoc hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .refdoc .tablewrap { overflow-x: auto; margin: 12px 0; }
  .refdoc table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
  .refdoc th, .refdoc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .refdoc th { background: var(--ground-2); font-weight: 600; }
  .refdoc td { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .pager button { padding: 10px 16px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: var(--ground); padding: 10px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 360px; }
  .toast.show { opacity: 1; }
  #menu { display: none; }
  .scrim { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    nav { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 20; transform: translateX(-104%); transition: transform .2s; box-shadow: 4px 0 24px rgba(0,0,0,.25); padding-top: 22px; }
    body.nav-open nav { transform: none; }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.35); }
    #menu { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
    header { padding: 8px 12px; gap: 8px; }
    header input[type=search] { flex-basis: 140px; min-width: 0; }
    header select { max-width: 40vw; }
    #finishAll { min-height: 40px; }
    main { padding: 12px 12px 90px; }
    .cat-head h2 { font-size: 22px; }
    section.d { grid-template-columns: 1fr; gap: 12px; padding: 14px 0 18px; }
    .fig { min-height: 0; max-height: 240px; }
    .fig img { max-height: 220px; }
    .fig .none { padding: 10px; }
    section.d.detail .fig { display: none; }
    .fig:has(> .none) { display: none; }
    button { min-height: 40px; padding: 8px 14px; }
    .acts { gap: 10px; }
    .acts button { flex: 1 1 auto; }
    .acts button[data-act="undo"] { flex: 0 0 auto; }
    textarea, input, select { font-size: 16px; }
    .pager button { flex: 1 1 100%; }
    .part, .qline, ol.clauses, details.more, .amendbox, .answer, .sub-form, .explain { max-width: none; }
    .toast { left: 12px; right: 12px; bottom: 12px; max-width: none; text-align: center; }
    .detail-head { gap: 8px; }
    .work .t .cites button, .work .d-row button { min-height: 28px; padding: 2px 10px; }
  }
  @media (max-width: 860px) and (prefers-reduced-motion: reduce) { nav { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <nav id="nav">
    <h1>Mealvana Decisions</h1>
    <div id="navlist"><div class="hint">Loading decisions.</div></div>
  </nav>
  <div>
    <header>
      <button id="menu" aria-label="Categories" aria-controls="nav" aria-expanded="false">☰ <span id="menuCount"></span></button>
      <input id="q" type="search" placeholder="Search" aria-label="Search">
      <select id="feat" aria-label="Feature"><option value="">All features</option></select>
      <select id="who" aria-label="Who is ruling"><option value="">Who are you?</option><option>Lee</option><option>Xuan</option></select>
      <button id="finishAll" class="primary" disabled>Finish all</button>
      <div class="status-line" id="status">Connecting.</div>
    </header>
    <main id="main"><div class="empty">Loading.</div></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state = { decisions: new Map(), verdicts: new Map(), chats: new Map(), tickets: new Map(), refs: new Map(), meta: {}, q: '', feat: '', pendingOnly: false, cat: '', db: null, sample: null, artifact: null, open: new Set(), inflight: new Map(), changes: new Map(), vocab: new Map(), termRe: null, sending: null, sentFlash: null, lastSent: null, toolsOk: false };
  const FEATURE_NAMES = { mealplanning: 'Meal planning', paywall: 'Paywall', 'shopping-list': 'Shopping list', 'ai-cost': 'Cost cutting', misc: 'Miscellany' };
  const featName = f => FEATURE_NAMES[f] || (state.meta.featureNames && state.meta.featureNames[f]) || f;
  const catKey = d => d.feature + '|' + d.category;
  const chatDocId = id => id.replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 180);

  function terms() {
    if (!state.termRe) { const names = [...state.vocab.values()].map(v => v.term).filter(Boolean).sort((a, b) => b.length - a.length); state.termRe = names.length ? new RegExp('\\b(' + names.map(n => n.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&')).join('|') + ')\\b', 'g') : /$^/; }
    return state.termRe;
  }
  const defOf = name => { for (const v of state.vocab.values()) if (v.term === name) return v.definition; return ''; };
  const mark = text => esc(text).replace(terms(), m => `<abbr class="term" title="${esc(defOf(m))}">${m}</abbr>`);
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }

  // A queued verdict overlays the file status until the skill applies it.
  function eff(d) {
    const v = state.verdicts.get(d.id);
    if (v && !v.applied) return { status: v.verdict === 'approve' ? 'approved' : v.verdict === 'withdraw' ? 'withdrawn' : v.verdict === 'reject' ? 'rejected' : 'amended', queued: true, text: v.text };
    if (acceptedEdits(d.id).length) return { status: 'amended', queued: true };
    return { status: d.status, queued: false };
  }
  // Edits Lee accepted on the page that the terminal has not written to the record yet.
  const acceptedEdits = id => [...state.verdicts.values()].filter(v => isChangeVerdict(v) && !v.applied && v.accepted && v.change && v.change.op === 'edit' && v.change.id === id).map(v => v.change);
  const isQuestion = d => d.kind === 'question';
  // A folded card answers for the ids it replaced (its `folded` list), so old links still land.
  const lookup = id => state.decisions.get(id) || [...state.decisions.values()].find(d => (d.folded || '').split(/[,\s]+/).includes(id));
  const isOpenQ = d => isQuestion(d) && d.status !== 'answered'; // an answered question is history, not work
  const GONE = ['rejected', 'withdrawn']; // rulings that take a card out of every count
  const isPending = d => { if (isQuestion(d)) return false; const e = eff(d); return !e.queued && (e.status === 'proposed' || e.status === 'amended'); };
  const isChangeVerdict = v => v.verdict === 'change';

  function matchesSearch(d) {
    if (!state.q) return true;
    const hay = [d.id, d.folded, d.title, d.category, d.context, d.question, d.decision, d.why, d.alternatives, d.touches, d.details, d.original, d.leeSaid].join(' ').toLowerCase();
    return state.q.split(/\s+/).every(w => hay.includes(w));
  }
  function visible(d) {
    if (state.feat && d.feature !== state.feat) return false;
    if (state.pendingOnly && !isPending(d) && !isOpenQ(d)) return false;
    return matchesSearch(d);
  }

  // The record's five sections and their subsections, in reading order (Lee, 2026-09-26).
  const FEATURE_ORDER = ['mealplanning', 'paywall', 'shopping-list', 'ai-cost', 'misc'];
  const CATEGORY_ORDER = ['Vana: who she is and how she talks', 'What Vana knows', "Vana's tools", 'Planning a week', 'Plan tab and meals', 'Recipes and cooking',
    'Price and trial', 'Existing users', 'When Pro ends', 'Coach codes and restore', 'The paywall screen', 'Lists', 'Kroger', 'Models', 'Caching', 'Usage budget', 'Design system', 'Data and sync'];
  function sorted() {
    const co = [...CATEGORY_ORDER, ...(state.meta.categoryOrder || [])];
    const ci = c => { const i = co.indexOf(c); return i < 0 ? 999 : i; };
    const fi = f => { const i = FEATURE_ORDER.indexOf(f); return i < 0 ? 999 : i; };
    return [...state.decisions.values()].sort((a, b) =>
      (fi(a.feature) - fi(b.feature)) || (a.feature || '').localeCompare(b.feature || '') || (ci(a.category) - ci(b.category)) ||
      (a.category || '').localeCompare(b.category || '') || ((a.order || 0) - (b.order || 0)) || a.id.localeCompare(b.id));
  }
  function groups() {
    const g = new Map();
    for (const d of sorted()) {
      if (state.feat && d.feature !== state.feat) continue;
      const k = catKey(d);
      if (!g.has(k)) g.set(k, { key: k, feature: d.feature, category: d.category, n: 0, pend: 0, open: 0, queued: 0, detailPend: 0, items: [] });
      const x = g.get(k); x.n++; if (isPending(d)) { x.pend++; if (d.detail) x.detailPend++; } if (isOpenQ(d)) x.open++; const v = state.verdicts.get(d.id); if (v && !v.applied) x.queued++; x.items.push(d);
    }
    for (const [id, v] of state.verdicts) if (isChangeVerdict(v) && !v.applied && g.has(v.scope)) g.get(v.scope).queued++;
    return [...g.values()];
  }

  // "12 days ago" from an ISO stamp; '' when the stamp is unreadable.
  function ago(iso) {
    const t = Date.parse(iso || ''); if (Number.isNaN(t)) return '';

    const months = Math.floor(days / 30); return months < 24 ? `${months} months ago` : `${Math.floor(months / 12)} years ago`;
  }
  // Under a picture: when it was taken and at which app version, and a stale mark when the screen's code moved on since.
  function ageLine(c) {
    if (!c || !(c.appVersion || c.commit)) return '';
    const when = ago(c.capturedAt);
    const stale = c.stale ? `<span class="stale" title="${esc((c.changed || []).join('\n'))}">stale · ${(c.changed || []).length} file${(c.changed || []).length === 1 ? '' : 's'} changed</span>` : '';
    return `<div class="age"><span>${c.how === 'reused' ? 'file from' : 'captured at'} ${esc(c.appVersion || c.commit)}${when ? `, ${when}` : ''}</span>${stale}</div>`;
  }
  // Up to two pictures stacked in the left column: the screenshot when the card has one, then
  // its drawn picture(s). A card with none shows one empty box saying what would picture it.
  function figure(d) {
    const isSvg = t => t && /^\s*<svg[\s>]/i.test(t);
    const figs = [];
    if (d.imageAssetId) figs.push(`<div class="figwrap"><div class="fig"><img src="/_blob/${esc(d.imageAssetId)}" alt="${esc(d.imageCaption || d.title)}" loading="lazy"></div>${(d.imageCaption ? `<div class="cap">${esc(d.imageCaption)}</div>` : '') + ageLine(d.captured)}</div>`);
    for (const svg of [d.svg, d.svg2]) if (isSvg(svg) && figs.length < 2) figs.push(`<div class="figwrap"><div class="fig">${svg}</div></div>`);
    if (!figs.length) figs.push(`<div class="fig"><div class="none"><b>?</b>No picture yet.<br>${esc(d.screen || 'Nothing on screen shows this one.')}</div></div>`);
    return `<div class="figs">${figs.join('')}</div>`;

  function thread(id, placeholder) {
    const chat = state.chats.get(id) || { turns: [] };
    return `<div class="thread">${chat.turns.map(t => `<div class="turn ${esc(t.role)}">${esc(t.text)}</div>`).join('')}${state.inflight.has(id) ? `<div class="turn assistant">${esc(state.inflight.get(id))}</div>` : ''}</div>
          <div class="row"><textarea data-chat placeholder="${esc(placeholder)}" style="min-height:44px"></textarea><button data-act="ask" ${state.sample ? '' : 'disabled'}>Ask</button></div>`;
  }

  function section(d) {
    const e = eff(d);
    const v = state.verdicts.get(d.id);
    const approved = e.status === 'approved';
    const open = state.open.has(d.id);
    const ctx = d.context ? `<div class="part"><div class="k">Context</div><p>${mark(d.context)}</p></div>` : '';
    if (isQuestion(d)) {
      // An answered question shows the decision that answered it, and that decision's pictures when it has none of its own.
      const by = d.status === 'answered' && d.answeredBy ? lookup(d.answeredBy) : null;
      const pic = by && !d.svg && !d.svg2 && !d.imageAssetId ? { ...by, title: by.title } : d;
      const answeredLine = by ? `<div class="answer"><div class="k">Answered by</div><p><button class="linkish" data-goto-id="${esc(by.id)}">${esc(by.id)}</button> ${esc(by.title)}</p></div>` : '';

      ${figure(pic)}
      <div class="txt">

        <div class="amendbox"><div class="k">The question</div><p>${mark(d.question)}</p></div>
        ${answeredLine}
        ${ctx}
        ${d.why ? `<div class="part"><div class="k">Why it matters</div><p>${mark(d.why)}</p></div>` : ''}
        ${d.touches ? `<div class="part"><div class="k">What it touches</div><p>${mark(d.touches)}</p></div>` : ''}
        <details class="explain" ${open ? 'open' : ''}><summary>Discuss</summary>${thread(d.id, '')}</details>
      </div>
    </section>`;
    }
    const cl = Array.isArray(d.clauses) ? d.clauses : [];
    const droppedQ = v && !v.applied && Array.isArray(v.dropped) ? v.dropped : [];
    const decisionHtml = cl.length
      ? `<ol class="clauses">${cl.map((c, i) => `<li class="${droppedQ.includes(i + 1) ? 'dropped' : ''}">${mark(c)}</li>`).join('')}</ol>`
      : `<p>${mark(d.decision)}</p>`;
    // The face: picture, title, context, question, answer, why and what else was considered, the three buttons.
    const answer = `<div class="answer">${d.original ? '<div class="k">Rewrite, awaiting your approval</div>' : ''}${decisionHtml}</div>`;
    const qline = d.question ? `<p class="qline"><b>The question</b>${mark(d.question)}</p>` : '';
    const edits = acceptedEdits(d.id);
    const editBox = edits.map(c => `<div class="amendbox"><div class="k">Rewrite accepted on the page; the terminal writes it to the record</div>${['context', 'question', 'decision', 'why', 'alternatives', 'touches'].filter(k => c[k]).map(k => `<p><b>${esc(CHANGE_LABELS[k])}.</b> ${esc(c[k])}</p>`).join('')}</div>`).join('');
    const myChanges = [...state.verdicts].filter(([, v]) => isChangeVerdict(v) && !v.applied && v.about === d.id);
    // The reasoning sits on the face with the answer (Lee, 2026-09-23: a card waiting for a ruling
    // has to be readable without opening anything). More keeps who ruled, the source, the numbers.
    const why = d.why ? `<div class="part"><div class="k">Why</div><p>${mark(d.why)}</p></div>` : '';
    const alts = d.alternatives ? `<div class="part"><div class="k">What else was considered</div><p>${mark(d.alternatives)}</p></div>` : '';
    const meta = `<div class="meta"><span class="pill ${e.status}">${e.status}</span>${e.queued ? `<span class="pill queued">${byLine('queued', v && v.by)}</span>` : ruledLine(d)}${d.work === 'pending' ? '<span class="pill amended">work pending</span>' : ''}<span>${esc(d.id)}</span>${d.folded ? `<span>folds ${esc(d.folded)}</span>` : ''}<span>${esc(d.source || '')}</span></div>`;
    const more = [
      meta,
      d.original ? `<div class="amendbox"><div class="k">Original</div><p>${mark(d.original)}</p></div><div class="amendbox"><div class="k">You said</div><p>${mark(d.leeSaid)}</p></div>` : '',
      v && !v.applied && (v.text || droppedQ.length) ? `<div class="amendbox"><div class="k">${v.verdict === 'reject' ? 'Your reason' : 'Your words'} (queued)</div><p>${droppedQ.length ? `Drop ${droppedQ.join(', ')}. ` : ''}${esc(v.text)}</p></div>` : '',
      d.details ? `<div class="part"><div class="k">Details</div><p>${mark(d.details)}</p></div>` : '',
      d.touches ? `<div class="part"><div class="k">What it touches</div><p>${mark(d.touches)}</p></div>` : '',

      ? `<div class="k" style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Tick what to drop</div><ol class="clauses">${cl.map((c, i) => `<li><label><input type="checkbox" name="drop" value="${i + 1}"><span>${esc(c)}</span></label></li>`).join('')}</ol><textarea placeholder="What you want instead, or nothing if dropping is enough"></textarea>`
      : `<textarea placeholder="What you want instead"></textarea>`;
    const brief = e.queued ? `<div class="meta brief"><span class="pill queued">${byLine('queued', v && v.by)}</span></div>` : (e.status !== 'approved' && e.status !== 'proposed' ? `<div class="meta brief"><span class="pill ${e.status}">${e.status}</span></div>` : '');
    return `<section class="d ${d.detail ? 'detail' : ''}" id="${esc(d.id)}" data-id="${esc(d.id)}">
      ${figure(d)}
      <div class="txt">
        <h3>${esc(d.title)}</h3>
        ${brief}
        ${ctx}
        ${qline}
        ${answer}
        ${why}
        ${alts}
        ${editBox}
        <div class="acts">
          <button class="approve ${e.queued && v && v.verdict === 'approve' ? 'on' : ''}" data-act="approve">${e.queued && v && v.verdict === 'approve' ? 'Approved' : 'Approve'}</button>
          <button class="reject ${e.status === 'rejected' ? 'on' : ''}" data-act="reject">${e.status === 'rejected' ? 'Rejected' : 'Reject'}</button>
          <button data-act="amend">Rewrite</button>
          ${e.queued ? '<button data-act="undo">Undo</button>' : ''}
        </div>
        <div class="sub-form" data-form="reject"><textarea placeholder="Reason"></textarea><div class="row"><button data-act="reject-send" class="approve">Reject</button><button data-act="close">Cancel</button></div></div>

        <details class="explain" ${open ? 'open' : ''}><summary>Ask</summary>

          <div class="row"><button data-act="suggest" ${state.sample && (state.chats.get(d.id) || { turns: [] }).turns.length ? '' : 'disabled'}>Draft the rewrite from this conversation</button></div>
          ${myChanges.map(([id, v]) => changeCard(id, v)).join('')}

      </div>
    </section>`;
  }

  const CHANGE_LABELS = { context: 'Context', question: 'Question', decision: 'Decision', why: 'Why', alternatives: 'What else was considered', touches: 'What it touches', reason: 'Reason' };
  function changeCard(id, v) {
    const c = v.change || {};
    const op = c.op || 'edit';
    return `<div class="change" data-change="${esc(id)}">
      <div class="op">${op === 'add' ? 'Add a decision' : op === 'delete' ? 'Remove a decision' : 'Edit a decision'}${c.id ? ` · ${esc(c.id)}` : ''}${v.about && v.about !== c.id ? ` · from ${esc(v.about)}` : ''}${v.accepted ? ' · accepted' : ''}</div>
      <h4>${esc(c.title || '')}</h4>
      ${Object.keys(CHANGE_LABELS).filter(k => c[k]).map(k => `<p><b>${esc(CHANGE_LABELS[k])}.</b> ${esc(c[k])}</p>`).join('')}
      <div class="acts">${v.accepted ? '<button data-act="change-drop">Undo</button>' : '<button class="approve" data-act="change-accept">Accept</button><button data-act="change-drop">Dismiss</button>'}</div>
    </div>`;
  }

  function vocabPage() {
    const all = [...state.vocab.values()].sort((a, b) => (a.order || 0) - (b.order || 0));
    const q = state.q; const vis = all.filter(v => !q || (v.term + ' ' + v.definition + ' ' + v.avoid).toLowerCase().includes(q));
    const queued = [...state.verdicts].filter(([, v]) => v.verdict === 'term' && !v.applied);
    let html = `<div class="cat-head"><div class="fname">CONTEXT.md</div><h2>Vocabulary</h2><div class="tools"><span class="hint">${all.length} terms${queued.length ? ` · ${queued.length} queued` : ''}</span></div></div>`;
    html += `<div class="vocab"><form data-form="term"><input name="term" placeholder="Term" required><input name="area" placeholder="Area (optional)"><textarea name="definition" placeholder="What it means" required></textarea><input name="avoid" placeholder="Words to avoid (optional)"><div class="row"><button class="primary" type="submit">Add term</button></div></form>`;
    html += queued.map(([id, v]) => `<div class="entry" data-term="${esc(id)}"><b>${esc(v.term)}</b><span class="area">${esc(v.area || '')}</span> <span class="pill queued">queued</span><p>${esc(v.definition)}</p>${v.avoid ? `<p class="avoid">Avoid: ${esc(v.avoid)}</p>` : ''}<div class="acts"><button data-act="term-drop">Undo</button></div></div>`).join('');
    let lastArea = null;
    for (const v of vis) {
      if (v.area !== lastArea) { html += `<h3 style="margin-top:22px">${esc(v.area)}</h3>`; lastArea = v.area; }
      html += `<div class="entry"><b>${esc(v.term)}</b><p>${esc(v.definition)}</p>${v.avoid ? `<p class="avoid">Avoid: ${esc(v.avoid)}</p>` : ''}</div>`;
    }
    return html + '</div>';
  }
  function wordsIn(g) {
    const hay = g.items.map(d => [d.context, d.decision, d.why, d.question].join(' ')).join(' ');
    const found = new Set(); const re = terms(); re.lastIndex = 0; let m; while ((m = re.exec(hay))) found.add(m[1]);
    return found.size ? `<div class="words">${[...found].map(n => `<abbr title="${esc(defOf(n))}">${esc(n)}</abbr>`).join('')}</div>` : '';
  }
  function categoryPage(g) {
    const finished = state.meta.finished && state.meta.finished[g.key];
    const catId = 'cat:' + g.key;
    const changes = [...state.verdicts].filter(([, v]) => isChangeVerdict(v) && !v.applied && v.scope === g.key);
    const vis = g.items.filter(visible);
    let html = `<div class="cat-head"><div class="fname">${esc(featName(g.feature))}</div><h2>${esc(g.category)}</h2>
      <div class="tools">
        <span class="hint">${g.n} decision${g.n === 1 ? '' : 's'}${g.queued ? ` · ${g.queued} queued` : ''}${finished ? ` · finished ${finished.slice(0, 10)}` : ''}</span>
        ${g.pend ? `<button data-approve-all="${esc(g.key)}">Approve all ${g.pend}</button>` : ''}
        <button class="primary" data-finish-cat="${esc(g.key)}" ${g.queued && state.artifact && !state.sending ? '' : 'disabled'}>${finishLabel(g.key, 'Finish category')}</button>
      </div>${wordsIn(g)}</div>`;
    html += `<details class="discuss" ${state.open.has(catId) ? 'open' : ''} data-cat="${esc(g.key)}"><summary>Discuss this category</summary>
      ${thread(catId, '')}
      <div class="row"><button data-act="suggest" ${state.sample ? '' : 'disabled'}>Suggest changes</button></div>
      ${changes.map(([id, v]) => changeCard(id, v)).join('')}
    </details>`;
    const main = vis.filter(d => !d.detail), det = vis.filter(d => d.detail);
    html += main.length ? main.map(section).join('') : (det.length ? '' : '<div class="empty">Nothing here matches the pending filter or search.</div>');
    if (det.length) {
      const detPend = det.filter(isPending).length;
      html += `<details class="detail-block" ${state.open.has('det:' + g.key) ? 'open' : ''} data-det="${esc(g.key)}"><summary><div class="detail-head"><h3>Implementation details · ${det.length}</h3><span class="hint">${detPend ? `${detPend} waiting. ` : ''}How things are built, not what the athlete sees. Open to read them.</span>${detPend ? `<button data-approve-details="${esc(g.key)}">Accept all ${detPend}</button>` : ''}</div></summary>${det.map(section).join('')}</details>`;
    }
    return html;
  }

  // The reference documents are repo Markdown. Everything is escaped first, then a small set of
  // block and inline forms is rebuilt, so nothing from the database reaches the page as raw HTML.
  function inlineMd(t) {
    return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  }
  function mdHtml(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n'); const out = []; let i = 0;
    const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const n = m[1].length; out.push(`<h${n}>${inlineMd(m[2])}</h${n}>`); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const head = cells(l); i += 2; const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
        out.push(`<div class="tablewrap"><table><thead><tr>${head.map(c => `<th>${inlineMd(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        const ordered = /^\s*\d+\./.test(l); const items = [];
        while (i < lines.length && lines[i].trim() && !/^#{1,4}\s/.test(lines[i]) && !/^\s*\|/.test(lines[i])) {
          if (/^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''));
          else items[items.length - 1] += ' ' + lines[i].trim();
          i++;
        }
        const tag = ordered ? 'ol' : 'ul'; out.push(`<${tag}>${items.map(x => `<li>${inlineMd(x)}</li>`).join('')}</${tag}>`);
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*\||\s*([-*]|\d+\.)\s+)/.test(lines[i])) para.push(lines[i++].trim());
      out.push(`<p>${inlineMd(para.join(' '))}</p>`);
    }
    return out.join('');
  }
  const refsSorted = () => [...state.refs.values()].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  function refPage(id) {
    const r = state.refs.get(id);
    if (!r) return '<div class="empty">This reference is not on the page yet.</div>';
    const when = ago(r.updatedAt);
    return `<div class="cat-head"><div class="fname">Reference</div><h2>${esc(r.title)}</h2><div class="tools"><span class="hint">${esc(r.source || '')}${when ? ` · copied to the page ${when}` : ''}. In-page Claude can read it when you ask on a card.</span></div></div><div class="refdoc">${mdHtml(r.body)}</div>`;
  }

  function render() {
    const main = $('#main'), nav = $('#navlist'), featSel = $('#feat');
    const all = sorted();
    const feats = [...new Set(all.map(d => d.feature))];
    if (featSel.options.length !== feats.length + 1) { featSel.innerHTML = '<option value="">All features</option>' + feats.map(f => `<option value="${esc(f)}">${esc(featName(f))}</option>`).join(''); featSel.value = state.feat; }
    const gs = groups();
    if (!gs.length) { nav.innerHTML = '<div class="hint">No decisions loaded yet.</div>'; main.innerHTML = '<div class="empty">Loading.</div>'; return; }
    if (state.cat !== 'vocab' && !(state.cat.startsWith('ref:') && state.refs.has(state.cat.slice(4))) && !gs.some(g => g.key === state.cat)) state.cat = (gs.find(g => g.pend) || gs[0]).key;
    let navHtml = '', lastF = null;
    for (const g of gs) {
      if (g.feature !== lastF) { navHtml += `${lastF !== null ? '</div>' : ''}<div class="feat"><div class="fname">${esc(featName(g.feature))}</div>`; lastF = g.feature; }
      const done = !g.pend && !g.queued && (state.meta.finished && state.meta.finished[g.key]);
      navHtml += `<button class="cat ${g.key === state.cat ? 'active' : ''}" data-goto="${esc(g.key)}"><span>${esc(g.category)}</span><span class="n ${g.pend ? 'pend' : ''}">${done ? '<span class="done">done</span> ' : ''}${g.open ? '<span class="q">' + g.open + '?</span> ' : ''}${g.pend ? g.pend + ' / ' : ''}${g.n}</span></button>`;
    }
    nav.innerHTML = navHtml + '</div>' + `<div class="feat"><button class="cat ${state.cat === 'vocab' ? 'active' : ''}" data-goto="vocab"><span>Vocabulary</span><span class="n">${state.vocab.size}</span></button></div>` + (state.refs.size ? `<div class="feat"><div class="fname">Reference</div>${refsSorted().map(r => `<button class="cat ${state.cat === 'ref:' + r.id ? 'active' : ''}" data-goto="ref:${esc(r.id)}"><span>${esc(r.title)}</span></button>`).join('')}</div>` : '');
    if (state.cat.startsWith('ref:')) {
      main.innerHTML = refPage(state.cat.slice(4));
    } else if (state.cat === 'vocab') {
      main.innerHTML = vocabPage();
    } else if (state.q) {
      const hits = all.filter(visible);
      main.innerHTML = `<div class="cat-head"><div class="fname">Search</div><h2>${hits.length} match${hits.length === 1 ? '' : 'es'} for "${esc(state.q)}"</h2></div>` + (hits.map(section).join('') || '<div class="empty">Nothing matches.</div>');
    } else {
      const i = gs.findIndex(g => g.key === state.cat);
      const g = gs[i], prev = gs[i - 1], next = gs[i + 1];
      main.innerHTML = categoryPage(g) + `<div class="pager">
        ${prev ? `<button data-goto="${esc(prev.key)}">Previous: ${esc(prev.category)}</button>` : '<span></span>'}
        ${next ? `<button data-goto="${esc(next.key)}" class="primary">Next: ${esc(next.category)}</button>` : '<span class="hint">Last category.</span>'}
      </div>`;
    }

  // Who is ruling. The platform tells the page nothing about the viewer, so each

  async function verdict(id, kind, text, dropped) {

  }
  async function undo(id) {

  // What the Explain thread reads: the card, the cards it names in full, the glossary terms it
  // uses, the tickets that cite it, and one line per sibling. Capped well under the 64 KiB input limit.
  const ID_RE = /\b[a-z]+-\d{3}\b/g;
  const cardText = x => `${x.id} · ${x.title} [${eff(x).status}]\n${x.question ? 'Question: ' + x.question + '\n' : ''}Context: ${x.context}\nDecision: ${x.decision}\nWhy: ${x.why}\n${x.alternatives ? 'What else was considered: ' + x.alternatives + '\n' : ''}What it touches: ${x.touches}${x.details ? '\nDetails: ' + x.details : ''}${x.original ? '\nOriginal text before the amendment: ' + x.original + '\nWhat Lee said: ' + x.leeSaid : ''}`.slice(0, 2500);

  function pageTools() {
    if (!state.toolsOk) return undefined;
    const str = v => String(v ?? '').trim();
    return [
      { name: 'read_decision', description: 'Returns the full text of one decision card by id, for example mp-317: title, status, plain words, context, question, decision, why, alternatives, what it touches, details.', inputSchema: { type: 'object', properties: { id: { type: 'string' } }, required: ['id'] }, execute: ({ id }) => { const x = state.decisions.get(str(id)); if (!x) throw new Error('no decision ' + str(id)); return cardText(x); } },
      { name: 'find_decisions', description: 'Searches every decision card for all the given words and returns up to 12 matches as id, title, status and the start of the decision. Use it to find where a term or behaviour is decided.', inputSchema: { type: 'object', properties: { words: { type: 'string' } }, required: ['words'] }, execute: ({ words }) => { const ws = str(words).toLowerCase().split(/\s+/).filter(Boolean); if (!ws.length) throw new Error('no words'); return sorted().filter(x => { const hay = [x.id, x.title, x.context, x.decision, x.why, x.touches].join(' ').toLowerCase(); return ws.every(w => hay.includes(w)); }).slice(0, 12).map(x => `${x.id} · ${x.title} [${eff(x).status}]: ${x.decision.slice(0, 160)}`).join('\n') || 'nothing matches'; } },
      { name: 'read_ticket', description: 'Returns one work ticket by feature slug and number, for example paywall 01: what was built, its status and its acceptance criteria.', inputSchema: { type: 'object', properties: { feature: { type: 'string' }, number: { type: 'string' } }, required: ['number'] }, execute: ({ feature, number }) => { const n = str(number).padStart(2, '0'); const t = [...state.tickets.values()].find(x => x.number === n && (!str(feature) || x.feature === str(feature))); if (!t) throw new Error('no ticket ' + n); return `${t.feature} ${t.number} · ${t.title} (${t.status})\n${t.body || ''}`; } },

    ];

  async function ask(id, question, d, g) {

    state.chats.set(id, chat); state.open.add(id); state.inflight.set(id, 'Thinking.'); render();

      const { text } = await state.sample(turns, { cache: false, modelTier: 'default', tools: pageTools(), onText: ({ text }) => { state.inflight.set(id, text); const sec = document.getElementById(id) || document.querySelector(`[data-cat="${CSS.escape(id.slice(4))}"]`); const b = sec && sec.querySelector('.thread .turn:last-child'); if (b && state.inflight.has(id)) b.textContent = text; } });

    render();

  }

  // Turns a thread (a card's Explain or a category's Discuss) into change cards Lee accepts on
  // the page. A card thread may edit its own card, edit or remove another, or add one.
  async function suggest(g, d) {
    const id = d ? d.id : 'cat:' + g.key;
    const chat = state.chats.get(id);
    if (!chat || !chat.turns.length) return toast('Nothing to work from yet');
    state.inflight.set(id, 'Drafting changes.'); render();
    const convo = chat.turns.map(t => `${t.role === 'user' ? 'LEE' : 'CLAUDE'}: ${t.text}`).join('\n\n');
    const prompt = `${rulesFor(d, g)}\n\nBelow is the conversation Lee had ${d ? 'about ' + d.id : 'about this category'}. Turn it into a list of concrete changes to the decision record. Reply with only a JSON array. Each item is an object with: "op" ("add", "edit" or "delete"), "id" (the decision id for edit or delete, omit for add), "title" (plain words), and for add or edit any of: "question" (one phrase), "decision" (the answer in plain words a newcomer can read, two to four sentences, ending with one worked example that uses real dates, names or numbers; no jargon that the glossary does not define), "context" (2 to 4 sentences), "why" (1 to 2 sentences), "alternatives" (one sentence), "touches" (one line), "details" (the precise clauses a builder needs, numbered on their own lines); for delete: "reason" (one sentence). For an edit include only the fields that change. ${d ? `The card under discussion is ${d.id}. Editing another card, removing one, or adding one are all allowed when the conversation calls for it; a change to another card must be consistent with what that card says.` : ''} Only include changes Lee asked for or clearly agreed to. If nothing changed, reply with []. Short sentences, no em-dashes, no hedging.\n\nCONVERSATION:\n${convo}`;

    state.inflight.delete(id); render();
  }

  async function send(scope, queued) {
    const n = Object.keys(queued).length;

    try { sessionStorage.setItem('ssot-open', JSON.stringify([...state.open])); } catch {}

  async function finishScope(scope) {

  function setNav(open) { document.body.classList.toggle('nav-open', open); $('#menu').setAttribute('aria-expanded', open ? 'true' : 'false'); }

  $('#nav').addEventListener('click', ev => { const b = ev.target.closest('button[data-goto]'); if (!b) return; state.cat = b.dataset.goto; state.q = ''; $('#q').value = ''; setNav(false); render(); window.scrollTo({ top: 0 }); });

    for (const k of s.open) { const [id, form] = k.split('|'); const f = document.querySelector(`#main section.d[data-id="${CSS.escape(id)}"] .sub-form[data-form="${form}"]`); if (f) f.classList.add('open'); }
    for (const k of s.ticked) { const [id, n] = k.split('|'); const c = document.querySelector(`#main section.d[data-id="${CSS.escape(id)}"] input[name=drop][value="${n}"]`); if (c) c.checked = true; }
    if (s.focus) { for (const el of document.querySelectorAll('#main textarea, #main input')) if (formKey(el) === s.focus.key) { el.focus({ preventScroll: true }); try { el.setSelectionRange(s.focus.start, s.focus.end); } catch {} break; } }
    window.scrollTo({ top: s.scrollY });
  }
  const _render = render; render = function () { const s = snapshotDrafts(); _render(); restoreDrafts(s); try { localStorage.setItem('ssot-cat', state.cat); } catch {} };

  (function wireWho() {
    const sel = $('#who');
    const saved = who();
    if ([...sel.options].some(o => o.value === saved)) sel.value = saved; else if (saved) { try { localStorage.removeItem('ssot-who'); } catch {} }
    sel.addEventListener('change', () => { try { sel.value ? localStorage.setItem('ssot-who', sel.value) : localStorage.removeItem('ssot-who'); } catch {} });
  })();

  render();

  (async () => {
    const [db, sample, artifact] = await Promise.all([claude.use('db'), claude.use('sample'), claude.use('artifact')]);
    state.sample = sample; state.artifact = artifact; state.db = db;
    if (sample) sample.limits().then(l => { state.toolsOk = !!(l && l.tools); }).catch(() => {});
    if (!db) { $('#status').textContent = 'No database in this view. Nothing can be saved here.'; render(); return; }
    db.doc('meta/state').onSnapshot(s => { state.meta = s.data() || {}; render(); }, () => {});
    db.collection('decisions').onSnapshot(s => { state.decisions = new Map(s.docs.map(x => [x.id, { id: x.id, ...x.data() }])); render(); }, e => { $('#status').textContent = 'Lost the decisions stream: ' + e.code; });
    db.collection('vocab').onSnapshot(s => { state.vocab = new Map(s.docs.map(x => [x.id, x.data()])); state.termRe = null; render(); }, () => {});
    db.collection('tickets').onSnapshot(s => { state.tickets = new Map(s.docs.map(x => [x.id, { id: x.id, ...x.data() }])); render(); }, () => {});
    db.collection('refs').onSnapshot(s => { state.refs = new Map(s.docs.map(x => [x.id, { id: x.id, ...x.data() }])); render(); }, () => {});
    db.collection('verdicts').onSnapshot(s => { state.verdicts = new Map(s.docs.map(x => [x.id, x.data()])); render(); }, () => {});
    db.collection('chats').onSnapshot(s => { const next = new Map(s.docs.map(x => { const d = x.data(); return [d.key || x.id, d]; })); for (const id of state.inflight.keys()) if (state.chats.has(id)) next.set(id, state.chats.get(id)); state.chats = next; render(); }, () => {});
  })();
})();
</script>
